name: Verificar supervisor de ingreso
on:
  pull_request:
    paths: ['supabase/functions/clientes-supervisor/**', 'supabase/functions/_shared/**', '.github/workflows/supervisor.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --config supabase/functions/deno.json supabase/functions/clientes-supervisor/index.ts
