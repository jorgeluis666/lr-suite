name: Integrar calendarios de Agenda
on:
  workflow_dispatch:
    inputs:
      instalar:
        description: 'Instalar almacenamiento y publicar agenda-panel'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: agenda-calendarios
  cancel-in-progress: false
jobs:
  integrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Diagnóstico e instalación
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          INSTALAR: ${{ inputs.instalar }}
        run: |
          if [ "$INSTALAR" = "true" ]; then
            node scripts/agenda/instalar.mjs --instalar
          else
            node scripts/agenda/instalar.mjs
          fi
      - uses: supabase/setup-cli@v1
        if: inputs.instalar
        with:
          version: latest
      - name: Publicar Agenda
        if: inputs.instalar
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          supabase functions deploy --help
          supabase functions deploy agenda-panel --remote="$REF" --yes
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "https://$REF.supabase.co/functions/v1/agenda-panel" -H 'content-type: application/json' -d '{"accion":"sincronizar_agenda"}')
          test "$code" = "401"
