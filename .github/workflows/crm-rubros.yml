name: Importar corte de anunciantes por rubro
on:
  workflow_dispatch:
    inputs:
      datos:
        description: 'Resumen JSON de LRACRMRubros.publicidad, sin datos personales'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: crm-rubros-importacion
  cancel-in-progress: false
jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guardar y comprobar el corte privado
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: node scripts/acrm/rubros.mjs
