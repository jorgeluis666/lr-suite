        const match = normalized.match(/^(\d{4}-\d{2}-\d{2})/);
        return match ? match[1] : "";
      }

      function hasSuiteAccess() {
        const sessionKey = getSuiteAccessSession();
        return Boolean(sessionKey && suiteUsers.some((user) => user.key === sessionKey));
      }

      function currentSuiteUser() {
        const sessionKey = currentSuiteUserKey();
        return suiteUsers.find((user) => user.key === sessionKey) || null;
      }

      function suiteUserCanAccessModule(user, moduleId) {
        return Boolean(user && normalizeSuiteModuleIds(user.modules).includes(moduleId));
      }

      function currentSuiteUserCanAccessModule(moduleId) {
        return suiteUserCanAccessModule(currentSuiteUser(), moduleId);
      }

      function currentSuiteUserModules() {
        const user = currentSuiteUser();
        return orderedSuiteModules().filter((module) => suiteUserCanAccessModule(user, module.id));
      }

      function updateSuiteModuleAccess(userKey, moduleId, enabled) {
        const normalizedKey = String(userKey || "").trim().toLowerCase();
        const index = suiteUsers.findIndex((user) => user.key === normalizedKey);
        if (index < 0 || !modules.some((module) => module.id === moduleId)) return false;

        const nextModules = new Set(normalizeSuiteModuleIds(suiteUsers[index].modules));
        if (enabled) nextModules.add(moduleId);
        else nextModules.delete(moduleId);
        suiteUsers[index].modules = orderedSuiteModules()
          .map((module) => module.id)
          .filter((availableModuleId) => nextModules.has(availableModuleId));
        saveSuiteUsers();
        state.suiteUserMessage = `Permisos actualizados para ${suiteUsers[index].key}.`;
        return true;
      }

      // Portada de acceso: el mismo formato que la pantalla de acceso de los dashboards de clientes.
      const SUITE_GATE_BACKGROUND = "./assets/login-bg.jpg";

      function suiteGate(content) {
        document.getElementById("app").innerHTML = `
          <main class="suite-gate">
            <div class="suite-gate-panel">
              <div class="suite-gate-inner">
                <img class="suite-gate-logo" src="./assets/lima-retail-logo.png" alt="" width="44" height="44" />
                <p class="suite-gate-brand">Lima Retail</p>
                <h1 class="suite-gate-title">LR Suite</h1>
                <div class="suite-gate-divider"></div>
                ${content}
              </div>
            </div>
            <div class="suite-gate-bg" id="suiteGateBg"></div>
          </main>
        `;
        // La foto se aplica solo cuando terminó de cargar; si falla queda el degradado.
        const background = new Image();
        background.onload = () => {
          const element = document.getElementById("suiteGateBg");
          if (element) element.style.backgroundImage = `url('${SUITE_GATE_BACKGROUND}')`;
        };
        background.src = SUITE_GATE_BACKGROUND;
      }

      function renderNoModuleAccess() {
        suiteGate(`
          <p class="suite-gate-text"><strong>Sin módulos asignados.</strong> Tu usuario está activo, pero aún no tiene permisos para visualizar módulos.</p>
        `);
      }

      // Solo registra el usuario en la suite (nombre, orden, modulos). La cuenta y su contraseña se
      // crean en Supabase > Authentication > Users; sin esa cuenta el usuario no puede entrar.
      function addSuiteUser(name, key) {
        const nextUser = normalizeSuiteUser({ name, key });
        nextUser.role = SUITE_SUPERADMIN_ROLE;

        if (!nextUser.name || !nextUser.key) {
          state.suiteUserMessage = "Completa nombre y usuario.";
          return null;
        }
        if (suiteUsers.some((user) => user.key === nextUser.key)) {
          state.suiteUserMessage = "Ese usuario ya existe.";
          return null;
        }

        suiteUsers.push(nextUser);
        state.suiteUserMessage = `Usuario creado: ${nextUser.key}.`;
        saveSuiteUsers();
        return nextUser;
      }

      function updateSuiteUserName(userKey, name) {
        const normalizedKey = String(userKey || "").trim().toLowerCase();
        const nextName = String(name || "").trim();

        if (!nextName) {
          state.suiteUserMessage = "Ingresa un nombre de usuario.";
          return false;
        }

        const index = suiteUsers.findIndex((user) => user.key === normalizedKey);
        if (index < 0) {
          state.suiteUserMessage = "Usuario no encontrado.";
          return false;
        }

        suiteUsers[index].name = nextName;
        state.suiteUserMessage = `Nombre actualizado para ${suiteUsers[index].key}.`;
        saveSuiteUsers();
        return true;
      }

      function updateSuiteUserOrder(userKey, order) {
        const normalizedKey = String(userKey || "").trim().toLowerCase();
        const nextOrder = Math.max(1, Math.trunc(Number(order) || 1));
        const index = suiteUsers.findIndex((user) => user.key === normalizedKey);
        if (index < 0) {
          state.suiteUserMessage = "Usuario no encontrado.";
          return false;
        }

        suiteUsers[index].order = nextOrder;
        state.suiteUserMessage = `Orden actualizado para ${suiteUsers[index].key}.`;
        saveSuiteUsers();
        return true;
      }

      // Cada usuario cambia solo su propia contraseña, en Supabase Auth. Las de otros usuarios se
      // restablecen desde Supabase > Authentication (antes se podian resetear a "1234" desde aqui).
      async function updateOwnSuitePassword(password, confirmPassword) {
        const nextPassword = String(password || "");
        if (nextPassword.length < 12) {
          state.suiteUserMessage = "La contraseña debe tener al menos 12 caracteres.";
          return false;
        }
        if (nextPassword !== String(confirmPassword || "")) {
          state.suiteUserMessage = "Las contraseñas no coinciden.";
          return false;
        }
        const client = ensureSharedPendingClient();
        const { error } = client ? await client.auth.updateUser({ password: nextPassword }) : { error: true };
        state.suiteUserMessage = error
          ? "No se pudo cambiar la contraseña en Supabase."
          : "Contraseña actualizada.";
        return !error;
      }

      function persistTaskStateVersion() {
        if (!pendingStateVersion) return;
        writeStoredValue(TASK_STATE_VERSION_STORAGE_KEY, String(pendingStateVersion));
      }

      function touchTaskStateVersion(options = {}) {
        if (options.version === false || sharedPendingApplying) {
          persistTaskStateVersion();
          return;
        }
        pendingStateVersion = Date.now();
        persistTaskStateVersion();
      }

      function saveTaskState(options = {}) {
        // Cada pendiente que cambio en este navegador desde la ultima fusion recibe su marca de edicion.
        if (!sharedPendingApplying) stampLocallyEditedTasks();
        pruneTaskTombstones();
        touchTaskStateVersion(options);
        writeStoredJson(TASKS_STORAGE_KEY, tasks);
        writeStoredJson(COMPLETED_STORAGE_KEY, completedTasks);
        if (options.backup !== false) saveLocalPendingBackup(options.reason || "cambio");
        if (options.broadcast !== false) publishTaskSync();
        if (options.shared !== false) queueSharedPendingSave();
      }

      function saveTimerState(options = {}) {
        touchTaskStateVersion(options);
        writeStoredJson(TIMER_STORAGE_KEY, taskTimer);
        if (options.broadcast !== false) publishTaskSync();
        if (options.shared !== false) queueSharedPendingSave();
      }

      function migrateJorgeLuisPendingTasks() {
        const current = tasks.filter((task) => task[1] === "Jorge Luis");
        const hasLegacyTasks = current.some((task) => LEGACY_JORGE_PENDING_TITLES.has(task[0]));

        if (!hasLegacyTasks) return false;

        tasks = [
          ...JORGE_LUIS_PENDING_TASKS.map((task) => [...task]),
          ...tasks.filter((task) => task[1] !== "Jorge Luis")
        ];
        jorgePendingMigrationApplied = true;
        return true;
      }

      function taskSyncPayload() {
        pruneTaskTombstones();
        return {
          actorName: currentSuiteUserName(),
          completedTasks,
          sourceId: pendingSyncSourceId,
          stateVersion: pendingStateVersion || 0,
          taskTimer,
          tombstonesById: taskTombstones(),
          tasks,
          updatedAt: Date.now()
        };
      }

      function captureNewTaskDraft() {
        const form = document.getElementById("newTaskForm");
        if (!form) return null;
        const activeElement = document.activeElement;
        return {
          activeName: form.contains(activeElement) ? activeElement.name : "",
          dueDate: form.elements.dueDate?.value || "",
          owner: form.elements.owner?.value || "",
          priority: form.elements.priority?.value || "",
          startDate: form.elements.startDate?.value || "",
          title: form.elements.title?.value || ""
        };
      }

      function restoreNewTaskDraft(draft) {
        if (!draft) return;
        const form = document.getElementById("newTaskForm");
        if (!form) return;
        if (form.elements.title) form.elements.title.value = draft.title;
        if (form.elements.owner && draft.owner) form.elements.owner.value = draft.owner;
        if (form.elements.startDate) form.elements.startDate.value = draft.startDate;
        if (form.elements.dueDate) form.elements.dueDate.value = draft.dueDate;
        if (form.elements.priority && draft.priority) form.elements.priority.value = draft.priority;
        if (draft.activeName && form.elements[draft.activeName]) {
          form.elements[draft.activeName].focus();
        }
      }

      function syncNewTaskTodayDates(event) {
        const input = event.currentTarget;
        const today = localDayKey();
        if (!input?.value || input.value !== today) return;

        const form = input.form || document.getElementById("newTaskForm");
        if (!form) return;
        if (form.elements.startDate) form.elements.startDate.value = today;
        if (form.elements.dueDate) form.elements.dueDate.value = today;
      }

      function wireNewTaskDateSync() {
        document.querySelectorAll("#newTaskForm, [data-category-task-form]").forEach((form) => {
          [form.elements.startDate, form.elements.dueDate].forEach((input) => {
            if (!input) return;
            input.addEventListener("input", syncNewTaskTodayDates);
            input.addEventListener("change", syncNewTaskTodayDates);
          });
        });
      }

      function taskTimerUiSignature() {
        return JSON.stringify(
          activeTimerEntries()
            .map(([id, entry]) => [
              id,
              Number(entry?.startedAt || 0),
              String(entry?.userKey || ""),
              String(entry?.userName || "")
            ])
            .sort((left, right) => String(left[0]).localeCompare(String(right[0])))
        );
      }

      function tasksRenderSignature() {
        return JSON.stringify([
          tasks,
          completedTasks,
          taskTimerUiSignature(),
          state.taskOwner,
          state.taskStatus,
          state.taskPriority,
          state.taskMonth,
          state.completedHistoryView
        ]);
      }

      function renderTasksIfActive() {
        if (state.active !== "tasks" || !hasSuiteAccess()) return;
        pruneActiveTimersByUser();
        syncLegacyActiveTimerFields();
        const nextSignature = tasksRenderSignature();
        if (document.querySelector(".task-module") && nextSignature === lastTasksRenderSignature) {
          renderPresenceFromSync();
          updateTaskTimerDom();
          updateLiveActivityNotice();
          updatePendingSyncStatusDom();
          return;
        }
        const draft = captureNewTaskDraft();
        tasksModule();
        restoreNewTaskDraft(draft);
      }

      function publishTaskSync() {
        const payload = taskSyncPayload();
        taskSyncChannel?.postMessage(payload);
        try {
          localStorage.setItem(TASK_SYNC_EVENT_KEY, JSON.stringify(payload));
        } catch {
          // La suite debe seguir funcionando aunque el navegador limite eventos de storage.
        }
      }

      function applyTaskSyncPayload(payload) {
        if (!payload || payload.sourceId === pendingSyncSourceId) return;
        if (!Array.isArray(payload.tasks) || !Array.isArray(payload.completedTasks)) return;
        const incomingVersion = Number(payload.stateVersion ?? payload.updatedAt ?? 0);
        mergeTaskTombstones(payload.tombstonesById, payload.taskTimer?.tombstonesById);
        const isNewer = !pendingStateVersion || incomingVersion >= pendingStateVersion;
        pendingStateVersion = Math.max(pendingStateVersion, incomingVersion || 0);
        persistTaskStateVersion();
        tasks = mergePendingTaskLists(tasks, payload.tasks);
        rememberTaskFieldSignatures();
        completedTasks = mergeCompletedTaskHistory(completedTasks, payload.completedTasks);
        const migrated = migrateJorgeLuisPendingTasks();
        if (isNewer && payload.taskTimer && typeof payload.taskTimer === "object") {
          mergeTaskTimerSnapshot(payload.taskTimer, {
            actorName: payload.actorName,
            updatedAt: incomingVersion
          });
        }
        ensureTaskIds();
        const normalizedStartDates = ensureTaskStartDates();
        if (migrated || normalizedStartDates) {
          pendingStateVersion = Date.now();
          saveTaskState();
          return;
        }
        if (hasActiveTaskTimers()) ensureTaskTimerInterval();
        else stopTaskTimerIntervalIfIdle();
        renderTasksIfActive();
      }

      function refreshTaskStateFromStorage() {
        applyTaskSyncPayload({
          completedTasks: readStoredJson(COMPLETED_STORAGE_KEY, completedTasks),
          sourceId: "storage",
          taskTimer: readStoredJson(TIMER_STORAGE_KEY, taskTimer),
          tasks: readStoredJson(TASKS_STORAGE_KEY, tasks),
          updatedAt: Date.now()
        });
      }

      function sharedPendingConfig() {
        const config = window.LR_SUITE_SUPABASE || {};
        return {
          anonKey: config.anonKey || config.anon_key || "",
          url: config.url || ""
        };
      }

      function canUseSharedPendingDb() {
        const config = sharedPendingConfig();
        return Boolean(window.supabase?.createClient && config.url && config.anonKey);
      }

      function isStorageCapacityError(error) {
        const text = `${error?.code || ""} ${error?.message || ""} ${error?.details || ""}`;
        return /quota|storage|space|disk|size|limit|full|insufficient|exceeded/i.test(text);
      }

      function updateSharedPendingHealth(patch = {}) {
        sharedPendingHealth = {
          ...sharedPendingHealth,
          checkedAt: Date.now(),
          ...patch
        };
        updatePendingSyncStatusDom();
      }

      function pendingHealthTime(value) {
        if (!value) return "sin confirmar";
        return new Date(value).toLocaleTimeString("es-PE", {
          hour: "2-digit",
          minute: "2-digit"
        });
      }

      function ensureSharedPendingClient() {
        if (sharedPendingClient || !canUseSharedPendingDb()) return sharedPendingClient;
        const config = sharedPendingConfig();
        // Antes de crear el cliente (y de guardar cualquier sesion) se achican los respaldos locales.
        compactLocalPendingBackups();
        sharedPendingClient = window.supabase.createClient(config.url, config.anonKey, {
          auth: {
            storage: suiteAuthStorage
          },
          realtime: {
            params: {
              eventsPerSecond: 8
            }
          }
        });
        return sharedPendingClient;
      }

      async function waitForSharedPendingLibrary(timeoutMs = 10000) {
        const startedAt = Date.now();
        while (!canUseSharedPendingDb() && Date.now() - startedAt < timeoutMs) {
          await new Promise((resolve) => window.setTimeout(resolve, 200));
        }
        return canUseSharedPendingDb();
      }

      async function ensureSharedPendingConnection() {
        if (sharedPendingAvailable && sharedPendingClient) return true;

        const libraryReady = await waitForSharedPendingLibrary();
        if (!libraryReady) {
          sharedPendingError =
            "No se pudo cargar la libreria de Supabase. Revisa tu conexion a internet y recarga la pagina.";
          sharedPendingStatus = "local";
          updateSharedPendingHealth({ readOk: false, storageOk: false, writeOk: false });
          return false;
        }

        if (sharedPendingInitializing) {
          const startedAt = Date.now();
          while (sharedPendingInitializing && Date.now() - startedAt < 10000) {
            await new Promise((resolve) => window.setTimeout(resolve, 200));
          }
          if (sharedPendingAvailable && sharedPendingClient) return true;
        }

        await initSharedPendingDb();
        return Boolean(sharedPendingAvailable && sharedPendingClient);
      }

      // Datos comerciales privados (cotizaciones): viven en Supabase y solo se leen con sesion.
      const PRIVATE_DATA_TABLE = "lr_suite_private_data";

      async function loadPrivateQuotes() {
        const client = ensureSharedPendingClient();
        if (!client || !getSuiteAccessSession()) return;
        const { data, error } = await client
          .from(PRIVATE_DATA_TABLE)
          .select("payload")
          .eq("key", "quotes")
          .maybeSingle();
        if (error) {
          console.warn("No se pudieron cargar las cotizaciones:", error.message);
          return;
        }
        quotes = Array.isArray(data?.payload) ? data.payload : [];
        loadQuoteProgress();
        if (state.active === "quotes") render();
      }

      // previousQuotes: si se pasa, primero se guarda como respaldo en la clave "quotes-backup".
      async function savePrivateQuotes(previousQuotes = null) {
        const client = ensureSharedPendingClient();
        if (!client || !getSuiteAccessSession()) return false;
        if (previousQuotes) {
          const { error: backupError } = await client
            .from(PRIVATE_DATA_TABLE)
            .upsert({ key: "quotes-backup", payload: previousQuotes, updated_at: new Date().toISOString() }, { onConflict: "key" });
          if (backupError) {
            console.warn("No se pudo respaldar la base de cotizaciones; no se guarda la importacion:", backupError.message);
            return false;
          }
        }
        const { error } = await client
          .from(PRIVATE_DATA_TABLE)
          .upsert({ key: "quotes", payload: quotes, updated_at: new Date().toISOString() }, { onConflict: "key" });
        if (error) console.warn("No se pudieron guardar las cotizaciones:", error.message);
        return !error;
      }

      // Carpetas de Drive de cada marca: no viven en el repositorio, que es publico, sino en Supabase
      // (clave "clientes-drive"), un objeto { "<repo>": "<url de la carpeta>" }. Es una lectura de menos
      // de 1 KB por sesion. Mientras no llega, el modulo pinta el acceso "Drive" en gris.
      let clientesDriveLinks = {};

      // Marcas archivadas (clave "clientes-archivadas"): las que dejaron de ser clientes. No se borran,
      // porque su historial sigue sirviendo; salen de la lista y quedan en su propia pestana. La lista
      // es de nombres de marca, vive en Supabase para que las dos cuentas vean lo mismo y viaja en la
      // misma lectura que las carpetas. Mientras la fila no existe valen las de abajo, las tres que ya
      // estaban archivadas cuando se hizo la opcion.
      const CLIENTES_ARCHIVADAS_INICIALES = ["Casiopia", "Llanos Import", "Rekluta"];
      let clientesArchivadas = CLIENTES_ARCHIVADAS_INICIALES.slice();
      let clientesArchivadasError = "";

      async function loadClientesPrivados() {
        const client = ensureSharedPendingClient();
        if (!client || !getSuiteAccessSession()) return;
        const { data, error } = await client
          .from(PRIVATE_DATA_TABLE)
          .select("key, payload")
          .in("key", ["clientes-drive", "clientes-archivadas"]);
        if (error) {
          console.warn("No se pudieron cargar los datos de los clientes:", error.message);
          return;
        }
        const filas = new Map((data || []).map((fila) => [fila.key, fila.payload]));
        const links = filas.get("clientes-drive");
        clientesDriveLinks = links && typeof links === "object" && !Array.isArray(links) ? links : {};
        // Sin fila manda la lista inicial; una fila vacia si quiere decir "ninguna archivada".
        if (filas.has("clientes-archivadas")) {
          const archivadas = filas.get("clientes-archivadas");
          clientesArchivadas = Array.isArray(archivadas) ? archivadas.map((marca) => String(marca)) : [];
        }
        if (state.active === "clientes") render();
      }

      // Archivar y restaurar guardan la lista entera: son unos pocos nombres, no hace falta mas tabla.
      async function guardarClientesArchivadas(siguiente) {
        const anterior = clientesArchivadas;
        clientesArchivadas = siguiente;
        clientesArchivadasError = "";
        if (state.active === "clientes") clientesModule();

        const client = ensureSharedPendingClient();
        let fallo = "no hay sesion de Supabase";
        if (client && getSuiteAccessSession()) {
          const { error } = await client
            .from(PRIVATE_DATA_TABLE)
            .upsert(
              { key: "clientes-archivadas", payload: siguiente, updated_at: new Date().toISOString() },
              { onConflict: "key" }
            );
          fallo = error ? error.message : "";
        }
        if (fallo) {
          console.warn("No se pudo guardar la lista de marcas archivadas:", fallo);
          // Si no se guardo, la pantalla no puede decir que si: vuelve a como estaba.
          clientesArchivadas = anterior;
          clientesArchivadasError = "No se pudo guardar el cambio en Supabase. La lista quedó como estaba.";
          if (state.active === "clientes") clientesModule();
          return false;
        }
        return true;
      }

      // Anuncios: una fila (clave "ads") con los anuncios de cada marca y mes ya sumados, y la pieza de
      // Drive de cada uno. Hoy son ~12 KB para una marca y un mes. Una lectura por sesion.
      let adsPayload = null;
      let adsLoaded = false;
      let adsError = "";
      let adsSyncing = false;

      async function loadPrivateAds() {
        const client = ensureSharedPendingClient();
        if (!client || !getSuiteAccessSession()) return;
        const { data, error } = await client
          .from(PRIVATE_DATA_TABLE)
          .select("payload")
          .eq("key", "ads")
          .maybeSingle();
        adsLoaded = true;
        if (error) {
          console.warn("No se pudieron cargar los anuncios:", error.message);
          adsError = "No se pudieron leer los anuncios desde Supabase. Recarga la página.";
        } else {
          adsPayload = data?.payload || null;
        }
        if (state.active === "ads") render();
      }

      // Qué carpetas tiene cada marca dentro de su carpeta de Drive. Las lista Supabase a diario
      // (src/modules/clientes/BBDD/carpetas-clientes.sql); el navegador no puede preguntárselo a
      // Drive. Sin esta fila, el mapa no sabe qué dibujar y lo dice.
      let clientesCarpetas = null;
      let clientesCarpetasCargado = false;
      let clientesCarpetasSync = false;
      let clientesCarpetasError = "";

      async function loadClientesCarpetas() {
        const client = ensureSharedPendingClient();
        if (!client || !getSuiteAccessSession()) return;
        const { data, error } = await client
          .from(PRIVATE_DATA_TABLE)
          .select("payload")
          .eq("key", "clientes-carpetas")
          .maybeSingle();
        clientesCarpetasCargado = true;
        if (error) {
          console.warn("No se pudieron cargar las carpetas de los clientes:", error.message);
        } else {
          clientesCarpetas = data?.payload || null;
        }
        if (state.active === "clientes") render();
      }

      async function syncClientesCarpetas() {
        if (clientesCarpetasSync) return;
        const client = ensureSharedPendingClient();
        if (!client || !getSuiteAccessSession()) return;
        clientesCarpetasSync = true;
        clientesCarpetasError = "";
        if (state.active === "clientes") clientesModule();
        try {
          const { data, error } = await client.rpc("sync_lr_suite_clientes_carpetas");
          if (error) {
            clientesCarpetasError = adsSyncErrorMessage(error).replace(
              "src/modules/anuncios/BBDD/sincronizacion-anuncios.sql",
              "src/modules/clientes/BBDD/carpetas-clientes.sql"
            );
          } else if (data) {
            clientesCarpetas = data;
            clientesCarpetasCargado = true;
          }
        } catch (error) {
          clientesCarpetasError = adsSyncErrorMessage(error);
        }
        clientesCarpetasSync = false;
        if (state.active === "clientes") clientesModule();
      }

      function adsSyncErrorMessage(error) {
        const code = String(error?.code || "");
        const message = String(error?.message || "");
        if (code === "PGRST202" || /could not find the function/i.test(message)) {
          return "Falta instalar la sincronización en Supabase: ejecuta src/modules/anuncios/BBDD/sincronizacion-anuncios.sql en el SQL Editor.";
        }
        if (code === "57014") return "Google tardó demasiado en responder. Vuelve a intentarlo en unos segundos.";
        if (code === "42501") return "Tu usuario no tiene permiso para actualizar los anuncios.";
        if (/falta configurar alguna marca/i.test(message)) {
          return "Todavía no hay ninguna marca configurada: ejecuta lr_suite_ads_set_brand() en el SQL Editor.";
        }
        return `No se pudo actualizar: ${message || "error desconocido"}`;
      }

      // Supabase vuelve a pedir el resumen a Google y devuelve la fila nueva en la misma respuesta,
      // asi que no hace falta una segunda lectura.
      async function syncAdsFromDrive() {
        if (adsSyncing) return;
        const client = ensureSharedPendingClient();
        if (!client || !getSuiteAccessSession()) {
          adsError = "Inicia sesión para actualizar los anuncios.";
          if (state.active === "ads") render();
          return;
        }
        adsSyncing = true;
        adsError = "";
        if (state.active === "ads") render();
        try {
          const { data, error } = await client.rpc("sync_lr_suite_ads");
          if (error) {
            adsError = adsSyncErrorMessage(error);
          } else if (data) {
            adsPayload = data;
            adsLoaded = true;
          }
        } catch (error) {
          adsError = adsSyncErrorMessage(error);
        }
        adsSyncing = false;
        if (state.active === "ads") render();
      }

      // Pérdidas y Ganancias: una sola fila (~5 KB) por carga de página; el botón "Actualizar" devuelve la
      // fila nueva en la misma respuesta, sin una segunda lectura.
      async function loadPrivateFinancial() {
        const client = ensureSharedPendingClient();
        if (!client || !getSuiteAccessSession()) return;
        const { data, error } = await client
          .from(PRIVATE_DATA_TABLE)
          .select("payload")
          .eq("key", "financial")
          .maybeSingle();
        financialLoaded = true;
        if (error) {
          console.warn("No se pudo cargar Pérdidas y Ganancias:", error.message);
          financialError = "No se pudieron leer los datos de Pérdidas y Ganancias desde Supabase. Recarga la página o pulsa «Actualizar».";
        } else {
          financialPayload = data?.payload || null;
        }
        if (state.active === "financial") render();
      }

      function financialSyncErrorMessage(error) {
        const code = String(error?.code || "");
        const message = String(error?.message || "");
        if (code === "PGRST202" || /could not find the function/i.test(message)) {
          return "Falta instalar la sincronización en Supabase: ejecuta src/modules/estado-perdidas-ganancias/BBDD/sincronizacion-google-sheets.sql en el SQL Editor.";
        }
        if (code === "57014") return "Google Sheets tardó demasiado en responder. Vuelve a intentarlo en unos segundos.";
        if (code === "42501") return "Tu usuario no tiene permiso para actualizar Pérdidas y Ganancias.";
        return `No se pudo actualizar desde Google Sheets: ${message || "error desconocido"}`;
      }

      // Supabase descarga la hoja (RPC sync_lr_suite_financial) y devuelve la fila guardada. A la vez se
      // releen de Drive los informes de Google Ads, de donde sale la inversión mensual en esa plataforma.
      async function syncFinancialFromSheet() {
        if (financialSyncing) return;
        const client = ensureSharedPendingClient();
        if (!client || !getSuiteAccessSession()) {
          financialError = "Inicia sesión para actualizar los datos.";
          if (state.active === "financial") render();
          return;
        }
        financialSyncing = true;
        financialError = "";
        if (state.active === "financial") render();
        refreshKeywordsFromDrive();
        try {
          const { data, error } = await client.rpc("sync_lr_suite_financial");
          if (error) {
            financialError = financialSyncErrorMessage(error);
          } else if (data) {
            financialPayload = data;
            financialLoaded = true;
          }
        } catch (error) {
          financialError = financialSyncErrorMessage(error);
        } finally {
          financialSyncing = false;
        }
        if (state.active === "financial") render();
      }

      async function connectSharedPendingUser() {
        await waitForSharedPendingLibrary();
        if (!ensureSharedPendingClient()) return false;
        sharedPendingAvailable = false;
        await initSharedPendingDb();
        return sharedPendingAvailable;
      }

      function sharedPendingPayload(overrides = {}) {
        return {
          app_id: SHARED_PENDING_APP_ID,
          actor_name: currentSuiteUserName(),
          completed_tasks: overrides.completedTasks || completedTasks,
          presence: readStoredJson(PRESENCE_STORAGE_KEY, {}),
          source_id: pendingSyncSourceId,
          state_version: pendingStateVersion || 0,
          task_timer: overrides.taskTimer || taskTimer,
          tasks,
          updated_at: new Date().toISOString()
        };
      }

      function sharedTimerPayload() {
        return {
          actorName: currentSuiteUserName(),
          sourceId: pendingSyncSourceId,
          taskTimer,
          updatedAt: Date.now()
        };
      }

      function applySharedPendingRow(row) {
        if (!row || row.source_id === pendingSyncSourceId) return;
        const previousTasksSignature = JSON.stringify([tasks, completedTasks]);
        const incomingVersion = Number(row.state_version ?? (row.updated_at ? new Date(row.updated_at).getTime() : 0));
        mergeTaskTombstones(row.task_timer?.tombstonesById);
        const isNewer = !pendingStateVersion || incomingVersion >= pendingStateVersion;
        sharedPendingApplying = true;
        if (JSON.stringify(tasks) !== JSON.stringify(row.tasks || [])) {
          saveLocalPendingBackup("antes-de-aplicar-bbdd");
        }
        tasks = isNewer ? mergePendingTaskLists(row.tasks, tasks) : mergePendingTaskLists(tasks, row.tasks);
        rememberTaskFieldSignatures();
        completedTasks = mergeCompletedTaskHistory(completedTasks, row.completed_tasks);
        const migrated = migrateJorgeLuisPendingTasks();
        if (isNewer && row.task_timer && typeof row.task_timer === "object") {
          mergeTaskTimerSnapshot(row.task_timer, {
            actorName: row.actor_name,
            updatedAt: incomingVersion
          });
        }
        if (row.presence && typeof row.presence === "object") {
          mergePendingPresence(row.presence);
        }
        ensureTaskIds();
        const normalizedStartDates = ensureTaskStartDates();
        pendingStateVersion = migrated || normalizedStartDates ? Date.now() : Math.max(pendingStateVersion, incomingVersion || 0);
        persistTaskStateVersion();
        writeStoredJson(TASKS_STORAGE_KEY, tasks);
        writeStoredJson(COMPLETED_STORAGE_KEY, completedTasks);
        writeStoredJson(TIMER_STORAGE_KEY, taskTimer);
        sharedPendingApplying = false;
        if (normalizedStartDates) queueSharedPendingSave();
        if (hasActiveTaskTimers()) ensureTaskTimerInterval();
        else stopTaskTimerIntervalIfIdle();
        publishTaskSync();
        if (previousTasksSignature !== JSON.stringify([tasks, completedTasks])) {
          showLiveActivity(`${row.actor_name || "Otro usuario"} actualizó pendientes.`);
        }
        renderTasksIfActive();
      }

      function applySharedLivePayload(payload) {
        if (!payload || payload.sourceId === pendingSyncSourceId) return;
        if (!Array.isArray(payload.tasks) || !Array.isArray(payload.completedTasks)) return;
        const incomingVersion = Number(payload.stateVersion ?? payload.updatedAt ?? 0);
        mergeTaskTombstones(payload.tombstonesById, payload.taskTimer?.tombstonesById);
        const isNewer = !pendingStateVersion || incomingVersion >= pendingStateVersion;
        lastSharedStateAt = Math.max(lastSharedStateAt, incomingVersion || Number(payload.updatedAt || 0));
        const previousTasksSignature = JSON.stringify([tasks, completedTasks]);
        const previousTimerUiSignature = taskTimerUiSignature();
        sharedPendingApplying = true;
        if (JSON.stringify(tasks) !== JSON.stringify(payload.tasks || [])) {
          saveLocalPendingBackup("antes-de-aplicar-bbdd-vivo");
        }
        tasks = isNewer ? mergePendingTaskLists(payload.tasks, tasks) : mergePendingTaskLists(tasks, payload.tasks);
        rememberTaskFieldSignatures();
        completedTasks = mergeCompletedTaskHistory(completedTasks, payload.completedTasks);
        const migrated = migrateJorgeLuisPendingTasks();
        if (isNewer && payload.taskTimer && typeof payload.taskTimer === "object") {
          mergeTaskTimerSnapshot(payload.taskTimer, {
            actorName: payload.actorName,
            updatedAt: Number(payload.updatedAt || incomingVersion)
          });
        }
        if (payload.presence && typeof payload.presence === "object") {
          mergePendingPresence(payload.presence);
        }
        ensureTaskIds();
        const normalizedStartDates = ensureTaskStartDates();
        pendingStateVersion = migrated || normalizedStartDates ? Date.now() : Math.max(pendingStateVersion, lastSharedStateAt);
        persistTaskStateVersion();
        writeStoredJson(TASKS_STORAGE_KEY, tasks);
        writeStoredJson(COMPLETED_STORAGE_KEY, completedTasks);
        writeStoredJson(TIMER_STORAGE_KEY, taskTimer);
        sharedPendingApplying = false;
        if (normalizedStartDates) queueSharedPendingSave();
        const hasTaskChanges = previousTasksSignature !== JSON.stringify([tasks, completedTasks]);
        const hasTimerUiChanges = previousTimerUiSignature !== taskTimerUiSignature();
        if (hasActiveTaskTimers()) ensureTaskTimerInterval();
        else stopTaskTimerIntervalIfIdle();
        if (hasTaskChanges || hasTimerUiChanges) {
          showLiveActivity(`${payload.actorName || "Otro usuario"} actualizó pendientes en vivo.`);
        }
        if (hasTaskChanges || hasTimerUiChanges) {
          renderTasksIfActive();
        } else {
          renderPresenceFromSync();
          updateTaskTimerDom();
        }
        if (migrated) queueSharedPendingSave();
      }

      function applySharedTimerPayload(payload) {
        if (!payload || payload.sourceId === pendingSyncSourceId) return;
        if (!payload.taskTimer || typeof payload.taskTimer !== "object") return;

        const incomingTimer = payload.taskTimer;
        const hasTimerChanges = JSON.stringify(incomingTimer) !== JSON.stringify(taskTimer);
        if (!hasTimerChanges) return;

        const previousTimerUiSignature = taskTimerUiSignature();
        mergeTaskTimerSnapshot(incomingTimer, {
          actorName: payload.actorName,
          updatedAt: Number(payload.updatedAt || 0)
        });
        writeStoredJson(TIMER_STORAGE_KEY, taskTimer);

        if (hasActiveTaskTimers()) ensureTaskTimerInterval();
        else stopTaskTimerIntervalIfIdle();

        if (previousTimerUiSignature !== taskTimerUiSignature()) {
          renderTasksIfActive();
        } else {
          updateTaskTimerDom();
          renderPresenceFromSync();
        }
      }

      function publishSharedTimerState() {
        if (!sharedLiveChannel || !sharedLiveSubscribed || sharedPendingApplying) return;
        sharedLiveChannel.send({
          event: "timer",
          payload: sharedTimerPayload(),
          type: "broadcast"
        });
      }

      function publishSharedPresence(entry) {
        if (!sharedLiveChannel || !sharedLiveSubscribed || !entry?.id) return;
        sharedLiveChannel.send({
          event: "presence",
          payload: {
            entry,
            sourceId: pendingSyncSourceId,
            updatedAt: Date.now()
          },
          type: "broadcast"
        });
      }

      function publishSharedAssignment(notice) {
        if (!sharedLiveChannel || !sharedLiveSubscribed || !notice?.id) return;
        sharedLiveChannel.send({
          event: "assignment",
          payload: {
            notice,
            sourceId: pendingSyncSourceId,
            updatedAt: Date.now()
          },
          type: "broadcast"
        });
      }

      function initSharedPendingLive() {
        if (sharedLiveReady) return;
        // El canal es privado (Realtime Authorization): sin sesion de Supabase no se puede unir.
        if (!getSuiteAccessSession()) return;
        const client = ensureSharedPendingClient();
        if (!client) return;
        sharedLiveReady = true;
        setupSharedPendingResumeListeners();
        subscribeSharedLiveChannel();
      }

      // Quita el canal del cliente aunque su unsubscribe falle: si queda en la lista, client.channel()
      // con el mismo nombre devuelve el canal roto y subscribe() lanza "tried to subscribe multiple times".
      async function removeSharedChannelsByTopic(client, name) {
        const topic = `realtime:${name}`;
        const stale = client.getChannels().filter((channel) => channel.topic === topic);
        for (const channel of stale) {
          try {
            await client.removeChannel(channel);
          } catch {
            // Se fuerza abajo.
          }
          if (client.getChannels().includes(channel)) {
            try {
              channel.teardown();
            } catch {
              // Se quita a mano abajo.
            }
            if (client.getChannels().includes(channel)) client.realtime?._remove?.(channel);
          }
        }
      }

      function isSharedChannelDown(status) {
        return status === "CHANNEL_ERROR" || status === "TIMED_OUT" || status === "CLOSED";
      }

      function scheduleSharedLiveReconnect() {
        if (sharedLiveReconnectTimer || !sharedLiveReady || !getSuiteAccessSession()) return;
        const delay = sharedLiveRetryDelay;
        sharedLiveRetryDelay = Math.min(sharedLiveRetryDelay * 2, 30000);
        sharedLiveReconnectTimer = window.setTimeout(() => {
          sharedLiveReconnectTimer = null;
          subscribeSharedLiveChannel();
        }, delay);
      }

      async function subscribeSharedLiveChannel() {
        const client = ensureSharedPendingClient();
        if (!client || !sharedLiveReady || !getSuiteAccessSession()) return;
        window.clearTimeout(sharedLiveReconnectTimer);
        sharedLiveReconnectTimer = null;
        sharedLiveChannel = null;
        sharedLiveSubscribed = false;
        await removeSharedChannelsByTopic(client, "lr-suite-pending-live");
        // El canal es privado: Realtime tiene que llevar el JWT vigente del usuario, no el anon key.
        try {
          await client.realtime.setAuth();
        } catch {
          // Si falla, el join da CHANNEL_ERROR y se reintenta.
        }
        // Otra llamada pudo crear el canal mientras se esperaba arriba.
        if (sharedLiveChannel || !sharedLiveReady || !getSuiteAccessSession()) return;
        const channel = client.channel("lr-suite-pending-live", {
          config: {
            // Antes era publico: cualquiera con la anon key podia escuchar el estado de las tareas y
            // enviar eventos "state" que los navegadores aplicaban y guardaban.
            private: true,
            broadcast: {
              self: false
            }
          }
        });
        sharedLiveChannel = channel;
        channel
          .on("broadcast", { event: "state" }, (event) => applySharedLivePayload(event.payload))
          .on("broadcast", { event: "timer" }, (event) => applySharedTimerPayload(event.payload))
          .on("broadcast", { event: "changed" }, (event) => {
            if (event.payload?.sourceId === pendingSyncSourceId) return;
            // Primero la consulta minima de updated_at: si ya se tiene esa version no se baja nada.
            checkSharedPendingRemote();
          })
          .on("broadcast", { event: "presence" }, (event) => applyPresenceSyncPayload(event.payload))
          .on("broadcast", { event: "assignment" }, (event) => applyAssignmentNotificationPayload(event.payload))
          .subscribe((status) => {
            // Estados de un canal ya reemplazado (o cerrado al salir) no deben tocar el actual.
            if (channel !== sharedLiveChannel) return;
            sharedLiveSubscribed = status === "SUBSCRIBED";
            if (status === "SUBSCRIBED") {
              sharedLiveRetryDelay = 1000;
              sharedPendingStatus = sharedPendingAvailable ? "shared" : "live";
              publishPresenceSync(currentPendingPresenceEntry());
              // Lo guardado antes de tener el canal listo (la subida inicial al entrar) no se aviso:
              // el otro navegador revisa updated_at (consulta minima) y baja la fila solo si cambio.
              publishSharedChangedPing();
              // Lo que cambio mientras el canal estuvo caido no llega por broadcast: se revisa la BBDD.
              checkSharedPendingRemote();
            } else if (isSharedChannelDown(status)) {
              scheduleSharedLiveReconnect();
            }
          });
      }

      // Lee la fila compartida y la aplica en pantalla. Solo se llama cuando hay algo nuevo (aviso
      // "changed" o updated_at distinto), porque cada lectura baja el tablero completo.
      function sharedRowStamp(row) {
        const stamp = Date.parse(row?.updated_at || "");
        return Number.isFinite(stamp) ? stamp : 0;
      }

      async function pullSharedPendingState() {
        if (!sharedPendingAvailable || !sharedPendingClient) return;
        if (sharedPendingPullInFlight) {
          // Llego otro aviso durante la lectura: se lee de nuevo al terminar para no quedarse con
          // la version de antes de ese cambio.
          sharedPendingPullAgain = true;
          return;
        }
        sharedPendingPullInFlight = true;
        sharedPendingPullAgain = false;
        try {
          const { data, error } = await sharedPendingClient
            .from(SHARED_PENDING_TABLE)
            .select("tasks,completed_tasks,task_timer,presence,actor_name,state_version,updated_at")
            .eq("app_id", SHARED_PENDING_APP_ID)
            .maybeSingle();
          if (error) {
            if (isSharedAuthError(error)) recoverSharedSession(error);
            updateSharedPendingHealth({ readOk: false });
            return;
          }
          updateSharedPendingHealth({ readOk: true, lastReadAt: Date.now() });
          if (!data) return;
          lastSeenRemoteStamp = sharedRowStamp(data);
          // source_id propio no se descarta aqui: la fila puede traer cambios del otro usuario
          // fusionados despues de nuestra ultima escritura.
          applySharedPendingRow({ ...data, source_id: "shared-pull" });
        } finally {
          sharedPendingPullInFlight = false;
          if (sharedPendingPullAgain) pullSharedPendingState();
        }
      }

      // Consulta barata: solo updated_at (unos bytes). Si la fila no cambio, no se baja nada mas.
      async function readSharedPendingStamp() {
        const { data, error } = await sharedPendingClient
          .from(SHARED_PENDING_TABLE)
          .select("updated_at")
          .eq("app_id", SHARED_PENDING_APP_ID)
          .maybeSingle();
        if (error) {
          if (isSharedAuthError(error)) recoverSharedSession(error);
          return { error };
        }
        return { stamp: sharedRowStamp(data) };
      }

      // "permission denied for table ..." (42501) o un JWT vencido: la pantalla seguia abierta pero la
      // sesion de Supabase se habia perdido, asi que las consultas llegaban como anonimas y la suite se
      // quedaba en "Modo local" sin avisar. Se intenta renovar la sesion y, si no hay, se vuelve al login.
      function isSharedAuthError(error) {
        const code = String(error?.code || "");
        const message = String(error?.message || "");
        return code === "42501" || code === "PGRST301" || code === "PGRST303" || /permission denied|jwt/i.test(message);
      }

      let sharedSessionRecovery = null;
      let sharedSessionRecoveryFailures = 0;
      async function recoverSharedSession(cause = null) {
        if (sharedSessionRecovery) return sharedSessionRecovery;
        sharedSessionRecovery = (async () => {
          const client = ensureSharedPendingClient();
          if (!client || !getSuiteAccessSession()) return false;
          const readSession = async () => {
            try {
              const { data } = await client.auth.getSession();
              return data?.session || null;
            } catch {
              return null;
            }
          };
          const adopt = async () => {
            try {
              await client.realtime.setAuth();
            } catch {
              // El canal se reconecta solo con el token nuevo.
            }
            sharedPendingError = "";
            sharedSessionRecoveryFailures = 0;
            return true;
          };
          try {
            let session = await readSession();
            suiteSessionAtFailure = Boolean(session);
            if (!session) {
              // Otra pestaña puede estar renovando la sesion (comparten el almacenamiento): se espera un
              // momento antes de dar la sesion por perdida.
              await new Promise((resolve) => window.setTimeout(resolve, 1500));
              session = await readSession();
            }
            if (!session) suiteLastRefreshError = "sin sesion guardada";
            if (session) {
              const { data: refreshed, error } = await client.auth.refreshSession();
              if (!error && refreshed?.session) return adopt();
              suiteLastRefreshError = error ? `${error.code || error.status || ""} ${error.message || ""}`.trim() : "sin sesion nueva";
              const current = await readSession();
              if (current && current.access_token !== session.access_token) return adopt();
            }
          } catch (error) {
            console.warn("No se pudo renovar la sesion de Supabase:", error);
          }
          sharedSessionRecoveryFailures += 1;
          const detail = cause?.message ? ` (${cause.message})` : "";
          const clockWarning = suiteClockSkewWarning();
          const diagnostics = suiteSessionDiagnostics(Boolean(await readSession()));
          state.suiteAccessError = clockWarning
            ? `${clockWarning} [${diagnostics}]`
            : `Tu sesión venció. Vuelve a entrar para seguir sincronizando.${detail} [${diagnostics}]`;
          console.warn("Sesion de Supabase perdida:", cause, diagnostics);
          await signOutSuite();
          return false;
        })();
        try {
          return await sharedSessionRecovery;
        } finally {
          sharedSessionRecovery = null;
        }
      }

      async function checkSharedPendingRemote() {
        if (!sharedPendingAvailable || !sharedPendingClient) return;
        const { stamp, error } = await readSharedPendingStamp();
        if (error) {
          updateSharedPendingHealth({ readOk: false });
          return;
        }
        updateSharedPendingHealth({ readOk: true, lastReadAt: Date.now() });
        if (stamp && stamp !== lastSeenRemoteStamp) await pullSharedPendingState();
      }

      // Aviso liviano "hay cambios en la BBDD" despues de cada guardado. El evento "state" lleva el
      // tablero completo y Supabase descarta en silencio los mensajes que pasan su limite de tamaño;
      // este no depende del tamaño: quien lo recibe lee la fila al instante.
      function publishSharedChangedPing() {
        if (!sharedLiveChannel || !sharedLiveSubscribed) return;
        sharedLiveChannel.send({
          event: "changed",
          payload: {
            sourceId: pendingSyncSourceId,
            stateVersion: pendingStateVersion || 0
          },
          type: "broadcast"
        });
      }

      function ensureSharedRealtimeAlive() {
        if (!getSuiteAccessSession()) return;
        if (sharedLiveReady && !sharedLiveSubscribed && !sharedLiveReconnectTimer) subscribeSharedLiveChannel();
      }

      // Al volver a la pestaña o recuperar internet: los timers estaban frenados por el navegador y el
      // socket pudo haberse caido. Se revisan los canales y se trae el estado actual.
      function setupSharedPendingResumeListeners() {
        if (sharedPendingResumeListenersReady) return;
        sharedPendingResumeListenersReady = true;
        const resume = () => {
          if (document.visibilityState === "hidden") return;
          ensureSharedRealtimeAlive();
          checkSharedPendingRemote();
        };
        document.addEventListener("visibilitychange", resume);
        window.addEventListener("focus", resume);
        window.addEventListener("online", resume);
      }

      async function saveSharedPendingState() {
        if (!sharedPendingAvailable || !sharedPendingClient || sharedPendingApplying) return;
        sharedPendingError = "";
        let nextTaskTimer = taskTimer;
        // Antes de escribir hay que fusionar lo que el otro usuario haya guardado. Primero se consulta
        // solo updated_at: si la fila no cambio desde la ultima vez, no se baja el tablero completo.
        const { stamp: remoteStamp, error: stampError } = await readSharedPendingStamp();
        let data = null;
        let readError = stampError || null;
        if (!readError && (!remoteStamp || remoteStamp !== lastSeenRemoteStamp)) {
          const result = await sharedPendingClient
            .from(SHARED_PENDING_TABLE)
            .select("tasks,completed_tasks,task_timer")
            .eq("app_id", SHARED_PENDING_APP_ID)
            .maybeSingle();
          data = result.data;
          readError = result.error;
        }
        if (readError) {
          sharedPendingError = readError.message;
          sharedPendingStatus = readError.code === "PGRST205" ? "missing" : "error";
          updateSharedPendingHealth({
            readOk: false,
            storageOk: false,
            writeOk: false
          });
          console.warn("No se pudo leer pendientes compartidos antes de sincronizar:", readError.message);
          return;
        }
        updateSharedPendingHealth({ readOk: true, lastReadAt: Date.now() });
        mergeTaskTombstones(data?.task_timer?.tombstonesById);
        if (Array.isArray(data?.tasks)) {
          tasks = mergePendingTaskLists(tasks, data.tasks);
          rememberTaskFieldSignatures();
          writeStoredJson(TASKS_STORAGE_KEY, tasks);
        }
        if (Array.isArray(data?.completed_tasks)) {
          completedTasks = mergeCompletedTaskHistory(completedTasks, data.completed_tasks);
          writeStoredJson(COMPLETED_STORAGE_KEY, completedTasks);
        }
        if (data?.task_timer && typeof data.task_timer === "object") {
          nextTaskTimer = mergedTaskTimerForSharedSave(data.task_timer);
          applyTaskTimerSnapshot(nextTaskTimer);
          writeStoredJson(TIMER_STORAGE_KEY, taskTimer);
        }
        const payload = sharedPendingPayload({ taskTimer: nextTaskTimer });
        const { error } = await sharedPendingClient
          .from(SHARED_PENDING_TABLE)
          .upsert(payload, { onConflict: "app_id" });
        if (error) {
          if (isSharedAuthError(error)) recoverSharedSession(error);
          sharedPendingError = error.message;
          sharedPendingStatus = isStorageCapacityError(error) ? "storage" : error.code === "PGRST205" ? "missing" : "error";
          updateSharedPendingHealth({
            storageOk: false,
            writeOk: false
          });
          console.warn("No se pudo sincronizar pendientes compartidos:", error.message);
          return;
        }
        sharedPendingError = "";
        sharedPendingStatus = "shared";
        lastSeenRemoteStamp = sharedRowStamp(payload);
        publishSharedChangedPing();
        updateSharedPendingHealth({
          lastWriteAt: Date.now(),
          storageOk: true,
          writeOk: true
        });
        const backupOk = await saveSharedPendingBackup("sincronizacion");
        if (backupOk) {
          updateSharedPendingHealth({ backupOk: true, lastBackupAt: Date.now() });
        }
      }

      async function flushSharedPendingSave() {
        if (sharedPendingApplying) {
          sharedPendingSavePending = true;
          sharedPendingRetryTimer = window.setTimeout(flushSharedPendingSave, 500);
          updatePendingSyncStatusDom();
          return;
        }
        if (sharedPendingSaveInFlight) {
          sharedPendingSavePending = true;
          updatePendingSyncStatusDom();
          return;
        }

        sharedPendingSaveInFlight = true;
        window.clearTimeout(sharedPendingRetryTimer);
        sharedPendingRetryTimer = null;
        updatePendingSyncStatusDom();

        try {
          const connected = await ensureSharedPendingConnection();
          if (!connected) {
            sharedPendingSavePending = true;
            sharedPendingRetryTimer = window.setTimeout(flushSharedPendingSave, 3000);
            updatePendingSyncStatusDom();
            return;
          }

          sharedPendingSavePending = false;
          await saveSharedPendingState();

          if (sharedPendingError) {
            sharedPendingSavePending = true;
            sharedPendingRetryTimer = window.setTimeout(flushSharedPendingSave, 3000);
            updatePendingSyncStatusDom();
            return;
          }

          renderTasksIfActive();
        } finally {
          sharedPendingSaveInFlight = false;
          if (sharedPendingSavePending && !sharedPendingRetryTimer) {
            sharedPendingRetryTimer = window.setTimeout(flushSharedPendingSave, 300);
          }
          updatePendingSyncStatusDom();
        }
      }

      async function saveSharedPendingBackup(reason = "cambio") {
        if (!sharedPendingAvailable || !sharedPendingClient) return false;
        const snapshot = currentPendingBackup(reason);
        const signature = pendingBackupSignature(snapshot);
        if (signature === lastSharedBackupSignature) return true;
        const { error } = await sharedPendingClient
          .from(SHARED_PENDING_BACKUP_TABLE)
          .insert({
            actor_name: snapshot.actorName,
            app_id: SHARED_PENDING_APP_ID,
            backup_key: `${SHARED_PENDING_APP_ID}-${snapshot.stateVersion}-${signature}`,
            completed_tasks: snapshot.completedTasks,
            reason,
            state_version: snapshot.stateVersion,
            task_timer: snapshot.taskTimer,
            tasks: snapshot.tasks
          });
        if (!error || error.code === "23505") {
          lastSharedBackupSignature = signature;
          return true;
        }
        updateSharedPendingHealth({
          backupOk: false,
          storageOk: isStorageCapacityError(error) ? false : sharedPendingHealth.storageOk
        });
        if (isStorageCapacityError(error)) {
          sharedPendingStatus = "storage";
          sharedPendingError = `Supabase no acepto el backup: posible falta de espacio o limite alcanzado. ${error.message}`;
        }
        if (error.code !== "PGRST205" && error.code !== "42P01") {
          console.warn("No se pudo crear el backup de pendientes:", error.message);
        }
        return false;
      }

      async function recoverSharedPendingBackups() {
        if (!sharedPendingAvailable || !sharedPendingClient) return false;
        const { data, error } = await sharedPendingClient
          .from(SHARED_PENDING_BACKUP_TABLE)
          .select("tasks,completed_tasks,task_timer,state_version")
          .eq("app_id", SHARED_PENDING_APP_ID)
          .order("created_at", { ascending: false })
          .limit(40);
        if (error) {
          if (error.code !== "PGRST205" && error.code !== "42P01") {
            console.warn("No se pudieron validar los backups de pendientes:", error.message);
          }
          return false;
        }
        const previousState = JSON.stringify([tasks, completedTasks, taskTimer]);
        (data || []).forEach((backup) => {
          mergeArchivedTaskTimer(backup?.task_timer);
        });
        tasks = mergePendingTaskLists(tasks, ...(data || []).map((backup) => backup.tasks));
        rememberTaskFieldSignatures();
        completedTasks = mergeCompletedTaskHistory(
          completedTasks,
          ...(data || []).map((backup) => backup.completed_tasks)
        );
        writeStoredJson(TASKS_STORAGE_KEY, tasks);
        writeStoredJson(COMPLETED_STORAGE_KEY, completedTasks);
        writeStoredJson(TIMER_STORAGE_KEY, taskTimer);
        return previousState !== JSON.stringify([tasks, completedTasks, taskTimer]);
      }

      async function validateSharedPendingState() {
        if (sharedPendingApplying || !getSuiteAccessSession()) return;
        const connected = await ensureSharedPendingConnection();
        if (!connected) {
          updateSharedPendingHealth({ readOk: false, storageOk: false, writeOk: false });
          return;
        }
        // Leer los respaldos baja hasta 40 copias completas del tablero: se intenta una sola vez por
        // sesion, no en cada revision.
        if (!tasks.length && !sharedBackupRecoveryTried) {
          sharedBackupRecoveryTried = true;
          const recovered = await recoverSharedPendingBackups();
          if (recovered) {
            pendingStateVersion = Date.now();
            saveTaskState({ reason: "recuperacion-automatica" });
            renderTasksIfActive();
            return;
          }
        }
        ensureSharedRealtimeAlive();
        // Con la pestaña oculta no se consulta: al volver, el listener de visibilidad revisa al instante.
        if (document.visibilityState === "hidden") return;
        // Consulta barata de updated_at; la fila completa solo se baja si otro usuario la cambio.
        await checkSharedPendingRemote();
      }

      async function archiveCompletedTask(record) {
        sharedPendingError = "";
        const connected = await ensureSharedPendingConnection();
        if (!connected) {
          sharedPendingError =
            sharedPendingError ||
            "La conexion compartida con Supabase no esta disponible. Revisa internet y vuelve a intentarlo.";
          return false;
        }

        const { data, error: readError } = await sharedPendingClient
          .from(SHARED_PENDING_TABLE)
          .select("tasks,completed_tasks,task_timer")
          .eq("app_id", SHARED_PENDING_APP_ID)
          .maybeSingle();
        if (readError) {
          sharedPendingError = readError.message;
          console.warn("No se pudo leer el historial antes de consolidar:", readError.message);
          return false;
        }

        const nextCompletedTasks = mergeCompletedTaskHistory(
          completedTasks,
          data?.completed_tasks,
          [record]
        );
        mergeTaskTombstones(data?.task_timer?.tombstonesById);
        tasks = mergePendingTaskLists(tasks, data?.tasks);
        rememberTaskFieldSignatures();
        const nextTaskTimer = data?.task_timer
          ? mergedTaskTimerForSharedSave(data.task_timer)
          : taskTimer;
        const archivePayload = sharedPendingPayload({
          completedTasks: nextCompletedTasks,
          taskTimer: nextTaskTimer
        });
        const { error: saveError } = await sharedPendingClient
          .from(SHARED_PENDING_TABLE)
          .upsert(archivePayload, { onConflict: "app_id" });
        if (saveError) {
          sharedPendingError = saveError.message;
          console.warn("No se pudo guardar el historial consolidado:", saveError.message);
          return false;
        }
        lastSeenRemoteStamp = sharedRowStamp(archivePayload);
        publishSharedChangedPing();

        completedTasks = nextCompletedTasks;
        localStorage.setItem(COMPLETED_STORAGE_KEY, JSON.stringify(completedTasks));

        const { error: archiveError } = await sharedPendingClient
          .from(SHARED_PENDING_HISTORY_TABLE)
          .insert({
            app_id: SHARED_PENDING_APP_ID,
            completed_at: record.completedAt,
            payload: record,
            record_id: record.completedRecordId
          });
        if (
          archiveError &&
          archiveError.code !== "23505" &&
          archiveError.code !== "PGRST205" &&
          archiveError.code !== "42P01"
        ) {
          console.warn("No se pudo crear la copia append-only del historial:", archiveError.message);
        }
        return true;
      }

      async function loadArchivedCompletedTasks() {
        if (!sharedPendingAvailable || !sharedPendingClient) return;
        const { data, error } = await sharedPendingClient
          .from(SHARED_PENDING_HISTORY_TABLE)
          .select("payload")
          .eq("app_id", SHARED_PENDING_APP_ID)
          .order("completed_at", { ascending: false });
        if (error) {
          if (error.code !== "PGRST205" && error.code !== "42P01") {
            console.warn("No se pudo cargar la copia histórica:", error.message);
          }
          return;
        }
        completedTasks = mergeCompletedTaskHistory(
          completedTasks,
          (data || []).map((row) => row.payload)
        );
        localStorage.setItem(COMPLETED_STORAGE_KEY, JSON.stringify(completedTasks));
      }

      // Los demas navegadores se enteran por el aviso "changed" que se envia despues de guardar. Antes
      // ademas se mandaba el tablero completo por Realtime en cada cambio (y la fila entera llegaba otra
      // vez por postgres_changes): eso agoto la cuota de trafico de salida del plan de Supabase.
      function queueSharedPendingSave() {
        if (sharedPendingApplying) return;
        sharedPendingSavePending = true;
        window.clearTimeout(sharedPendingSaveTimer);
        window.clearTimeout(sharedPendingRetryTimer);
        sharedPendingRetryTimer = null;
        sharedPendingSaveTimer = window.setTimeout(flushSharedPendingSave, 250);
        updatePendingSyncStatusDom();
      }

      async function initSharedPendingDb() {
        if (sharedPendingAvailable || sharedPendingInitializing) return;
        // Sin sesion no se lee ni se escribe la BBDD compartida: antes cualquier visitante de la pagina
        // se conectaba como anonimo y podia sobrescribir los pendientes con su copia local.
        if (!getSuiteAccessSession()) {
          sharedPendingStatus = "local";
          return;
        }
        sharedPendingInitializing = true;
        try {
          await loadSharedPendingDb();
        } finally {
          // Antes, un error a mitad de camino dejaba esto en true para siempre y la BBDD no volvia a conectarse.
          sharedPendingInitializing = false;
        }
      }

      async function loadSharedPendingDb() {
        const client = ensureSharedPendingClient();
        if (!client) {
          sharedPendingStatus = "local";
          return;
        }

        const { data, error } = await client
          .from(SHARED_PENDING_TABLE)
          .select("app_id,tasks,completed_tasks,task_timer,presence,source_id,actor_name,state_version,updated_at")
          .eq("app_id", SHARED_PENDING_APP_ID)
          .maybeSingle();

        if (error) {
          if (isSharedAuthError(error)) recoverSharedSession(error);
          sharedPendingError = error.message;
          sharedPendingStatus = error.code === "PGRST205" ? "missing" : "error";
          console.warn("BBDD compartida de pendientes no disponible:", error.message);
          return;
        }

        sharedPendingAvailable = true;
        sharedPendingStatus = "shared";

        if (data) {
          lastSeenRemoteStamp = sharedRowStamp(data);
          applySharedPendingRow({ ...data, source_id: "shared-load" });
        } else {
          await saveSharedPendingState();
        }
        await loadArchivedCompletedTasks();
        const recoveredFromBackup =
          !Array.isArray(data?.tasks) || !data.tasks.length
            ? await recoverSharedPendingBackups()
            : false;
        recoverLegacyCompletedTasks();
        await saveSharedPendingState();
        if (jorgePendingMigrationApplied) {
          await saveSharedPendingState();
          jorgePendingMigrationApplied = false;
        }

        setupSharedPendingResumeListeners();
        window.clearInterval(sharedPendingValidationTimer);
        sharedPendingValidationTimer = window.setInterval(
          validateSharedPendingState,
          PENDING_BACKUP_VALIDATION_MS
        );
        if (recoveredFromBackup) renderTasksIfActive();
      }

      function renderPresenceFromSync() {
        if (state.active !== "tasks" || !hasSuiteAccess()) return;
        updatePresenceCardsOnly();
        updateLiveTaskEditorsOnly();
      }

      function publishPresenceSync(entry) {
        const payload = {
          entry,
          sourceId: pendingSyncSourceId,
          updatedAt: Date.now()
        };
        presenceSyncChannel?.postMessage(payload);
        publishSharedPresence(entry);
        try {
          localStorage.setItem(PRESENCE_SYNC_EVENT_KEY, JSON.stringify(payload));
        } catch {
          // La presencia sigue usando el almacenamiento local como respaldo.
        }
      }

      function applyPresenceSyncPayload(payload) {
        if (!payload || payload.sourceId === pendingSyncSourceId || !payload.entry?.id) return;
        mergePendingPresence({ [payload.entry.id]: payload.entry });
        renderPresenceFromSync();
      }

      function publishAssignmentNotification(notice) {
        const payload = {
          notice,
          sourceId: pendingSyncSourceId,
          updatedAt: Date.now()
        };
        assignmentSyncChannel?.postMessage(payload);
        publishSharedAssignment(notice);
        try {
          localStorage.setItem(ASSIGNMENT_SYNC_EVENT_KEY, JSON.stringify(payload));
        } catch {
          // Las notificaciones usan storage como respaldo local.
        }
      }

      function applyAssignmentNotificationPayload(payload) {
        if (!payload || payload.sourceId === pendingSyncSourceId || !payload.notice?.id) return;
        receiveAssignmentNotification(payload.notice);
      }

      function pendingEditorsByTask() {

          const taskEditors = editors.get(entry.editingTaskId) || [];
          taskEditors.push(entry);
          editors.set(entry.editingTaskId, taskEditors);

        const editors = editorsByTask.get(id) || [];
        if (!editors.length) return "";
        const detail = editors

      function updateLiveActivityNotice() {
        const notice = document.getElementById("liveActivityNotice");
        if (!notice) return;
        notice.hidden = !liveActivityMessage;
        notice.textContent = liveActivityMessage;
      }

      function pendingSyncStatusInfo() {
        if (sharedPendingStatus === "storage") {
          return {
            tone: "danger",
            label: "BBDD sin espacio",
            detail: sharedPendingError || "Supabase no esta aceptando escrituras. Revisa cuota, limite o politicas."
          };
        }
        if (sharedPendingSaveInFlight || sharedPendingSavePending) {
          return {
            tone: "busy",
            label: "Sincronizando BBDD",
            detail: "Guardando la copia visible de este navegador en Supabase."
          };
        }
        if (sharedPendingAvailable && sharedPendingClient) {
          if (sharedPendingHealth.readOk && sharedPendingHealth.writeOk && sharedPendingHealth.storageOk) {
            return {
              tone: "ok",
              label: "BBDD verificada",
              detail: `Lectura OK · Guardado OK · Espacio OK · Ultima prueba ${pendingHealthTime(sharedPendingHealth.lastWriteAt)} · ${tasks.length} pendientes · Lista ${pendingTasksDigest()}.`
            };
          }
          return {
            tone: "warn",
            label: "BBDD conectada",
            detail: `Conectada, esperando confirmar guardado y espacio. Ultima lectura ${pendingHealthTime(sharedPendingHealth.lastReadAt)}.`
          };
        }
        if (sharedPendingStatus === "missing") {
          return {
            tone: "warn",
            label: "Tabla pendiente",
            detail: "Falta instalar o publicar la tabla de pendientes en Supabase."
          };
        }
        if (sharedPendingError) {
          return {
            tone: "warn",
            label: "Modo local",
            detail: sharedPendingError
          };
        }
        return {
          tone: "warn",
          label: "Modo local",
          detail: "Esta pantalla aun no confirma conexion con Supabase."
        };
      }

      function pendingSyncStatusHtml() {
        const status = pendingSyncStatusInfo();
        return `
          <div class="pending-sync-bar">
            <div class="pending-sync-detail">
              <span class="pending-sync-label ${status.tone}" id="pendingSyncLabel">${escapeHtml(status.label)}</span>
              <p class="pending-sync-message" id="pendingSyncMessage">${escapeHtml(status.detail)}</p>
            </div>
            <button class="btn" type="button" data-force-pending-sync>Sincronizar BBDD</button>
          </div>
        `;
      }

      function updatePendingSyncStatusDom() {
        const label = document.getElementById("pendingSyncLabel");
        const message = document.getElementById("pendingSyncMessage");
        const buttons = document.querySelectorAll("[data-force-pending-sync]");
        const status = pendingSyncStatusInfo();
        // Copia del estado junto al boton "Sincronizar BBDD": el recuadro original queda al pie de la
        // pagina y no se veia. Si no esta todo OK, el detalle se muestra debajo del tablero.
        const topLabel = document.getElementById("pendingSyncTopLabel");
        const topMessage = document.getElementById("pendingSyncTopMessage");
        if (topLabel) {
          topLabel.className = `pending-sync-label ${status.tone}`;
          topLabel.textContent = status.label;
          topLabel.title = status.detail;
        }
        if (topMessage) {
          topMessage.textContent = status.detail;
          topMessage.hidden = status.tone === "ok";
        }
        if (!label || !message) return;
        label.className = `pending-sync-label ${status.tone}`;
        label.textContent = status.label;
        message.textContent = status.detail;
        buttons.forEach((button) => {
          button.disabled = sharedPendingSaveInFlight;
          button.textContent = sharedPendingSaveInFlight ? "Sincronizando..." : "Sincronizar BBDD";
        });
      }

      async function forcePendingSync() {
        sharedPendingSavePending = true;
        showLiveActivity("Sincronizando pendientes con la BBDD...");
        await flushSharedPendingSave();
        if (sharedPendingAvailable && !sharedPendingError) {
          await validateSharedPendingState();
          showLiveActivity("Pendientes sincronizados con Supabase.");
        } else {
          showLiveActivity("No se pudo confirmar la sincronizacion con Supabase.");
        }
        updatePendingSyncStatusDom();
      }

      function setupPendingConnectivityMonitor() {
        if (pendingConnectivityListenersReady) return;
        pendingConnectivityListenersReady = true;
        window.addEventListener("online", () => {
          sharedPendingError = "";
          sharedPendingStatus = sharedPendingAvailable ? "shared" : "local";
          forcePendingSync();
        });
        window.addEventListener("offline", () => {
          sharedPendingStatus = "local";
          sharedPendingError = "Sin internet. La app conserva una copia local y reintentara al reconectar.";
          updateSharedPendingHealth({ readOk: false, storageOk: false, writeOk: false });
        });
      }

          ASSIGNMENT_NOTICE_STORAGE_KEY,

      function visibleAssignmentNotifications() {

          button.addEventListener("click", () => dismissAssignmentNotification(button.dataset.dismissAssignmentNotice));
        });

      function updateAssignmentNotificationsOnly() {
        const container = document.getElementById("assignmentNotifications");
        if (!container) return false;
        const html = assignmentNotificationsHtml();
        container.hidden = !html;
        container.innerHTML = html;
        wireAssignmentNotificationButtons();

      function dismissAssignmentNotification(id) {
        const notices = readAssignmentNotifications().map((notice) =>
          notice.id === id ? { ...notice, dismissed: true } : notice
        );
        saveAssignmentNotifications(notices);
        updateAssignmentNotificationsOnly();
      }

      function receiveAssignmentNotification(notice) {
        if (!notice?.id || !isSameSuitePerson(notice.assignedTo, currentSuiteUserName())) return;
        const notices = readAssignmentNotifications();
        if (notices.some((entry) => entry.id === notice.id)) return;
        const nextNotice = {
          ...notice,
          dismissed: false,
          receivedAt: new Date().toISOString()
        };
        saveAssignmentNotifications([nextNotice, ...notices]);
        showLiveActivity(`${nextNotice.assignedBy || "Otro usuario"} te asignó: ${nextNotice.taskTitle}`);
        updateAssignmentNotificationsOnly();
      }

      function createAssignmentNotice(task, id, assignedTo) {
        return {
          assignedBy: currentSuiteUserName(),
          assignedTo,
          createdAt: new Date().toISOString(),
          id: `assignment-${Date.now().toString(36)}-${Math.random().toString(16).slice(2, 8)}`,
          taskId: id,
          taskTitle: task?.[0] || "Nuevo pendiente asignado"
        };
      }

      function notifyTaskAssignment(task, id, assignedTo) {
        if (!assignedTo || isSameSuitePerson(assignedTo, currentSuiteUserName())) return;
        const notice = createAssignmentNotice(task, id, assignedTo);
        publishAssignmentNotification(notice);
        showLiveActivity(`Asignaste "${notice.taskTitle}" a ${assignedTo}.`);
      }

      // Zona de notificaciones de la barra superior: al abrir la suite avisa que
      // pendientes tiene el responsable y cuantos dias lleva creado cada uno.
      const NOTIF_WARN_DAYS = 4;
      const NOTIF_LATE_DAYS = 8;
      let suiteNotificationsAutoOpened = false;
      let suiteNotificationsOutsideReady = false;

      function notifDayLabel(dayKey) {
        const match = String(dayKey || "").match(/^(\d{4})-(\d{2})-(\d{2})$/);
        return match ? `${match[3]}/${match[2]}/${match[1]}` : "";
      }

      function pendingNotificationItems(scope) {
        const activeScope = scope === "todos" ? "todos" : "mios";
        const currentName = currentSuiteUserName();
        const today = new Date(`${localDayKey()}T00:00:00`);
        return tasks
          .filter((task) => Array.isArray(task) && String(task[0] || "").trim())
          .filter((task) => activeScope === "todos" || isSameSuitePerson(task[1], currentName))
          .map((task) => {
            // Las subtareas se leen sin reordenarlas: el conteo no debe tocar el estado compartido.
            const subtasks = Array.isArray(task[TASK_SUBTASKS_INDEX]) ? task[TASK_SUBTASKS_INDEX] : [];
            const closedSubtasks = subtasks.filter((subtask) => normalizeText(subtask?.status) === "completado").length;
            const dueKey = taskDateInputValue(task[2]);
            const due = dueKey ? new Date(`${dueKey}T00:00:00`) : null;
            const days = daysSinceTaskStart(task);
            const overdue = Boolean(due && !Number.isNaN(due.getTime()) && due < today);
            return {
              id: taskId(task, tasks.indexOf(task)),
              title: String(task[0] || "").trim(),
              owner: String(task[1] || "").trim() || "Sin asignar",
              status: String(task[3] || "Pendiente").trim(),
              priority: String(task[4] || "").trim(),
              startDay: taskStartDay(task),
              dueKey,
              days,
              overdue,
              subtasksTotal: subtasks.length,
              subtasksOpen: Math.max(0, subtasks.length - closedSubtasks),
              tone: overdue || days >= NOTIF_LATE_DAYS ? "late" : days >= NOTIF_WARN_DAYS ? "warn" : ""
            };
          })
          .sort((left, right) => right.days - left.days || left.title.localeCompare(right.title, "es"));
      }

      function pendingNotificationSummary(items) {
        return {
          total: items.length,
          late: items.filter((item) => item.tone === "late").length,
          warn: items.filter((item) => item.tone === "warn").length,
          overdue: items.filter((item) => item.overdue).length
        };
      }

      function notificationItemHtml(item) {
        const dateLine = [
          `Creado el ${notifDayLabel(item.startDay)}`,
          item.dueKey ? `${item.overdue ? "venció" : "vence"} el ${notifDayLabel(item.dueKey)}` : ""
        ]
          .filter(Boolean)
          .join(" · ");
        const detailLine = [
          item.owner,
          item.status,
          item.priority ? `Prioridad ${item.priority}` : "",
          item.subtasksTotal ? `${item.subtasksOpen}/${item.subtasksTotal} tareas por cerrar` : ""
        ]
          .filter(Boolean)
          .join(" · ");
        return `
          <button class="notif-item ${item.tone}" type="button" data-notification-task="${escapeHtml(item.id)}" title="Abrir este pendiente en el tablero">
            <span>
              <strong>${escapeHtml(item.title)}</strong>
              <span class="notif-meta">${escapeHtml(detailLine)}</span>
              <span class="notif-meta">${escapeHtml(dateLine)}</span>
            </span>
            <span class="notif-days"><strong>${item.days}</strong><span>${item.days === 1 ? "día" : "días"}</span></span>
          </button>
