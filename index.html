                <span class="utm-preview" style="display:inline-flex">
                  <span class="utm-preview-label">utm_term:</span>
                  <span class="utm-preview-value" id="utm-${blockId}-${campId}-as-pv-${asId}"></span>
                </span>
              </div>
              <div id="utm-${blockId}-${campId}-ads-${asId}" class="utm-ads-container">
                ${adRowHtml(blockId, campId, firstAdId, asId)}
              </div>
              <button class="utm-add-ad-btn" data-action="add-ad" data-as="${asId}" data-camp="${campId}" data-block="${blockId}">+ Añadir Anuncio</button>
            </div>`;
        }

        /* ── HTML: contenedor de campaña (Nivel 1) ── */
        function campaignHtml(blockId, campId) {
          const firstAsId = `as${++seqs[blockId].as}`;
          return `
            <div class="utm-campaign-container" id="utm-${blockId}-${campId}" data-camp="${campId}" data-block="${blockId}" style="border-top:1px solid var(--line)">
              <div style="display:flex;align-items:center;padding:8px 18px;background:var(--surface-subtle);border-bottom:1px solid var(--line-soft)">
                <p style="margin:0;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--subtle)">Nivel 1 · Campaña</p>
                <button class="utm-delete-btn" data-action="delete-campaign" data-camp="${campId}" data-block="${blockId}" style="margin-left:auto" title="Eliminar campaña">${icons.trash}</button>
              </div>
              <div style="padding:14px 18px 16px;border-bottom:1px solid var(--line-soft)">
                <div class="utm-campaign-block">
                  <div class="form-field"><span>URL de Destino</span><input id="utm-${blockId}-${campId}-base-url" type="url" placeholder="https://…" /></div>
                  <div class="form-field"><span>Marca</span><select id="utm-${blockId}-${campId}-marca">${opts(MARCAS, "Seleccionar…")}</select></div>
                  <div class="form-field"><span>Nombre de la Campaña</span><input id="utm-${blockId}-${campId}-campaign-name" type="text" placeholder="ej. verano 2025" /></div>
                </div>
                <div id="utm-${blockId}-${campId}-preview" class="utm-preview" style="display:none;margin-top:10px">
                  <span class="utm-preview-label">utm_campaign:</span>
                  <span class="utm-preview-value" id="utm-${blockId}-${campId}-pv"></span>
                </div>
              </div>
              <div style="padding:14px 18px 18px">
                <p style="margin:0 0 12px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--subtle)">Niveles 2 y 3 · Conjuntos y Anuncios</p>
                <div id="utm-${blockId}-${campId}-tree" style="display:flex;flex-direction:column;gap:10px">
                  ${adSetHtml(blockId, campId, firstAsId)}
                </div>
                <button class="utm-add-adset-btn" style="margin-top:12px" data-action="add-adset" data-camp="${campId}" data-block="${blockId}">
                  ${icons.checks} Añadir Conjunto de Anuncios
                </button>
              </div>
            </div>`;
        }

        /* ── HTML: bloque de plataforma ── */
        function blockHtml(block) {
          const firstCampId = `camp${++seqs[block.id].camp}`;
          const pillStyle = `display:inline-flex;align-items:center;border:1px solid var(--green-line);border-radius:5px;background:var(--green-soft);overflow:hidden`;
          const lblStyle  = `padding:3px 6px 3px 9px;font-size:11px;font-weight:600;color:var(--green-700);font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;white-space:nowrap;line-height:1`;
          const inpStyle  = `border:none;border-left:1px solid var(--green-line);background:transparent;color:var(--green-700);padding:0 6px;font-size:11px;font-weight:600;height:26px;outline:none;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;min-width:0`;
          return `
            <div class="panel" id="utm-${block.id}-block" style="overflow:hidden;padding:0">
              <div style="display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line);background:var(--surface-subtle);flex-wrap:wrap">
                <strong style="font-size:13px;font-weight:700;color:var(--ink)">${block.label}</strong>
                <div style="${pillStyle}">
                  <span style="${lblStyle}">utm_source =</span>
                  <input id="utm-${block.id}-source" value="${block.source}" style="${inpStyle};width:80px" />
                </div>
                <div style="${pillStyle}">
                  <span style="${lblStyle}">utm_medium =</span>
                  <input id="utm-${block.id}-medium" value="${block.defaultMedium}" style="${inpStyle};width:100px" />
                </div>
                <div style="display:flex;gap:6px;margin-left:auto">
                  <button class="btn" style="font-size:11px;height:28px;padding:0 10px;display:inline-flex;align-items:center;gap:5px" data-action="export-csv" data-block="${block.id}">${icons.download} Exportar CSV</button>
                  <button class="btn" style="font-size:11px;height:28px;padding:0 10px" data-action="clear-block" data-block="${block.id}">Limpiar</button>
                </div>
              </div>
              <div id="utm-${block.id}-campaigns">
                ${campaignHtml(block.id, firstCampId)}
              </div>
              <div style="padding:10px 18px 14px;border-top:1px solid var(--line-soft)">
                <button class="utm-add-adset-btn" data-action="add-campaign" data-block="${block.id}">
                  ${icons.checks} Añadir Campaña
                </button>
              </div>
            </div>`;
        }

        /* ── Render ── */
        shell(`
          <section class="module">
            ${header("UTM Builder", "Genera URLs con parámetros UTM para Meta, Google y TikTok Ads. Los resultados aparecen inline en cada anuncio.", "Analítica Digital · GA4", icons.link, "<span></span>")}
            ${BLOCKS.map(b => blockHtml(b)).join("")}
          </section>
        `);

        /* ── Actualizar URLs (itera campañas del bloque) ── */
        function updateBlockUrls(blockId) {
          const source = getVal(`utm-${blockId}-source`) || BLOCKS.find(b => b.id === blockId).source;
          const medium = getVal(`utm-${blockId}-medium`) || BLOCKS.find(b => b.id === blockId).defaultMedium;
          document.getElementById(`utm-${blockId}-campaigns`)
            ?.querySelectorAll(".utm-campaign-container")
            .forEach(campEl => updateCampaignUrls(blockId, campEl.dataset.camp, source, medium));
        }

        function updateCampaignUrls(blockId, campId, source, medium) {
          const baseUrl  = getVal(`utm-${blockId}-${campId}-base-url`).trim();
          const marca    = getVal(`utm-${blockId}-${campId}-marca`);
          const cname    = sanitizeUtm(getVal(`utm-${blockId}-${campId}-campaign-name`));
          const campaign = (marca && cname) ? `${marca}_${cname}` : "";
          const sep      = baseUrl.includes("?") ? "&" : "?";
          const prevEl   = document.getElementById(`utm-${blockId}-${campId}-preview`);
          const pvVal    = document.getElementById(`utm-${blockId}-${campId}-pv`);
          if (prevEl && pvVal) {
            if (campaign) { prevEl.style.display = ""; pvVal.textContent = campaign; }
            else prevEl.style.display = "none";
          }
          const treeEl = document.getElementById(`utm-${blockId}-${campId}-tree`);
          if (!treeEl) return;
          treeEl.querySelectorAll(".utm-adset-row").forEach(asEl => {
            const asId    = asEl.dataset.as;
            const term    = sanitizeUtm(getVal(`utm-${blockId}-${campId}-as-name-${asId}`));
            const asPrev  = document.getElementById(`utm-${blockId}-${campId}-as-preview-${asId}`);
            const asPvVal = document.getElementById(`utm-${blockId}-${campId}-as-pv-${asId}`);
            if (asPrev && asPvVal) {
              if (term) { asPrev.style.display = ""; asPvVal.textContent = term; }
              else asPrev.style.display = "none";
            }
            asEl.querySelectorAll(".utm-ad-row").forEach(adEl => {
              const adId    = adEl.dataset.ad;
              const content = sanitizeUtm(getVal(`utm-${blockId}-${campId}-ad-name-${adId}`));
              const urlEl   = document.getElementById(`utm-${blockId}-${campId}-ad-url-${adId}`);
              if (!urlEl) return;
              if (!baseUrl || !campaign) { urlEl.value = ""; urlEl.title = ""; urlEl.classList.remove("has-url"); return; }
              const parts = [`utm_source=${source}`,`utm_medium=${medium}`,`utm_campaign=${campaign}`,...(term?[`utm_term=${term}`]:[]),...(content?[`utm_content=${content}`]:[])];
              const url = `${baseUrl}${sep}${parts.join("&")}`;
              urlEl.value = url; urlEl.title = url; urlEl.classList.add("has-url");
            });
          });
        }

        /* ── Exportar CSV de un bloque ── */
        function exportBlockCsv(blockId) {
          const source = getVal(`utm-${blockId}-source`) || BLOCKS.find(b => b.id === blockId).source;
          const medium = getVal(`utm-${blockId}-medium`) || BLOCKS.find(b => b.id === blockId).defaultMedium;
          const rows = [];
          document.getElementById(`utm-${blockId}-campaigns`)
            ?.querySelectorAll(".utm-campaign-container")
            .forEach(campEl => {
              const campId   = campEl.dataset.camp;
              const campaign = document.getElementById(`utm-${blockId}-${campId}-pv`)?.textContent || "";
              campEl.querySelectorAll(".utm-adset-row").forEach(asEl => {
                const asId = asEl.dataset.as;
                asEl.querySelectorAll(".utm-ad-row").forEach(adEl => {
                  const adId  = adEl.dataset.ad;
                  const urlEl = document.getElementById(`utm-${blockId}-${campId}-ad-url-${adId}`);
                  if (!urlEl?.value) return;
                  rows.push({source,medium,campaign,term:sanitizeUtm(getVal(`utm-${blockId}-${campId}-as-name-${asId}`)),content:sanitizeUtm(getVal(`utm-${blockId}-${campId}-ad-name-${adId}`)),url:urlEl.value});
                });
              });
            });
          if (!rows.length) return;
          const BOM="﻿",HEADERS=["#","utm_source","utm_medium","utm_campaign","utm_term","utm_content","URL"].join(",");
          const body=rows.map((r,i)=>[i+1,`"${r.source}"`,`"${r.medium}"`,`"${r.campaign}"`,`"${r.term}"`,`"${r.content}"`,`"${r.url}"`].join(",")).join("\n");
          const blob=new Blob([BOM+HEADERS+"\n"+body],{type:"text/csv;charset=utf-8;"});
          const url=URL.createObjectURL(blob);
          const a=Object.assign(document.createElement("a"),{href:url,download:`utm_${blockId}_${new Date().toISOString().slice(0,10)}.csv`});
          document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
        }

        /* ── Event listeners por bloque ── */
        BLOCKS.forEach(block => {
          const blockEl = document.getElementById(`utm-${block.id}-block`);
          if (!blockEl) return;
          blockEl.addEventListener("input",  () => updateBlockUrls(block.id));
          blockEl.addEventListener("change", () => updateBlockUrls(block.id));
          blockEl.addEventListener("click", e => {
            const btn = e.target.closest("[data-action]");
            if (!btn) return;
            const action  = btn.dataset.action;
            const blockId = btn.dataset.block || block.id;
            const campId  = btn.dataset.camp;
            const asId    = btn.dataset.as;
            const adId    = btn.dataset.ad;

            if (action === "add-campaign") {
              const campsEl = document.getElementById(`utm-${blockId}-campaigns`);
              if (!campsEl) return;
              const newCampId = `camp${++seqs[blockId].camp}`;
              const div = document.createElement("div");
              div.innerHTML = campaignHtml(blockId, newCampId);
              campsEl.appendChild(div.firstElementChild);
              document.getElementById(`utm-${blockId}-${newCampId}-base-url`)?.focus();
            }
            if (action === "delete-campaign" && campId) {
              const campsEl = document.getElementById(`utm-${blockId}-campaigns`);
              if (!campsEl || campsEl.querySelectorAll(".utm-campaign-container").length <= 1) return;
              document.getElementById(`utm-${blockId}-${campId}`)?.remove();
            }
            if (action === "add-adset" && campId) {
              const treeEl = document.getElementById(`utm-${blockId}-${campId}-tree`);
              if (!treeEl) return;
              const newAsId = `as${++seqs[blockId].as}`;
              const div = document.createElement("div");
              div.innerHTML = adSetHtml(blockId, campId, newAsId);
              treeEl.appendChild(div.firstElementChild);
              document.getElementById(`utm-${blockId}-${campId}-as-name-${newAsId}`)?.focus();
              updateBlockUrls(blockId);
            }
            if (action === "add-ad" && campId && asId) {
              const adsEl = document.getElementById(`utm-${blockId}-${campId}-ads-${asId}`);
              if (!adsEl) return;
              const newAdId = `ad${++seqs[blockId].ad}`;
              const div = document.createElement("div");
              div.innerHTML = adRowHtml(blockId, campId, newAdId, asId);
              adsEl.appendChild(div.firstElementChild);
              document.getElementById(`utm-${blockId}-${campId}-ad-name-${newAdId}`)?.focus();
              updateBlockUrls(blockId);
            }
            if (action === "delete-adset" && campId && asId) {
              const treeEl = document.getElementById(`utm-${blockId}-${campId}-tree`);
              if (!treeEl || treeEl.querySelectorAll(".utm-adset-row").length <= 1) return;
              document.getElementById(`utm-${blockId}-${campId}-as-${asId}`)?.remove();
            }
            if (action === "delete-ad" && campId && asId && adId) {
              const adsEl = document.getElementById(`utm-${blockId}-${campId}-ads-${asId}`);
              if (!adsEl || adsEl.querySelectorAll(".utm-ad-row").length <= 1) return;
              document.getElementById(`utm-${blockId}-${campId}-ad-${adId}`)?.remove();
            }
            if (action === "copy-url") {
              const urlEl = document.getElementById(btn.dataset.urlId);
              if (!urlEl?.value) return;
              navigator.clipboard.writeText(urlEl.value).catch(() => {});
              const orig = btn.textContent; btn.textContent = "✓";
              setTimeout(() => { btn.textContent = orig; }, 1500);
            }
            if (action === "export-csv") exportBlockCsv(blockId);
            if (action === "clear-block") {
              const b = BLOCKS.find(x => x.id === blockId);
              const srcEl = document.getElementById(`utm-${blockId}-source`);
              const medEl = document.getElementById(`utm-${blockId}-medium`);
              if (srcEl) srcEl.value = b.source;
              if (medEl) medEl.value = b.defaultMedium;
              seqs[blockId].camp = 0; seqs[blockId].as = 0; seqs[blockId].ad = 0;
              const campsEl = document.getElementById(`utm-${blockId}-campaigns`);
              if (!campsEl) return;
              campsEl.innerHTML = "";
              const newCampId = `camp${++seqs[blockId].camp}`;
              const div = document.createElement("div");
              div.innerHTML = campaignHtml(blockId, newCampId);
              campsEl.appendChild(div.firstElementChild);
            }
          });
        });
      }

      // ── Clientes ─────────────────────────────────────────────
      const CLIENTES_OWNER = "jorgeluis666";
      const CLIENTES_DOMINIO = "limaretail.com";

      // [repo, nombre, cliente, categoria, descripcion, publicado en GitHub Pages]
      // Cada marca tiene cuatro accesos. `drive` es la carpeta de Drive y se pega
      // aqui. `envivo` es el subdominio <marca>.limaretail.com: en `true` se arma
      // solo, en `false` queda en gris hasta que el subdominio este publicado, y
      // si lleva una URL se usa esa en lugar del subdominio.
      const clientesProyectos = [
        {
          repo: "objetivos-Amador",
          nombre: "Amador · Gasto publicitario 2026",
          cliente: "Amador",
          categoria: "Objetivos",
          descripcion: "Seguimiento de objetivos y gasto publicitario del año.",
          publicado: true,
          drive: "",
          envivo: true
        },
        {
          repo: "objetivos-Aquarius",
          nombre: "Aquarius · Dashboard 2026",
          cliente: "Aquarius",
          categoria: "Objetivos",
          descripcion: "Panel de objetivos e inversión publicitaria.",
          publicado: true,
          drive: "",
          envivo: true
        },
        {
          repo: "objetivos-ventas-casiopia",
          nombre: "Casiopia · Dashboard de ventas 2026",
          cliente: "Casiopia",
          categoria: "Ventas",
          descripcion: "Avance de ventas contra objetivo mensual.",
          publicado: true,
          drive: "",
          envivo: true
        },
        {
          repo: "objetivos-Excambiare",
          nombre: "Excambiare · Objetivos",
          cliente: "Excambiare",
          categoria: "Objetivos",
          descripcion: "Objetivos del cliente. Pendiente de publicar en GitHub Pages.",
          publicado: false,
          drive: "",
          envivo: false
        },
        {
          repo: "objetivos-Rekluta",
          nombre: "Rekluta · Gasto publicitario 2026",
          cliente: "Rekluta",
          categoria: "Objetivos",
          descripcion: "Seguimiento de objetivos y gasto publicitario del año.",
          publicado: true,
          drive: "",
          envivo: true
        },
        {
          repo: "objetivo-ventas-RB",
          nombre: "Royal Baby · Dashboard de ventas 2026",
          cliente: "Royal Baby",
          categoria: "Ventas",
          descripcion: "Avance de ventas contra objetivo mensual.",
          publicado: true,
          drive: "",
          envivo: true
        },
        {
          repo: "objetivos-TP",
          nombre: "Terminal Pesquero · Gasto publicitario 2026",
          cliente: "Terminal Pesquero",
          categoria: "Objetivos",
          descripcion: "Seguimiento de objetivos y gasto publicitario del año.",
          publicado: true,
          drive: "",
          envivo: true
        },
        {
          repo: "objetivos-Tierra-Films",
          nombre: "Tierra Films · Dashboard 2026",
          cliente: "Tierra Films",
          categoria: "Objetivos",
          descripcion: "Panel de objetivos e inversión publicitaria.",
          publicado: true,
          drive: "",
          envivo: false
        }
      ];

      function clientesRepoUrl(repo) {
        return `https://github.com/${CLIENTES_OWNER}/${repo}`;
      }

      function clientesDashboardUrl(repo) {
        return `https://${CLIENTES_OWNER}.github.io/${repo}/`;
      }

      function clientesEnVivoUrl(project) {
        // Una URL propia manda sobre el subdominio derivado de la marca.
        if (typeof project.envivo === "string" && project.envivo) return project.envivo;
        if (!project.envivo) return "";
        return `https://${normalizeText(project.cliente).replace(/[^a-z0-9]/g, "")}.${CLIENTES_DOMINIO}/`;
      }

      function clientesGroups() {
        const groups = new Map();
        clientesProyectos.forEach((project) => {
          // El trabajo interno se parte por categoria: un bloque largo no cabe en
          // una columna y obligaria a hacer scroll.
          const label =
            project.cliente === "Lima Retail" ? `Lima Retail · ${project.categoria}` : project.cliente;
          if (!groups.has(label)) groups.set(label, []);
          groups.get(label).push(project);
        });
        // Los clientes van primero y el trabajo interno cierra la lista.
        return [...groups.entries()].sort((left, right) => {
          const leftInterno = left[0].startsWith("Lima Retail");
          const rightInterno = right[0].startsWith("Lima Retail");
          if (leftInterno !== rightInterno) return leftInterno ? 1 : -1;
          return left[0].localeCompare(right[0]);
        });
      }

      function clientesShortName(project) {
        // El nombre del cliente ya encabeza el grupo, no hace falta repetirlo.
        const prefix = `${project.cliente} · `;
        return project.nombre.startsWith(prefix) ? project.nombre.slice(prefix.length) : project.nombre;
      }

      function clientesLinkHtml(label, url, faltante) {
        if (!url) {
          return `<span class="client-link off" title="${escapeHtml(faltante)}">${escapeHtml(label)}</span>`;
        }
        return `<a class="client-link" href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer" title="${escapeHtml(url)}">${escapeHtml(label)}</a>`;
      }

      function clientesRowHtml(project) {
        const search = normalizeText(
          [project.nombre, project.cliente, project.repo, project.categoria, project.descripcion].join(" ")
        );
        const tooltip = `${project.categoria} · ${project.descripcion}`;
        return `
          <div class="client-row" data-client-card data-search="${escapeHtml(search)}" data-scope="${project.cliente === "Lima Retail" ? "interno" : "cliente"}">
            <div class="client-row-head">
              <span class="client-dot ${project.publicado ? "" : "off"}" title="${project.publicado ? "Dashboard publicado" : "Sin dashboard publicado"}"></span>
              <span class="client-row-name" title="${escapeHtml(tooltip)}">${escapeHtml(clientesShortName(project))}</span>
            </div>
            <div class="client-links">
              ${clientesLinkHtml("Drive", project.drive, "Falta cargar la carpeta de Drive")}
              ${clientesLinkHtml("Repo", clientesRepoUrl(project.repo), "")}
              ${clientesLinkHtml("Pages", project.publicado ? clientesDashboardUrl(project.repo) : "", "Sin dashboard publicado en GitHub Pages")}
              ${clientesLinkHtml("En vivo", clientesEnVivoUrl(project), "El subdominio de la marca todavia no esta publicado")}
            </div>
          </div>
        `;
      }

      function clientesModule() {
        const groups = clientesGroups();
        const total = clientesProyectos.length;
        const publicados = clientesProyectos.filter((project) => project.publicado).length;
        const resumen = `${publicados} dashboards activos · ${total - publicados} sin publicar`;
        const hayInternos = clientesProyectos.some((project) => project.cliente === "Lima Retail");

        shell(`
          <section class="module clients-module">
            <div class="panel clients-bar">
              <div class="clients-bar-head">
                <p class="clients-title">Clientes</p>
                <p class="clients-sub" id="clientsCount">${total} proyectos · ${resumen}</p>
              </div>
              <input class="clients-search" id="clientsSearch" type="search" placeholder="Buscar cliente o repositorio" autocomplete="off" />
              <button class="clients-filter active" type="button" data-client-filter="todos">Todos</button>
              <button class="clients-filter" type="button" data-client-filter="cliente">Clientes</button>
              ${hayInternos ? `<button class="clients-filter" type="button" data-client-filter="interno">Lima Retail</button>` : ""}
            </div>

            <div class="panel">
              <div class="clients-board">
                ${groups
                  .map(
                    ([cliente, projects]) => `
                      <div class="clients-group" data-client-group>
                        <p class="clients-group-title">
                          ${escapeHtml(cliente)}
                          <span class="clients-group-count" data-client-group-count>${projects.length}</span>
                        </p>
                        ${projects.map(clientesRowHtml).join("")}
                      </div>
                    `
                  )
                  .join("")}
              </div>
              <p class="clients-empty" id="clientsEmpty" style="display:none">No hay proyectos que coincidan con la búsqueda.</p>
            </div>
          </section>
        `);

        let clientsScope = "todos";

        function applyClientsFilters() {
          const query = normalizeText(document.getElementById("clientsSearch")?.value || "");
          let visible = 0;

          document.querySelectorAll("[data-client-group]").forEach((group) => {
            let groupVisible = 0;
            group.querySelectorAll("[data-client-card]").forEach((card) => {
              const matchesScope = clientsScope === "todos" || card.dataset.scope === clientsScope;
              const matchesQuery = !query || card.dataset.search.includes(query);
              const show = matchesScope && matchesQuery;
              card.style.display = show ? "" : "none";
              if (show) groupVisible += 1;
            });

            group.style.display = groupVisible ? "" : "none";
            const counter = group.querySelector("[data-client-group-count]");
            if (counter) counter.textContent = groupVisible;
            visible += groupVisible;
          });

          const count = document.getElementById("clientsCount");
          if (count) {
            count.textContent =
              visible === clientesProyectos.length
                ? `${clientesProyectos.length} proyectos · ${resumen}`
                : `${visible} de ${clientesProyectos.length} proyectos · ${resumen}`;
          }

          const empty = document.getElementById("clientsEmpty");
          if (empty) empty.style.display = visible ? "none" : "";
        }

        document.getElementById("clientsSearch")?.addEventListener("input", applyClientsFilters);

        document.querySelectorAll("[data-client-filter]").forEach((button) => {
          button.addEventListener("click", () => {
            clientsScope = button.dataset.clientFilter;
            document.querySelectorAll("[data-client-filter]").forEach((other) => {
              other.classList.toggle("active", other === button);
            });
            applyClientsFilters();
          });
        });
      }

      function render() {
        if (!hasSuiteAccess()) {
          renderSuiteLock();
          return;
        }

        const visibleModules = currentSuiteUserModules();
        if (!visibleModules.length) {
          renderNoModuleAccess();
          return;
        }
        if (!currentSuiteUserCanAccessModule(state.active)) {
          state.active = visibleModules[0].id;
          saveActiveModule(state.active);
        }

        if (state.active === "quotes") quotesModule();
        else if (state.active === "tasks") tasksModule();
        else if (state.active === "access") accessModule();
        else if (state.active === "utm") utmModule();
        else if (state.active === "clientes") clientesModule();
        else if (state.active === "keywords") keywordsModule();
        else financialModule();
      }

      async function bootSuite() {
        try {
          loadSuiteUsers();
          loadTaskState();
          await restoreSuiteAccessSession();
          render();
        } catch (error) {
          console.error("LR Suite no pudo restaurar el estado local.", error);
          suiteUsers = defaultSuiteUsers();
          suiteAccessSession = "";
          renderSuiteLock();
        }
      }

      bootSuite();
    </script>
  </body>
</html>
