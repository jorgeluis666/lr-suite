      function financialMetrics(model, period, previous) {
        const trendFor = (now, before) =>
          previous && now !== null && before !== null && before !== undefined && before ? variation(now, before) : null;
        const versus = (now, before) =>
          previous && now !== null && before !== null && before !== undefined ? `${signedMoney(now - before)} vs. ${previous.label}` : "";

        // Meta Ads y Google Ads dentro de la misma tarjeta. Una plataforma sin dato en el periodo queda en "—".
        const platformRows = model.platforms
          .map((platform) => {
            const line = period.investmentLines.find((item) => item.key === normalizeText(platform.name));
            return `<div class="financial-platform"><span>${escapeHtml(platform.name)}</span><strong>${line ? fmtMoney(line.amount) : "—"}</strong></div>`;
          })
          .join("");
        const missingNames = period.investmentMissing.map((item) => item.label).join(" y ");
        const investmentNote =
          period.investment === null
            ? period.isTotal
              ? "La hoja no registra inversión"
              : "Sin informes de inversión para este mes"
            : missingNames
              ? `No incluye ${missingNames}: sin informe mensual`
              : "";
        const investmentTrend = trendFor(period.investment, previous?.investment);
        const investmentCard = `
          <article class="metric-card">
            <div class="metric-head">
              <p class="metric-label">Inversión publicitaria</p>
              ${typeof investmentTrend === "number" ? trend(investmentTrend, true) : ""}
            </div>
            <p class="metric-value">${period.investment === null ? "Sin desglose" : fmtMoney(period.investment)}</p>
            ${platformRows ? `<div class="financial-platforms">${platformRows}</div>` : ""}
            ${investmentNote ? `<p class="metric-detail">${escapeHtml(investmentNote)}</p>` : ""}
          </article>
        `;
        const roasDetail =
          period.roas === null
            ? "Necesita la inversión del periodo"
            : missingNames
              ? `Facturación por sol invertido, sin ${missingNames}`
              : "Facturación por cada sol invertido";

        const named = period.newClients.filter((sale) => sale.client).map((sale) => sale.client);
        const unnamed = period.newClients.length - named.length;
        const clientsDetail = !period.newClients.length
          ? "Sin primeras ventas en el periodo"
          : period.newClients.length <= 3
            ? [...named, ...(unnamed ? [`${unnamed} sin nombre en la hoja`] : [])].join(", ")
            : `${named.length} con nombre${unnamed ? ` · ${unnamed} sin nombre en la hoja` : ""}`;

        return `
          <div class="metrics">
            ${investmentCard}
            ${metric("Facturación", fmtMoney(period.billed), versus(period.billed, previous?.billed) || `${period.salesCount} ventas cerradas`, trendFor(period.billed, previous?.billed))}
            ${metric("ROAS", period.roas === null ? "—" : `${period.roas.toFixed(2)}x`, escapeHtml(roasDetail))}
            ${metric("Nuevos clientes", fmtNumber(period.newClients.length), escapeHtml(clientsDetail))}
          </div>
        `;
      }

      function financialStatement(period, previous) {
        const compare = !period.isTotal;
        const columns = compare ? 4 : 3;
        // value || 0: una inversión de 0 llega negada (-0) y se mostraría como "-S/ 0.00".
        const money = (value) =>
          value === null || value === undefined
            ? `<td class="right muted">—</td>`
            : `<td class="right ${value < 0 ? "negative" : ""}">${fmtMoneyCents(value || 0)}</td>`;
        // Acumulado: % sobre la facturación. Mes: monto del mes anterior y variación.
        const tail = (now, before) => {
          if (!compare) {
            return `<td class="right muted">${now === null || !period.billed ? "—" : fmtPercent(Math.abs(now) / period.billed)}</td>`;
          }
          const change = now === null || before === null || before === undefined || !before ? null : variation(now, before);
          return `${money(before)}<td class="right ${change !== null && change < 0 ? "negative" : "muted"}">${change === null ? "—" : `${change.toFixed(1)}%`}</td>`;
        };
        const lineLabel = (label, detail) =>
          `<td class="muted">${escapeHtml(label)}${detail ? `<span class="financial-line-detail">${escapeHtml(detail)}</span>` : ""}</td>`;

        const previousGroups = new Map((previous?.incomeGroups || []).map((group) => [group.key, group]));
        const incomeGroups = [...period.incomeGroups];
        if (compare) {
          previousGroups.forEach((group, key) => {
            if (!incomeGroups.some((item) => item.key === key)) incomeGroups.push({ ...group, amount: 0, clients: [] });
          });
        }
        const incomeRows = incomeGroups.length
          ? incomeGroups
              .map((group) => `
                <tr>
                  ${lineLabel(group.service, group.clients.join(", "))}
                  ${money(group.amount)}
                  ${tail(group.amount, previous ? previousGroups.get(group.key)?.amount ?? 0 : null)}
                </tr>`)
              .join("")
          : `<tr><td class="muted" colspan="${columns}">Sin ventas registradas en el periodo.</td></tr>`;

        // Plataformas sin dato en el periodo: fila en "—" con el motivo, para que se vea qué falta sumar.
        const missingRows = period.investmentMissing
          .map((item) => {
            const previousLine = previous?.investmentLines.find((line) => line.key === item.key);
            return `
              <tr>
                ${lineLabel(item.label, item.detail)}
                ${money(null)}
                ${compare ? `${money(previousLine ? -previousLine.amount : null)}<td class="right muted">—</td>` : `<td class="right muted">—</td>`}
              </tr>`;
          })
          .join("");
        const investmentRows =
          period.investmentLines.length || missingRows
            ? period.investmentLines
                .map((line) => {
                  const previousLine = previous?.investmentLines.find((item) => item.key === line.key);
                  return `
                    <tr>
                      ${lineLabel(line.label, line.detail)}
                      ${money(-line.amount)}
                      ${tail(-line.amount, previousLine ? -previousLine.amount : null)}
                    </tr>`;
                })
                .join("") + missingRows
            : `<tr><td class="muted" colspan="${columns}">${
                period.isTotal
                  ? "La hoja no registra inversión publicitaria."
                  : "Sin inversión registrada para este mes."
              }</td></tr>`;

        const investment = period.investment === null ? null : -period.investment;
        const previousInvestment = previous?.investment === null || previous?.investment === undefined ? null : -previous.investment;
        const notes = period.notes.length
          ? `<div class="financial-notes">${period.notes.map((note) => `<p class="small">${escapeHtml(note)}</p>`).join("")}</div>`
          : "";

        return `
          <div class="panel">
            <div class="panel-head">
              <strong>Estado de Pérdidas y Ganancias</strong>
              <p class="small">Facturación por servicio vendido e inversión publicitaria por plataforma</p>
            </div>
            <div class="table-wrap">
              <table class="financial-statement">
                <thead>
                  <tr>
                    <th>Concepto</th>
                    <th class="right">${escapeHtml(period.isTotal ? period.range : period.label)}</th>
                    ${compare ? `<th class="right">${escapeHtml(previous ? previous.label : "Mes anterior")}</th><th class="right">Var.</th>` : `<th class="right">% de facturación</th>`}
                  </tr>
                </thead>
                <tbody>
                  <tr class="section-row">
                    <td>Ingresos · facturación</td>
                    ${money(period.billed)}
                    ${tail(period.billed, previous?.billed)}
                  </tr>
                  ${incomeRows}
                  <tr class="section-row">
                    <td>Inversión publicitaria</td>
                    ${money(investment)}
                    ${tail(investment, previousInvestment)}
                  </tr>
                  ${investmentRows}
                  <tr class="final-row">
                    <td>Resultado</td>
                    ${money(period.result)}
                    ${tail(period.result, previous?.result)}
                  </tr>
                </tbody>
              </table>
            </div>
            ${notes}
          </div>
        `;
      }

      function financialChart(model, period) {
        const months = model.months;
        if (!months.length) {
          return `<div class="panel chart-panel"><p class="small">La hoja no tiene meses registrados.</p></div>`;
        }
        const billedOf = (month) => month.sales.reduce((sum, sale) => sum + sale.billed, 0);
        const max = Math.max(1, ...months.flatMap((month) => [month.quoted || 0, billedOf(month)]));
        const rawStep = max / 4;
        const magnitude = 10 ** Math.floor(Math.log10(rawStep));
        const step = [1, 2, 2.5, 5, 10].map((factor) => factor * magnitude).find((value) => value >= rawStep);
        const top = step * Math.ceil(max / step);
        const chartStart = 60;
        const chartWidth = 488;
        const baseline = 330;
        const xStep = chartWidth / months.length;
        const barWidth = Math.min(22, Math.max(8, xStep / 4));
        const y = (value) => baseline - (value / top) * 280;
        const compact = (value) =>
          value >= 1000
            ? `S/ ${(value / 1000).toLocaleString("es-PE", { maximumFractionDigits: 1 })}k`
            : `S/ ${fmtNumber(value)}`;
        const ticks = [];
        for (let value = step; value <= top + step / 1000; value += step) ticks.push(value);
        const grid = ticks
          .map((value) => `
              <line x1="${chartStart - 4}" x2="${chartStart + chartWidth}" y1="${y(value)}" y2="${y(value)}" stroke="#dbe2ea" stroke-dasharray="4 7"></line>
              <text x="${chartStart - 10}" y="${y(value) + 4}" text-anchor="end" fill="#7a8797" font-size="12">${compact(value)}</text>`)
          .join("");
        const groups = months
          .map((month, index) => {
            const centerX = chartStart + index * xStep + xStep / 2;
            const quoted = month.quoted || 0;
            const billed = billedOf(month);
            const active = period.id === month.id;
            return `
              <g>
                ${active ? `<rect x="${chartStart + index * xStep + 3}" y="40" width="${xStep - 6}" height="${baseline - 30}" rx="6" fill="#eff6ff"></rect>` : ""}
                <rect x="${centerX - barWidth - 2}" y="${y(quoted)}" width="${barWidth}" height="${baseline - y(quoted)}" rx="3" fill="#93c5fd"><title>${escapeHtml(month.label)} · cotizado ${fmtMoneyCents(quoted)}</title></rect>
                <rect x="${centerX + 2}" y="${y(billed)}" width="${barWidth}" height="${baseline - y(billed)}" rx="3" fill="#2563eb"><title>${escapeHtml(month.label)} · facturado ${fmtMoneyCents(billed)}</title></rect>
                <text x="${centerX}" y="${baseline + 24}" text-anchor="middle" fill="${active ? "#1d4ed8" : "#7a8797"}" font-size="13" font-weight="${active ? 600 : 400}">${month.short}</text>
              </g>`;
          })
          .join("");

        return `
          <div class="panel chart-panel">
            <div class="chart-head">
              <div>
                <strong>Cotizado vs. facturado por mes</strong>
                <p class="small">Monto cotizado y facturación registrados en la hoja, ${model.year}</p>
              </div>
              <div class="legend">
                <span><i class="dot" style="background:#93c5fd"></i>Cotizado</span>
                <span><i class="dot" style="background:#2563eb"></i>Facturado</span>
              </div>
            </div>
            <svg viewBox="0 0 560 370" width="100%" role="img" aria-label="Monto cotizado y facturación por mes">
              ${grid}
              <line x1="${chartStart - 4}" x2="${chartStart + chartWidth}" y1="${baseline}" y2="${baseline}" stroke="#cbd5e1"></line>
              ${groups}
            </svg>
          </div>
        `;
      }

      function financialSalesTable(period) {
        const rows = period.sales.length
          ? period.sales
              .map((sale) => `
                <tr>
                  <td>${sale.date ? fmtDate(sale.date) : escapeHtml(sale.monthName || "—")}</td>
                  <td>${sale.client ? escapeHtml(sale.client) : `<span class="muted">Sin nombre en la hoja</span>`}</td>
                  <td>${escapeHtml(sale.service)}</td>
                  <td class="right">${fmtMoneyCents(sale.base)}</td>
                  <td class="right">${fmtNumber(sale.units)}</td>
                  <td class="right">${fmtMoneyCents(sale.billed)}</td>
                </tr>`)
              .join("")
          : `<tr><td class="muted" colspan="6">Sin ventas registradas en el periodo.</td></tr>`;
        return `
          <div class="panel">
            <div class="panel-head">
              <strong>Ventas del periodo</strong>
              <p class="small">Pestaña Ventas de la hoja · ${escapeHtml(period.label)}</p>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Fecha</th>
                    <th>Cliente / marca</th>
                    <th>Servicio</th>
                    <th class="right">Monto base</th>
                    <th class="right">Meses / unid.</th>
                    <th class="right">Facturación</th>
                  </tr>
                </thead>
                <tbody>${rows}</tbody>
              </table>
            </div>
          </div>
        `;
      }

      function financialModule() {
        ensureKeywordsLoaded(); // informes de Google Ads: inversión mensual
        const model = financialModel();
        if (!model || (!model.months.length && !model.platforms.length)) {
          const message = !financialLoaded
            ? "Cargando los datos de la hoja de Google…"
            : model
              ? "La hoja se sincronizó, pero no se encontraron las tablas de Ventas, Inversion ni Venta vs Resultados. Revisa que sus encabezados no hayan cambiado."
              : "Todavía no hay datos sincronizados. Pulsa «Actualizar» para traer la hoja de Google.";
          shell(`
            <section class="module financial-module">
              ${financialHeader(model)}
              ${financialNotices(model)}
              <div class="panel financial-empty"><p>${message}</p></div>
            </section>
          `);
          wireFinancialModule();
          return;
        }

        const periodId =
          state.financialMonth !== "ytd" && model.months.some((month) => month.id === state.financialMonth)
            ? state.financialMonth
            : "ytd";
        const period = financialPeriod(model, periodId);
        const monthIndex = model.months.findIndex((month) => month.id === periodId);
        const previous = monthIndex > 0 ? financialPeriod(model, model.months[monthIndex - 1].id) : null;

        shell(`
          <section class="module financial-module">
            ${financialHeader(model)}
            ${financialNotices(model)}
            ${financialCompareCard(period, previous)}
            ${financialMonthTrack(model, period)}
            ${financialMetrics(model, period, previous)}
            <div class="split">
              ${financialStatement(period, previous)}
              ${financialChart(model, period)}
            </div>
            ${financialSalesTable(period)}
          </section>
        `);
        wireFinancialModule();
      }

      function wireFinancialModule() {
        document.querySelectorAll("[data-financial-month]").forEach((button) => {
          button.addEventListener("click", () => {
            state.financialMonth = button.dataset.financialMonth;
            financialModule();
          });
        });
        document.querySelector("[data-financial-sync]")?.addEventListener("click", syncFinancialFromSheet);
      }

      // ── Análisis de Palabras Clave ────────────────────────────────────────────
      // Informes mensuales de palabras clave de Google Ads en una carpeta de Drive. Supabase los descarga
      // cada día a las 06:20 de Lima (src/modules/analisis-palabras-clave/BBDD/sincronizacion-drive.sql)
      // y el botón "Actualizar" los vuelve a leer directo de Google desde el navegador. Los CSV se
      // interpretan con keyword-report.js, el mismo lector del script de Node. El modelo ya interpretado
      // se guarda en IndexedDB y no en localStorage, que esta app usa para la sesión y las tareas.
      const KEYWORDS_PREFS_KEY = "lr-suite-keywords-prefs-v1";
      const KEYWORDS_CACHE_DB = "lr-suite-keywords";
      const KEYWORDS_STALE_HOURS = 30;
      const KEYWORDS_MESSAGE_MS = 120000;
      const KEYWORD_INDICATORS = {
        clicks: { label: "Clics", better: "up" },
        impressions: { label: "Impresiones", better: "up" },
        cost: { label: "Costo", better: "neutral" },
        conversions: { label: "Conversiones", better: "up" },
        ctr: { label: "CTR", better: "up" },
        cpa: { label: "Costo por conversión", better: "down" }
      };
      let keywordsModel = null;
      let keywordsMeta = null; // { lastSync, contentHash, origin: "publicado" | "navegador" }
      let keywordsStatus = null; // fila "keywords-status" de Supabase
      let keywordsDatasetCache = null;
      const keywordsLoad = { started: false, loading: false, syncing: false, message: "", messageAt: 0, error: "" };
      let keywordsPrefs = readKeywordsPrefs();

      const keywordReport = () => window.LRKeywordReport || null;
      const keywordRound = (value) => Math.round(value * 100) / 100;

      function readKeywordsPrefs() {
        const defaults = { month: "", campaign: "all", indicator: "clicks", views: {}, showIdle: {}, showInactive: false };
        try {
          const saved = JSON.parse(localStorage.getItem(KEYWORDS_PREFS_KEY) || "{}");
          return {
            ...defaults,
            ...saved,
            views: saved.views && typeof saved.views === "object" ? saved.views : {},
            showIdle: saved.showIdle && typeof saved.showIdle === "object" ? saved.showIdle : {}
          };
        } catch {
          return defaults;
        }
      }

      function saveKeywordsPrefs() {
        try {
          localStorage.setItem(KEYWORDS_PREFS_KEY, JSON.stringify(keywordsPrefs));
        } catch {
          // Los filtros siguen activos durante la sesión aunque el navegador no los guarde.
        }
      }

      // Caché del modelo en IndexedDB. Cualquier fallo se trata como "sin caché".
      function keywordsCacheRequest(mode, action) {
        return new Promise((resolve) => {
          try {
            const request = indexedDB.open(KEYWORDS_CACHE_DB, 1);
            request.onupgradeneeded = () => request.result.createObjectStore("cache");
            request.onerror = () => resolve(null);
            request.onsuccess = () => {
              const db = request.result;
              try {
                const transaction = db.transaction("cache", mode);
                const operation = action(transaction.objectStore("cache"));
                transaction.oncomplete = () => {
                  db.close();
                  resolve(operation?.result ?? null);
                };
                transaction.onerror = transaction.onabort = () => {
                  db.close();
                  resolve(null);
                };
              } catch {
                db.close();
                resolve(null);
              }
            };
          } catch {
            resolve(null);
          }
        });
      }

      async function readKeywordsCache() {
        const entry = await keywordsCacheRequest("readonly", (store) => store.get("model"));
        const report = keywordReport();
        return entry && report && entry.schemaVersion === report.SCHEMA_VERSION && entry.model?.months ? entry : null;
      }

      function setKeywordsModel(model, meta) {
        keywordsModel = model;
        keywordsMeta = meta;
        keywordsDatasetCache = null;
        keywordsCacheRequest("readwrite", (store) => store.put({ schemaVersion: model.schemaVersion, model, meta }, "model"));
      }

      // Pérdidas y Ganancias toma de estos informes la inversión mensual en Google Ads: también se repinta.
      function rerenderKeywords() {
        if (!hasSuiteAccess()) return;
        if (state.active === "keywords") keywordsModule();
        else if (state.active === "financial") financialModule();
      }

      function keywordsPublishedDrive(status) {
        return {
          folderId: status?.folderId || "",
          discovery: status?.discovery || "",
          lastSync: status?.lastSync || "",
          files: (status?.files || []).map(({ status: _status, ...file }) => file)
        };
      }

      // Interpreta los CSV guardados por Supabase. Un archivo que no es un informe se informa y se omite.
      function parseKeywordFiles(files) {
        const report = keywordReport();
        const months = [];
        (files || []).forEach((file) => {
          try {
            months.push(report.parseReport(file.csv, file).month);
          } catch (error) {
            console.warn(`Informe de palabras clave omitido («${file.name}»): ${error.message}`);
          }
        });
        return months;
      }

      async function loadPublishedKeywords(client, status) {
        const { data, error } = await client.from(PRIVATE_DATA_TABLE).select("payload").eq("key", "keywords").maybeSingle();
        if (error || !Array.isArray(data?.payload?.files)) {
          if (error) console.warn("No se pudieron cargar los informes de palabras clave:", error.message);
          return false;
        }
        const model = keywordReport().buildModel(parseKeywordFiles(data.payload.files), keywordsPublishedDrive(status));
        setKeywordsModel(model, { lastSync: status.lastSync, contentHash: data.payload.contentHash || status.contentHash, origin: "publicado" });
        return true;
      }

      // Al abrir el módulo: primero la caché local; luego la fila pequeña "keywords-status" y, solo si el
      // contenido publicado cambió y es más reciente que la caché, la fila grande "keywords".
      async function ensureKeywordsLoaded() {
        if (keywordsLoad.started || !keywordReport()) return;
        keywordsLoad.started = true;
        keywordsLoad.loading = true;
        try {
          const cache = await readKeywordsCache();
          if (cache && !keywordsModel) {
            keywordsModel = cache.model;
            keywordsMeta = cache.meta || null;
            keywordsDatasetCache = null;
            rerenderKeywords();
          }
          const client = ensureSharedPendingClient();
          if (!client || !getSuiteAccessSession()) return;
          const { data, error } = await client.from(PRIVATE_DATA_TABLE).select("payload").eq("key", "keywords-status").maybeSingle();
          if (error) {
            console.warn("No se pudo leer el estado de la sincronización de palabras clave:", error.message);
            if (!keywordsModel) keywordsLoad.error = "No se pudieron leer los datos desde Supabase. Recarga la página o pulsa «Actualizar».";
            return;
          }
          keywordsStatus = data?.payload || null;
          if (!keywordsStatus) return;
          const publishedAt = Date.parse(keywordsStatus.lastSync) || 0;
          const cachedAt = Date.parse(keywordsMeta?.lastSync) || 0;
          if (keywordsModel && keywordsMeta?.contentHash && keywordsMeta.contentHash === keywordsStatus.contentHash) {
            // Mismo contenido: solo se actualiza la fecha de la sincronización, sin descargar los informes.
            if (publishedAt > cachedAt) {
              setKeywordsModel({ ...keywordsModel, drive: keywordsPublishedDrive(keywordsStatus) }, { ...keywordsMeta, lastSync: keywordsStatus.lastSync });
            }
          } else if (!keywordsModel || publishedAt >= cachedAt) {
            // La caché gana solo si es más reciente que lo publicado (un "Actualizar" posterior al cron).
            const loaded = await loadPublishedKeywords(client, keywordsStatus);
            if (!loaded && !keywordsModel) keywordsLoad.error = "No se pudieron leer los informes desde Supabase. Pulsa «Actualizar».";
          }
        } catch (error) {
          console.warn("No se pudo cargar el análisis de palabras clave:", error);
          if (!keywordsModel) keywordsLoad.error = "No se pudieron cargar los datos. Recarga la página.";
        } finally {
          keywordsLoad.loading = false;
          rerenderKeywords();
        }
      }

      function keywordsSyncErrorMessage(error) {
        const code = String(error?.code || "");
        const message = String(error?.message || "");
        if (code === "PGRST202" || /could not find the function/i.test(message)) {
          return "Falta instalar la sincronización en Supabase: ejecuta src/modules/analisis-palabras-clave/BBDD/sincronizacion-drive.sql.";
        }
        if (code === "42501") return "Tu usuario no tiene permiso para leer la carpeta de palabras clave.";
        return message || "error desconocido";
      }

      // Botón "Actualizar": descarga cada hoja directo de Google (la exportación CSV responde con CORS
      // abierto, sin API key). Supabase solo lista la carpeta, para encontrar meses nuevos al instante.
      async function refreshKeywordsFromDrive() {
        const report = keywordReport();
        if (keywordsLoad.syncing || !report) return;
        keywordsLoad.syncing = true;
        keywordsLoad.error = "";
        keywordsLoad.message = "";
        rerenderKeywords();
        try {
          const known = keywordsModel?.drive?.files?.length ? keywordsModel.drive : keywordsPublishedDrive(keywordsStatus);
          let files = known.files || [];
          let folderId = known.folderId || "";
          let discovery = known.discovery || "manifest";
          let listingError = "";
          const client = ensureSharedPendingClient();
          if (client && getSuiteAccessSession()) {
            try {
              const { data, error } = await client.rpc("list_lr_suite_keyword_files");
              if (error) listingError = keywordsSyncErrorMessage(error);
              else if (Array.isArray(data?.files) && data.files.length) {
                files = data.files.map(({ status: _status, ...file }) => file);
                folderId = data.folderId || folderId;
                discovery = data.discovery || discovery;
              }
            } catch (error) {
              listingError = keywordsSyncErrorMessage(error);
            }
            if (listingError) console.warn("No se pudo listar la carpeta de Drive desde Supabase:", listingError);
          }
          files = files.filter(report.isReportFile);

          if (!files.length) {
            // Sin hojas conocidas: se recarga la última versión publicada.
            const reloaded = client && keywordsStatus ? await loadPublishedKeywords(client, keywordsStatus) : false;
            if (reloaded) {
              keywordsLoad.message = "Se recargó la última versión publicada";
              keywordsLoad.messageAt = Date.now();
            } else {
              keywordsLoad.error = listingError || "No hay hojas de Drive conocidas todavía. Instala la sincronización en Supabase.";
            }
            return;
          }

          const results = await Promise.allSettled(
            files.map((file) =>
              fetch(report.exportUrl(file), { cache: "no-store" })
                .then((response) => {
                  if (!response.ok) throw new Error(`Google respondió ${response.status}`);
                  return response.text();
                })
                .then((text) => report.parseReport(text, file).month)
            )
          );
          const months = [];
          const failed = [];
          results.forEach((result, index) => {
            if (result.status === "fulfilled") months.push(result.value);
            else {
              failed.push(files[index]);
              console.warn(`No se pudo leer «${files[index].name}»:`, result.reason?.message || result.reason);
            }
          });
          if (!months.length) {
            keywordsLoad.error = "No se pudo leer ninguna hoja de Drive. Se conservan los datos anteriores.";
            return;
          }
          // Una hoja que falla conserva su mes anterior.
          const kept = (keywordsModel?.months || []).filter((month) => failed.some((file) => file.id === month.driveFileId));
          const now = new Date().toISOString();
          setKeywordsModel(report.buildModel([...months, ...kept], { folderId, discovery, lastSync: now, files }), {
            lastSync: now,
            contentHash: null,
            origin: "navegador"
          });
          keywordsLoad.message = `${months.length} ${months.length === 1 ? "mes actualizado" : "meses actualizados"} desde Drive ahora${
            failed.length ? ` · ${failed.length} ${failed.length === 1 ? "hoja no se pudo leer" : "hojas no se pudieron leer"}` : ""
          }`;
          keywordsLoad.messageAt = Date.now();
        } catch (error) {
          keywordsLoad.error = `No se pudo actualizar desde Drive: ${error.message || error}`;
        } finally {
          keywordsLoad.syncing = false;
          rerenderKeywords();
        }
      }

      function sumKeywordMetrics(items) {
        const totals = { count: items.length, active: 0, converting: 0, impressions: 0, clicks: 0, cost: 0, conversions: 0, wasted: 0, wastedCount: 0 };
        items.forEach((item) => {
          totals.impressions += item.impressions;
          totals.clicks += item.clicks;
          totals.cost += item.cost;
          totals.conversions += item.conversions;
          if (item.impressions > 0) totals.active += 1;
          if (item.conversions > 0) totals.converting += 1;
          if (item.cost > 0 && !item.conversions) {
            totals.wasted += item.cost;
            totals.wastedCount += 1;
          }
        });
        totals.cost = keywordRound(totals.cost);
        totals.conversions = keywordRound(totals.conversions);
        totals.wasted = keywordRound(totals.wasted);
        return totals;
      }

      // Una palabra clave en varios grupos de anuncios se suma en una fila. Estado, motivos, cuota y nivel
      // de calidad salen de la fila con más impresiones.
      function groupKeywordRows(rows) {
        const report = keywordReport();
        const groups = new Map();
        rows.forEach((row) => {
          const key = report.keywordKey(row);
          let item = groups.get(key);
          if (!item) {
            item = { key, keyword: row.keyword, matchType: row.matchType, campaign: row.campaign, adGroups: [], impressions: 0, clicks: 0, cost: 0, conversions: 0, lead: row };
            groups.set(key, item);
          }
          item.impressions += row.impressions;
          item.clicks += row.clicks;
          item.cost += row.cost;
          item.conversions += row.conversions;
          if (row.adGroup && !item.adGroups.includes(row.adGroup)) item.adGroups.push(row.adGroup);
          if (row.impressions > item.lead.impressions) item.lead = row;
        });
        return [...groups.values()].map((item) => ({ ...item, cost: keywordRound(item.cost), conversions: keywordRound(item.conversions) }));
      }

      function keywordCampaignStatus(rows) {
        const all = (pattern) => rows.length > 0 && rows.every((row) => pattern.test(normalizeText(row.reasons)));
        if (all(/campana detenida/)) return "Campaña detenida";
        if (all(/campana quitada/)) return "Campaña quitada";
        return "Activa";
      }

      // Datos listos para pintar, recalculados solo cuando cambia el modelo. Las campañas excluidas se
      // quitan aquí también, por si el modelo viene de una caché anterior a la exclusión.
      function keywordsDataset() {
        const report = keywordReport();
        if (!report || !keywordsModel) return null;
        if (keywordsDatasetCache?.model === keywordsModel) return keywordsDatasetCache.data;
        const model = report.applyExclusions(keywordsModel);
        const months = model.months.map((month) => {
          const campaigns = new Map();
          month.keywords.forEach((row) => {
            if (!campaigns.has(row.campaign)) campaigns.set(row.campaign, { name: row.campaign, rows: [] });
            campaigns.get(row.campaign).rows.push(row);
          });
          campaigns.forEach((campaign) => {
            campaign.keywords = groupKeywordRows(campaign.rows);
            campaign.totals = sumKeywordMetrics(campaign.keywords);
            campaign.status = keywordCampaignStatus(campaign.rows);
          });
          const keywords = [...campaigns.values()].flatMap((campaign) => campaign.keywords);
          return { ...month, campaigns, byKey: new Map(keywords.map((item) => [item.key, item])), totals: sumKeywordMetrics(keywords) };
        });
        const campaignTotals = new Map();
        months.forEach((month) => {
          month.campaigns.forEach((campaign) => {
            const total = campaignTotals.get(campaign.name) || { name: campaign.name, cost: 0, impressions: 0 };
            total.cost += campaign.totals.cost;
            total.impressions += campaign.totals.impressions;
            campaignTotals.set(campaign.name, total);
          });
        });
        const data = {
          model,
          months,
          campaigns: [...campaignTotals.values()].sort(
            (a, b) => b.cost - a.cost || b.impressions - a.impressions || a.name.localeCompare(b.name, "es")
          ),
          multiYear: new Set(months.map((month) => month.id.slice(0, 4))).size > 1
        };
        keywordsDatasetCache = { model: keywordsModel, data };
        return data;
      }

      function keywordMetricValue(totals, indicator) {
        if (!totals) return null;
        if (indicator === "ctr") return totals.impressions ? totals.clicks / totals.impressions : null;
        if (indicator === "cpa") return totals.conversions ? totals.cost / totals.conversions : null;
        return totals[indicator];
      }

      const keywordMoneyFormats = new Map();
      function fmtKeywordMoney(value, currency = "USD") {
        if (value === null || value === undefined || !Number.isFinite(value)) return "—";
        let format = keywordMoneyFormats.get(currency);
        if (!format) {
          try {
            format = new Intl.NumberFormat("es-PE", { style: "currency", currency, minimumFractionDigits: 2, maximumFractionDigits: 2 });
          } catch {
            format = new Intl.NumberFormat("es-PE", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
          }
          keywordMoneyFormats.set(currency, format);
        }
        return format.format(value).replace(/\s/g, " ");
      }
      const keywordPercentFormat = new Intl.NumberFormat("es-PE", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      const keywordCountFormat = new Intl.NumberFormat("es-PE", { maximumFractionDigits: 2 });
      const fmtKeywordPercent = (value) => (value === null || value === undefined ? "—" : `${keywordPercentFormat.format(value * 100)}%`);
      const fmtKeywordCount = (value) => keywordCountFormat.format(value);

      function fmtKeywordIndicator(value, indicator, currency) {
        if (value === null || value === undefined) return "—";
        if (indicator === "cost" || indicator === "cpa") return fmtKeywordMoney(value, currency);
        if (indicator === "ctr") return fmtKeywordPercent(value);
        return fmtKeywordCount(value);
      }

      // Nombre amigable: sin prefijos técnicos ("Search 2026 |", "LR", "SKAG") y sin mayúsculas sostenidas.
      function keywordCampaignName(name) {
        let friendly = String(name || "")
          .replace(/^(?:(?:search|b[uú]squeda|pmax|performance max|display|skag|lr)\b[\s\-_:|·]*|20\d{2}\b[\s\-_:|·]*)+/i, "")
          .trim();
        if (!friendly) friendly = String(name || "");
        if (friendly === friendly.toUpperCase() && /[A-ZÁÉÍÓÚÑ]{3}/.test(friendly)) friendly = friendly.toLowerCase();
        return friendly.charAt(0).toUpperCase() + friendly.slice(1);
      }

      function keywordStatusTone(status) {
        const value = normalizeText(status);
        if (/no apta|rechaz/.test(value)) return "rose";
        if (/limitad/.test(value)) return "amber";
        if (/apta|aprobad|habilitad/.test(value)) return "green";
        return "";
      }

      function keywordReading(item, campaignTotals) {
        if (!item.impressions) return ["Sin impresiones", ""];
        if (!item.clicks) return ["Sin clics", ""];
        if (!item.conversions) return item.cost > 0 ? ["Gasta sin convertir", "rose"] : ["Sin conversiones", ""];
        const campaignCpa = keywordMetricValue(campaignTotals, "cpa");
        return campaignCpa === null || item.cost / item.conversions <= campaignCpa + 1e-9 ? ["Eficiente", "green"] : ["CPA alto", "amber"];
      }

      function keywordMonthShort(month, multiYear) {
        const short = month.label.slice(0, 3);
        return multiYear ? `${short} ${month.id.slice(2, 4)}` : short;
      }

      function keywordChangeText(current, previous, better) {
        if (current === null || current === undefined || previous === null || previous === undefined) {
          return `<span class="keywords-change">—</span>`;
        }
        if (!previous) {
          // Sin base para un porcentaje: el mes anterior fue 0.
          const tone = !current || better === "neutral" ? "" : better === "down" ? "down" : "up";
          return `<span class="keywords-change ${tone}" title="El mes anterior fue 0">${current ? "desde 0" : "—"}</span>`;
        }
        const change = ((current - previous) / Math.abs(previous)) * 100;
        const tone = better === "neutral" || Math.abs(change) < 0.05 ? "" : (better === "down" ? change < 0 : change > 0) ? "up" : "down";
        return `<span class="keywords-change ${tone}">${change > 0 ? "+" : ""}${change.toFixed(1)}%</span>`;
      }

      // Mini gráfica del indicador en todos los meses; marca el mes elegido. Un mes sin dato corta la línea.
      function keywordSparkline(data, values, selectedIndex, indicator, label) {
        const width = 92;
        const height = 28;
        const pad = 3;
        const valid = values.filter((value) => typeof value === "number");
        if (!valid.length) return `<svg class="keywords-spark" width="${width}" height="${height}" aria-hidden="true"></svg>`;
        const max = Math.max(...valid);
        const x = (index) => (values.length === 1 ? width / 2 : pad + (index * (width - pad * 2)) / (values.length - 1));
        const y = (value) => (max > 0 ? height - pad - (value / max) * (height - pad * 2) : height - pad);
        let path = "";
        let drawing = false;
        values.forEach((value, index) => {
          if (typeof value !== "number") {
            drawing = false;
            return;
          }
          path += `${drawing ? "L" : "M"}${x(index).toFixed(1)} ${y(value).toFixed(1)}`;
          drawing = true;
        });
        const dots = values
          .map((value, index) =>
            typeof value !== "number"
              ? ""
              : index === selectedIndex
                ? `<circle cx="${x(index).toFixed(1)}" cy="${y(value).toFixed(1)}" r="3.2" fill="#1d4ed8" stroke="#fff" stroke-width="1.5"></circle>`
                : `<circle cx="${x(index).toFixed(1)}" cy="${y(value).toFixed(1)}" r="1.4" fill="#93c5fd"></circle>`
          )
          .join("");
        const summary = data.months
          .map((month, index) => `${keywordMonthShort(month, data.multiYear)} ${fmtKeywordIndicator(values[index] ?? null, indicator, month.currency)}`)
          .join(" · ");
        const description = `${KEYWORD_INDICATORS[indicator].label} de ${label} por mes: ${summary}`;
        return `
          <svg class="keywords-spark" viewBox="0 0 ${width} ${height}" width="${width}" height="${height}" role="img" aria-label="${escapeHtml(description)}">
            <title>${escapeHtml(description)}</title>
            <line x1="0" x2="${width}" y1="${height - pad}" y2="${height - pad}" stroke="#e2e8f0"></line>
            <path d="${path}" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"></path>
            ${dots}
          </svg>`;
      }

      function keywordTrendCell(data, monthIndex, indicator, series, existedBefore, label) {
        const previousMonth = data.months[monthIndex - 1];
        const change = !previousMonth
          ? `<span class="keywords-change">—</span>`
          : !existedBefore
            ? `<span class="keywords-change new" title="No estaba en el informe de ${escapeHtml(previousMonth.label)}">Nueva</span>`
            : keywordChangeText(series[monthIndex], series[monthIndex - 1], KEYWORD_INDICATORS[indicator].better);
        return `<div class="keywords-trend">${keywordSparkline(data, series, monthIndex, indicator, label)}${change}</div>`;
      }

      function keywordsSyncPanel() {
        const busy = keywordsLoad.syncing;
        let text = "";
        let tone = "";
        if (busy) text = "Leyendo las hojas de Drive…";
        else if (keywordsLoad.error) {
          text = keywordsLoad.error;
          tone = "error";
        } else if (keywordsLoad.message && Date.now() - keywordsLoad.messageAt < KEYWORDS_MESSAGE_MS) text = keywordsLoad.message;
        else if (keywordsMeta?.lastSync) {
          text = `Datos actualizados: ${fmtDateTime(keywordsMeta.lastSync)}${keywordsMeta.origin === "navegador" ? " · desde este navegador" : ""}`;
        } else text = keywordsLoad.loading ? "Cargando datos…" : "Sin datos sincronizados";
        return `
          <div class="keywords-sync">
            <button class="btn primary" type="button" data-keywords-sync ${busy || !keywordReport() ? "disabled" : ""}>
              <span class="financial-sync-icon ${busy ? "spinning" : ""}">${icons.refresh}</span>
              ${busy ? "Actualizando…" : "Actualizar"}
            </button>
            <p class="small keywords-sync-status ${tone}" role="status" aria-live="polite">${escapeHtml(text)}</p>
            <p class="small">Google Drive · diario a las 6:20 a. m.</p>
          </div>
        `;
      }

      function keywordsNotices(data) {
        const notices = [];
        const lastSync = Date.parse(keywordsMeta?.lastSync || "") || 0;
        if (lastSync && Date.now() - lastSync > KEYWORDS_STALE_HOURS * 3600000) {
          notices.push(
            `<div class="financial-notice">La última actualización tiene más de un día. Pulsa «Actualizar» o revisa el cron <code>lr-suite-keywords-daily</code> en Supabase.</div>`
          );
        }
        (data?.months || [])
          .filter((month) => month.check?.ok === false)
          .forEach((month) => {
            const diff = month.check.diff || {};
            const parts = [
              diff.impressions ? `impresiones ${diff.impressions > 0 ? "+" : ""}${fmtNumber(diff.impressions)}` : "",
              diff.clicks ? `clics ${diff.clicks > 0 ? "+" : ""}${fmtNumber(diff.clicks)}` : "",
              diff.conversions ? `conversiones ${diff.conversions > 0 ? "+" : ""}${fmtKeywordCount(diff.conversions)}` : "",
              Math.abs(diff.cost || 0) > 0.05 ? `costo ${fmtKeywordMoney(diff.cost, month.currency)}` : ""
            ].filter(Boolean);
            notices.push(
              `<div class="financial-notice error" role="alert">Las sumas de ${escapeHtml(month.label)} no cuadran con la fila «${escapeHtml(month.check.label || "Total")}» del informe (${escapeHtml(parts.join(", "))}). Revisa la hoja en Drive.</div>`
            );
          });
        const serverErrors = keywordsStatus?.errors || [];
        if (serverErrors.length && keywordsMeta?.origin === "publicado") {
          notices.push(
            `<div class="financial-notice">Aviso de la sincronización diaria: ${escapeHtml(serverErrors.slice(0, 2).join(" · "))}</div>`
          );
        }
        if (data?.model?.duplicates?.length) {
          notices.push(
            `<div class="financial-notice">Hay más de una hoja para ${escapeHtml(data.model.duplicates.join(", "))} en la carpeta; se usa la modificada más recientemente.</div>`
          );
        }
        return notices.join("");
      }

      function keywordsFilters(data, month, campaign, indicator) {
        const monthOptions = [...data.months]
          .reverse()
          .map(
            (item) =>
              `<option value="${item.id}" ${item.id === month.id ? "selected" : ""}>${escapeHtml(item.label)}${item.totals.impressions ? "" : " · sin actividad"}</option>`
          )
          .join("");
        const campaignOptions = data.campaigns
          .map(
            (item) =>
              `<option value="${escapeHtml(item.name)}" ${item.name === campaign ? "selected" : ""}>${escapeHtml(keywordCampaignName(item.name))}${item.impressions ? "" : " · sin actividad"}</option>`
          )
          .join("");
        const indicatorOptions = Object.entries(KEYWORD_INDICATORS)
          .map(([key, item]) => `<option value="${key}" ${key === indicator ? "selected" : ""}>${item.label}</option>`)
          .join("");
        const check = month.check || {};
        const checkText =
          check.ok === true
            ? `las sumas cuadran con la fila «${check.label}»`
            : check.ok === false
              ? `las sumas no cuadran con la fila «${check.label}»`
              : "el informe no trae fila de totales";
        return `
          <div class="panel keywords-filters">
            <label class="keywords-field">
              <span>Mes</span>
              <span class="control">${icons.calendar}<select data-keywords-filter="month" aria-label="Mes">${monthOptions}</select></span>
            </label>
            <label class="keywords-field">
              <span>Campaña</span>
              <span class="control">${icons.megaphone}<select data-keywords-filter="campaign" aria-label="Campaña"><option value="all" ${campaign === "all" ? "selected" : ""}>Todas las campañas</option>${campaignOptions}</select></span>
            </label>
            <label class="keywords-field">
              <span>Indicador de tendencia</span>
              <span class="control">${icons.trend}<select data-keywords-filter="indicator" aria-label="Indicador de tendencia">${indicatorOptions}</select></span>
            </label>
            <p class="small keywords-period">${escapeHtml(
              `${month.period?.start ? `${fmtDate(month.period.start)} – ${fmtDate(month.period.end)}` : month.label} · Informe «${month.sourceFile || "sin nombre"}» · ${checkText} · montos en ${month.currency}`
            )}</p>
          </div>
        `;
      }

      function keywordMetricCard(label, value, detail, change, better, extraClass = "") {
        const badge =
          typeof change === "number" && Number.isFinite(change)
            ? `<span class="trend ${better === "neutral" ? "neutral" : (better === "down" ? change > 0 : change < 0) ? "bad" : ""}" title="Variación contra el mes anterior">${change >= 0 ? "↗" : "↘"} ${Math.abs(change).toFixed(1)}%</span>`
            : "";
        return `
          <article class="metric-card ${extraClass}">
            <div class="metric-head">
              <p class="metric-label">${label}</p>
              ${badge}
            </div>
            <p class="metric-value">${value}</p>
            <p class="metric-detail">${detail}</p>
          </article>
        `;
      }

      function keywordsMetrics(current, previous, month, previousMonth) {
        const totals = current.totals;
        const before = previous?.totals || null;
        const currency = month.currency;
        const change = (now, then) => (before && typeof now === "number" && typeof then === "number" && then !== 0 ? ((now - then) / Math.abs(then)) * 100 : null);
        const cpa = keywordMetricValue(totals, "cpa");
        const cpc = totals.clicks ? totals.cost / totals.clicks : null;
        return `
          <div class="metrics keywords-metrics">
            ${keywordMetricCard("Palabras clave activas", fmtNumber(totals.active), `${fmtNumber(totals.converting)} convierten · ${fmtNumber(totals.count)} en el informe`, change(totals.active, before?.active), "up")}
            ${keywordMetricCard("Impresiones", fmtNumber(totals.impressions), before ? `${fmtNumber(before.impressions)} en ${escapeHtml(previousMonth.label)}` : "Sin mes anterior para comparar", change(totals.impressions, before?.impressions), "up")}
            ${keywordMetricCard("Clics", fmtNumber(totals.clicks), `CTR ${fmtKeywordPercent(keywordMetricValue(totals, "ctr"))}`, change(totals.clicks, before?.clicks), "up")}
            ${keywordMetricCard("Costo", fmtKeywordMoney(totals.cost, currency), `CPC ${fmtKeywordMoney(cpc, currency)}`, change(totals.cost, before?.cost), "neutral")}
            ${keywordMetricCard("Conversiones", fmtKeywordCount(totals.conversions), `Tasa de conv. ${fmtKeywordPercent(totals.clicks ? totals.conversions / totals.clicks : null)}`, change(totals.conversions, before?.conversions), "up")}
            ${keywordMetricCard("Costo por conversión", fmtKeywordMoney(cpa, currency), cpa === null ? "Sin conversiones en el mes" : "Costo ÷ conversiones", change(cpa, before ? keywordMetricValue(before, "cpa") : null), "down")}
            ${keywordMetricCard("Gasto sin conversiones", fmtKeywordMoney(totals.wasted, currency), `${fmtNumber(totals.wastedCount)} ${totals.wastedCount === 1 ? "palabra clave" : "palabras clave"} · ${totals.cost ? fmtKeywordPercent(totals.wasted / totals.cost) : "—"} del costo`, change(totals.wasted, before?.wasted), "down", "wide")}
          </div>
        `;
      }

      function keywordScope(month, campaign) {
        if (!month) return null;
        if (campaign === "all") return { totals: month.totals };
        const found = month.campaigns.get(campaign);
        return { totals: found ? found.totals : sumKeywordMetrics([]) };
      }

      function keywordsDetailTable(data, month, monthIndex, campaign, indicator) {
        const currency = month.currency;
        const id = encodeURIComponent(campaign.name);
        const showIdle = Boolean(keywordsPrefs.showIdle[campaign.name]);
        const sorted = [...campaign.keywords].sort(
          (a, b) => b.cost - a.cost || b.impressions - a.impressions || b.clicks - a.clicks || a.keyword.localeCompare(b.keyword, "es")
        );
        const active = sorted.filter((item) => item.impressions > 0);
        const idle = sorted.filter((item) => !item.impressions);
        const previousMonth = data.months[monthIndex - 1];
        // Algunas exportaciones traen "% perdidas por ranking" y "% parte superior"; esta cuenta trae la
        // cuota de impresiones de búsqueda y el nivel de calidad.
        const rankFormat = month.keywords.some((row) => "lostRank" in row);
        const shareCell = (lead) => {
          const main = rankFormat ? lead.lostRank : lead.impressionShare;
          const second = rankFormat ? (lead.topShare ? `${lead.topShare} parte sup.` : "") : lead.qualityScore ? `NC ${lead.qualityScore}/10` : "";
          const title = rankFormat
            ? ""
            : [
                lead.expectedCtr ? `CTR previsto: ${lead.expectedCtr}` : "",
                lead.landingPage ? `Experiencia en la página de destino: ${lead.landingPage}` : "",
                lead.adRelevance ? `Relevancia del anuncio: ${lead.adRelevance}` : ""
              ]
                .filter(Boolean)
                .join(" · ");
          return `${main ? escapeHtml(main) : "—"}${second ? `<span class="keywords-sub" ${title ? `title="${escapeHtml(title)}"` : ""}>${escapeHtml(second)}</span>` : ""}`;
        };
        const row = (item) => {
          const lead = item.lead;
          const [reading, tone] = keywordReading(item, campaign.totals);
          const series = data.months.map((other) => keywordMetricValue(other.byKey.get(item.key), indicator));
          const groups =
            item.adGroups.length > 1
              ? `<span title="${escapeHtml(item.adGroups.join(", "))}">${item.adGroups.length} grupos de anuncios</span>`
              : escapeHtml(item.adGroups[0] || "Sin grupo");
          return `
            <tr>
              <td class="keywords-word"><strong>${escapeHtml(item.keyword)}</strong><span class="keywords-sub">${escapeHtml(item.matchType || "—")} · ${groups}</span></td>
              <td><span class="badge ${keywordStatusTone(lead.status)}">${escapeHtml(lead.status || "—")}</span>${lead.reasons ? `<span class="keywords-reasons">${escapeHtml(lead.reasons)}</span>` : ""}</td>
              <td class="right">${fmtNumber(item.impressions)}</td>
              <td class="right">${fmtNumber(item.clicks)}</td>
              <td class="right">${fmtKeywordPercent(keywordMetricValue(item, "ctr"))}</td>
              <td class="right">${fmtKeywordMoney(item.clicks ? item.cost / item.clicks : null, currency)}</td>
              <td class="right">${fmtKeywordMoney(item.cost, currency)}</td>
              <td class="right">${fmtKeywordCount(item.conversions)}</td>
              <td class="right">${fmtKeywordMoney(keywordMetricValue(item, "cpa"), currency)}</td>
              <td class="right">${shareCell(lead)}</td>
              <td>${keywordTrendCell(data, monthIndex, indicator, series, Boolean(previousMonth?.byKey.has(item.key)), `«${item.keyword}»`)}</td>
              <td><span class="badge ${tone}">${reading}</span></td>
            </tr>
          `;
        };
        const totals = campaign.totals;
        const campaignSeries = data.months.map((other) => keywordMetricValue(other.campaigns.get(campaign.name)?.totals, indicator));
        const rows = [
          active.length
            ? active.map(row).join("")
            : `<tr class="keywords-note-row"><td colspan="12">Ninguna palabra clave de esta campaña tuvo impresiones en ${escapeHtml(month.label)}.</td></tr>`,
          idle.length
            ? `<tr class="keywords-note-row"><td colspan="12"><button class="keywords-link" type="button" data-keywords-idle data-campaign="${id}" aria-expanded="${showIdle}">${showIdle ? "Ocultar" : "Mostrar"} ${fmtNumber(idle.length)} ${idle.length === 1 ? "palabra clave" : "palabras clave"} sin impresiones</button></td></tr>`
            : "",
          showIdle ? idle.map(row).join("") : ""
        ].join("");
        return `
          <div class="table-wrap">
            <table class="keywords-table">
              <thead>
                <tr>
                  <th scope="col">Palabra clave</th>
                  <th scope="col">Estado</th>
                  <th scope="col" class="right">Impr.</th>
                  <th scope="col" class="right">Clics</th>
                  <th scope="col" class="right">CTR</th>
                  <th scope="col" class="right">CPC</th>
                  <th scope="col" class="right">Costo</th>
                  <th scope="col" class="right">Conv.</th>
                  <th scope="col" class="right">Costo/conv.</th>
                  <th scope="col" class="right" title="${rankFormat ? "% de impresiones perdidas por ranking; debajo, % en la parte superior" : "Porcentaje de impresiones de búsqueda; debajo, nivel de calidad"}">${rankFormat ? "% perdidas ranking" : "Cuota impr."}</th>
                  <th scope="col">Tendencia · ${escapeHtml(KEYWORD_INDICATORS[indicator].label)}</th>
                  <th scope="col">Lectura</th>
                </tr>
              </thead>
              <tbody>${rows}</tbody>
              <tfoot>
                <tr>
                  <td colspan="2">Total de la campaña</td>
                  <td class="right">${fmtNumber(totals.impressions)}</td>
                  <td class="right">${fmtNumber(totals.clicks)}</td>
                  <td class="right">${fmtKeywordPercent(keywordMetricValue(totals, "ctr"))}</td>
                  <td class="right">${fmtKeywordMoney(totals.clicks ? totals.cost / totals.clicks : null, currency)}</td>
                  <td class="right">${fmtKeywordMoney(totals.cost, currency)}</td>
                  <td class="right">${fmtKeywordCount(totals.conversions)}</td>
                  <td class="right">${fmtKeywordMoney(keywordMetricValue(totals, "cpa"), currency)}</td>
                  <td class="right">—</td>
                  <td>${keywordTrendCell(data, monthIndex, indicator, campaignSeries, Boolean(previousMonth?.campaigns.has(campaign.name)), "la campaña")}</td>
                  <td></td>
                </tr>
              </tfoot>
            </table>
          </div>
        `;
      }

      function keywordsEvolutionTable(data, month, campaign, indicator) {
        const id = encodeURIComponent(campaign.name);
        const showIdle = Boolean(keywordsPrefs.showIdle[campaign.name]);
        const entries = new Map();
        data.months.forEach((other) => {
          other.campaigns.get(campaign.name)?.keywords.forEach((item) => {
            const entry = entries.get(item.key) || { key: item.key, keyword: item.keyword, matchType: item.matchType, byMonth: new Map(), items: [] };
            entry.byMonth.set(other.id, item);
            entry.items.push(item);
            entries.set(item.key, entry);
          });
        });
        const list = [...entries.values()]
          .map((entry) => ({ ...entry, totals: sumKeywordMetrics(entry.items) }))
          .sort((a, b) => b.totals.cost - a.totals.cost || b.totals.impressions - a.totals.impressions || a.keyword.localeCompare(b.keyword, "es"));
        const active = list.filter((entry) => entry.totals.impressions > 0);
        const idle = list.filter((entry) => !entry.totals.impressions);
        const columns = data.months.length + 2;
        // Intensidad relativa al máximo de la fila; "-" si la palabra clave no está en el informe del mes.
        const cells = (valueFor) => {
          const values = data.months.map(valueFor);
          const max = Math.max(0, ...values.filter((value) => typeof value === "number"));
          return values
            .map((value, index) => {
              const other = data.months[index];
              const selected = other.id === month.id ? "selected" : "";
              if (value === undefined) return `<td class="right muted ${selected}">-</td>`;
              if (value === null) return `<td class="right muted ${selected}">—</td>`;
              const alpha = max > 0 ? 0.04 + 0.3 * (value / max) : 0;
              return `<td class="right ${selected}" style="background: rgba(37, 99, 235, ${alpha.toFixed(3)})">${fmtKeywordIndicator(value, indicator, other.currency)}</td>`;
            })
            .join("");
        };
        const row = (entry) => `
          <tr>
            <th scope="row" class="keywords-word sticky"><strong>${escapeHtml(entry.keyword)}</strong><span class="keywords-sub">${escapeHtml(entry.matchType || "—")}</span></th>
            ${cells((other) => (entry.byMonth.has(other.id) ? keywordMetricValue(entry.byMonth.get(other.id), indicator) : undefined))}
            <td class="right accumulated">${fmtKeywordIndicator(keywordMetricValue(entry.totals, indicator), indicator, month.currency)}</td>
          </tr>
        `;
        const campaignMonths = data.months.map((other) => other.campaigns.get(campaign.name)).filter(Boolean);
        const campaignTotals = sumKeywordMetrics(campaignMonths.flatMap((item) => item.keywords));
        const rows = [
          active.length
            ? active.map(row).join("")
            : `<tr class="keywords-note-row"><td colspan="${columns}">Ninguna palabra clave de esta campaña tuvo impresiones en los meses cargados.</td></tr>`,
          idle.length
            ? `<tr class="keywords-note-row"><td colspan="${columns}"><button class="keywords-link" type="button" data-keywords-idle data-campaign="${id}" aria-expanded="${showIdle}">${showIdle ? "Ocultar" : "Mostrar"} ${fmtNumber(idle.length)} ${idle.length === 1 ? "palabra clave" : "palabras clave"} sin impresiones en ningún mes</button></td></tr>`
            : "",
          showIdle ? idle.map(row).join("") : ""
        ].join("");
        return `
          <div class="table-wrap">
            <table class="keywords-table keywords-evolution">
              <thead>
                <tr>
                  <th scope="col" class="sticky">Palabra clave · ${escapeHtml(KEYWORD_INDICATORS[indicator].label)}</th>
                  ${data.months.map((other) => `<th scope="col" class="right ${other.id === month.id ? "selected" : ""}" title="${escapeHtml(other.label)}">${keywordMonthShort(other, data.multiYear)}</th>`).join("")}
                  <th scope="col" class="right accumulated">Acumulado</th>
                </tr>
              </thead>
              <tbody>${rows}</tbody>
              <tfoot>
                <tr>
                  <th scope="row" class="sticky">Total de la campaña</th>
                  ${cells((other) => (other.campaigns.has(campaign.name) ? keywordMetricValue(other.campaigns.get(campaign.name).totals, indicator) : undefined))}
                  <td class="right accumulated">${fmtKeywordIndicator(keywordMetricValue(campaignTotals, indicator), indicator, month.currency)}</td>
                </tr>
              </tfoot>
            </table>
          </div>
        `;
      }

      function keywordsCampaignCard(data, month, monthIndex, campaign, indicator) {
        const view = keywordsPrefs.views[campaign.name] === "evolution" ? "evolution" : "detail";
        const friendly = keywordCampaignName(campaign.name);
        const id = encodeURIComponent(campaign.name);
        const statusTone = campaign.status === "Activa" ? "green" : campaign.status === "Campaña detenida" ? "amber" : "";
        const totals = campaign.totals;
        return `
          <article class="panel keywords-campaign">
            <div class="keywords-campaign-head">
              <div>
                <div class="keywords-campaign-title">
                  <strong>${escapeHtml(friendly)}</strong>
                  <span class="badge ${statusTone}">${campaign.status}</span>
                </div>
                ${friendly !== campaign.name ? `<p class="small">${escapeHtml(campaign.name)}</p>` : ""}
                <p class="small">${fmtNumber(totals.active)} ${totals.active === 1 ? "palabra clave" : "palabras clave"} con impresiones de ${fmtNumber(totals.count)} · ${fmtKeywordMoney(totals.cost, month.currency)} de costo en ${escapeHtml(month.label)}</p>
              </div>
              <div class="keywords-views" role="group" aria-label="Vista de ${escapeHtml(friendly)}">
                <button type="button" class="${view === "detail" ? "active" : ""}" aria-pressed="${view === "detail"}" data-keywords-view="detail" data-campaign="${id}">Detalle del mes</button>
                <button type="button" class="${view === "evolution" ? "active" : ""}" aria-pressed="${view === "evolution"}" data-keywords-view="evolution" data-campaign="${id}">Evolución mensual</button>
              </div>
            </div>
            ${view === "evolution" ? keywordsEvolutionTable(data, month, campaign, indicator) : keywordsDetailTable(data, month, monthIndex, campaign, indicator)}
          </article>
        `;
      }

      function keywordsCampaignCards(data, month, monthIndex, campaignFilter, indicator) {
        const all = [...month.campaigns.values()];
        const hasActivity = (campaign) => campaign.totals.impressions > 0 || campaign.totals.cost > 0;
        if (campaignFilter !== "all") {
          const campaign = month.campaigns.get(campaignFilter);
          return campaign
            ? keywordsCampaignCard(data, month, monthIndex, campaign, indicator)
            : `<div class="panel financial-empty"><p>La campaña «${escapeHtml(keywordCampaignName(campaignFilter))}» no aparece en el informe de ${escapeHtml(month.label)}.</p></div>`;
        }
        // Ordenadas por costo. Las campañas sin impresiones ni costo en el mes se pliegan al final.
        const visible = all.filter(hasActivity).sort((a, b) => b.totals.cost - a.totals.cost || b.totals.impressions - a.totals.impressions);
        const inactive = all.filter((campaign) => !hasActivity(campaign)).sort((a, b) => a.name.localeCompare(b.name, "es"));
        const cards = [...visible, ...(keywordsPrefs.showInactive ? inactive : [])]
          .map((campaign) => keywordsCampaignCard(data, month, monthIndex, campaign, indicator))
          .join("");
        return `
          ${visible.length ? "" : `<div class="panel financial-empty"><p>Ninguna campaña tuvo impresiones ni costo en ${escapeHtml(month.label)}.</p></div>`}
          ${cards}
          ${
            inactive.length
              ? `<div class="keywords-inactive"><button class="btn" type="button" data-keywords-inactive aria-expanded="${keywordsPrefs.showInactive}">${keywordsPrefs.showInactive ? "Ocultar" : "Mostrar"} ${fmtNumber(inactive.length)} ${inactive.length === 1 ? "campaña" : "campañas"} sin actividad en ${escapeHtml(month.label)}</button></div>`
              : ""
          }
        `;
      }

      function keywordsFootnote(data) {
        const excluded = keywordReport()?.CONFIG.excludeCampaigns || [];
        return `
          <div class="panel keywords-notes">
            <strong>Cómo se lee</strong>
            <ul>
              <li>CTR = clics ÷ impresiones · CPC = costo ÷ clics · Costo/conv. = costo ÷ conversiones · Tasa de conv. = conversiones ÷ clics. Se calculan siempre sobre las sumas (de la palabra clave, la campaña, el mes o el acumulado), como Google Ads; nunca se promedian porcentajes.</li>
              <li>Una palabra clave es la combinación de campaña, texto y tipo de concordancia: si está en varios grupos de anuncios se suma en una sola fila y se sigue así mes a mes. «Nueva» indica que no estaba en el informe del mes anterior.</li>
              <li>Lectura: <strong>Eficiente</strong>, costo por conversión menor o igual al de su campaña; <strong>CPA alto</strong>, mayor al de su campaña; <strong>Gasta sin convertir</strong>, tuvo costo y ninguna conversión; <strong>Sin clics</strong>, tuvo impresiones pero ningún clic; <strong>Sin impresiones</strong>, no se mostró en el mes.</li>
              <li>Cuota impr.: porcentaje de impresiones de búsqueda que informa Google Ads, acotado (por ejemplo «&lt; 10%»). NC: nivel de calidad de 1 a 10 (pasa el cursor para ver sus componentes). Gasto sin conversiones: costo de las palabras clave que no convirtieron en el mes.</li>
              <li>Fuente: el «Informe de palabras clave de búsqueda» de cada mes en la carpeta de Drive. Las sumas de cada mes se comparan con la fila de totales del informe.${excluded.length ? ` Campañas excluidas: ${escapeHtml(excluded.join(", "))}.` : ""}</li>
            </ul>
          </div>
        `;
      }

      function keywordsModule() {
        ensureKeywordsLoaded();
        const report = keywordReport();
        const data = keywordsDataset();
        const head = header(
          "Análisis de Palabras Clave",
          "Comportamiento de las palabras clave de Google Ads por campaña, leído de los informes mensuales de la carpeta de Drive.",
          "Google Ads",
          icons.megaphone,
          keywordsSyncPanel()
        );
        if (!report || !data || !data.months.length) {
          const message = !report
            ? "No se pudo cargar el lector de informes (keyword-report.js). Recarga la página."
            : keywordsLoad.loading || keywordsLoad.syncing
              ? "Cargando los informes de palabras clave…"
              : keywordsLoad.error
                ? "No hay datos para mostrar todavía."
                : keywordsStatus
                  ? "La sincronización no encontró informes de palabras clave en la carpeta de Drive."
                  : "Todavía no hay datos sincronizados. Instala la sincronización en Supabase (src/modules/analisis-palabras-clave/BBDD/sincronizacion-drive.sql) y pulsa «Actualizar».";
          shell(`
            <section class="module keywords-module">
              ${head}
              ${keywordsNotices(null)}
              <div class="panel financial-empty"><p>${escapeHtml(message)}</p></div>
            </section>
          `);
          wireKeywordsModule();
          return;
        }

        const fallbackIndex = Math.max(0, data.months.findIndex((month) => month.id === data.model.defaultMonth));
        const savedIndex = data.months.findIndex((month) => month.id === keywordsPrefs.month);
        const monthIndex = savedIndex >= 0 ? savedIndex : fallbackIndex;
        const month = data.months[monthIndex];
        const previousMonth = data.months[monthIndex - 1] || null;
        const campaign = keywordsPrefs.campaign !== "all" && data.campaigns.some((item) => item.name === keywordsPrefs.campaign) ? keywordsPrefs.campaign : "all";
        const indicator = KEYWORD_INDICATORS[keywordsPrefs.indicator] ? keywordsPrefs.indicator : "clicks";

        shell(`
          <section class="module keywords-module">
            ${head}
            ${keywordsNotices(data)}
            ${keywordsFilters(data, month, campaign, indicator)}
            ${keywordsMetrics(keywordScope(month, campaign), keywordScope(previousMonth, campaign), month, previousMonth)}
            ${keywordsCampaignCards(data, month, monthIndex, campaign, indicator)}
            ${keywordsFootnote(data)}
          </section>
        `);
        wireKeywordsModule();
      }

      function wireKeywordsModule() {
        document.querySelector("[data-keywords-sync]")?.addEventListener("click", refreshKeywordsFromDrive);
        document.querySelectorAll("[data-keywords-filter]").forEach((select) => {
          select.addEventListener("change", () => {
            keywordsPrefs[select.dataset.keywordsFilter] = select.value;
            saveKeywordsPrefs();
            keywordsModule();
          });
        });
        document.querySelectorAll("[data-keywords-view]").forEach((button) => {
          button.addEventListener("click", () => {
            keywordsPrefs.views[decodeURIComponent(button.dataset.campaign)] = button.dataset.keywordsView;
            saveKeywordsPrefs();
            keywordsModule();
          });
        });
        document.querySelectorAll("[data-keywords-idle]").forEach((button) => {
          button.addEventListener("click", () => {
            const name = decodeURIComponent(button.dataset.campaign);
            keywordsPrefs.showIdle[name] = !keywordsPrefs.showIdle[name];
            saveKeywordsPrefs();
            keywordsModule();
          });
        });
        document.querySelector("[data-keywords-inactive]")?.addEventListener("click", () => {
          keywordsPrefs.showInactive = !keywordsPrefs.showInactive;
          saveKeywordsPrefs();
          keywordsModule();
        });
      }

      function quoteIgv(quote) {

      }

      function quoteDocumentHref(quote) {
        if (!quote.archivoUrl) return "";
        return quote.archivoTipo === "file" ? quote.archivoSignedUrl || quote.archivoUrl : quote.archivoUrl;
      }

      function quoteContactMeta(type) {

          reunion: ["Reunión", "🎥", "amber"],

              <div class="drawer-title-row">
                <div>
                  <p class="label">Contactos</p>
                  <h2>${escapeHtml(quote.servicio)}</h2>
                  <p class="small">${escapeHtml(quote.cliente || "Cliente sin nombre")} · ${escapeHtml(quote.emailContacto || "Sin mail")}</p>
                  <p class="drawer-total">${fmtMoneyCents(quoteTotal(quote))}</p>
                </div>
                <button class="drawer-close" type="button" data-close-quote-drawer aria-label="Cerrar drawer">×</button>

                <div>
                  <p class="small">Cantidad</p>

      function serializeQuoteContacts(quote) {
        return JSON.stringify(
          [...quote.contactos]
            .sort((left, right) => left[2] - right[2])

              tipo: contact[0],

      function exportQuotesXls() {
        const rows = quotes
          .map((quote) => {
            const values = [
              quote.id,
              quoteMonthKey(quote),
              quote.servicio,
              quote.cliente || "",
              quote.contacto || "",
              quote.telefono || "",
              quote.emailContacto || "",
              quote.montoCotizado,
              quote.estado || "Enviada",
              quoteContactCount(quote),
              Number(quote.montoFacturado) || 0,
              quote.fechaEnvio,
              quote.archivoTipo || "",
              quote.archivoUrl || "",
              serializeQuoteContacts(quote)
            ];
            return `<tr>${values.map((value) => `<td>${escapeHtml(value)}</td>`).join("")}</tr>`;
          })
          .join("");
        const html = `
          <html>
            <head><meta charset="utf-8" /></head>

              <table>
