<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LR Suite</title>
    <link rel="icon" type="image/png" href="./assets/lima-retail-logo.png" />
    <!-- Sello de version: permite saber que build esta sirviendo el navegador.
         Comprobar con  window.LR_SUITE_BUILD  en la consola. -->
    <meta name="lr-suite-build" content="2026-10-05-portada-acceso" />
    <script>
      window.LR_SUITE_BUILD = "2026-10-05-portada-acceso";
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.3/dist/umd/supabase.js" integrity="sha384-wUhGjm8yom7j8IkWM5ZzIdOO/62dez3WNulthrcTYBqGaTi9lWhKKCnVtcxT2CEI" crossorigin="anonymous"></script>
    <script src="./lr-suite-config.js"></script>
    <!-- Lector de informes de palabras clave: el mismo archivo que usa el script de Node. -->
    <script src="./src/modules/analisis-palabras-clave/keyword-report.js?v=2026-10-04b"></script>
    <style>
      :root {
        --ink: #0f172a;
        --muted: #475569;
        --subtle: #64748b;
        --soft: #f8fafc;
        --surface-subtle: #f1f5f9;
        --line: #dce3ef;
        --line-soft: #e2e8f0;
        --green: #2563eb;
        --green-700: #1d4ed8;
        --green-soft: #eff6ff;
        --green-line: #bfdbfe;
        --sky: #0ea5e9;
        --sky-soft: #f0f9ff;
        --amber: #d97706;
        --amber-soft: #fffbeb;
        --rose: #e11d48;
        --rose-soft: #fff1f2;
        --white: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      html {
        background: var(--soft);
      }

      body {
        width: 100%;
        max-width: 100%;
        margin: 0;
        overflow-x: hidden;
        background: var(--soft);
        color: var(--ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      button,
      input,
      select {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      .app {
        min-height: 100vh;
      }

      .sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        z-index: 20;
        width: 288px;
        border-right: 1px solid var(--line);
        background: var(--white);
        padding: 24px 22px 20px;
        display: flex;
        flex-direction: column;
        gap: 24px;
        overflow-y: auto;
        transition:
          width 0.2s ease,
          padding 0.2s ease,
          transform 0.2s ease,
          box-shadow 0.2s ease;
      }

      /* Sidebar minimizable */
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        max-width: 1480px;
        margin: 0 auto 16px;
      }

      .topbar-left {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }

      .topbar-title {
        overflow: hidden;
        color: var(--ink);
        font-size: 15px;
        font-weight: 600;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .sidebar-toggle {
        display: grid;
        flex: 0 0 auto;
        width: 36px;
        height: 36px;
        padding: 0;
        place-items: center;
        border: 1px solid #dbe5f2;
        border-radius: 9px;
        background: #ffffff;
        color: #52647d;
        transition:
          background 0.15s ease,
          border-color 0.15s ease,
          color 0.15s ease;
      }

      .sidebar-toggle:hover {
        border-color: #bfdbfe;
        background: #f8fbff;
        color: var(--green);
      }

      .sidebar-toggle:focus-visible {
        outline: none;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.25);
      }

      .sidebar-toggle-arrow {
        transform-box: fill-box;
        transform-origin: center;
        transition: transform 0.2s ease;
      }

      .app.sidebar-collapsed .sidebar-toggle-arrow {
        transform: scaleX(-1);
      }

      @media (min-width: 901px) {
        .app.sidebar-collapsed .sidebar {
          width: 88px;
          padding: 24px 12px 20px;
        }

        .app.sidebar-collapsed .content {
          margin-left: 88px;
        }

        .app.sidebar-collapsed .brand {
          justify-content: center;
        }

        .app.sidebar-collapsed .brand-text,
        .app.sidebar-collapsed .sidebar-heading,
        .app.sidebar-collapsed .nav-text,
        .app.sidebar-collapsed .chevron,
        .app.sidebar-collapsed .active-box {
          display: none;
        }

        .app.sidebar-collapsed .nav-button {
          min-height: 56px;
          grid-template-columns: 40px;
          justify-content: center;
          padding: 7px;
        }
      }

      @media (max-width: 900px) {
        .app.sidebar-collapsed .sidebar {
          transform: translateX(-100%);
          box-shadow: none;
        }

        .app.sidebar-collapsed .content {
          margin-left: 0;
        }
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        text-decoration: none;
        color: inherit;
      }

      .logo {
        display: block;
        flex: none;
        width: 48px;
        height: 48px;
        object-fit: contain;
        /* El PNG trae fondo blanco: multiply lo funde con fondos claros. */
        mix-blend-mode: multiply;
      }

      .brand-title {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
      }

      .small {
        margin: 0;
        color: var(--subtle);
        font-size: 12px;
        line-height: 1.5;
      }

      .eyebrow {
        margin: 0 0 4px;
        color: var(--subtle);
        font-size: 13px;
        font-weight: 500;
      }

      .panel-title {
        margin: 0;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 0;
      }

      .nav {
        display: grid;
        gap: 9px;
      }

      .nav-button {
        width: 100%;
        min-height: 66px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--white);
        color: var(--ink);
        display: grid;
        grid-template-columns: 40px minmax(0, 1fr) 14px;
        gap: 12px;
        align-items: center;
        padding: 10px;
        text-align: left;
        transition:
          background 0.18s ease,
          border-color 0.18s ease,
          box-shadow 0.18s ease;
      }

      .nav-button:hover,
      .nav-button.active {
        border-color: var(--green-line);
        background: var(--green-soft);
        box-shadow: 0 6px 16px rgba(16, 185, 129, 0.08);
      }

      .nav-icon {
        display: grid;
        width: 40px;
        height: 40px;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--soft);
        color: var(--subtle);
      }

      .nav-button.active .nav-icon {
        border-color: var(--green-line);
        background: #fff;
        color: var(--green);
      }

      .nav-name,
      .nav-desc {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .nav-name {
        color: var(--ink);
        font-size: 14px;
        font-weight: 500;
      }

      .nav-button.active .nav-name {
        color: var(--green-700);
      }

      .nav-desc {
        margin-top: 4px;
        color: var(--subtle);
        font-size: 12px;
      }

      .chevron {
        color: #94a3b8;
        font-size: 22px;
        line-height: 1;
      }

      .active-box {
        margin-top: auto;
        border: 1px solid var(--green-line);
        border-radius: 8px;
        background: var(--green-soft);
        padding: 14px;
      }

      .active-box .label {
        margin: 0 0 8px;
        color: var(--green-700);
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
      }

      .active-box strong {
        display: block;
        margin-bottom: 5px;
        font-size: 14px;
        font-weight: 600;
      }

      .content {
        margin-left: 288px;
        min-height: 100vh;
        padding: 32px 56px;
        transition: margin-left 0.2s ease;
      }

      .module {
        width: 100%;
        min-width: 0;
        max-width: 1480px;
        margin: 0 auto;
        display: grid;
        gap: 22px;
      }

      .task-module {
        width: 100%;
        min-width: 0;
        gap: 8px;
      }

      .task-module .header-card {
        gap: 12px;
        padding: 14px 16px;
      }

      .task-module .tag {
        gap: 5px;
        padding: 3px 8px;
        font-size: 11px;
      }

      .task-module h1 {
        margin-top: 7px;
        font-size: 24px;
      }

      .task-module .lead {
        margin-top: 5px;
        font-size: 12px;
        line-height: 1.35;
      }

      .task-module .header-card > .control {
        min-width: 190px;
        padding: 7px 9px;
        font-size: 12px;
      }

      .task-module .task-overview {
        grid-template-columns: minmax(260px, 0.75fr) minmax(520px, 1.8fr);
        gap: 6px;
      }

      .task-module .presence-grid,
      .task-module .task-overview .metrics {
        gap: 6px;
      }

      .task-module .presence-card {
        padding: 6px 8px;
      }

      .task-module .presence-title {
        gap: 6px;
        font-size: 11px;
      }

      .task-module .presence-detail,
      .task-module .presence-worked {
        font-size: 9px;
      }

      .task-module .task-overview .metric-card {
        gap: 1px 6px;
        padding: 6px 8px;
      }

      .task-module .task-overview .metric-label {
        font-size: 9px;
      }

      .task-module .task-overview .metric-value {
        font-size: 17px;
      }

      .task-module .task-overview .metric-detail {
        font-size: 8px;
      }

      .task-module .live-activity {
        padding: 6px 10px;
        font-size: 11px;
      }

      .task-module .pending-sync-bar {
        gap: 8px;
        margin-top: 0;
        padding: 6px 8px;
        border-radius: 8px;
      }

      .task-module .pending-sync-label,
      .task-module .pending-sync-message {
        font-size: 10px;
      }

      .task-module .task-create-panel {
        padding: 7px 9px;
      }

      .task-module .task-form {
        gap: 6px;
      }

      .task-module .form-field input,
      .task-module .form-field select,
      .task-module .task-form > .btn {
        height: 30px;
        font-size: 11px;
      }

      .task-module .toolbar {
        gap: 10px;
        padding: 10px 12px;
      }

      .task-module .filters {
        gap: 6px;
      }

      .task-module .toolbar .control {
        min-width: 155px;
        gap: 7px;
        padding: 7px 9px;
        font-size: 12px;
      }

      .task-module .toolbar .btn,
      .task-module .pending-sync-bar .btn {
        height: 32px;
        padding: 0 10px;
        font-size: 12px;
      }

      .task-module .task-owner-heading,
      .task-module .category-task-form {
        display: none;
      }

      .task-module .task-owner-group + .task-owner-group {
        border-top: 1px solid var(--line-soft);
      }

      .task-module .task-subtasks {
        margin: -2px 0 4px 44px;
        border-color: #e2e8f0;
        background: #fff;
      }

      .task-module .task-subtasks > summary {
        min-height: 26px;
        padding: 4px 8px;
        font-size: 10px;
      }

      .task-module .task-subtask-body {
        gap: 6px;
        padding: 6px 8px 8px;
      }
      @media (max-width: 1380px) {
        .task-module .task-overview {
          grid-template-columns: 1fr;
        }
      }

      .header-card,
      .compare-card,
      .month-track,
      .metric-card,
      .panel {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--white);
        box-shadow: 0 18px 60px rgba(15, 23, 42, 0.04);
      }

      .header-card {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 18px;
        padding: 22px 20px;
      }

      .tag {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        width: max-content;
        border: 1px solid var(--green-line);
        border-radius: 7px;
        background: var(--green-soft);
        color: var(--green-700);
        padding: 5px 10px;
        font-size: 12px;
        font-weight: 500;
      }

      h1 {
        margin: 12px 0 0;
        color: var(--ink);
        font-size: 30px;
        line-height: 1.1;
        letter-spacing: 0;
        font-weight: 600;
      }

      .lead {
        max-width: 900px;
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.5;
      }

      .control {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        min-width: 240px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--white);
        padding: 11px 12px;
        color: var(--subtle);
      }

      .control input,
      .control select {
        width: 100%;
        border: 0;
        background: transparent;
        color: var(--ink);
        font-weight: 500;
        outline: 0;
      }

      .month-period strong {
        display: block;
        color: var(--ink);
        font-size: 14px;
        font-weight: 600;
        white-space: nowrap;
      }

      .compare-card {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 16px;
        padding: 16px 18px;
      }

      .compare-left {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .compare-icon {
        display: grid;
        width: 42px;
        height: 42px;
        place-items: center;
        border-radius: 8px;
        background: var(--amber-soft);
        color: var(--amber);
      }

      .compare-title {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
      }

      .compare-grid {
        display: grid;
        grid-template-columns: repeat(4, max-content);
        gap: 26px;
        color: var(--subtle);
        font-size: 12px;
      }

      .compare-grid strong {
        display: block;
        margin-top: 3px;
        color: var(--ink);
        font-size: 13px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }

      .compare-grid .up {
        color: var(--green);
      }

      .compare-grid .negative {
        color: var(--rose);
      }

      .month-track {
        display: grid;
        gap: 14px;
        padding: 16px 18px;
      }

      .month-track-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
      }

      .month-track-head strong {
        display: block;
        font-size: 14px;
        font-weight: 600;
      }

      .month-chip {
        display: inline-flex;
        align-items: center;
        width: max-content;
        border: 1px solid var(--green-line);
        border-radius: 999px;
        background: var(--green-soft);
        color: var(--green-700);
        padding: 5px 10px;
        font-size: 12px;
        font-weight: 600;
      }

      .month-tabs {
        display: grid;
        grid-template-columns: repeat(12, minmax(0, 1fr));
        gap: 9px;
      }

      .month-tab {
        min-height: 48px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--white);
        color: var(--ink);
        font-size: 13px;
        font-weight: 600;
        transition:
          background 0.18s ease,
          border-color 0.18s ease,
          color 0.18s ease;
      }

      .month-tab:hover:not(:disabled),
      .month-tab.active {
        border-color: var(--green-line);
        background: var(--green-soft);
        color: var(--green-700);
      }

      .month-tab:disabled {
        cursor: not-allowed;
        color: #94a3b8;
        background: #f8fafc;
      }

      .metrics {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 16px;
      }

      .metric-card {
        min-height: 126px;
        padding: 18px;
        position: relative;
      }

      .metric-head {
        display: flex;
        align-items: start;
        justify-content: space-between;
        gap: 12px;
      }

      .metric-label {
        margin: 0;
        color: var(--subtle);
        font-size: 13px;
        font-weight: 500;
        text-transform: uppercase;
      }

      .trend {
        display: inline-flex;
        align-items: center;
        border-radius: 6px;
        background: var(--green-soft);
        color: var(--green);
        padding: 4px 8px;
        font-size: 12px;
        font-weight: 500;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }

      .trend.bad {
        background: var(--rose-soft);
        color: var(--rose);
      }

      .metric-value {
        margin: 22px 0 0;
        color: var(--ink);
        font-size: 24px;
        font-weight: 600;
        letter-spacing: 0;
        font-variant-numeric: tabular-nums;
      }

      .metric-detail {
        margin: 9px 0 0;
        color: var(--subtle);
        font-size: 12px;
      }

      .split {
        display: grid;
        grid-template-columns: minmax(0, 1.15fr) minmax(420px, 0.85fr);
        gap: 22px;
        align-items: start;
      }

      .panel-head {
        border-bottom: 1px solid var(--line);
        padding: 17px 18px;
      }

      .panel-head strong {
        display: block;
        font-size: 14px;
        font-weight: 600;
      }

      .table-wrap {
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }

      th,
      td {
        border-bottom: 1px solid var(--line-soft);
        padding: 13px 18px;
        vertical-align: middle;
      }

      th {
        background: #f8fafc;
        color: var(--subtle);
        font-size: 12px;
        font-weight: 500;
        text-align: left;
        text-transform: uppercase;
      }

      .right {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }

      .muted {
        color: var(--subtle);
      }

      .section-row td {
        background: #fff;
        color: var(--ink);
        font-weight: 600;
      }

      .section-row .negative {
        color: var(--rose);
      }

      .final-row td {
        background: #172033;
        color: #fff;
        font-weight: 600;
      }

      .chart-panel {
        padding: 18px;
      }

      .chart-head {
        display: flex;
        justify-content: space-between;
        gap: 14px;
        margin-bottom: 12px;
      }

      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        color: var(--subtle);
        font-size: 12px;
      }

      .dot {
        display: inline-block;
        width: 10px;
        height: 10px;
        margin-right: 6px;
        border-radius: 3px;
        vertical-align: -1px;
      }

      /* ── Pérdidas y Ganancias (Google Sheets) ── */
      .financial-sync {
        display: flex;
        align-items: center;
        gap: 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--white);
        padding: 11px 12px;
      }

      .financial-sync-info strong {
        display: block;
        color: var(--ink);
        font-size: 14px;
        font-weight: 600;
        white-space: nowrap;
      }

      .financial-sync .btn {
        flex: none;
      }

      .financial-sync-icon {
        display: inline-flex;
      }

      .financial-sync-icon.spinning {
        animation: financial-spin 0.9s linear infinite;
      }

      @keyframes financial-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .financial-sync-icon.spinning {
          animation: none;
        }
      }

      .financial-notice {
        border: 1px solid #fde68a;
        border-radius: 8px;
        background: var(--amber-soft);
        color: #92400e;
        padding: 12px 16px;
        font-size: 13px;
        line-height: 1.5;
      }

      .financial-notice.error {
        border-color: #fecdd3;
        background: var(--rose-soft);
        color: #9f1239;
      }

      .financial-empty {
        padding: 28px 22px;
        color: var(--muted);
        font-size: 14px;
      }

      .financial-empty p {
        margin: 0;
      }

      .financial-line-detail {
        display: block;
        margin-top: 3px;
        color: #94a3b8;
        font-size: 12px;
      }

      .financial-notes {
        display: grid;
        gap: 6px;
        border-top: 1px solid var(--line);
        padding: 14px 18px;
      }

      .final-row td.muted {
        color: #cbd5e1;
      }

      .financial-platforms {
        display: grid;
        gap: 6px;
        margin-top: 12px;
        border-top: 1px solid var(--line-soft);
        padding-top: 10px;
      }

      .financial-platform {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        color: var(--subtle);
        font-size: 13px;
      }

      .financial-platform strong {
        color: var(--ink);
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }

      .financial-statement .right {
        white-space: nowrap;
      }

      /* Las tablas ya se desplazan dentro de .table-wrap: sin esto, su ancho fija el minimo del grid y
         en un telefono la pagina entera se ensancha. */
      .financial-module > *,
      .financial-module .split > * {
        min-width: 0;
      }

      .month-tabs.financial-month-tabs {
        grid-template-columns: repeat(13, minmax(0, 1fr));
      }

      @media (max-width: 1040px) {
        .month-tabs.financial-month-tabs {
          grid-template-columns: repeat(7, minmax(0, 1fr));
        }

        .financial-sync {
          justify-content: space-between;
        }
      }

      @media (max-width: 760px) {
        .month-tabs.financial-month-tabs {

      .keywords-change.up {

      /* ── Control de Automatización ── */
      .automation-module > * {
        min-width: 0;
      }

      .automation-toolbar {
        display: grid;
        justify-items: end;
        gap: 8px;
        min-width: 220px;
      }

      .automation-toolbar-status {
        max-width: 340px;
        margin: 0;
        color: var(--ink);
        font-weight: 500;
        text-align: right;
      }

      .automation-threshold {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--subtle);
        white-space: nowrap;
      }

      .automation-threshold select {
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--white);
        color: var(--ink);
        padding: 5px 8px;
        font: inherit;
      }

      .automation-panel-head p {
        margin: 4px 0 0;
      }

      .automation-panel-head-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      /* Proceso: etapas conectadas por flechas, de izquierda a derecha como en el gráfico. */
      .automation-flow {
        display: flex;
        align-items: stretch;
        gap: 6px;
        padding: 16px 18px 18px;
      }

      .automation-stage {
        display: grid;
        flex: 1 1 0;
        grid-template-columns: minmax(0, 1fr);
        align-content: start;
        gap: 10px;
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--soft);
        padding: 12px;
      }

      /* El asistente de la Agenda corre solo, fuera del camino de los datos de las marcas: va debajo
         del proceso, separado por una línea y sin flecha que lo cuelgue del dashboard. */
      .automation-flow.aparte {
        border-top: 1px solid var(--line);
        margin: 0 18px;
        padding: 14px 0 18px;
      }

      /* Una sola etapa ocupa todo el ancho: sus piezas se reparten en columnas, no apiladas. */
      .automation-flow.aparte .automation-nodes {
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      }

      .automation-stage-head {
        display: flex;
        align-items: flex-start;
        gap: 8px;
      }

      .automation-stage-head strong {
        display: block;
        color: var(--ink);
        font-size: 13px;
        font-weight: 600;
        line-height: 1.3;
      }

      .automation-step {
        display: inline-grid;
        flex: none;
        place-items: center;
        width: 22px;
        height: 22px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--white);
        color: var(--muted);
        font-size: 12px;
        font-weight: 600;
      }

      .automation-arrow {
        flex: none;
        align-self: center;
        color: #94a3b8;
        font-size: 18px;
        line-height: 1;
      }

      .automation-arrow::before {
        content: "→";
      }

      .automation-nodes {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 8px;
      }

      .automation-stage > .automation-light {
        white-space: normal;
      }

      .automation-node {
        display: grid;
        gap: 4px;
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--white);
        padding: 9px 10px;
        color: var(--ink);
        font: inherit;
        text-align: left;
        cursor: pointer;
        transition:
          border-color 0.15s ease,
          box-shadow 0.15s ease;
      }

      .automation-node:hover {
        border-color: var(--green-line);
      }

      .automation-node:focus-visible {
        outline: 2px solid var(--green);
        outline-offset: 2px;
      }

      .automation-node.selected {
        border-color: var(--green);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
      }

      .automation-node.pending {
        border-style: dashed;
        background: transparent;
      }

      .automation-node-name {
        font-size: 13px;
        font-weight: 600;
        line-height: 1.3;
      }

      .automation-node .automation-light {
        font-size: 12px;
        white-space: normal;
      }

      .automation-manual-box {
        display: grid;
        gap: 3px;
        border: 1px dashed var(--green-line);
        border-radius: 8px;
        background: var(--green-soft);
        padding: 9px 10px;
      }

      .automation-manual-box strong {
        color: var(--ink);
        font-size: 13px;
        font-weight: 600;
      }

      .automation-manual-box .automation-sub {
        margin-top: 0;
      }

      .automation-table {
        font-size: 13px;
      }

      .automation-table th,
      .automation-table td {
        padding: 11px 12px;
      }

      .automation-table th {
        white-space: nowrap;
      }

      .automation-table td strong {
        color: var(--ink);
        font-weight: 600;
      }

      .automation-sub {
        display: block;
        margin-top: 3px;
        color: var(--subtle);
        font-size: 12px;
      }

      .automation-light {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-weight: 600;
        white-space: nowrap;
      }

      .automation-light::before {
        content: "";
        flex: none;
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: #94a3b8;
      }

      .automation-light.verde {
        color: #15803d;
      }

      .automation-light.verde::before {
        background: #16a34a;
      }

      .automation-light.ambar {
        color: #b45309;
      }

      .automation-light.ambar::before {
        background: var(--amber);
      }

      .automation-light.rojo,
      .automation-light.error {
        color: #be123c;
      }

      .automation-light.rojo::before,
      .automation-light.error::before {
        background: var(--rose);
      }

      .automation-light.sin-datos,
      .automation-light.cargando,
      .automation-light.pausado,
      .automation-light.pendiente {
        color: var(--subtle);
      }

      .automation-light.pendiente::before {
        border: 1.5px dashed #94a3b8;
        background: transparent;
      }

      .badge.automation-ok {
        border-color: #bbf7d0;
        background: #f0fdf4;
        color: #166534;
      }

      .automation-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
      }

      .automation-actions .btn {
        height: 32px;
        padding: 0 10px;
        font-size: 13px;
        white-space: nowrap;
      }

      .automation-detail-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        border-bottom: 1px solid var(--line);
        padding: 16px 18px;
      }

      .automation-detail-head strong {
        display: block;
        margin-top: 2px;
        color: var(--ink);
        font-size: 16px;
        font-weight: 600;
      }

      .automation-detail-head p {
        max-width: 760px;
        margin: 6px 0 0;
      }

      .automation-detail {
        display: grid;
        grid-template-columns: minmax(0, 1.5fr) minmax(260px, 1fr);
        gap: 18px;
        padding: 16px 18px 18px;
      }

      .automation-detail > div {
        min-width: 0;
      }

      .automation-detail-title {
        margin: 0 0 8px;
        color: var(--subtle);
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
      }

      .automation-runs-wrap {
        overflow-x: auto;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--white);
      }

      .automation-runs {
        font-size: 12px;
      }

      .automation-runs th,
      .automation-runs td {
        padding: 8px 10px;
      }

      .automation-runs td {
        white-space: nowrap;
      }

      .automation-runs td.automation-message,
      .automation-table td.automation-message {
        min-width: 220px;
        max-width: 420px;
        color: var(--muted);
        white-space: normal;
        overflow-wrap: anywhere;
      }

      .automation-runs tr:last-child td {
        border-bottom: 0;
      }

      .automation-list {
        display: grid;
        gap: 6px;
        margin: 0 0 16px;
        padding-left: 18px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
        overflow-wrap: anywhere;
      }

      .automation-list:last-child {
        margin-bottom: 0;
      }

      .automation-link {
        color: var(--green-700);
        font-weight: 500;
        text-decoration: none;
      }

      .automation-link:hover {
        text-decoration: underline;
      }

      button.automation-link {
        justify-self: start;
        border: 0;
        background: none;
        padding: 0;
        font: inherit;
        font-size: 12px;
        cursor: pointer;
      }

      .automation-notes {
        display: grid;
        gap: 8px;
        padding: 16px 18px;
      }

      .automation-notes strong {
        font-size: 13px;
      }

      .automation-notes ul {
        display: grid;
        gap: 6px;
        margin: 0;
        padding-left: 18px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
      }

      /* Sin espacio para cinco columnas: las etapas se apilan y el proceso se lee de arriba hacia abajo. */
      @media (max-width: 1380px) {
        .automation-flow {
          flex-direction: column;
        }

        .automation-arrow::before {
          content: "↓";
        }

        .automation-nodes {
          grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));

      @media (max-width: 1040px) {
        .automation-toolbar {

        .automation-toolbar-status {
          max-width: none;
          text-align: left;
        }

      .quote-kpi-inputs label { color: #657183; font-size: 10px; font-weight: 800; text-transform: uppercase; }
      .quote-kpi-inputs input { width: 100%; margin-top: 4px; padding: 7px 8px; border: 1px solid #d9dee7; border-radius: 8px; font: inherit; }

      .quotes-module { gap: 14px; }
      .quotes-module .header-card { padding: 18px 20px; }
      .quotes-module .header-card h1 { margin-top: 8px; font-size: 27px; }
      .quotes-module .header-card .lead { margin-top: 5px; font-size: 13px; }
      .quotes-module .quote-closure-chart { gap: 9px; margin-bottom: 0; padding: 14px 18px; }
      .quotes-module .quote-closure-head strong { font-size: 19px; }
      .quotes-module .month-track { padding: 13px 16px; }
      .quotes-module .month-track-head { margin-bottom: 10px; }
      .quotes-module .month-tabs { gap: 7px; }
      .quotes-module .month-tab { min-height: 32px; padding: 6px 9px; font-size: 11px; }
      .quotes-module .quote-kpis { grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 9px; }
      .quotes-module .metric-card { min-height: 112px; padding: 13px 14px; border-radius: 12px; }
      .quotes-module .metric-label { font-size: 10px; }
      .quotes-module .metric-value { margin-top: 8px; font-size: 20px; }
      .quotes-module .metric-detail { margin-top: 3px; font-size: 10px; }
      .quotes-module .quote-kpi-inputs { gap: 5px; margin-top: 6px; }
      .quotes-module .quote-kpi-inputs input { padding: 4px 6px; font-size: 11px; }

      @media (max-width: 1240px) {
        .quotes-module .quote-kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      }

      .quote-link {
        display: inline-grid;
        width: 36px;
        height: 36px;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        color: var(--green-700);
        font-size: 17px;
        text-decoration: none;
      }

      .quote-link:hover,
      .quote-link:focus {
        border-color: var(--green-line);
        background: var(--green-soft);
        outline: 0;
      }

      .drawer-backdrop {
        position: fixed;
        inset: 0;
        z-index: 80;
        border: 0;
        background: rgba(15, 23, 42, 0.36);
      }

      .quote-drawer {
        position: fixed;
        z-index: 81;
        inset: 0 0 0 auto;
        display: flex;
        width: min(460px, 100vw);
        flex-direction: column;
        border-left: 1px solid var(--line);
        background: #fff;
        box-shadow: -24px 0 60px rgba(15, 23, 42, 0.16);
      }

      .drawer-header {
        border-bottom: 1px solid var(--line);
        padding: 22px;
      }

      .drawer-title-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 40px;
        gap: 14px;
        align-items: start;
      }

      .drawer-title-row h2 {
        margin: 8px 0 0;
        font-size: 19px;
        line-height: 1.25;
      }

      .drawer-total {
        margin: 8px 0 0;
        color: var(--green-700);
        font-size: 15px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }

      .drawer-close {
        display: grid;
        width: 40px;
        height: 40px;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        color: var(--subtle);
        font-size: 22px;
      }

      .drawer-close:hover,
      .drawer-close:focus {
        border-color: var(--green-line);
        background: var(--green-soft);
        color: var(--green-700);
        outline: 0;
      }

      .drawer-summary {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        margin-top: 16px;
      }

      .drawer-summary div {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--soft);
        padding: 10px 12px;
      }

      .drawer-summary strong {
        display: block;
        margin-top: 4px;
        font-size: 13px;
      }

      .drawer-body {
        flex: 1;
        overflow-y: auto;
        padding: 20px 22px;
      }

      .contact-timeline {
        position: relative;
        display: grid;
        gap: 0;
      }

      .contact-item {
        position: relative;
        display: grid;
        grid-template-columns: 38px minmax(0, 1fr);
        gap: 12px;
        padding-bottom: 18px;
      }

      .contact-item:not(:last-child)::before {
        content: "";
        position: absolute;
        left: 18px;
        top: 38px;
        bottom: 0;
        width: 1px;
        background: var(--line-soft);
      }

      .contact-icon {
        position: relative;
        z-index: 1;
        display: grid;
        width: 38px;
        height: 38px;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #fff;
        font-size: 17px;
      }

      .contact-card {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        padding: 13px 14px;
        box-shadow: 0 10px 32px rgba(15, 23, 42, 0.05);
      }

      .contact-card-head {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 8px;
        align-items: center;
      }

      .contact-note {
        margin: 11px 0 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.55;
      }

      .tasks {
        display: block;
        position: relative;
      }

      .critical-route-panel {
        border-top: 1px solid var(--line-soft);
        background: #f8fbff;
        padding: 12px 18px;
      }

      .critical-route-panel[hidden] {
        display: none;
      }

      .critical-route-head {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 10px;
        align-items: center;
        margin-bottom: 10px;
      }

      .critical-route-head strong {
        color: var(--ink);
        font-size: 13px;
      }

      .critical-route-list {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 8px;
      }

      .critical-route-card {
        border: 1px solid var(--line);
        border-left: 4px solid var(--green);
        border-radius: 8px;
        background: #fff;
        padding: 9px 10px;
      }

      .critical-route-card strong {
        display: block;
        margin-bottom: 6px;
        color: var(--ink);
        font-size: 12px;
      }

      .critical-route-title {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: center;
      }

      .critical-route-color-control {
        display: inline-flex;
        flex: 0 0 auto;
        align-items: center;
        gap: 6px;
        color: var(--muted);
        font-size: 10px;
        font-weight: 800;
      }

      .critical-route-color-control input {
        width: 28px;
        height: 22px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
        padding: 2px;
      }

      .critical-route-palette {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 8px 0 7px;
      }

      .critical-route-swatch {
        width: 22px;
        height: 22px;
        border: 2px solid #fff;
        border-radius: 999px;
        background: var(--swatch-color);
        box-shadow: 0 0 0 1px rgba(100, 116, 139, 0.28);
        padding: 0;
      }

      .critical-route-swatch.active,
      .critical-route-swatch:focus-visible {
        box-shadow: 0 0 0 2px var(--ink);
        outline: 0;
      }

      .critical-route-swatch:hover {
        transform: translateY(-1px);
      }

      .critical-route-card ol {
        margin: 0;
        padding-left: 18px;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.45;
      }

      .critical-route-card li + li {
        margin-top: 4px;
      }

      .critical-route-date {
        color: var(--green);
        font-weight: 800;
        white-space: nowrap;
      }

      .task.critical-route-task {
        background: linear-gradient(90deg, rgba(37, 99, 235, 0.07), rgba(248, 250, 252, 0));
        box-shadow: inset 3px 0 0 var(--critical-route-color, var(--green));
      }


      .critical-step-badge {
        display: inline-grid;
        width: 14px;
        height: 14px;
        min-width: 16px;
        border: 2px solid rgba(255, 255, 255, 0.95);
        border-radius: 999px;
        background: var(--critical-route-color, var(--green));
        box-shadow: 0 0 0 1px color-mix(in srgb, var(--critical-route-color, var(--green)) 35%, white);
        cursor: pointer;
        padding: 0;
      }

      .critical-step-badge:hover,
      .critical-step-badge:focus-visible {
        box-shadow: 0 0 0 2px var(--ink);
        outline: 0;
      }

      .critical-route-picker {
        position: fixed;
        z-index: 9999;
        display: none;
        grid-template-columns: repeat(5, 14px);
        gap: 4px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: #fff;
        padding: 6px;
        box-shadow: 0 12px 26px rgba(15, 23, 42, 0.16);
      }

      .critical-route-picker.open {
        display: grid;
      }

      .critical-route-picker .critical-route-swatch {
        width: 14px;
        height: 14px;
      }

      .critical-route-arrows,
      .critical-route-arrow,
      .critical-route-arrow-marker {
        display: none;
      }

      .task-owner-group {
        display: block;
      }

      .task-owner-heading {
        display: flex;
        flex-wrap: wrap;
        margin: 0;
        border-bottom: 1px solid var(--line-soft);
        background: #f8fafc;
        padding: 12px 18px;
        color: #000;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        gap: 8px;
        align-items: center;
      }

      .task-owner-heading .route-heading-meta {
        color: #000;
        font-size: inherit;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .task-owner-heading::before {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: var(--category-color, var(--blue));
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--category-color, var(--blue)) 16%, transparent);
        content: "";
        flex: 0 0 auto;
      }

      .route-heading-title,
      .route-heading-meta {
        max-width: 100%;
        min-width: 160px;
        line-height: 1.2;
        text-transform: uppercase;
      }

      .category-task-form {
        display: grid;
        grid-template-columns:
          minmax(240px, 2fr)
          minmax(130px, 0.8fr)
          minmax(136px, 0.8fr)
          minmax(136px, 0.8fr)
          minmax(100px, 0.6fr)
          auto;
        gap: 7px;
        align-items: end;
        border-bottom: 1px solid var(--line-soft);
        background: #fff;
        padding: 10px 18px;
      }

      .category-task-form .form-field span {
        font-size: 9px;
      }

      .category-task-form .form-field input,
      .category-task-form .form-field select,
      .category-task-form > .btn {
        height: 30px;
        font-size: 11px;
      }

      .form-field-error {
        display: block;
        margin-top: 5px;
        color: #b91c1c;
        font-size: 12px;
        font-weight: 700;
      }

      .field-invalid {
        border-color: #dc2626 !important;
        box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12) !important;
      }

      .category-create-panel .task-form {
        grid-template-columns:
          minmax(260px, 2fr)
          minmax(150px, 1fr)
          minmax(160px, 0.9fr)
          minmax(160px, 0.9fr)
          minmax(110px, 0.7fr)
          auto;
      }

      .task {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        gap: 8px;
        border-bottom: 1px solid var(--line-soft);
        background: #f8fafc;
        padding: 0 18px 8px;
        min-height: 50px;
        position: relative;
        transition:
          background 0.18s ease,
          opacity 0.18s ease,
          box-shadow 0.18s ease;
      }

      .task.locked-by-other {
        overflow: hidden;
      }

      .task.locked-by-other > :not(.task-lock-overlay) {
        pointer-events: none;
      }

      .task.locked-by-other .task-subtasks,
      .task.locked-by-other .task-subtasks > summary,
      .task.locked-by-other .task-subtask-form,
      .task.locked-by-other .task-subtask-form input,
      .task.locked-by-other .task-subtask-form select,
      .task.locked-by-other .task-subtask-form .btn {
        pointer-events: auto;
      }

      .task.locked-by-other .task-subtasks {
        position: relative;
        z-index: 8;
        opacity: 1;
      }

      .task.locked-by-other .task-main,
      .task.locked-by-other .task-actions,
      .task.locked-by-other .timer-box,
      .task.locked-by-other .btn {
        pointer-events: auto;
      }

      .task.locked-by-other .task-order-controls,
      .task.locked-by-other .task-main,
      .task.locked-by-other .task-actions {
        opacity: 0.62;
      }

      .task.locked-by-other .task-actions {
        opacity: 1;
      }

      .task-lock-overlay {
        position: absolute;
        inset: 0;
        z-index: 5;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto auto;
        gap: 10px;
        align-items: center;
        border: 1px solid rgba(100, 116, 139, 0.24);
        background: linear-gradient(90deg, rgba(241, 245, 249, 0.28), rgba(241, 245, 249, 0.72));
        padding: 14px 18px;
        backdrop-filter: blur(1px);
        pointer-events: none;
      }

      .task-lock-message {
        justify-self: end;
        width: min(320px, 28vw);
        min-width: 220px;
        border: 1px solid rgba(148, 163, 184, 0.3);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.82);
        padding: 8px 10px;
        box-shadow: 0 6px 16px rgba(15, 23, 42, 0.08);
        pointer-events: auto;
      }

      .task-lock-title {
        color: var(--ink);
        font-size: 13px;
        font-weight: 800;
      }

      .task-lock-detail {
        margin-top: 2px;
        color: var(--muted);
        font-size: 11px;
      }

      .task-lock-timer {
        display: inline-grid;
        grid-template-columns: auto auto;
        align-items: stretch;
        overflow: hidden;
        border: 1px solid var(--rose);
        border-radius: 8px;
        background: #fff;
        pointer-events: auto;
      }

      .task-lock-timer strong {
        display: grid;
        min-width: 86px;
        place-items: center;
        background: var(--rose);
        color: #fff;
        font-variant-numeric: tabular-nums;
        padding: 10px 14px;
      }

      .task-lock-timer span {
        display: grid;
        min-width: 130px;
        place-items: center;
        color: #be123c;
        font-size: 13px;
        font-weight: 800;
        padding: 10px 14px;
      }

      .task.dragging {
        opacity: 0.5;
        background: var(--surface-subtle);
      }

      .task.remote-editing {
        background: #f8fbff;
        box-shadow: inset 3px 0 0 var(--green);
      }

      .task.drop-before,
      .task.drop-after {
        box-shadow: inset 0 0 0 2px var(--green-line);
        background: var(--green-soft);
      }

      .task.drop-before::before,
      .task.drop-after::after {
        content: "";
        position: absolute;
        left: 18px;
        right: 18px;
        height: 3px;
        border-radius: 999px;
        background: var(--green);
      }

      .task.drop-before::before {
        top: 0;
      }

      .task.drop-after::after {
        bottom: 0;
      }

      .task-order-controls {
        display: inline-grid;
        grid-template-columns: 24px 28px;
        grid-template-rows: repeat(2, 12px);
        column-gap: 4px;
        row-gap: 0;
        flex: 0 0 56px;
        width: 56px;
        margin-top: 13px;
        justify-items: center;
        align-items: center;
        position: relative;
        z-index: 10;
        pointer-events: auto;
      }

      .task-order-controls .critical-step-badge {
        grid-row: 1 / span 2;
        grid-column: 1;
        width: 20px;
        height: 20px;
        min-width: 20px;
        touch-action: none;
        user-select: none;
      }

      .task-order-button {
        display: grid;
        grid-column: 2;
        width: 28px;
        height: 12px;
        place-items: center;
        border: 0;
        border-radius: 4px;
        background: transparent;
        color: #94a3b8;
        line-height: 1;
        padding: 0;
        position: relative;
        z-index: 11;
        pointer-events: auto;
        touch-action: manipulation;
      }

      /* Las dos flechas se juntan hacia el centro para quedar a la altura del punto de color. */
      .task-order-button::before {
        content: "";
        width: 7px;
        height: 7px;
        align-self: end;
        border-top: 2px solid currentColor;
        border-left: 2px solid currentColor;
        transform: rotate(45deg);
      }

      .task-order-button[data-task-move-direction="down"]::before {
        align-self: start;
        transform: rotate(225deg);
      }

      .task-order-button:hover,
      .task-order-button:focus-visible {
        background: rgba(15, 118, 110, 0.08);
        color: var(--green);
        outline: 0;
      }

      .task-order-button:disabled {
        cursor: not-allowed;
        opacity: 0.25;
      }

      .task h2 {
        flex: 0 0 100%;
        width: 100%;
        max-width: 100%;
        min-width: 0;
        white-space: normal;
        overflow-wrap: anywhere;
        /* Centra el título con el punto de color; el margen negativo descuenta el gap
           de .task-main para que la fila de fechas no se mueva. */
        margin: 12px 0 -8px;
        padding: 4px 0 2px;
        color: #000;
        font-size: 13px;
        font-weight: 600;
        line-height: 1.3;
        text-transform: uppercase;
        overflow: visible;
        text-overflow: clip;
      }

      .task.timer-owned {
        background: linear-gradient(90deg, rgba(225, 29, 72, 0.05), rgba(255, 255, 255, 0));
        box-shadow: inset 3px 0 0 var(--rose);
      }

      .task.timer-owned h2 {
        color: #000;
      }

      .task-meta-top {
        display: flex;
        min-width: 0;
        flex-wrap: wrap;
        gap: 4px;
        align-items: center;
        flex-shrink: 0;
        font-size: 11px;
      }

      .task-meta-top .badge {
        padding: 3px 7px;
        font-size: 11px;
      }

      /* Responsable del pendiente: desplegable con los usuarios de la Suite */
      .task-owner-pick {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        color: var(--subtle);
        font-size: 11px;
        font-weight: 700;
      }

      .task-owner-pick select {
        max-width: 160px;
        height: 24px;
        border: 1px dashed transparent;
        border-radius: 6px;
        background: transparent;
        padding: 0 4px;
        color: var(--muted);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }

      .task-owner-pick select:hover:not(:disabled),
      .task-owner-pick select:focus-visible {
        border-color: var(--green-line);
        background: var(--surface-subtle);
        outline: 0;
      }

      .task-owner-pick select:disabled {
        cursor: default;
        appearance: none;
      }

      .task-live-slot:empty {
        display: none;
      }

      .task-live-edit {
        display: inline-flex;
        width: max-content;
        max-width: 100%;
        align-items: center;
        border: 1px solid var(--green-line);
        border-radius: 999px;
        background: var(--green-soft);
        color: var(--green-700);
        padding: 4px 8px;
        font-size: 11px;
        font-weight: 700;
        line-height: 1.2;
      }

      .task-main {
        display: flex;
        width: 100%;
        max-width: 100%;
        flex-wrap: wrap;
        align-items: center;
        flex: 1;
        min-height: 50px;
        min-width: 0;
        gap: 8px;
        overflow: visible;
        position: relative;
        z-index: 2;
      }

      .task-subtasks {
        flex: 1 0 calc(100% - 56px);
        min-width: 0;
        margin: -4px 0 0 56px;
        border: 1px solid #dbe7fb;
        border-radius: 8px;
        background: rgba(248, 250, 252, 0.82);
        overflow: hidden;
      }

      .task-subtasks > summary {
        display: flex;
        min-height: 30px;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        cursor: pointer;
        list-style: none;
        padding: 6px 10px;
        color: var(--subtle);
        font-size: 11px;
        font-weight: 800;
        text-transform: uppercase;
      }

      .task-subtasks > summary::-webkit-details-marker {
        display: none;
      }

      .task-subtasks > summary::after {
        content: "+";
        display: grid;
        width: 20px;
        height: 20px;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #fff;
        color: var(--green);
        font-size: 14px;
        line-height: 1;
      }

      .task-subtasks[open] > summary::after {
        content: "-";
      }

      .task-subtask-body {
        display: grid;
        gap: 8px;
        border-top: 1px solid var(--line-soft);
        padding: 8px 10px 10px;
      }

      .task-subtask-form {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }

      .task-subtask-form input[name="title"] {
        flex: 1 1 170px;
        min-width: 0;
      }

      .task-subtask-form select {
        flex: 0 1 140px;
        min-width: 0;
      }

      .task-subtask-form .btn {
        flex: 0 0 auto;
        margin-left: auto;
      }

      .task-subtask-date {
        display: inline-flex;
        flex: 0 0 auto;
        align-items: center;
        gap: 4px;
        padding: 0;
        color: var(--subtle);
        font-size: 10px;
        font-weight: 800;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .task-subtask-date.is-empty {
        color: #94a3b8;
      }

      /* Las fechas de la tarea interna quedan plegadas a la derecha, detras del
         calendario de su fila. El icono se enciende cuando ya tiene fechas. */
      .task-subtask-dates {
        display: inline-flex;
        flex: 0 0 auto;
        align-items: center;
        gap: 6px;
        margin-left: auto;
      }

      .task-subtask-date-fields {
        display: none;
        align-items: center;
        gap: 6px;
      }

      .task-subtask-dates.open .task-subtask-date-fields {
        display: inline-flex;
      }

      .task-subtask-date-toggle {
        display: grid;
        width: 26px;
        height: 26px;
        flex: 0 0 auto;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #ffffff;
        color: #94a3b8;
        transition:
          background 0.15s ease,
          border-color 0.15s ease,
          color 0.15s ease;
      }

      .task-subtask-date-toggle .svg-icon {
        width: 14px;
        height: 14px;
      }

      .task-subtask-date-toggle:hover {
        border-color: var(--green-line);
        color: var(--green);
      }

      .task-subtask-date-toggle:focus-visible {
        outline: none;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.25);
      }

      .task-subtask-dates.has-dates .task-subtask-date-toggle,
      .task-subtask-dates.open .task-subtask-date-toggle {
        border-color: var(--green-line);
        background: var(--green-soft);
        color: var(--green-700);
      }

      .task-subtask-item.done .task-subtask-dates.has-dates .task-subtask-date-toggle {
        background: #ffffff;
      }

      .task-subtask-date input {
        height: 26px;
        min-width: 116px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
        color: var(--ink);
        padding: 0 5px;
        font-size: 11px;
        font-weight: 600;
        text-transform: none;
        outline: 0;
      }

      .task-subtask-date input:focus {
        border-color: var(--green);
      }

      .task-subtask-form input,
      .task-subtask-form select {
        height: 30px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: #fff;
        color: var(--ink);
        padding: 0 9px;
        font-size: 11px;
        font-weight: 600;
        outline: 0;
      }

      .task-subtask-form .btn {
        height: 30px;
        padding: 0 10px;
        font-size: 11px;
      }

      .task-subtask-form .task-subtask-date input {
        height: 30px;
        min-width: 116px;
        padding: 0 6px;
      }

      .task-subtask-list {
        display: grid;
        gap: 5px;
      }

      .task-subtask-item {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        border: 1px solid var(--line-soft);
        border-radius: 7px;
        background: #fff;
        padding: 5px 6px;
      }

      .task-subtask-item .task-subtask-check {
        flex: 0 0 auto;
      }

      .task-subtask-order {
        display: grid;
        flex: 0 0 auto;
        gap: 1px;
      }

      .task-subtask-order-button {
        display: grid;
        width: 20px;
        height: 13px;
        place-items: center;
        border: 0;
        border-radius: 3px;
        background: transparent;
        color: #94a3b8;
        line-height: 1;
        padding: 0;
        touch-action: manipulation;
      }

      .task-subtask-order-button::before {
        content: "";
        width: 6px;
        height: 6px;
        border-top: 2px solid currentColor;
        border-left: 2px solid currentColor;
        transform: rotate(45deg);
      }

      .task-subtask-order-button[data-subtask-move-direction="down"]::before {
        transform: rotate(225deg);
      }

      .task-subtask-order-button:hover,
      .task-subtask-order-button:focus-visible {
        background: rgba(15, 118, 110, 0.08);
        color: var(--green);
        outline: 0;
      }

      .task-subtask-order-button:disabled {
        cursor: not-allowed;
        opacity: 0.25;
      }

      .task-subtask-item .task-subtask-delete,
      .task-subtask-item .task-subtask-done {
        height: 24px;
        flex: 0 0 auto;
        margin-left: auto;
        padding: 0 8px;
        font-size: 10px;
      }

      .task-subtask-item.done {
        background: #f0fdf4;
        color: #166534;
      }

      .task-subtask-check {
        display: grid;
        width: 22px;
        height: 22px;
        place-items: center;
        border: 1px solid #bfdbfe;
        border-radius: 999px;
        background: #eff6ff;
        color: var(--green);
        font-size: 12px;
        font-weight: 900;
      }

      .task-subtask-item.done .task-subtask-check {
        border-color: #86efac;
        background: #22c55e;
        color: #fff;
      }

      .task-subtask-title {
        flex: 1 1 150px;
        min-width: 0;
        color: #000;
        font-size: 12px;
        font-weight: 700;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .task-subtask-item.done .task-subtask-title {
        text-decoration: line-through;
      }

      .task-subtask-title[data-editable-subtask] {
        border: 1px dashed transparent;
        border-radius: 6px;
        margin: -1px -3px;
        padding: 1px 3px;
        cursor: text;
        transition:
          background 0.18s ease,
          border-color 0.18s ease;
      }

      .task-subtask-title[data-editable-subtask]:hover {
        border-color: var(--green-line);
        background: var(--surface-subtle);
      }

      .task-subtask-item .task-subtask-title[contenteditable="true"] {
        overflow: visible;
        white-space: normal;
        text-overflow: clip;
        text-decoration: none;
        border-color: transparent;
        background: #fff;
        box-shadow: 0 0 0 2px var(--green-line);
        outline: 0;
      }

      .task-subtask-owner {
        flex: 0 1 110px;
        min-width: 0;
        color: var(--subtle);
        font-size: 11px;
        font-weight: 700;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .task-subtask-owner[data-subtask-owner-select] {
        border: 1px dashed transparent;
        border-radius: 6px;
        margin: -1px -3px;
        padding: 1px 3px;
        cursor: pointer;
        transition:
          background 0.18s ease,
          border-color 0.18s ease;
      }

      .task-subtask-owner[data-subtask-owner-select]:hover,
      .task-subtask-owner[data-subtask-owner-select]:focus-visible {
        border-color: var(--green-line);
        background: var(--surface-subtle);
        outline: 0;
      }

      .task-subtask-owner-select {
        flex: 0 1 120px;
        height: 22px;
        min-width: 0;
        padding: 0 4px;
        font-size: 11px;
      }

      .task-subtask-delete,
      .task-subtask-done {
        height: 24px;
        padding: 0 8px;
        font-size: 10px;
      }

      .task-subtask-list .task-subtask-done {
        border-color: #86efac;
        background: #dcfce7;
        color: #166534;
        font-weight: 800;
      }

      .task-subtask-list .task-subtask-done:hover {
        background: #bbf7d0;
      }

      .task-subtask-empty {
        color: var(--muted);
        font-size: 11px;
      }

      .task-bottom-row {
        display: flex;
        width: 100%;
        gap: 4px;
        align-items: center;
        justify-content: space-between;
      }

      .task-dates {
        display: flex;
        min-width: 0;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }

      .task-age {
        display: inline-flex;
        flex: 0 0 auto;
        align-items: center;
        gap: 4px;
        color: var(--subtle);
        font-size: 11px;
        white-space: nowrap;
      }

      .task-age strong {
        display: inline-grid;
        min-width: 32px;
        height: 26px;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
        color: var(--ink);
        font-size: 11px;
        font-weight: 800;
      }

      .task-age.overdue {
        padding: 2px 6px;
        border: 1px solid var(--rose);
        border-radius: 8px;
        background: var(--rose);
        color: #fff;
        font-weight: 800;
      }

      .task-age.overdue strong {
        border-color: rgba(255, 255, 255, 0.35);
        background: rgba(255, 255, 255, 0.14);
        color: #fff;
      }

      .task-meta .badge {
        padding: 4px 7px;
        font-size: 11px;
      }

      .task-meta > .muted {
        font-size: 12px;
      }

      .editable-field {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        border-radius: 6px;
        border: 1px dashed transparent;
        margin: -2px;
        padding: 2px;
        cursor: text;
        transition:
          background 0.18s ease,
          border-color 0.18s ease,
          box-shadow 0.18s ease;
      }

      .editable-field:hover {
        border-color: var(--green-line);
        background: var(--surface-subtle);
      }

      .editable-field::after {
        content: "";
        width: 7px;
        height: 2px;
        flex: 0 0 7px;
        border-radius: 999px;
        background: currentColor;
        color: var(--green);
        opacity: 0.42;
        transform: rotate(45deg);
      }

      .editable-field[contenteditable="true"] {
        background: #fff;
        box-shadow: 0 0 0 2px var(--green-line);
        outline: 0;
      }

      .editable-field[contenteditable="true"]::after {
        content: "";
      }

      .task-date {
        display: inline-flex;
        position: relative;
        flex: 0 0 auto;
        align-items: center;
        gap: 4px;
        color: var(--subtle);
        font-size: 11px;
      }

      .date-field {
        width: 104px;
        height: 26px;
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
        color: var(--ink);
        padding: 0 5px;
        font-size: 11px;
        font-weight: 500;
      }

      .task-actions {
        flex: 0 0 auto;
      }

      /* Anula el padding de la regla genérica .empty (estado vacío de paneles),
         que colisiona con la clase "empty" de las fechas sin valor e inflaba la
         fila, dejando los botones del timer debajo de la fila siguiente. */
      .task-date.empty {
        padding: 0;
      }

      .task-date.empty .date-field {
        color: transparent;
      }

      .task-date.empty::after {
        content: "Sin fecha";
        position: absolute;
        right: 28px;
        left: 42px;
        color: var(--subtle);
        line-height: 30px;
        text-align: center;
        white-space: nowrap;
        pointer-events: none;
      }

      .date-field:focus {
        border-color: var(--green-line);
        outline: 0;
      }

      .task-create-panel {
        padding: 10px 12px;
      }

      .task-form {
        display: grid;
        grid-template-columns:
          minmax(260px, 2fr)
          minmax(150px, 1fr)
          minmax(160px, 0.9fr)
          minmax(160px, 0.9fr)
          minmax(110px, 0.7fr)
          auto;
        gap: 8px;
        align-items: end;
      }

      .task-title-field {
        min-width: 0;
      }

      .form-field {
        display: grid;
        min-width: 0;
        gap: 3px;
        color: var(--subtle);
        font-size: 10px;
        font-weight: 500;
      }

      .form-field span {
        color: var(--subtle);
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
      }

      .form-field input,
      .form-field select {
        width: 100%;
        min-width: 0;
        height: 34px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--white);
        color: var(--ink);
        outline: 0;
        padding: 0 10px;
        font-size: 12px;
        font-weight: 500;
      }

      .task-form > .btn {
        height: 34px;
        padding: 0 14px;
        font-size: 12px;
      }

      .form-field input:focus,
      .form-field select:focus {
        border-color: var(--green);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
      }

      .task-actions {
        display: flex;
        max-width: 100%;
        flex-wrap: wrap;
        flex: 0 0 auto;
        justify-content: flex-end;
        gap: 6px;
        align-items: center;
        min-width: 0;
        position: relative;
        z-index: 3;
      }

      .task-actions > .btn {
        height: 26px;
        border-radius: 6px;
        padding: 0 8px;
        font-size: 11px;
      }

      .timer-box {
        display: inline-grid;
        grid-template-columns: minmax(64px, auto) auto;
        align-items: stretch;
        height: 26px;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
      }

      .timer-box .btn {
        height: 100%;
        border: 0;
        border-left: 1px solid var(--line);
        border-radius: 0;
        padding: 0 8px;
        font-size: 11px;
      }

      .timer-box.active {
        border-color: var(--rose);
      }

      .timer-box.active .timer-value {
        border-color: var(--rose);
        background: var(--rose);
        color: #fff;
      }

      .timer-box.active .btn {
        border-left-color: #fecdd3;
        color: #be123c;
      }

      .timer-value {
        display: grid;
        min-width: 68px;
        place-items: center;
        border-right: 1px solid var(--line);
        color: var(--ink);
        font-size: 11px;
        font-variant-numeric: tabular-nums;
        font-weight: 700;
        padding: 0 8px;
      }

      .timer-value[data-timer-value] {
        cursor: text;
        user-select: none;
      }

      .timer-value[data-timer-editing="true"] {
        min-width: 82px;
        background: #eff6ff;
        box-shadow: inset 0 0 0 2px var(--green);
        outline: 0;
        user-select: text;
      }

      .completed-list {
        display: grid;
      }

      .completed-task {
        display: grid;
        grid-template-columns: minmax(0, 1fr) repeat(4, max-content);
        gap: 14px;
        align-items: center;
        border-bottom: 1px solid var(--line-soft);
        padding: 12px 18px;
      }

      .completed-task:last-child {
        border-bottom: 0;
      }

      .completed-task strong {
        display: block;
        font-size: 14px;
        font-weight: 600;
      }

      .completed-meta {
        color: var(--subtle);
        font-size: 12px;
        white-space: nowrap;
      }

      .completed-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
      }

      .completed-head > div {
        min-width: 0;
      }

      .completed-head .btn {
        flex: 0 0 auto;
        white-space: nowrap;
      }

      .history-actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 10px;
      }

      .history-tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .history-tabs .btn,
      .history-actions > .btn {
        height: 28px;
        padding: 0 10px;
        font-size: 11px;
        border-radius: 6px;
        font-weight: 500;
        letter-spacing: 0.01em;
      }

      .history-tab.active {
        border-color: var(--green);
        background: var(--green-soft);
        color: var(--green-700);
      }

      .presence-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .presence-card {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        padding: 9px 11px;
      }

      .presence-card.online {
        border-color: #bbf7d0;
        background: #f0fdf4;
      }

      .presence-title {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--ink);
        font-size: 12px;
        font-weight: 600;
      }

      .presence-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #cbd5e1;
      }

      .presence-card.online .presence-dot {
        background: #22c55e;
      }

      .presence-detail {
        margin: 2px 0 0;
        color: var(--subtle);
        font-size: 10px;
        line-height: 1.25;
      }

      .presence-worked {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 4px;
        margin-top: 4px;
        color: var(--ink);
        font-size: 11px;
        font-weight: 700;
      }

      .presence-worked span {
        color: var(--subtle);
        font-size: 9px;
        font-weight: 600;
        text-transform: uppercase;
      }

      .task-overview {
        display: grid;
        grid-template-columns: minmax(340px, 0.9fr) minmax(560px, 1.6fr);
        gap: 10px;
        align-items: stretch;
      }

      .task-footer-status {
        display: grid;
        gap: 10px;
      }
      .task-overview .metrics {
        gap: 8px;
      }

      .task-overview .metric-card {
        display: grid;
        min-height: 0;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 2px 8px;
        align-content: center;
        padding: 9px 11px;
      }

      .task-overview .metric-head {
        min-width: 0;
      }

      .task-overview .metric-label {
        overflow: hidden;
        font-size: 10px;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      .task-overview .metric-value {
        grid-column: 2;
        grid-row: 1 / span 2;
        align-self: center;
        margin: 0;
        font-size: 20px;
      }

      .task-overview .metric-detail {
        overflow: hidden;
        margin: 0;
        font-size: 9px;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      .pending-sync-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-top: 10px;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fff;
      }

      .pending-sync-detail {
        display: flex;
        min-width: 0;
        flex-direction: column;
        gap: 2px;
      }

      .pending-sync-label {
        display: inline-flex;
        width: fit-content;
        align-items: center;
        gap: 6px;
        border-radius: 999px;
        padding: 3px 8px;
        background: #f8fafc;
        color: var(--subtle);
        font-size: 11px;
        font-weight: 700;
      }

      .pending-sync-label::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #94a3b8;
      }

      .pending-sync-label.ok {
        background: #f0fdf4;
        color: #15803d;
      }

      .pending-sync-label.ok::before {
        background: #22c55e;
      }

      .pending-sync-label.busy {
        background: #eff6ff;
        color: #1d4ed8;
      }

      .pending-sync-label.busy::before {
        background: #3b82f6;
      }

      .pending-sync-label.warn {
        background: #fff7ed;
        color: #c2410c;
      }

      .pending-sync-label.warn::before {
        background: #f97316;
      }

      .pending-sync-label.danger {
        background: var(--rose-soft);
        color: var(--rose);
      }

      .pending-sync-label.danger::before {
        background: var(--rose);
      }

      .pending-sync-message {
        overflow: hidden;
        margin: 0;
        color: var(--subtle);
        font-size: 11px;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      .pending-sync-top-message {
        margin: 0 14px 8px;
        white-space: normal;
        color: #b45309;
        font-size: 12px;
      }

      .live-activity {
        border: 1px solid var(--green-line);
        border-radius: 8px;
        background: var(--green-soft);
        color: var(--green-700);
        padding: 10px 14px;
        font-size: 13px;
        font-weight: 700;
      }

      .live-activity[hidden] {
        display: none;
      }

      .assignment-notices {
        display: grid;
        gap: 8px;
      }

      .assignment-notices[hidden] {
        display: none;
      }

      .assignment-notice {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 12px;
        align-items: center;
        border: 1px solid var(--green-line);
        border-radius: 8px;
        background: #fff;
        box-shadow: 0 10px 32px rgba(37, 99, 235, 0.08);
        padding: 10px 12px;
      }

      .assignment-notice strong {
        display: block;
        color: var(--ink);
        font-size: 13px;
        font-weight: 700;
      }

      .assignment-notice p {
        margin: 3px 0 0;
        color: var(--subtle);
        font-size: 12px;
      }

      /* Zona de notificaciones: campana en la barra superior con los pendientes
         del responsable y los dias que lleva creado cada uno. */
      .topbar-right {
        display: flex;
        flex: 0 0 auto;
        align-items: center;
        gap: 10px;
      }

      .notif-zone {
        position: relative;
      }

      .notif-toggle {
        display: inline-flex;
        height: 36px;
        align-items: center;
        gap: 8px;
        border: 1px solid #dbe5f2;
        border-radius: 9px;
        background: #ffffff;
        padding: 0 12px;
        color: #52647d;
        font-size: 13px;
        font-weight: 600;
        transition:
          background 0.15s ease,
          border-color 0.15s ease,
          color 0.15s ease;
      }

      .notif-toggle:hover {
        border-color: var(--green-line);
        background: #f8fbff;
        color: var(--green);
      }

      .notif-toggle:focus-visible {
        outline: none;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.25);
      }

      .notif-toggle.open {
        border-color: var(--green-line);
        background: var(--green-soft);
        color: var(--green-700);
      }

      .notif-toggle .svg-icon {
        width: 17px;
        height: 17px;
      }

      .notif-toggle-text {
        display: inline-block;
      }

      .notif-count {
        display: inline-grid;
        min-width: 20px;
        height: 20px;
        place-items: center;
        border-radius: 999px;
        background: var(--green);
        padding: 0 6px;
        color: #ffffff;
        font-size: 11px;
        font-weight: 700;
        line-height: 1;
      }

      .notif-count.late {
        background: var(--green-700);
      }

      .notif-count.warn {
        background: var(--green);
      }

      .notif-count.none {
        background: var(--surface-subtle);
        color: var(--subtle);
      }

      .notif-panel {
        position: absolute;
        top: calc(100% + 8px);
        right: 0;
        z-index: 40;
        display: grid;
        width: min(430px, calc(100vw - 32px));
        gap: 10px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #ffffff;
        box-shadow: 0 18px 44px rgba(15, 23, 42, 0.16);
        padding: 14px;
      }

      .notif-panel[hidden] {
        display: none;
      }

      .notif-head {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 10px;
        align-items: start;
      }

      .notif-head strong {
        display: block;
        color: var(--ink);
        font-size: 14px;
      }

      .notif-head p {
        margin: 3px 0 0;
        color: var(--subtle);
        font-size: 12px;
      }

      .notif-close {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #ffffff;
        padding: 4px 9px;
        color: var(--subtle);
        font-size: 12px;
      }

      .notif-close:hover {
        border-color: var(--green-line);
        background: var(--green-soft);
        color: var(--green-700);
      }

      .notif-scope {
        display: flex;
        gap: 6px;
      }

      .notif-scope button {
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #ffffff;
        padding: 4px 11px;
        color: var(--subtle);
        font-size: 12px;
        font-weight: 600;
      }

      .notif-scope button.active {
        border-color: var(--green-line);
        background: var(--green-soft);
        color: var(--green-700);
      }

      .notif-list {
        display: grid;
        max-height: 330px;
        gap: 8px;
