            <div class="quote-closure-chart">
              <div class="quote-closure-head">
                <div><p class="small">Oportunidad total</p><strong>${fmtMoneyCents(allQuoted)}</strong></div>
                <div><p class="small">Cierre real</p><strong>${fmtMoneyCents(allBilled)}</strong></div>
              </div>
              <div class="quote-closure-track" aria-label="${fmtPercent(closeRate)} de oportunidad cerrada"><div class="quote-closure-fill" style="width:${closeRate * 100}%"></div></div>
              <div class="quote-closure-foot"><span>Pendiente ${fmtMoneyCents(Math.max(0, allQuoted - allBilled))}</span><strong>${fmtPercent(closeRate)} cerrado</strong></div>
            </div>
            ${quoteMonthTrack()}
            <div class="metrics quote-kpis">
              <article class="metric-card"><p class="metric-label">Inversión en Ads</p><p class="metric-value">${fmtMoneyCents(activeInvestment.googleAds + activeInvestment.metaAds)}</p>${state.quoteShowAll ? `<p class="metric-detail">Google ${fmtMoneyCents(activeInvestment.googleAds)} · Meta ${fmtMoneyCents(activeInvestment.metaAds)}</p>` : `<div class="quote-kpi-inputs"><label>Google<input type="number" min="0" value="${activeInvestment.googleAds}" data-quote-investment="googleAds"></label><label>Meta<input type="number" min="0" value="${activeInvestment.metaAds}" data-quote-investment="metaAds"></label></div>`}</article>
              <article class="metric-card"><p class="metric-label">Inversión en Plataformas</p><p class="metric-value">${fmtMoneyCents(activeInvestment.plataformas)}</p>${state.quoteShowAll ? `<p class="metric-detail">Total acumulado</p>` : `<div class="quote-kpi-inputs one"><label>Monto del mes<input type="number" min="0" value="${activeInvestment.plataformas}" data-quote-investment="plataformas"></label></div>`}</article>
              ${metric("Cotizaciones enviadas", fmtNumber(monthQuotes.length), state.quoteShowAll ? "Total acumulado" : activeQuoteMonthLabel())}
              ${metric("Monto cotizado promedio", fmtMoneyCents(monthQuotes.length ? totalQuoted / monthQuotes.length : 0), "Promedio por cotización")}
              ${metric("Monto total cotizado", fmtMoneyCents(totalQuoted), `${monthQuotes.length} propuestas`)}
              ${metric("Oportunidad facturada", fmtMoneyCents(totalBilled), `${fmtPercent(totalQuoted ? totalBilled / totalQuoted : 0)} del monto cotizado`)}
            </div>
            <div class="panel">
              <div class="toolbar">
                <div>
                  <strong>${state.quoteShowAll ? "Lista total de cotizaciones" : "Tabla principal"}</strong>
                  <p class="small">${visible.length} registros visibles</p>

      function taskId(task, index) {
        if (!task[6]) task[6] = `task-${String(index + 1).padStart(3, "0")}`;
        return task[6];
      }

      function taskCreatedAt(task) {
        if (!task[7]) task[7] = new Date().toISOString();
        return task[7];
      }

      function generatedTaskId(prefix = "task") {
        return prefix + "-" + Date.now().toString(36) + "-" + Math.random().toString(16).slice(2, 8);
      }

      function completedTaskKey(task, index) {
        if (!task.completedRecordId) {
          task.completedRecordId = `completed-${task.id || "task"}-${task.completedAt || "sin-fecha"}-${index}`;
        }
        return task.completedRecordId;
      }

      function completedTaskIdentity(task) {
        return (
          task?.completedRecordId ||
          [
            task?.id || "task",
            task?.completedAt || task?.fecha_finalizacion || "sin-fecha",
            task?.action || task?.accion || "completada",
            normalizeText(task?.title || task?.titulo || ""),
            suitePersonKey(task?.owner || task?.responsable || "")
          ].join("|")
        );
      }

      function isCompletedTaskForActiveSuiteUser(task) {
        const ownerKey = suitePersonKey(task?.owner || task?.responsable || "");
        if (!ownerKey) return false;
        return SUITE_SUPERADMIN_KEYS.some((userKey) => {
          return suitePersonKey(userKey) === ownerKey;
        });
      }

      function mergeCompletedTaskHistory(...sources) {
        const merged = new Map();
        sources.forEach((source) => {
          if (!Array.isArray(source)) return;
          source.forEach((task) => {
            if (!task || typeof task !== "object") return;
            if (!isCompletedTaskForActiveSuiteUser(task)) return;
            const identity = completedTaskIdentity(task);
            if (!merged.has(identity)) merged.set(identity, task);
          });
        });
        return [...merged.values()].sort((left, right) => {
          const leftDate = new Date(left.completedAt || left.fecha_finalizacion || 0).getTime() || 0;
          const rightDate = new Date(right.completedAt || right.fecha_finalizacion || 0).getTime() || 0;
          return rightDate - leftDate;
        });
      }

      function recoverLegacyCompletedTasks() {
        const recovered = LEGACY_COMPLETED_STORAGE_KEYS.flatMap((key) => {
          const value = readStoredJson(key, []);
          return Array.isArray(value) ? value : [];
        });
        completedTasks = mergeCompletedTaskHistory(completedTasks, recovered);
        return recovered.length > 0;
      }

      function ensureTaskIds() {
        tasks = tasks.map((task, index) => {
          taskId(task, index);
          taskCreatedAt(task);
          return task;
        });
      }

      function ensureTaskStartDates() {
        let changed = false;
        tasks = tasks.map((task) => {
          if (!Array.isArray(task)) return task;
          if (!taskDateInputValue(task[5])) {
            task[5] = localDayKey(taskCreatedAt(task)) || localDayKey();
            changed = true;
          }
          return task;
        });
        return changed;
      }

      function taskStartDay(task) {
        return taskDateInputValue(task?.[5]) || localDayKey(taskCreatedAt(task)) || localDayKey();
      }

      function daysSinceTaskStart(task) {
        const startKey = taskStartDay(task);
        const start = new Date(`${startKey}T00:00:00`);
        const today = new Date(`${localDayKey()}T00:00:00`);
        if (Number.isNaN(start.getTime()) || Number.isNaN(today.getTime())) return 0;
        return Math.max(0, Math.floor((today - start) / 86400000));
      }

      function taskTombstones() {
        taskTimer.tombstonesById =
          taskTimer.tombstonesById && typeof taskTimer.tombstonesById === "object"
            ? taskTimer.tombstonesById
            : {};
        return taskTimer.tombstonesById;
      }

      function pruneTaskTombstones() {
        const tombstones = taskTombstones();
        const entries = Object.entries(tombstones)
          .filter(([id, tombstone]) => id && tombstone && Number(tombstone.closedAt || 0) > 0)
          .sort((left, right) => Number(right[1].closedAt || 0) - Number(left[1].closedAt || 0));
        const retained = {};
        entries.slice(0, 1000).forEach(([id, tombstone]) => {
          retained[id] = tombstone;
        });
        taskTimer.tombstonesById = retained;
        return retained;
      }

      function mergeTaskTombstones(...sources) {
        const merged = { ...taskTombstones() };
        sources.forEach((source) => {
          if (!source || typeof source !== "object") return;
          Object.entries(source).forEach(([id, tombstone]) => {
            if (!id || !tombstone) return;
            const currentAt = Number(merged[id]?.closedAt || 0);
            const incomingAt = Number(tombstone.closedAt || 0);
            if (!merged[id] || incomingAt >= currentAt) merged[id] = tombstone;
          });
        });
        taskTimer.tombstonesById = merged;
        return merged;
      }

      function mergeArchivedTaskTimer(timer) {
        const incoming = normalizeTaskTimer(timer);
        mergeTaskTombstones(incoming.tombstonesById);
        taskTimer.dailyById = mergedTaskDailyTimerTotals(taskTimer.dailyById, incoming.dailyById);
        taskTimer.dailyByUser = mergedDailyTimerTotals(taskTimer.dailyByUser, incoming.dailyByUser);
        taskTimer.elapsedById = { ...(taskTimer.elapsedById || {}) };
        taskTimer.elapsedEditedAt = { ...(taskTimer.elapsedEditedAt || {}) };
        Object.entries(incoming.elapsedById || {}).forEach(([id, seconds]) => {
          const localEditedAt = Number(taskTimer.elapsedEditedAt[id] || 0);
          const incomingEditedAt = Number(incoming.elapsedEditedAt?.[id] || 0);
          if (incomingEditedAt > localEditedAt) {
            taskTimer.elapsedById[id] = Number(seconds || 0);
            taskTimer.elapsedEditedAt[id] = incomingEditedAt;
          } else if (localEditedAt > 0) {
            // local explicit edit wins
          } else {
            taskTimer.elapsedById[id] = Math.max(Number(taskTimer.elapsedById[id] || 0), Number(seconds || 0));
          }
        });
        taskTimer.durationById = {
          ...(incoming.durationById || {}),
          ...(taskTimer.durationById || {})
        };
        taskTimer.presetById = {
          ...(incoming.presetById || {}),
          ...(taskTimer.presetById || {})
        };
      }

      function pendingSubtaskStamp(subtask) {
        const parsed = Date.parse(subtask?.updatedAt || subtask?.completedAt || subtask?.createdAt || "");
        return Number.isFinite(parsed) ? parsed : 0;
      }

      function mergePendingSubtaskLists(...sources) {
        const merged = new Map();
        const tombstones = taskTombstones();
        sources.forEach((source) => {
          if (!Array.isArray(source)) return;
          source.forEach((subtask, index) => {
            const normalized = normalizePendingSubtask(subtask, {
              owner: subtask?.owner || currentSuiteUserName()
            });
            if (!normalized) return;
            const id = normalized.id || `subtask-${index}`;
            // Una subtarea borrada no debe revivir cuando llega el estado de la BBDD.
            if (tombstones[id]) return;
            const current = merged.get(id);
            if (!current) {
              merged.set(id, normalized);
              return;
            }
            // Gana la version editada mas tarde, no la ultima fuente del merge: sin esto
            // el estado viejo de la BBDD deshacia el tachado recien marcado en pantalla.
            const currentStamp = pendingSubtaskStamp(current);
            const incomingStamp = pendingSubtaskStamp(normalized);
            const sameStamp = incomingStamp === currentStamp;
            const [base, other] = incomingStamp >= currentStamp ? [normalized, current] : [current, normalized];
            const done = normalizeText(base.status) === "completado";
            merged.set(id, {
              ...other,
              ...base,
              title: base.title || other.title,
              owner: base.owner || other.owner,
              status: base.status || other.status,
              createdAt:
                other.createdAt && (!base.createdAt || other.createdAt < base.createdAt)
                  ? other.createdAt
                  : base.createdAt,
              completedAt: done ? base.completedAt || other.completedAt : "",
              completedBy: done ? base.completedBy || other.completedBy : "",
              order: Number.isFinite(base.order) ? base.order : other.order,
              startDate: sameStamp ? base.startDate || other.startDate : base.startDate,
              endDate: sameStamp ? base.endDate || other.endDate : base.endDate,
              updatedAt: base.updatedAt || other.updatedAt
            });
          });
        });
        return [...merged.values()];
      }

      // ── Marca de edicion por pendiente ──────────────────────────────────────
      // Antes la fusion decidia con la version global del tablero (Date.now() del ultimo cambio de cada
      // navegador): si Diego habia tocado cualquier cosa despues, o su reloj iba adelantado, el cambio de
      // Jorge en OTRO pendiente se descartaba y el siguiente guardado de Diego lo borraba de la BBDD.
      // Ahora cada pendiente lleva su propia marca y gana la version editada mas tarde de ese pendiente.
      // La marca es un reloj logico: nunca menor que la ultima marca vista, asi un reloj atrasado no
      // hace perder ediciones hechas despues de ver las del otro.
      let taskFieldSignatures = new Map();
      let lastTaskStamp = 0;

      function taskEditStamp(task) {
        const stamp = Number(task?.[TASK_UPDATED_AT_INDEX]);
        return Number.isFinite(stamp) ? stamp : 0;
      }

      function nextTaskStamp(previousStamp = 0) {
        lastTaskStamp = Math.max(Date.now(), lastTaskStamp + 1, Number(previousStamp || 0) + 1);
        return lastTaskStamp;
      }

      // Marca para editar una tarea interna: siempre posterior a la que ya tenia, aunque el reloj de
      // este equipo vaya atrasado respecto del equipo que la creo o la edito antes.
      function nextSubtaskStamp(subtask) {
        return new Date(nextTaskStamp(pendingSubtaskStamp(subtask))).toISOString();
      }

      // Campos propios del pendiente: se excluyen las subtareas (tienen su propia marca) y la marca.
      function taskFieldSignature(task) {
        const copy = task.slice();
        copy[TASK_SUBTASKS_INDEX] = null;
        copy[TASK_UPDATED_AT_INDEX] = null;
        return JSON.stringify(copy);
      }

      // Toma la lista actual como punto de partida: lo que cambie desde aqui es edicion local.
      function rememberTaskFieldSignatures() {
        taskFieldSignatures = new Map();
        tasks.forEach((task, index) => {
          if (!Array.isArray(task)) return;
          taskFieldSignatures.set(taskId(task, index), taskFieldSignature(task));
          lastTaskStamp = Math.max(lastTaskStamp, taskEditStamp(task));
          const subtasks = Array.isArray(task[TASK_SUBTASKS_INDEX]) ? task[TASK_SUBTASKS_INDEX] : [];
          subtasks.forEach((subtask) => {
            lastTaskStamp = Math.max(lastTaskStamp, pendingSubtaskStamp(subtask));
          });
        });
      }

      function stampLocallyEditedTasks() {
        tasks.forEach((task, index) => {
          if (!Array.isArray(task)) return;
          const id = taskId(task, index);
          if (taskFieldSignatures.get(id) !== taskFieldSignature(task)) {
            task[TASK_UPDATED_AT_INDEX] = nextTaskStamp();
          }
        });
        rememberTaskFieldSignatures();
      }

      function mergePendingTaskRecord(current, incoming) {
        const currentStamp = taskEditStamp(current);
        const incomingStamp = taskEditStamp(incoming);
        const [base, other] = incomingStamp > currentStamp ? [incoming, current] : [current, incoming];
        const merged = [...base];
        // Sin condicion: la lista fusionada ya es la union de ambas fuentes, y si queda
        // vacia es porque las subtareas se borraron, asi que tampoco deben conservarse.
        merged[TASK_SUBTASKS_INDEX] = mergePendingSubtaskLists(current?.[TASK_SUBTASKS_INDEX], incoming?.[TASK_SUBTASKS_INDEX]);
        // Relleno de campos vacios solo entre versiones sin marca o con la misma marca (datos viejos):
        // con marcas distintas, un campo vaciado a proposito (quitar la categoria) no debe volver.
        if (currentStamp === incomingStamp) {
          [TASK_CATEGORY_INDEX, TASK_COLOR_INDEX].forEach((fieldIndex) => {
            if (!merged[fieldIndex] && other?.[fieldIndex]) merged[fieldIndex] = other[fieldIndex];
          });
          // El orden manual es numerico y 0 es valido, asi que no sirve el `!merged[i]`
          // de arriba. Sin esto, al fusionar el estado que llega de la sincronizacion la
          // tarea se quedaba sin orden y el tablero la reordenaba por fecha y prioridad.
          if (!hasManualOrder(merged) && hasManualOrder(other)) {
            merged[TASK_MANUAL_ORDER_INDEX] = other[TASK_MANUAL_ORDER_INDEX];
          }
        }
        return merged;
      }

      function mergePendingTaskLists(...sources) {
        const merged = new Map();
        const tombstones = taskTombstones();
        sources.forEach((source) => {
          if (!Array.isArray(source)) return;
          source.forEach((task, index) => {
            if (!Array.isArray(task)) return;
            const id = taskId(task, index);
            if (tombstones[id]) return;
            if (merged.has(id)) {
              merged.set(id, mergePendingTaskRecord(merged.get(id), task));
              return;
            }
            merged.set(id, task);
          });
        });
        return [...merged.values()];
      }
      function replacePendingTaskListFromShared(source) {
        return mergePendingTaskLists(Array.isArray(source) ? source : []);
      }

      function readStoredJson(key, fallback) {
        try {
          const value = localStorage.getItem(key);
          return value ? JSON.parse(value) : fallback;
        } catch {
          return fallback;
        }
      }

      function isStorageQuotaError(error) {
        return (
          error?.name === "QuotaExceededError" ||
          error?.code === 22 ||
          error?.code === 1014 ||
          /quota/i.test(String(error?.message || ""))
        );
      }

      // Respaldo local sin el historial de completadas: el historial ya vive en la BBDD (y en su tabla
      // append-only) y era lo que hacia pesar cada copia.
      function compactLocalPendingBackup(backup) {
        return backup && typeof backup === "object" ? { ...backup, completedTasks: [] } : backup;
      }

      // El almacenamiento del navegador (unos 5 MB) se llenaba con hasta 40 copias completas del tablero.
      // Sin espacio, Supabase no podia guardar la sesion al entrar: las consultas salian como anonimas
      // ("permission denied for table ...") y la suite sacaba al usuario. Esto deja el respaldo local
      // en su tamaño normal; si aun asi falta espacio, se quedan solo con la copia mas reciente.
      function compactLocalPendingBackups(maxCopies = MAX_LOCAL_PENDING_BACKUPS) {
        try {
          const list = readStoredJson(TASK_BACKUP_STORAGE_KEY, []);
          if (!Array.isArray(list)) {
            localStorage.removeItem(TASK_BACKUP_STORAGE_KEY);
            return;
          }
          const compacted = list.slice(0, maxCopies).map(compactLocalPendingBackup);
          localStorage.setItem(TASK_BACKUP_STORAGE_KEY, JSON.stringify(compacted));
        } catch {
          try {
            localStorage.removeItem(TASK_BACKUP_STORAGE_KEY);
          } catch {
            // Sin acceso al almacenamiento no hay nada que liberar.
          }
        }
      }

      function freeLocalStorageSpace() {
        compactLocalPendingBackups(1);
      }

      function writeStoredValue(key, value) {
        try {
          localStorage.setItem(key, value);
          return true;
        } catch (error) {
          if (isStorageQuotaError(error) && key !== TASK_BACKUP_STORAGE_KEY) {
            freeLocalStorageSpace();
            try {
              localStorage.setItem(key, value);
              return true;
            } catch (retryError) {
              console.warn(`No se pudo guardar ${key} en este navegador.`, retryError);
              return false;
            }
          }
          console.warn(`No se pudo guardar ${key} en este navegador.`, error);
          return false;
        }
      }

      // Almacenamiento de la sesion de Supabase. Si el navegador esta lleno, libera los respaldos locales
      // y reintenta. Si aun asi el navegador no deja guardarla (se vio en el equipo de Jorge Luis: la
      // sesion no quedaba guardada ni un instante despues de entrar y todas las consultas salian como
      // anonimas), la sesion se mantiene en memoria mientras la pestaña este abierta.
      const suiteAuthMemory = new Map();
      let suiteAuthStorageError = "";

      // Segundo canal de guardado. localStorage y las cookies son almacenamientos
      // distintos del navegador: cuando uno no conserva nada (politica de datos de
      // sitio, extensiones, cuota llena), el otro suele seguir funcionando. Antes la
      // alternativa era solo la memoria, que se pierde al refrescar la pagina.
      const SUITE_AUTH_COOKIE_CHUNK = 3000;
      const SUITE_AUTH_COOKIE_MAX_CHUNKS = 10;
      const SUITE_AUTH_COOKIE_MAX_AGE = 60 * 60 * 24 * 30;

      function suiteAuthCookieName(key, part) {
        return `lrs_${String(key).replace(/[^A-Za-z0-9_-]/g, "_")}_${part}`;
      }

      function readRawCookie(name) {
        const prefix = `${name}=`;
        const found = document.cookie.split("; ").find((entry) => entry.startsWith(prefix));
        return found ? decodeURIComponent(found.slice(prefix.length)) : null;
      }

      function writeRawCookie(name, value, maxAge) {
        const secure = window.location.protocol === "https:" ? "; Secure" : "";
        document.cookie = `${name}=${encodeURIComponent(value)}; max-age=${maxAge}; path=/; SameSite=Lax${secure}`;
      }

      function writeSuiteAuthCookie(key, value) {
        const chunks = [];
        for (let at = 0; at < value.length; at += SUITE_AUTH_COOKIE_CHUNK) {
          chunks.push(value.slice(at, at + SUITE_AUTH_COOKIE_CHUNK));
        }
        if (chunks.length > SUITE_AUTH_COOKIE_MAX_CHUNKS) return false;
        try {
          chunks.forEach((chunk, index) => writeRawCookie(suiteAuthCookieName(key, index), chunk, SUITE_AUTH_COOKIE_MAX_AGE));
          // Limpia restos de una sesion anterior mas larga.
          for (let index = chunks.length; index < SUITE_AUTH_COOKIE_MAX_CHUNKS; index += 1) {
            if (readRawCookie(suiteAuthCookieName(key, index)) === null) break;
            writeRawCookie(suiteAuthCookieName(key, index), "", 0);
          }
          return readSuiteAuthCookie(key) === value;
        } catch {
          return false;
        }
      }

      function readSuiteAuthCookie(key) {
        try {
          let value = "";
          for (let index = 0; index < SUITE_AUTH_COOKIE_MAX_CHUNKS; index += 1) {
            const chunk = readRawCookie(suiteAuthCookieName(key, index));
            if (chunk === null) break;
            value += chunk;
          }
          return value || null;
        } catch {
          return null;
        }
      }

      function clearSuiteAuthCookie(key) {
        try {
          for (let index = 0; index < SUITE_AUTH_COOKIE_MAX_CHUNKS; index += 1) {
            writeRawCookie(suiteAuthCookieName(key, index), "", 0);
          }
        } catch {
          // Sin cookies no hay nada que borrar.
        }
      }

      // De varias copias de la sesion gana la que vence mas tarde: otra pestaña pudo
      // renovarla, o uno de los almacenamientos puede haberse quedado atras.
      function freshestSuiteSession(candidates) {
        const expiresAt = (value) => {
          try {
            return Number(JSON.parse(value)?.expires_at || 0);
          } catch {
            return 0;
          }
        };
        return candidates
          .filter((value) => typeof value === "string" && value)
          .reduce((best, value) => (best === null || expiresAt(value) > expiresAt(best) ? value : best), null);
      }

      const suiteAuthStorage = {
        getItem(key) {
          let stored = null;
          try {
            stored = localStorage.getItem(key);
          } catch (error) {
            suiteAuthStorageError = `lectura: ${error?.name || ""} ${error?.message || error}`.trim();
          }
          const remembered = suiteAuthMemory.has(key) ? suiteAuthMemory.get(key) : null;
          return freshestSuiteSession([stored, remembered, readSuiteAuthCookie(key)]);
        },
        setItem(key, value) {
          suiteAuthMemory.set(key, value);
          const savedInCookie = writeSuiteAuthCookie(key, value);
          try {
            localStorage.setItem(key, value);
          } catch (error) {
            freeLocalStorageSpace();
            try {
              localStorage.setItem(key, value);
            } catch (retryError) {
              suiteAuthStorageError = `escritura: ${retryError?.name || ""} ${retryError?.message || retryError}`.trim();
              console.warn("No se pudo guardar la sesion de Supabase en este navegador; se usa la memoria.", retryError);
            }
          }
          // Comprobacion: hay navegadores/extensiones que aceptan setItem sin guardar nada.
          try {
            if (localStorage.getItem(key) !== value && !suiteAuthStorageError) {
              suiteAuthStorageError = "el navegador no conserva lo guardado";
            }
          } catch {
            // Ya registrado arriba.
          }
          // Mientras quede una copia en cookie la sesion sobrevive al refresco, asi que
          // deja de ser un fallo que reportar.
          if (savedInCookie) suiteAuthStorageError = "";
        },
        removeItem(key) {
          suiteAuthMemory.delete(key);
          clearSuiteAuthCookie(key);
          try {
            localStorage.removeItem(key);
          } catch {
            // Nada que quitar.
          }
        }
      };

      function writeStoredJson(key, value) {
        return writeStoredValue(key, JSON.stringify(value));
      }

      function pendingBackupSignature(snapshot) {
        const value = JSON.stringify([
          snapshot.tasks || [],
          snapshot.completedTasks || [],
          snapshot.taskTimer || {},
          snapshot.tombstonesById || {}
        ]);
        let hash = 2166136261;
        for (let index = 0; index < value.length; index += 1) {
          hash ^= value.charCodeAt(index);
          hash = Math.imul(hash, 16777619);
        }
        return (hash >>> 0).toString(36);
      }

      function currentPendingBackup(reason = "cambio") {
        return {
          actorName: currentSuiteUserName(),
          completedTasks,
          createdAt: new Date().toISOString(),
          reason,
          stateVersion: pendingStateVersion || Date.now(),
          tasks,
          taskTimer,
          tombstonesById: taskTombstones()
        };
      }

      function pendingTasksDigest() {
        return pendingBackupSignature({
          completedTasks: [],
          tasks,
          taskTimer: {},
          tombstonesById: taskTombstones()
        });
      }

      function saveLocalPendingBackup(reason = "cambio") {
        const snapshot = currentPendingBackup(reason);
        const signature = pendingBackupSignature(snapshot);
        const backups = readStoredJson(TASK_BACKUP_STORAGE_KEY, []);
        const list = Array.isArray(backups) ? backups : [];
        if (list[0]?.signature === signature) return;
        list.unshift(compactLocalPendingBackup({ ...snapshot, signature }));
        writeStoredJson(TASK_BACKUP_STORAGE_KEY, list.slice(0, MAX_LOCAL_PENDING_BACKUPS).map(compactLocalPendingBackup));
      }

      function recoverLocalPendingBackups() {
        const backups = readStoredJson(TASK_BACKUP_STORAGE_KEY, []);
        if (!Array.isArray(backups) || !backups.length) return false;
        backups.forEach((backup) => {
          mergeTaskTombstones(
            backup?.tombstonesById,
            backup?.taskTimer?.tombstonesById
          );
          mergeArchivedTaskTimer(backup?.taskTimer);
        });
        const previousTasks = JSON.stringify(tasks);
        tasks = mergePendingTaskLists(
          tasks,
          ...backups.map((backup) => backup?.tasks)
        );
        completedTasks = mergeCompletedTaskHistory(
          completedTasks,
          ...backups.map((backup) => backup?.completedTasks)
        );
        return previousTasks !== JSON.stringify(tasks);
      }

      function readPendingPresence() {
        const presence = readStoredJson(PRESENCE_STORAGE_KEY, {});
        const now = Date.now();
        return Object.values(presence || {}).filter((entry) => {
          return entry && now - Number(entry.updatedAt || 0) < 20000;
        });
      }

      function mergePendingPresence(nextPresence) {
        const presence = readStoredJson(PRESENCE_STORAGE_KEY, {});
        Object.values(nextPresence || {}).forEach((entry) => {
          if (!entry?.id) return;
          const currentEntry = presence[entry.id];
          if (Number(currentEntry?.updatedAt || 0) > Number(entry.updatedAt || 0)) return;
          presence[entry.id] = entry;
        });
        localStorage.setItem(PRESENCE_STORAGE_KEY, JSON.stringify(presence));
        return presence;
      }

        if (applyingPresenceSync) return;
        const presence = readStoredJson(PRESENCE_STORAGE_KEY, {});
        const entry = currentPendingPresenceEntry(task);
        presence[pendingSessionId] = entry;

        editingState.taskId = task?.id || null;
        editingState.taskTitle = task?.title || null;

      function normalizeSuiteUser(user) {
        const key = String(user?.key || "").trim().toLowerCase();
        const savedRole = String(user?.role || user?.rol || "").trim().toLowerCase();
        const savedOrder = Number(user?.order || user?.orden);
        const savedModules = Array.isArray(user?.modules)
          ? user.modules
          : Array.isArray(user?.moduleAccess)
            ? user.moduleAccess
            : null;
        return {
          name: String(user?.name || "").trim(),
          key,
          role: SUITE_SUPERADMIN_KEYS.includes(key) ? SUITE_SUPERADMIN_ROLE : savedRole || SUITE_SUPERADMIN_ROLE,
          order: Number.isFinite(savedOrder) && savedOrder > 0 ? savedOrder : defaultSuiteUserOrder(key),
          modules: normalizeSuiteModuleIds(savedModules)
        };
      }

      function normalizeSuiteModuleIds(moduleIds) {
        const availableIds = orderedSuiteModules().map((module) => module.id);
        if (!Array.isArray(moduleIds)) return availableIds;
        return [...new Set(moduleIds.map((moduleId) => String(moduleId || "").trim()).filter((moduleId) => availableIds.includes(moduleId)))];
      }

      function orderedSuiteModules() {
        return [...modules].sort((left, right) => {
          if (left.id === "access") return 1;
          if (right.id === "access") return -1;
          return 0;
        });
      }

      function defaultSuiteUserOrder(value) {
        const normalized = normalizeText(value);
        if (normalized.includes("diego")) return 1;
        if (normalized.includes("jorgeluis") || normalized.includes("jorge")) return 2;
        return 99;
      }

      function defaultSuiteUsers() {
        return mergeSuiteUsers(DEFAULT_SUITE_USERS);
      }

      function mergeSuiteUsers(...groups) {
        const byKey = new Map();
        groups.flat().forEach((user) => {
          const normalizedUser = normalizeSuiteUser(user);
          if (!normalizedUser.key) return;
          const existingUser = byKey.get(normalizedUser.key);
          byKey.set(normalizedUser.key, {
            ...existingUser,
            ...normalizedUser,
            role:
              existingUser?.role === SUITE_SUPERADMIN_ROLE || normalizedUser.role === SUITE_SUPERADMIN_ROLE
                ? SUITE_SUPERADMIN_ROLE
                : normalizedUser.role
          });
        });
        return Array.from(byKey.values());
      }

      function saveSuiteUsers() {
        writeStoredJson(SUITE_USERS_STORAGE_KEY, suiteUsers);
      }

      function loadSuiteUsers() {
        const savedUsers = readStoredJson(SUITE_USERS_STORAGE_KEY, null);
        const normalizedUsers = Array.isArray(savedUsers)
          ? savedUsers.map(normalizeSuiteUser).filter((user) => user.key)
          : [];
        suiteUsers = mergeSuiteUsers(defaultSuiteUsers(), normalizedUsers);
        migrateDiegoCredentialsOnce();
        migrateAddNewModules();
        if (suiteUsers.length) saveSuiteUsers();
      }

      function migrateAddNewModules() {
        const availableIds = orderedSuiteModules().map((m) => m.id);
        suiteUsers.forEach((user) => {
          if (!Array.isArray(user.modules)) return;
          const missing = availableIds.filter((id) => !user.modules.includes(id));
          if (missing.length) user.modules.push(...missing);
        });
      }

      function migrateDiegoCredentialsOnce() {
        const previousKey = "diego@limaretail.com";
        const currentKey = "diegomachuca@limaretail.com";

        try {
          if (localStorage.getItem(SUITE_CREDENTIALS_MIGRATION_KEY) === "done") return;

          const previousDiego = suiteUsers.find((user) => user.key === previousKey);
          const currentDiego = suiteUsers.find((user) => user.key === currentKey);
          if (currentDiego) {
            currentDiego.name = previousDiego?.name || currentDiego.name || "Diego";
            currentDiego.role = SUITE_SUPERADMIN_ROLE;
            currentDiego.order = previousDiego?.order || currentDiego.order || 1;
          }
          suiteUsers = suiteUsers.filter((user) => user.key !== previousKey);
          localStorage.setItem(SUITE_CREDENTIALS_MIGRATION_KEY, "done");
        } catch {
          suiteUsers = suiteUsers.filter((user) => user.key !== previousKey);
        }
      }

      // El acceso lo valida Supabase Auth. Antes la contraseña se comparaba en el navegador contra
      // claves escritas en este archivo y la "sesion" era el email guardado en cookie/localStorage
      // (bastaba con escribirlo a mano para entrar). La sesion ahora es el token de Supabase y la
      // BBDD solo responde a usuarios autenticados (ver BBDD/security-hardening-2026-09.sql).
      const LEGACY_AUTH_KEYS = [SUITE_AUTH_SESSION_KEY, SUITE_AUTH_PASSWORD_SESSION_KEY, SUITE_AUTH_FALLBACK_KEY];

      function clearLegacySuiteSession() {
        try {
          LEGACY_AUTH_KEYS.forEach((key) => {
            sessionStorage.removeItem(key);
            localStorage.removeItem(key);
          });
          document.cookie = `${encodeURIComponent(SUITE_AUTH_COOKIE)}=; max-age=0; path=/`;
        } catch {
          // Sin almacenamiento disponible no hay nada que limpiar.
        }
      }

      function suiteUserForEmail(email) {
        const normalized = String(email || "").trim().toLowerCase();
        return suiteUsers.find((user) => user.key === normalized) || null;
      }

      // Antes todo error se mostraba como "clave incorrecta" y no habia forma de saber si era la clave,
      // el email sin confirmar, demasiados intentos o una falla de Supabase.
      function suiteSignInErrorMessage(error) {
        const code = String(error?.code || "");
        const status = Number(error?.status || 0);
        if (code === "invalid_credentials") return "Usuario o contraseña incorrectos.";
        if (code === "email_not_confirmed") return "El email de esta cuenta no esta confirmado en Supabase.";
        if (status === 429 || code.includes("rate_limit")) {
          return "Demasiados intentos seguidos. Espera unos minutos y vuelve a intentar.";
        }
        if (!error) return "No se pudo iniciar sesión.";
        const detail = [error.message, code || status || ""].filter(Boolean).join(" · ");
        return `No se pudo iniciar sesión: ${detail}`;
      }

      // Diferencia entre el reloj de este equipo y el de Supabase (segundos), medida con el "iat" del token
      // recien emitido. Si el reloj va adelantado mas de lo que dura el token, supabase-js lo da por
      // vencido al instante, intenta renovarlo en cada consulta y termina consultando sin sesion.
      let suiteClockSkewSeconds = null;
      // Diagnostico: si la sesion se pudo leer justo despues de entrar y por que fallo la renovacion.
      let suiteSessionSavedAtLogin = null;
      let suiteSessionAtFailure = null;
      let suiteLastRefreshError = "";

      function rememberSuiteClockSkew(session) {
        try {
          const payload = JSON.parse(atob(String(session?.access_token || "").split(".")[1].replace(/-/g, "+").replace(/_/g, "/")));
          if (Number.isFinite(payload?.iat)) suiteClockSkewSeconds = Math.round(Date.now() / 1000 - payload.iat);
        } catch {
          // Sin token legible no se mide.
        }
      }

      function suiteClockSkewWarning() {
        if (!Number.isFinite(suiteClockSkewSeconds) || Math.abs(suiteClockSkewSeconds) < 300) return "";
        const minutes = Math.round(Math.abs(suiteClockSkewSeconds) / 60);
        const amount = minutes >= 90 ? `${Math.round(minutes / 60)} horas` : `${minutes} minutos`;
        return `La hora de este equipo está ${suiteClockSkewSeconds > 0 ? "adelantada" : "atrasada"} ${amount}. Activa "Establecer la hora automáticamente" y la zona horaria correcta en Windows, y vuelve a entrar.`;
      }

      // Datos para diagnosticar por que se perdio la sesion, visibles en el aviso del login.
      function suiteSessionDiagnostics(hasSession) {
        let storageKb = "?";
        try {
          let chars = 0;
          for (let index = 0; index < localStorage.length; index += 1) {
            const key = localStorage.key(index) || "";
            chars += key.length + String(localStorage.getItem(key) || "").length;
          }
          storageKb = String(Math.round((chars * 2) / 1024));
        } catch {
          // Sin acceso al almacenamiento.
        }
        const skew = Number.isFinite(suiteClockSkewSeconds) ? `${suiteClockSkewSeconds}s` : "?";
        const savedAtLogin = suiteSessionSavedAtLogin === null ? "?" : suiteSessionSavedAtLogin ? "si" : "no";
        const refresh =
          (suiteLastRefreshError ? ` · renovacion: ${suiteLastRefreshError}` : "") +
          (suiteAuthStorageError ? ` · navegador: ${suiteAuthStorageError}` : "");
        const atFailure = suiteSessionAtFailure === null ? "?" : suiteSessionAtFailure ? "si" : "no";
        return `version ${window.LR_SUITE_BUILD || "?"} · sesion al entrar ${savedAtLogin} · sesion al fallar ${atFailure} · sesion ahora ${hasSession ? "si" : "no"} · reloj ${skew} · almacenamiento ${storageKb} KB${refresh}`;
      }

      async function authenticateSuiteUser(key, password) {
        await waitForSharedPendingLibrary();
        const client = ensureSharedPendingClient();
        if (!client) return { error: "No se pudo conectar con Supabase. Revisa tu conexión y recarga." };
        const normalizedKey = String(key || "").trim().toLowerCase();
        const email = normalizedKey.includes("@") ? normalizedKey : `${normalizedKey}@limaretail.com`;
        const { data, error } = await client.auth.signInWithPassword({
          email,
          password: String(password || "")
        });
        if (error || !data?.user) return { error: suiteSignInErrorMessage(error) };
        rememberSuiteClockSkew(data.session);
        try {
          const { data: stored } = await client.auth.getSession();
          suiteSessionSavedAtLogin = Boolean(stored?.session?.access_token);
        } catch (sessionError) {
          suiteSessionSavedAtLogin = false;
          suiteLastRefreshError = `getSession: ${sessionError?.message || sessionError}`;
        }
        const user = suiteUserForEmail(data.user.email);
        if (!user) {
          await client.auth.signOut({ scope: "local" });
          return { error: "Tu cuenta no tiene acceso a LR Suite." };
        }
        return { user };
      }

      async function restoreSuiteAccessSession() {
        clearLegacySuiteSession();
        if (!(await waitForSharedPendingLibrary())) return;
        const client = ensureSharedPendingClient();
        if (!client) return;
        const { data } = await client.auth.getSession();
        const user = suiteUserForEmail(data?.session?.user?.email);
        suiteAccessSession = user ? user.key : "";
        if (suiteAccessSession) {
          initSharedPendingLive();
          connectSharedPendingUser();
          loadPrivateQuotes();
          loadPrivateFinancial();
        }
        client.auth.onAuthStateChange((event, session) => {
          if (event !== "SIGNED_OUT" && session) return;
          if (!suiteAccessSession) return;
          suiteAccessSession = "";
          // Cierre que no pidio el usuario (Supabase no pudo renovar la sesion): antes volvia al login
          // sin explicar nada.
          if (!state.suiteAccessError) {
            const clockWarning = suiteClockSkewWarning();
            state.suiteAccessError = `${clockWarning || "Tu sesión se cerró. Vuelve a entrar."} [${suiteSessionDiagnostics(false)}]`;
          }
          render();
        });
      }

      async function signOutSuite() {
        suiteAccessSession = "";
        quotes = [];
        const client = ensureSharedPendingClient();
        sharedLiveChannel = null;
        sharedLiveSubscribed = false;
        sharedLiveReady = false;
        window.clearTimeout(sharedLiveReconnectTimer);
        sharedLiveReconnectTimer = null;
        // Sin sesion no se consulta la BBDD: al volver a entrar, connectSharedPendingUser la reabre.
        window.clearInterval(sharedPendingValidationTimer);
        sharedPendingValidationTimer = null;
        sharedPendingAvailable = false;
        if (client) await removeSharedChannelsByTopic(client, "lr-suite-pending-live");
        // scope "local": solo este navegador. El signOut global revocaba la sesion en todas las pestañas
        // y equipos del usuario, y una pestaña podia sacar a la otra en cadena.
        if (client) await client.auth.signOut({ scope: "local" });
        render();
      }

      function currentSuiteUserIsSuperadmin() {

      function suitePendingOwnerName(user, fallback = "Usuario") {
        const rawName = user?.name || user?.key || fallback;
        const normalized = normalizeText(rawName);
        if (normalized.includes("jorge")) return "Jorge Luis";
        if (normalized.includes("diego")) return "Diego";
        return rawName;
      }

      function suitePersonKey(value) {
        const normalized = normalizeText(value).trim();
        if (normalized.includes("jorge")) return "jorge";
        if (normalized.includes("diego")) return "diego";
        return normalized;
      }

      function isSameSuitePerson(left, right) {
        const leftKey = suitePersonKey(left);
        const rightKey = suitePersonKey(right);
        return Boolean(leftKey && rightKey && leftKey === rightKey);
      }

      function normalizeTaskTimer(timer) {
        const source = timer && typeof timer === "object" ? timer : {};
        const activeById = source.activeById && typeof source.activeById === "object" ? { ...source.activeById } : {};
        const activeByKey = source.activeByKey && typeof source.activeByKey === "object" ? { ...source.activeByKey } : {};
        const legacyCountdownIds = new Set([
          ...Object.keys(source.durationById || {}),
          ...Object.keys(source.presetById || {})
        ]);
        const elapsedById = { ...(source.elapsedById || {}) };
        legacyCountdownIds.forEach((id) => delete elapsedById[id]);
        if (source.activeTaskId && !activeById[source.activeTaskId]) {
          activeById[source.activeTaskId] = {
            userKey: source.activeUserKey || null,
            userName: source.activeUserName || null,
            startedAt: source.startedAt || null
          };
        }
        Object.entries(activeById).forEach(([id, entry]) => {
          const key = taskTimerKeyForId(id, entry);
          if (key && !activeByKey[key]) activeByKey[key] = entry;
        });
        return {
          activeTaskId: source.activeTaskId || null,
          activeUserKey: source.activeUserKey || null,
          activeUserName: source.activeUserName || null,
          activeById,
          activeByKey,
          dailyById: source.dailyById && typeof source.dailyById === "object" ? source.dailyById : {},
          dailyByUser: source.dailyByUser && typeof source.dailyByUser === "object" ? source.dailyByUser : {},
          durationById: {},
          presetById: {},
          tombstonesById: source.tombstonesById && typeof source.tombstonesById === "object" ? source.tombstonesById : {},
          elapsedById,
          elapsedEditedAt: source.elapsedEditedAt && typeof source.elapsedEditedAt === "object" ? source.elapsedEditedAt : {},
          startedAt: source.startedAt || null
        };
      }

      function applyTaskTimerSnapshot(timer) {
        const normalized = normalizeTaskTimer(timer);
        taskTimer.activeTaskId = normalized.activeTaskId;
        taskTimer.activeUserKey = normalized.activeUserKey;
        taskTimer.activeUserName = normalized.activeUserName;
        taskTimer.activeById = normalized.activeById;
        taskTimer.activeByKey = normalized.activeByKey;
        taskTimer.dailyById = normalized.dailyById;
        taskTimer.dailyByUser = normalized.dailyByUser;
        taskTimer.durationById = normalized.durationById;
        taskTimer.presetById = normalized.presetById;
        taskTimer.tombstonesById = normalized.tombstonesById;
        taskTimer.startedAt = normalized.startedAt;
        taskTimer.elapsedById = normalized.elapsedById;
        taskTimer.elapsedEditedAt = normalized.elapsedEditedAt;
        pruneActiveTimersByUser();
      }

      function timerEntryMatchesUser(id, entry, userName, userKey) {
        if (!entry) return false;
        const entryKey = String(entry.userKey || "").trim().toLowerCase();
        const normalizedKey = String(userKey || "").trim().toLowerCase();
        if (entryKey && normalizedKey && (entryKey === normalizedKey || isSameSuitePerson(entryKey, normalizedKey))) return true;
        if (userName && isSameSuitePerson(entry.userName, userName)) return true;
        if (userName && isSameSuitePerson(entry.taskOwner, userName)) return true;
        const task = taskByTimerId(id);
        return Boolean(userName && task?.[1] && isSameSuitePerson(task[1], userName));
      }

      function timerEntryPersonKey(id, entry) {
        const task = taskByTimerId(id);
        return (
          suitePersonKey(entry?.userKey) ||
          suitePersonKey(entry?.userName) ||
          suitePersonKey(entry?.taskOwner) ||
          suitePersonKey(task?.[1])
        );
      }

      function pruneActiveTimersByUser() {
        const candidates = [];
        const now = Date.now();
        Object.entries(taskTimer.activeById || {}).forEach(([id, entry]) => {
          if (!entry?.startedAt) return;
          if (now - Number(entry.startedAt) > TIMER_STALE_ACTIVE_MS) return;
          const localId = localTaskIdForTimer(id, entry);
          candidates.push({
            id: localId,
            key: taskTimerKeyForId(localId, entry),
            entry,
            user: timerEntryPersonKey(localId, entry) || `id:${id}`
          });
        });
        Object.entries(taskTimer.activeByKey || {}).forEach(([key, entry]) => {
          if (!entry?.startedAt) return;
          if (now - Number(entry.startedAt) > TIMER_STALE_ACTIVE_MS) return;
          const localId = localTaskIdForTimer("", entry);
          candidates.push({
            id: localId,
            key,
            entry,
            user: timerEntryPersonKey(localId, entry) || `key:${key}`
          });
        });

        const latestByUser = new Map();
        candidates.forEach((candidate) => {
          const current = latestByUser.get(candidate.user);
          if (!current || Number(candidate.entry.startedAt || 0) > Number(current.entry.startedAt || 0)) {
            latestByUser.set(candidate.user, candidate);
          }
        });

        const nextActiveById = {};
        const nextActiveByKey = {};
        latestByUser.forEach((candidate) => {
          const entry = candidate.entry;
          const localId = localTaskIdForTimer(candidate.id, entry);
          if (localId && taskByTimerId(localId)) nextActiveById[localId] = entry;
          const key = taskTimerKeyForId(localId, entry) || candidate.key || taskTimerFingerprintFromEntry(entry);
          if (key && localId && taskByTimerId(localId)) nextActiveByKey[key] = entry;
        });
        taskTimer.activeById = nextActiveById;
        taskTimer.activeByKey = nextActiveByKey;
      }

      function syncLegacyActiveTimerFields() {
        const ownedActiveId = currentUserActiveTaskId();
        const fallbackEntry = ownedActiveId ? null : activeTimerEntries()[0];
        const nextActiveId = ownedActiveId || fallbackEntry?.[0] || null;
        const nextEntry = nextActiveId ? activeTimerEntry(nextActiveId) : null;
        taskTimer.activeTaskId = nextActiveId;
        taskTimer.activeUserKey = nextEntry?.userKey || null;
        taskTimer.activeUserName = nextEntry?.userName || null;
        taskTimer.startedAt = nextEntry?.startedAt || null;
      }

      function mergeTaskTimerSnapshot(timer, options = {}) {
        const incoming = normalizeTaskTimer(timer);
        const incomingActiveById = incoming.activeById || {};
        const incomingActiveByKey = incoming.activeByKey || {};
        const nextActiveById = { ...(taskTimer.activeById || {}) };
        const nextActiveByKey = { ...(taskTimer.activeByKey || {}) };
        const sourceName = options.actorName || incoming.activeUserName || "";
        const sourceKey = incoming.activeUserKey || "";
        const sourceUpdatedAt = Number(options.updatedAt || 0);

        Object.entries(nextActiveById).forEach(([id, entry]) => {
          const missingFromIncoming = !incomingActiveById[id]?.startedAt;
          const sourceCanReplaceEntry =
            !sourceUpdatedAt || sourceUpdatedAt >= Number(entry?.startedAt || 0);
          if (
            missingFromIncoming &&
            sourceCanReplaceEntry &&
            timerEntryMatchesUser(id, entry, sourceName, sourceKey)
          ) {
            delete nextActiveById[id];
          }
        });
        Object.entries(nextActiveByKey).forEach(([key, entry]) => {
          const missingFromIncoming = !incomingActiveByKey[key]?.startedAt;
          const sourceCanReplaceEntry =
            !sourceUpdatedAt || sourceUpdatedAt >= Number(entry?.startedAt || 0);
          if (
            missingFromIncoming &&
            sourceCanReplaceEntry &&
            timerEntryMatchesUser(null, entry, sourceName, sourceKey)
          ) {
            delete nextActiveByKey[key];
          }
        });

        Object.entries(incomingActiveById).forEach(([id, entry]) => {
          if (!entry?.startedAt) return;
          const localId = localTaskIdForTimer(id, entry);
          nextActiveById[localId] = entry;
          if (localId !== id) delete nextActiveById[id];
          const key = taskTimerKeyForId(localId, entry);
          if (key) nextActiveByKey[key] = entry;
        });
        Object.entries(incomingActiveByKey).forEach(([key, entry]) => {
          if (!entry?.startedAt) return;
          nextActiveByKey[key] = entry;
          const localId = localTaskIdForTimer("", entry);
          if (localId) nextActiveById[localId] = entry;
        });

        taskTimer.activeById = nextActiveById;
        taskTimer.activeByKey = nextActiveByKey;
        taskTimer.dailyById = mergedTaskDailyTimerTotals(taskTimer.dailyById, incoming.dailyById);
        taskTimer.dailyByUser = mergedDailyTimerTotals(taskTimer.dailyByUser, incoming.dailyByUser);
        taskTimer.durationById = {};
        taskTimer.presetById = {};
        mergeTaskTombstones(incoming.tombstonesById);
        taskTimer.elapsedById = { ...(taskTimer.elapsedById || {}) };
        taskTimer.elapsedEditedAt = { ...(taskTimer.elapsedEditedAt || {}) };
        Object.entries(incoming.elapsedById || {}).forEach(([id, seconds]) => {
          const localEditedAt = Number(taskTimer.elapsedEditedAt[id] || 0);
          const incomingEditedAt = Number(incoming.elapsedEditedAt?.[id] || 0);
          if (incomingEditedAt > localEditedAt) {
            taskTimer.elapsedById[id] = Number(seconds || 0);
            taskTimer.elapsedEditedAt[id] = incomingEditedAt;
          } else if (localEditedAt > 0) {
            // local explicit edit wins — do not overwrite
          } else {
            taskTimer.elapsedById[id] = Math.max(Number(taskTimer.elapsedById[id] || 0), Number(seconds || 0));
          }
        });
        pruneActiveTimersByUser();
        syncLegacyActiveTimerFields();
      }

      function taskTimerSnapshotFromParts(activeById, elapsedById) {
        const latestByUser = new Map();
        Object.entries(activeById || {}).forEach(([id, entry]) => {
          if (!entry?.startedAt) return;
          const user = timerEntryPersonKey(id, entry) || `id:${id}`;
          const current = latestByUser.get(user);
          if (!current || Number(entry.startedAt || 0) > Number(current[1].startedAt || 0)) {
            latestByUser.set(user, [id, entry]);
          }
        });
        const activeEntries = [...latestByUser.values()];
        const activeByKey = {};
        activeEntries.forEach(([id, entry]) => {
          const key = taskTimerKeyForId(id, entry);
          if (key) activeByKey[key] = entry;
        });
        const currentName = currentSuiteUserName();
        const currentKey = currentSuiteUserKey();
        const preferredEntry =
          activeEntries.find(([id, entry]) => timerEntryMatchesUser(id, entry, currentName, currentKey)) ||
          activeEntries[0] ||
          null;
        const activeTaskId = preferredEntry?.[0] || null;
        const activeEntry = preferredEntry?.[1] || null;
        return {
          activeTaskId,
          activeUserKey: activeEntry?.userKey || null,
          activeUserName: activeEntry?.userName || null,
          activeById: Object.fromEntries(activeEntries),
          activeByKey,
          dailyById: taskTimer.dailyById || {},
          dailyByUser: taskTimer.dailyByUser || {},
          durationById: taskTimer.durationById || {},
          presetById: taskTimer.presetById || {},
          tombstonesById: taskTombstones(),
          elapsedById: elapsedById || {},
          startedAt: activeEntry?.startedAt || null
        };
      }

      function mergedTaskTimerForSharedSave(remoteTimer) {
        const remote = normalizeTaskTimer(remoteTimer);
        const local = normalizeTaskTimer(taskTimer);
        const nextActiveById = { ...(remote.activeById || {}) };
        const nextActiveByKey = { ...(remote.activeByKey || {}) };
        const currentName = currentSuiteUserName();
        const currentKey = currentSuiteUserKey();

        Object.entries(nextActiveById).forEach(([id, entry]) => {
          const localStillActive = Boolean(local.activeById?.[id]?.startedAt);
          if (!localStillActive && timerEntryMatchesUser(id, entry, currentName, currentKey)) {
            delete nextActiveById[id];
          }
        });
        Object.entries(nextActiveByKey).forEach(([key, entry]) => {
          const localStillActive = Boolean(local.activeByKey?.[key]?.startedAt);
          if (!localStillActive && timerEntryMatchesUser(null, entry, currentName, currentKey)) {
            delete nextActiveByKey[key];
          }
        });

        Object.entries(local.activeById || {}).forEach(([id, entry]) => {
          if (!entry?.startedAt) return;
          const localId = localTaskIdForTimer(id, entry);
          nextActiveById[localId] = entry;
          if (localId !== id) delete nextActiveById[id];
          const key = taskTimerKeyForId(localId, entry);
          if (key) nextActiveByKey[key] = entry;
        });
        Object.entries(local.activeByKey || {}).forEach(([key, entry]) => {
          if (!entry?.startedAt) return;
          nextActiveByKey[key] = entry;
          const localId = localTaskIdForTimer("", entry);
          if (localId) nextActiveById[localId] = entry;
        });

        const nextElapsedById = { ...(remote.elapsedById || {}) };
        const nextElapsedEditedAt = { ...(remote.elapsedEditedAt || {}) };
        Object.entries(local.elapsedById || {}).forEach(([id, seconds]) => {
          const localEditedAt = Number(local.elapsedEditedAt?.[id] || 0);
          const remoteEditedAt = Number(remote.elapsedEditedAt?.[id] || 0);
          if (localEditedAt > remoteEditedAt) {
            nextElapsedById[id] = Number(seconds || 0);
            nextElapsedEditedAt[id] = localEditedAt;
          } else if (remoteEditedAt === 0) {
            nextElapsedById[id] = Math.max(Number(nextElapsedById[id] || 0), Number(seconds || 0));
          }
        });

        const snapshot = taskTimerSnapshotFromParts(nextActiveById, nextElapsedById);
        snapshot.elapsedEditedAt = nextElapsedEditedAt;
        snapshot.activeByKey = { ...nextActiveByKey, ...snapshot.activeByKey };
        snapshot.dailyById = mergedTaskDailyTimerTotals(remote.dailyById, local.dailyById);
        snapshot.dailyByUser = mergedDailyTimerTotals(remote.dailyByUser, local.dailyByUser);
        snapshot.durationById = {
          ...(remote.durationById || {}),
          ...(local.durationById || {})
        };
        snapshot.presetById = {
          ...(remote.presetById || {}),
          ...(local.presetById || {})
        };
        snapshot.tombstonesById = mergeTaskTombstones(
          remote.tombstonesById,
          local.tombstonesById
        );
        return snapshot;
      }

      function localDayKey(value = Date.now()) {
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return "";
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
      }

      function localMonthKey(value = Date.now()) {
        if (typeof value === "string") {
          const dateOnly = value.trim().match(/^(\d{4}-\d{2})-\d{2}$/);
          if (dateOnly) return dateOnly[1];
        }
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return "";
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        return `${year}-${month}`;
      }

      function taskMatchesMonth(task, monthId) {
        if (!monthId) return true;
        const startMonth = localMonthKey(taskDateInputValue(task[5]) || "");
        const endMonth = localMonthKey(taskDateInputValue(task[2]) || "");
        if (!startMonth && !endMonth) return true;
        if (startMonth && endMonth) return startMonth <= monthId && monthId <= endMonth;
        if (startMonth) return monthId >= startMonth;
        return monthId <= endMonth;
      }

      function mergedDailyTimerTotals(left, right) {
        const merged = {};
        [left, right].forEach((source) => {
          if (!source || typeof source !== "object") return;
          Object.entries(source).forEach(([day, totals]) => {
            if (!totals || typeof totals !== "object") return;
            merged[day] = { ...(merged[day] || {}) };
            Object.entries(totals).forEach(([userKey, seconds]) => {
              merged[day][userKey] = Math.max(
                Number(merged[day][userKey] || 0),
                Number(seconds || 0)
              );
            });
          });
        });
        return merged;
      }

      function mergedTaskDailyTimerTotals(left, right) {
        const merged = {};
        [left, right].forEach((source) => {
          if (!source || typeof source !== "object") return;
          Object.entries(source).forEach(([taskIdValue, dailyTotals]) => {
            if (!dailyTotals || typeof dailyTotals !== "object") return;
            merged[taskIdValue] = mergedDailyTimerTotals(merged[taskIdValue], dailyTotals);
          });
        });
        return merged;
      }

      function timerDailySegments(startAt, endAt = Date.now()) {
        const start = Number(startAt || 0);
        const end = Number(endAt || 0);
        if (!Number.isFinite(start) || !Number.isFinite(end) || end <= start) return {};

        const segments = {};
        let cursor = start;
        while (cursor < end) {
          const cursorDate = new Date(cursor);
          const nextDay = new Date(cursorDate);
          nextDay.setHours(24, 0, 0, 0);
          const segmentEnd = Math.min(end, nextDay.getTime());
          const dayKey = localDayKey(cursor);
          if (dayKey) {
            segments[dayKey] = (segments[dayKey] || 0) + Math.max(0, Math.floor((segmentEnd - cursor) / 1000));
          }
          cursor = segmentEnd;
        }
        return segments;
      }

      function addTimerDailySeconds(id, entry, endAt = Date.now()) {
        if (!entry?.startedAt) return;
        const userKey = timerEntryPersonKey(id, entry) || suitePersonKey(activeTimerWorkerName(id)) || "sin_usuario";
        if (!userKey) return;
        const segments = timerDailySegments(entry.startedAt, endAt);
        taskTimer.dailyByUser = taskTimer.dailyByUser && typeof taskTimer.dailyByUser === "object" ? taskTimer.dailyByUser : {};
        taskTimer.dailyById = taskTimer.dailyById && typeof taskTimer.dailyById === "object" ? taskTimer.dailyById : {};
        taskTimer.dailyById[id] = taskTimer.dailyById[id] && typeof taskTimer.dailyById[id] === "object" ? taskTimer.dailyById[id] : {};
        Object.entries(segments).forEach(([day, seconds]) => {
          taskTimer.dailyByUser[day] = { ...(taskTimer.dailyByUser[day] || {}) };
          taskTimer.dailyByUser[day][userKey] = Number(taskTimer.dailyByUser[day][userKey] || 0) + Number(seconds || 0);
          taskTimer.dailyById[id][day] = { ...(taskTimer.dailyById[id][day] || {}) };
          taskTimer.dailyById[id][day][userKey] = Number(taskTimer.dailyById[id][day][userKey] || 0) + Number(seconds || 0);
        });
      }

      function activeDailySecondsForUser(name, dayKey = localDayKey()) {
        return activeTimerEntries().reduce((sum, [id, entry]) => {
          if (!taskByTimerId(id)) return sum;
          if (!timerEntryMatchesUser(id, entry, name, "")) return sum;
          const segments = timerDailySegments(entry.startedAt, Date.now());
          return sum + Number(segments[dayKey] || 0);
        }, 0);
      }

      function completedDailySecondsForUser(name, dayKey = localDayKey()) {
        const userKey = suitePersonKey(name);
        return completedTasks.reduce((sum, task) => {
          if (!task || task.action === "eliminada") return sum;
          if (localDayKey(task.completedAt) !== dayKey) return sum;
          const dailySeconds = Number(task.dailySecondsByUser?.[dayKey]?.[userKey] || 0);
          return sum + dailySeconds;
        }, 0);
      }

      function dailyWorkedSecondsForUser(name, dayKey = localDayKey()) {
        return completedDailySecondsForUser(name, dayKey) + activeDailySecondsForUser(name, dayKey);
      }

      function formatWorkedMinutes(seconds) {
        const minutes = Math.floor(Number(seconds || 0) / 60);
        return `${minutes} min`;
      }

      function taskByTimerId(id) {
        return tasks.find((task, index) => taskId(task, index) === id) || null;
      }

      function taskTimerFingerprint(task) {
        if (!task) return "";
        const base = `${normalizeText(task[0]).trim()}|${suitePersonKey(task[1])}`;
        return task[7] ? `${base}|${task[7]}` : base;
      }

      function taskTimerFingerprintFromEntry(entry) {
        if (!entry) return "";
        const base = `${normalizeText(entry.taskTitle).trim()}|${suitePersonKey(entry.taskOwner)}`;
        return entry.taskCreatedAt ? `${base}|${entry.taskCreatedAt}` : base;
      }

      function taskTimerKeyForId(id, entry) {
        const task = taskByTimerId(id);
        return taskTimerFingerprint(task) || taskTimerFingerprintFromEntry(entry);
      }

      function localTaskIdForTimer(id, entry) {
        if (taskByTimerId(id)) return id;
        const fingerprint = taskTimerFingerprintFromEntry(entry);
        if (!fingerprint || fingerprint === "|") return id;
        const index = tasks.findIndex((task) => taskTimerFingerprint(task) === fingerprint);
        return index >= 0 ? taskId(tasks[index], index) : id;
      }

      function activeTimerEntry(id) {
        const activeEntry = taskTimer.activeById?.[id];
        if (activeEntry?.startedAt) return activeEntry;
        const key = taskTimerKeyForId(id, activeEntry);
        const keyedEntry = key ? taskTimer.activeByKey?.[key] : null;
        if (keyedEntry?.startedAt) return keyedEntry;
        if (taskTimer.activeTaskId === id && taskTimer.startedAt) {
          return {
            userKey: taskTimer.activeUserKey,
            userName: taskTimer.activeUserName,
            startedAt: taskTimer.startedAt
          };
        }
        return null;
      }

      function activeTimerEntries() {
        const entries = new Map();
        Object.entries(taskTimer.activeById || {}).forEach(([id, entry]) => {
          if (entry?.startedAt) entries.set(id, entry);
        });
        Object.entries(taskTimer.activeByKey || {}).forEach(([key, entry]) => {
          if (!entry?.startedAt) return;
          const localId = localTaskIdForTimer("", entry);
          if (localId && taskByTimerId(localId)) entries.set(localId, entry);
        });
        return [...entries.entries()];
      }

      function hasActiveTaskTimers() {
        return activeTimerEntries().length > 0 || Boolean(taskTimer.activeTaskId && taskTimer.startedAt && taskByTimerId(taskTimer.activeTaskId));
      }

      function activeTimerWorkerName(id = taskTimer.activeTaskId) {
        const entry = activeTimerEntry(id);
        const storedName = String(entry?.userName || "").trim();
        const normalizedStoredName = normalizeText(storedName);
        if (storedName && normalizedStoredName !== "otro usuario" && normalizedStoredName !== "usuario") return storedName;

        const storedKey = String(entry?.userKey || "").trim();
        if (storedKey) return suitePendingOwnerName({ key: storedKey }, storedKey);

        const task = taskByTimerId(id);
        if (task?.[1]) return task[1];

        return "Responsable";
      }

      function currentUserOwnsActiveTimer(id = taskTimer.activeTaskId) {
        const entry = activeTimerEntry(id);
        if (!entry) return false;
        const activeKey = String(entry.userKey || "").trim().toLowerCase();
        const currentKey = currentSuiteUserKey();
        if (activeKey && (activeKey === currentKey || isSameSuitePerson(activeKey, currentKey))) return true;

        const entryName = String(entry.userName || "").trim();
        const normalizedEntryName = normalizeText(entryName);
        const entryHasIdentity =
          Boolean(activeKey) ||
          (entryName && normalizedEntryName !== "otro usuario" && normalizedEntryName !== "usuario");
        if (
          entryHasIdentity &&
          entryName &&
          normalizedEntryName !== "otro usuario" &&
          normalizedEntryName !== "usuario" &&
          isSameSuitePerson(entryName, currentSuiteUserName())
        ) {
          return true;
        }
        if (!entryHasIdentity) {
          const task = taskByTimerId(id);
          return Boolean(task?.[1] && isSameSuitePerson(task[1], currentSuiteUserName()));
        }
        return false;
      }

      function currentUserActiveTaskId() {
        const ownedEntry = activeTimerEntries().find(([id]) => currentUserOwnsActiveTimer(id));
        if (ownedEntry) return ownedEntry[0];
        if (taskTimer.activeTaskId && currentUserOwnsActiveTimer(taskTimer.activeTaskId)) return taskTimer.activeTaskId;
        return null;
      }

      function clearCurrentUserActiveTimers() {
        const currentName = currentSuiteUserName();
        const currentKey = currentSuiteUserKey();
        Object.entries(taskTimer.activeById || {}).forEach(([id, entry]) => {
          if (!timerEntryMatchesUser(id, entry, currentName, currentKey)) return;
          addTimerDailySeconds(id, entry);
          taskTimer.elapsedById[id] = elapsedSecondsForTask(id);
          delete taskTimer.activeById[id];
        });
        Object.entries(taskTimer.activeByKey || {}).forEach(([key, entry]) => {
          if (!timerEntryMatchesUser(null, entry, currentName, currentKey)) return;
          delete taskTimer.activeByKey[key];
        });
        if (taskTimer.activeTaskId && !taskTimer.activeById[taskTimer.activeTaskId]) {
          taskTimer.activeTaskId = null;
          taskTimer.activeUserKey = null;
          taskTimer.activeUserName = null;
          taskTimer.startedAt = null;
        }
        pruneActiveTimersByUser();
      }

      function isTaskLockedByOtherUser(id) {
        const entry = activeTimerEntry(id);
        return Boolean(entry && !currentUserOwnsActiveTimer(id));
      }

      function canCurrentUserControlTask(id) {
        return !isTaskLockedByOtherUser(id);
      }

      function explainTaskLock(id, action = "usar esta accion") {
        const workerName = activeTimerWorkerName(id);
        const canUnlock = currentSuiteUserIsSuperadmin();
        const message = `${workerName} esta trabajando esta tarea.`;
        if (!canUnlock) {
          window.alert(`${message} Espera a que finalice su timer para ${action}.`);
          return false;
        }
        if (
          window.confirm(
            `${message} Â¿Quieres destrabarla ahora para ${action}? El tiempo trabajado quedara guardado.`
          )
        ) {
          forceUnlockTaskTimer(id);
          return true;
        }
        return false;
      }

      function normalizeText(value) {
        return String(value || "")
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .toLowerCase();
      }

      function taskDateInputValue(value) {
        const normalized = String(value || "").trim();
        const match = normalized.match(/^(\d{4}-\d{2}-\d{2})/);
        return match ? match[1] : "";
      }

      function hasSuiteAccess() {
        const sessionKey = getSuiteAccessSession();
        return Boolean(sessionKey && suiteUsers.some((user) => user.key === sessionKey));
      }

      function currentSuiteUser() {
        const sessionKey = currentSuiteUserKey();
        return suiteUsers.find((user) => user.key === sessionKey) || null;
      }

      function suiteUserCanAccessModule(user, moduleId) {
        return Boolean(user && normalizeSuiteModuleIds(user.modules).includes(moduleId));
      }

      function currentSuiteUserCanAccessModule(moduleId) {
        return suiteUserCanAccessModule(currentSuiteUser(), moduleId);
      }

      function currentSuiteUserModules() {
        const user = currentSuiteUser();
        return orderedSuiteModules().filter((module) => suiteUserCanAccessModule(user, module.id));
      }

      function updateSuiteModuleAccess(userKey, moduleId, enabled) {
        const normalizedKey = String(userKey || "").trim().toLowerCase();
        const index = suiteUsers.findIndex((user) => user.key === normalizedKey);
        if (index < 0 || !modules.some((module) => module.id === moduleId)) return false;

        const nextModules = new Set(normalizeSuiteModuleIds(suiteUsers[index].modules));
        if (enabled) nextModules.add(moduleId);
        else nextModules.delete(moduleId);
        suiteUsers[index].modules = orderedSuiteModules()
          .map((module) => module.id)
          .filter((availableModuleId) => nextModules.has(availableModuleId));
        saveSuiteUsers();
        state.suiteUserMessage = `Permisos actualizados para ${suiteUsers[index].key}.`;
        return true;
      }

      function renderNoModuleAccess() {
        document.getElementById("app").innerHTML = `
          <main class="suite-lock">
            <div class="suite-lock-inner">
              <div class="suite-lock-brand">
                <span class="logo">LR</span>
                <span>
                  <p class="brand-title">LR Suite</p>
                  <p class="small">Lima Retail</p>
                </span>
              </div>
              ${header(
                "Sin módulos asignados",
                "Tu usuario está activo, pero aún no tiene permisos para visualizar módulos.",
                "Acceso restringido",
                icons.lock,
                '<span aria-hidden="true"></span>'
              )}
            </div>
          </main>
        `;
      }

      // Solo registra el usuario en la suite (nombre, orden, modulos). La cuenta y su contraseña se
      // crean en Supabase > Authentication > Users; sin esa cuenta el usuario no puede entrar.
      function addSuiteUser(name, key) {
        const nextUser = normalizeSuiteUser({ name, key });
        nextUser.role = SUITE_SUPERADMIN_ROLE;

        if (!nextUser.name || !nextUser.key) {
          state.suiteUserMessage = "Completa nombre y usuario.";
          return null;
        }
        if (suiteUsers.some((user) => user.key === nextUser.key)) {
          state.suiteUserMessage = "Ese usuario ya existe.";
          return null;
        }

        suiteUsers.push(nextUser);
        state.suiteUserMessage = `Usuario creado: ${nextUser.key}.`;
        saveSuiteUsers();
        return nextUser;
      }

      function updateSuiteUserName(userKey, name) {
        const normalizedKey = String(userKey || "").trim().toLowerCase();
        const nextName = String(name || "").trim();

        if (!nextName) {
          state.suiteUserMessage = "Ingresa un nombre de usuario.";
          return false;
        }

        const index = suiteUsers.findIndex((user) => user.key === normalizedKey);
        if (index < 0) {
          state.suiteUserMessage = "Usuario no encontrado.";
          return false;
        }

        suiteUsers[index].name = nextName;
        state.suiteUserMessage = `Nombre actualizado para ${suiteUsers[index].key}.`;
        saveSuiteUsers();
        return true;
      }

      function updateSuiteUserOrder(userKey, order) {
        const normalizedKey = String(userKey || "").trim().toLowerCase();
        const nextOrder = Math.max(1, Math.trunc(Number(order) || 1));
        const index = suiteUsers.findIndex((user) => user.key === normalizedKey);
        if (index < 0) {
          state.suiteUserMessage = "Usuario no encontrado.";
          return false;
        }

        suiteUsers[index].order = nextOrder;
        state.suiteUserMessage = `Orden actualizado para ${suiteUsers[index].key}.`;
        saveSuiteUsers();
        return true;
      }

      // Cada usuario cambia solo su propia contraseña, en Supabase Auth. Las de otros usuarios se
      // restablecen desde Supabase > Authentication (antes se podian resetear a "1234" desde aqui).
      async function updateOwnSuitePassword(password, confirmPassword) {
        const nextPassword = String(password || "");
        if (nextPassword.length < 12) {
          state.suiteUserMessage = "La contraseña debe tener al menos 12 caracteres.";
          return false;
        }
        if (nextPassword !== String(confirmPassword || "")) {
          state.suiteUserMessage = "Las contraseñas no coinciden.";
          return false;
        }
        const client = ensureSharedPendingClient();
        const { error } = client ? await client.auth.updateUser({ password: nextPassword }) : { error: true };
        state.suiteUserMessage = error
          ? "No se pudo cambiar la contraseña en Supabase."
          : "Contraseña actualizada.";
        return !error;
      }

      function persistTaskStateVersion() {
        if (!pendingStateVersion) return;
        writeStoredValue(TASK_STATE_VERSION_STORAGE_KEY, String(pendingStateVersion));
      }

      function touchTaskStateVersion(options = {}) {
        if (options.version === false || sharedPendingApplying) {
          persistTaskStateVersion();
          return;
        }
        pendingStateVersion = Date.now();
        persistTaskStateVersion();
      }

      function saveTaskState(options = {}) {
        // Cada pendiente que cambio en este navegador desde la ultima fusion recibe su marca de edicion.
        if (!sharedPendingApplying) stampLocallyEditedTasks();
        pruneTaskTombstones();
        touchTaskStateVersion(options);
        writeStoredJson(TASKS_STORAGE_KEY, tasks);
        writeStoredJson(COMPLETED_STORAGE_KEY, completedTasks);
        if (options.backup !== false) saveLocalPendingBackup(options.reason || "cambio");
        if (options.broadcast !== false) publishTaskSync();
        if (options.shared !== false) queueSharedPendingSave();
      }

      function saveTimerState(options = {}) {
        touchTaskStateVersion(options);
        writeStoredJson(TIMER_STORAGE_KEY, taskTimer);
        if (options.broadcast !== false) publishTaskSync();
        if (options.shared !== false) queueSharedPendingSave();
      }

      function migrateJorgeLuisPendingTasks() {
        const current = tasks.filter((task) => task[1] === "Jorge Luis");
        const hasLegacyTasks = current.some((task) => LEGACY_JORGE_PENDING_TITLES.has(task[0]));

        if (!hasLegacyTasks) return false;

        tasks = [
          ...JORGE_LUIS_PENDING_TASKS.map((task) => [...task]),
          ...tasks.filter((task) => task[1] !== "Jorge Luis")
        ];
        jorgePendingMigrationApplied = true;
        return true;
      }

      function taskSyncPayload() {
        pruneTaskTombstones();
        return {
          actorName: currentSuiteUserName(),
          completedTasks,
          sourceId: pendingSyncSourceId,
          stateVersion: pendingStateVersion || 0,
          taskTimer,
          tombstonesById: taskTombstones(),
          tasks,
          updatedAt: Date.now()
        };
      }

      function captureNewTaskDraft() {
        const form = document.getElementById("newTaskForm");
        if (!form) return null;
        const activeElement = document.activeElement;
        return {
          activeName: form.contains(activeElement) ? activeElement.name : "",
          dueDate: form.elements.dueDate?.value || "",
          owner: form.elements.owner?.value || "",
          priority: form.elements.priority?.value || "",
          startDate: form.elements.startDate?.value || "",
          title: form.elements.title?.value || ""
        };
      }

      function restoreNewTaskDraft(draft) {
        if (!draft) return;
        const form = document.getElementById("newTaskForm");
        if (!form) return;
        if (form.elements.title) form.elements.title.value = draft.title;
        if (form.elements.owner && draft.owner) form.elements.owner.value = draft.owner;
        if (form.elements.startDate) form.elements.startDate.value = draft.startDate;
        if (form.elements.dueDate) form.elements.dueDate.value = draft.dueDate;
        if (form.elements.priority && draft.priority) form.elements.priority.value = draft.priority;
        if (draft.activeName && form.elements[draft.activeName]) {
          form.elements[draft.activeName].focus();
        }
      }

      function syncNewTaskTodayDates(event) {
        const input = event.currentTarget;
        const today = localDayKey();
        if (!input?.value || input.value !== today) return;

        const form = input.form || document.getElementById("newTaskForm");
        if (!form) return;
        if (form.elements.startDate) form.elements.startDate.value = today;
        if (form.elements.dueDate) form.elements.dueDate.value = today;
      }

      function wireNewTaskDateSync() {
        document.querySelectorAll("#newTaskForm, [data-category-task-form]").forEach((form) => {
          [form.elements.startDate, form.elements.dueDate].forEach((input) => {
            if (!input) return;
            input.addEventListener("input", syncNewTaskTodayDates);
            input.addEventListener("change", syncNewTaskTodayDates);
          });
        });
      }

      function taskTimerUiSignature() {
        return JSON.stringify(
          activeTimerEntries()
            .map(([id, entry]) => [
              id,
              Number(entry?.startedAt || 0),
