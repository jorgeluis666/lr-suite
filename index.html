        select.value = task[field] || element.textContent.trim();
        setEditingPresence({ id: taskId(task, index), title: task[0] });

        const closeWithoutChange = () => {
          setEditingPresence(null);
          tasksModule();
        };

        select.addEventListener("change", () => {
          if (!tasks[index]) return;
          tasks[index][field] = select.value;
          setEditingPresence(null);
          saveTaskState();
          tasksModule();
        });
        select.addEventListener("blur", closeWithoutChange);
        select.addEventListener("keydown", (event) => {
          if (event.key === "Escape") {
            event.preventDefault();
            closeWithoutChange();
          }
          if (event.key === "Enter") {
            event.preventDefault();
            select.dispatchEvent(new Event("change"));
          }
        });

        element.replaceWith(select);
        select.focus();
      }

      function finishInlineTaskEdit(element) {
        if (element.contentEditable !== "true") return;
        const index = Number(element.dataset.index);
        const field = Number(element.dataset.field);
        const task = tasks[index];
        if (task && !canCurrentUserControlTask(taskId(task, index))) {
          element.contentEditable = "false";
          setEditingPresence(null);
          tasksModule();
          return;
        }
        const fallback = element.dataset.original || "";
        const previousValue = tasks[index]?.[field] || "";
        const canceled = element.dataset.cancelEdit === "true";
        const nextValue =
          canceled ? fallback : element.textContent.trim();

        if (tasks[index] && nextValue) {
          tasks[index][field] = nextValue;
        }

        element.contentEditable = "false";
        delete element.dataset.original;
        delete element.dataset.cancelEdit;
        setEditingPresence(null);
        saveTaskState();
        if (
          tasks[index] &&
          field === 1 &&
          nextValue &&
          !canceled &&
          !isSameSuitePerson(previousValue, nextValue)
        ) {
          notifyTaskAssignment(tasks[index], taskId(tasks[index], index), nextValue);
        }
        tasksModule();
      }

      function beginRouteHeadingEdit(element) {
        element.dataset.original = element.textContent.trim();
        element.dataset.cancelEdit = "false";
        element.contentEditable = "true";
        element.focus();
        selectEditableText(element);
      }

      function finishRouteHeadingEdit(element) {
        if (element.contentEditable !== "true") return;
        const key = element.dataset.routeHeadingKey;
        const categoryId = element.dataset.pendingCategoryId;
        const fallback = element.dataset.original || "";
        const canceled = element.dataset.cancelEdit === "true";
        const nextValue = canceled ? fallback : element.textContent.trim();
        element.contentEditable = "false";
        delete element.dataset.original;
        delete element.dataset.cancelEdit;
        if (!canceled) {
          if (categoryId) renamePendingCategory(categoryId, nextValue);
          else setCriticalRouteHeading(key, nextValue);
        }
        tasksModule();
      }

      function beginRouteResponsibleEdit(element) {
        element.dataset.original = element.textContent.trim();
        element.dataset.cancelEdit = "false";
        element.contentEditable = "true";
        element.focus();
        selectEditableText(element);
      }

      function finishRouteResponsibleEdit(element) {
        if (element.contentEditable !== "true") return;
        const key = element.dataset.routeResponsibleKey;
        const categoryId = element.dataset.pendingCategoryId;
        const fallback = element.dataset.original || "";
        const canceled = element.dataset.cancelEdit === "true";
        const nextValue = canceled ? fallback : element.textContent.trim();
        element.contentEditable = "false";
        delete element.dataset.original;
        delete element.dataset.cancelEdit;
        if (!canceled) {
          if (categoryId) updatePendingCategoryResponsible(categoryId, nextValue);
          else setCriticalRouteResponsible(key, nextValue);
        }
        tasksModule();
      }

      const closingTaskIds = new Set();

      function moveTaskToCompleted(id, action = "completada") {
        if (!id || closingTaskIds.has(id)) return;
        const index = tasks.findIndex((task, taskIndex) => taskId(task, taskIndex) === id);
        if (index < 0) return;

        closingTaskIds.add(id);
        const task = tasks[index];
        try {
          const entry = activeTimerEntry(id);
          const workedByName = entry ? activeTimerWorkerName(id) : currentSuiteUserName();
          const workedByKey = suitePersonKey(entry?.userKey || entry?.userName || workedByName);
          const totalSeconds = elapsedSecondsForTask(id);
          const dailySecondsByUser = { ...(taskTimer.dailyById?.[id] || {}) };
          if (entry) finalizeTaskTimer(id, { persist: false });

          const completedRecord = {
            completedRecordId: generatedTaskId("completed"),
            id,
            title: task[0],
            owner: task[1],
            createdAt: taskCreatedAt(task),
            startDate: task[5],
            dueDate: task[2],
            priority: task[4] || "Media",
            completedAt: new Date().toISOString(),
            completedBy: currentSuiteUserName(),
            dailySecondsByUser,
            action,
            totalSeconds,
            workedByKey,
            workedByName
          };

          taskTombstones()[id] = {
            action,
            closedAt: Date.now(),
            closedBy: currentSuiteUserName(),
            title: task[0]
          };
          completedTasks = mergeCompletedTaskHistory(completedTasks, [completedRecord]);
          tasks.splice(index, 1);
          collapsedSubtaskIds.delete(String(id));
          if (editingState.taskId === id) setEditingPresence(null);
          delete taskTimer.elapsedById[id];
          delete taskTimer.elapsedEditedAt?.[id];
          delete taskTimer.durationById[id];
          delete taskTimer.presetById[id];
          delete taskTimer.dailyById?.[id];

          saveTimerState({ broadcast: false, shared: false, version: false });
          saveTaskState({ reason: action });
          tasksModule();

          void archiveCompletedTask(completedRecord)
            .then((archived) => {
              if (!archived) {
                console.warn(
                  "No se pudo guardar esta tarea en la BBDD historica; permanece cerrada en el estado compartido.",
                  sharedPendingError || "Acceso rechazado por Supabase."
                );
              }
            })
            .catch((error) => {
              console.warn("No se pudo archivar la tarea cerrada:", error);
            })
            .finally(() => {
              closingTaskIds.delete(id);
            });
        } catch (error) {
          closingTaskIds.delete(id);
          console.error("No se pudo cerrar la tarea:", error);
          window.alert("No se pudo cerrar la tarea. Recarga la pagina e intenta nuevamente.");
        }
      }

      function restoreCompletedTask(key) {
        const index = completedTasks.findIndex((task, taskIndex) => completedTaskKey(task, taskIndex) === key);
        if (index < 0) return;

        const task = completedTasks[index];
        const nextId = generatedTaskId();
        tasks.unshift([
          task.title,
          task.owner || currentSuiteUserName(),
          task.dueDate || "",
          "Pendiente",
          task.priority || "Media",
          task.startDate || "",
          nextId,
          task.createdAt || new Date().toISOString()
        ]);

        if (task.totalSeconds) {
          taskTimer.elapsedById[nextId] = task.totalSeconds;
        }
        if (task.dailySecondsByUser) {
          taskTimer.dailyById = taskTimer.dailyById && typeof taskTimer.dailyById === "object" ? taskTimer.dailyById : {};
          taskTimer.dailyById[nextId] = task.dailySecondsByUser;
        }
        completedTasks.splice(index, 1);
        saveTimerState({ broadcast: false, shared: false });
        saveTaskState();
        tasksModule();
      }

      function completeTask(id) {
        void moveTaskToCompleted(id, "completada");
      }

      function deleteTask(id) {
        if (!window.confirm("¿Mover este pendiente al historial como eliminado?")) return;
        void moveTaskToCompleted(id, "eliminada");
      }

      function handleTaskModuleClick(event) {
        const target = event.target;
        if (!(target instanceof Element)) return;

        const syncButton = target.closest("[data-force-pending-sync]");
        if (syncButton) {
          event.preventDefault();

          event.stopImmediatePropagation();
          forcePendingSync();
          return;
        }

        const unlockButton = target.closest("[data-force-unlock-task]");
        if (unlockButton) {
          event.preventDefault();
          event.stopPropagation();
          event.stopImmediatePropagation();
          const id = unlockButton.dataset.forceUnlockTask;
          const workerName = activeTimerWorkerName(id);
          if (
            window.confirm(
              `Â¿Destrabar esta tarea? Se pausarÃ¡ el timer de ${workerName} y su tiempo quedarÃ¡ guardado.`
            )
          ) {
            forceUnlockTaskTimer(id);
            tasksModule();
          }
          return;
        }

        const timerButton = target.closest("[data-timer-toggle]");
        if (timerButton) {

        }

        const subtaskMoveButton = target.closest("[data-subtask-move]");
        if (subtaskMoveButton) {

            movePendingSubtask(
              subtaskMoveButton.dataset.parentTaskId,

            )
          ) {

          }

        const subtaskToggleButton = target.closest("[data-subtask-toggle]");
        if (subtaskToggleButton) {
          event.preventDefault();
          event.stopPropagation();
          event.stopImmediatePropagation();
          if (togglePendingSubtask(subtaskToggleButton.dataset.parentTaskId, subtaskToggleButton.dataset.subtaskToggle)) {
            tasksModule();
          }
          return;
        }

        const subtaskDeleteButton = target.closest("[data-subtask-delete]");
        if (subtaskDeleteButton) {
          event.preventDefault();
          event.stopPropagation();

            tasksModule();

        const deleteButton = target.closest("[data-delete-task]");
        if (deleteButton) {
          event.preventDefault();

      function taskDropDirection(target, event) {
        const rect = target.getBoundingClientRect();
        return event.clientY > rect.top + rect.height / 2 ? "after" : "before";
      }

      function clearTaskDropGuides() {
        document.querySelectorAll(".task.drop-before, .task.drop-after").forEach((element) => {
          element.classList.remove("drop-before", "drop-after");
        });
      }

      function clearTaskDropTargets() {
        document.querySelectorAll(".task.dragging").forEach((element) => {
          element.classList.remove("dragging");
        });
        clearTaskDropGuides();
      }

      // Al ordenar a mano, el resto del tablero se queda donde el usuario lo esta
      // viendo. Sin esto, sacar un pendiente de una ruta podia dejarla con uno solo,
      // disolverla y arrastrar a su compañero a otro grupo.
      function pinVisibleTasksToTheirGroups() {
        document.querySelectorAll("[data-task-draggable]").forEach((row) => {
          const groupKey = row.closest(".task-owner-group")?.dataset.groupKey || "";
          if (!groupKey) return;
          const index = tasks.findIndex((task, taskIndex) => taskId(task, taskIndex) === row.dataset.taskId);
          if (index < 0) return;
          const task = tasks[index];
          if (task[TASK_CATEGORY_INDEX] || taskRoutePin(task)) return;
          task[TASK_ROUTE_PIN_INDEX] = groupKey;
        });
      }

      function reorderTaskByDrop(sourceId, targetId, direction = "before") {
        if (!sourceId || !targetId || sourceId === targetId) {
          clearTaskDropTargets();
          draggedTaskId = null;
          return;
        }

        pinVisibleTasksToTheirGroups();

        // El grupo del destino se lee del DOM antes de mover, porque el re-render
        // posterior reconstruye las filas.
        const targetGroupKey =
          document
            .querySelector(`[data-task-draggable][data-task-id="${CSS.escape(targetId)}"]`)
            ?.closest(".task-owner-group")?.dataset.groupKey || "";

        const previousOrder = tasks.map((task, index) => taskId(task, index)).join("|");
        const sourceIndex = tasks.findIndex((task, index) => taskId(task, index) === sourceId);
        if (sourceIndex < 0) {
          clearTaskDropTargets();
          draggedTaskId = null;
          return;
        }

        const [movedTask] = tasks.splice(sourceIndex, 1);
        const targetIndex = tasks.findIndex((task, index) => taskId(task, index) === targetId);
        if (targetIndex < 0) {
          tasks.splice(sourceIndex, 0, movedTask);
          clearTaskDropTargets();
          draggedTaskId = null;
          return;
        }

        const previousGroupPin = taskRoutePin(movedTask);
        const previousCategory = movedTask[TASK_CATEGORY_INDEX];
        adoptGroupFromNeighbour(movedTask, tasks[targetIndex], targetGroupKey);
        tasks.splice(direction === "after" ? targetIndex + 1 : targetIndex, 0, movedTask);
        tasks.forEach((task, index) => {
          if (Array.isArray(task)) task[TASK_MANUAL_ORDER_INDEX] = index;
        });
        draggedTaskId = null;
        const nextOrder = tasks.map((task, index) => taskId(task, index)).join("|");
        const groupChanged =
          taskRoutePin(movedTask) !== previousGroupPin || movedTask[TASK_CATEGORY_INDEX] !== previousCategory;
        if (nextOrder === previousOrder && !groupChanged) {
          clearTaskDropTargets();
          return;
        }
        saveTaskState({ reason: "orden-manual" });
        tasksModule();
      }

      function moveTaskWithArrow(button) {
        const taskIdToMove = button.dataset.taskMove;
        const direction = button.dataset.taskMoveDirection;
        if (!taskIdToMove || !canCurrentUserControlTask(taskIdToMove)) return;
        const item = button.closest("[data-task-draggable]");
        if (!item) return;
        // Se recorre el tablero entero, no solo el grupo: al pasar el borde el
        // pendiente se cambia de grupo en vez de quedarse atascado.
        const board = item.closest(".tasks") || document;
        const visibleItems = Array.from(board.querySelectorAll("[data-task-draggable]"));
        const currentIndex = visibleItems.findIndex((candidate) => candidate.dataset.taskId === taskIdToMove);
        if (currentIndex < 0) return;
        const target = direction === "up" ? visibleItems[currentIndex - 1] : visibleItems[currentIndex + 1];
        if (!target?.dataset.taskId) return;
        reorderTaskByDrop(taskIdToMove, target.dataset.taskId, direction === "up" ? "before" : "after");
      }

      function ensureTaskManualOrder() {
        let changed = false;
        tasks.forEach((task, index) => {
          if (!Array.isArray(task)) return;
          if (!hasManualOrder(task)) {
            task[TASK_MANUAL_ORDER_INDEX] = index;
            changed = true;
          }
        });
        return changed;
      }

      // Un hueco del arreglo vuelve como null al pasar por JSON, y Number(null) es 0:
      // sin este filtro esas tareas quedaban todas con orden 0, empatadas, y el tablero
      // caia de vuelta al orden por fecha y prioridad.
      function hasManualOrder(task) {
        const raw = task?.[TASK_MANUAL_ORDER_INDEX];
        if (raw === null || raw === undefined || raw === "") return false;
        return Number.isFinite(Number(raw));
      }

      function taskManualOrder(task) {
        return hasManualOrder(task) ? Number(task[TASK_MANUAL_ORDER_INDEX]) : Number.MAX_SAFE_INTEGER;
      }

      function taskRoutePin(task) {
        const pin = task?.[TASK_ROUTE_PIN_INDEX];
        return typeof pin === "string" && pin ? pin : "";
      }

      // Al mover un pendiente junto a otro, adopta el grupo del vecino: si el vecino
      // esta en una categoria manual entra en esa categoria, y si esta en una ruta
      // sugerida queda fijado a esa ruta.
      function adoptGroupFromNeighbour(task, neighbourTask, neighbourGroupKey) {
        if (!Array.isArray(task) || !Array.isArray(neighbourTask)) return;
        const neighbourCategory = neighbourTask[TASK_CATEGORY_INDEX];
        if (neighbourCategory) {
          task[TASK_CATEGORY_INDEX] = neighbourCategory;
          task[TASK_ROUTE_PIN_INDEX] = "";
          return;
        }
        task[TASK_CATEGORY_INDEX] = "";
        task[TASK_ROUTE_PIN_INDEX] = neighbourGroupKey || "";
      }

      function compareTasksByManualOrder(left, right) {
        return taskManualOrder(left) - taskManualOrder(right);
      }

      function beginTaskPointerDrag(handle, startEvent) {
        if (startEvent.button !== undefined && startEvent.button !== 0) return;
        const sourceItem = handle.closest("[data-task-draggable]");
        if (!sourceItem) return;
        if (!canCurrentUserControlTask(sourceItem.dataset.taskId)) return;

        const sourceId = handle.dataset.taskDragHandle || sourceItem.dataset.taskId;
        const sourceIndex = tasks.findIndex((task, index) => taskId(task, index) === sourceId);
        if (sourceIndex < 0) return;

        const startPoint = { x: startEvent.clientX, y: startEvent.clientY };
        const dragState = {
          active: false,
          lastTarget: null,
          lastDirection: "before",
          pointerId: startEvent.pointerId,
          sourceId,
          sourceItem
        };

        const cleanup = () => {
          try {
            if (dragState.pointerId !== undefined && handle.hasPointerCapture?.(dragState.pointerId)) {
              handle.releasePointerCapture(dragState.pointerId);
            }
          } catch {
            // El navegador puede cancelar la captura si cambia la ventana activa.
          }
          document.removeEventListener("pointermove", move);
          document.removeEventListener("pointerup", stop);
          document.removeEventListener("pointercancel", cancel);
          setEditingPresence(null);
          draggedTaskId = null;
          clearTaskDropTargets();
        };

        const activate = () => {
          if (dragState.active) return;
          dragState.active = true;
          draggedTaskId = sourceId;
          sourceItem.classList.add("dragging");
          setEditingPresence({
            action: "Moviendo",
            id: sourceId,
            title: tasks[sourceIndex][0]
          });
        };

        const targetFromPoint = (event) => {
          const target = document.elementFromPoint(event.clientX, event.clientY)?.closest("[data-task-draggable]");
          if (!target || target.dataset.taskId === sourceId) return null;
          return target;
        };

        const updateGuide = (event) => {
          const target = targetFromPoint(event);
          clearTaskDropGuides();
          dragState.lastTarget = target;
          if (!target) return;
          dragState.lastDirection = taskDropDirection(target, event);
          target.classList.toggle("drop-before", dragState.lastDirection === "before");
          target.classList.toggle("drop-after", dragState.lastDirection === "after");
        };

        const move = (event) => {
          if (event.pointerId !== dragState.pointerId) return;
          const distance = Math.hypot(event.clientX - startPoint.x, event.clientY - startPoint.y);
          if (!dragState.active && distance < 6) return;
          event.preventDefault();
          activate();
          updateGuide(event);
        };

        const stop = (event) => {
          if (event.pointerId !== dragState.pointerId) return;
          event.preventDefault();
          if (!dragState.active) {
            cleanup();
            return;
          }
          updateGuide(event);
          const target = dragState.lastTarget;
          const direction = dragState.lastDirection;
          cleanup();
          if (target?.dataset.taskId && target.dataset.taskId !== sourceId) {
            reorderTaskByDrop(sourceId, target.dataset.taskId, direction);
          }
        };

        const cancel = (event) => {
          if (event.pointerId !== dragState.pointerId) return;
          cleanup();
        };

        startEvent.preventDefault();
        handle.setPointerCapture?.(startEvent.pointerId);
        document.addEventListener("pointermove", move, { passive: false });
        document.addEventListener("pointerup", stop, { passive: false });
        document.addEventListener("pointercancel", cancel);
      }

      const CRITICAL_ROUTE_COLORS_STORAGE_KEY = "lr-suite-critical-route-colors-v1";
      const CRITICAL_ROUTE_HEADINGS_STORAGE_KEY = "lr-suite-critical-route-headings-v1";
      const CRITICAL_ROUTE_RESPONSIBLES_STORAGE_KEY = "lr-suite-critical-route-responsibles-v1";
      const PENDING_MANUAL_CATEGORIES_STORAGE_KEY = "lr-suite-pending-manual-categories-v1";
      const TASK_CATEGORY_INDEX = 8;
      const TASK_SUBTASKS_INDEX = 9;
      const TASK_COLOR_INDEX = 10;
      const TASK_MANUAL_ORDER_INDEX = 11;
      // Grupo al que el usuario movio el pendiente a mano. Manda sobre la ruta que
      // sugeriria el algoritmo, para que las flechas puedan cruzar de grupo.
      const TASK_ROUTE_PIN_INDEX = 12;
      // Marca de la ultima edicion del pendiente (numero, ver nextTaskStamp). La fusion con la BBDD
      // elige campo por pendiente segun esta marca, no segun la version global del tablero.
      const TASK_UPDATED_AT_INDEX = 13;
      const criticalRoutePalette = ["#2563eb", "#0f766e", "#7c3aed", "#ea580c", "#db2777", "#ca8a04", "#0891b2", "#475569", "#16a34a", "#dc2626"];
      const defaultCriticalRouteColors = criticalRoutePalette.slice(0, 4);
      let criticalRouteHeadingOverrides = getStoredCriticalRouteHeadings();
      let criticalRouteResponsibleOverrides = getStoredCriticalRouteResponsibles();
      let manualPendingCategories = getStoredPendingCategories();

      function pendingCategoryIdFromTitle(title) {
        const slug = normalizeText(title)
          .replace(/[^a-z0-9]+/g, "-")
          .replace(/^-+|-+$/g, "")
          .slice(0, 60);
        return `category-${slug || Date.now().toString(36)}`;
      }

      function normalizePendingCategory(value, fallback = {}) {
        const source =
          value && typeof value === "object"
            ? value
            : {
                title: value
              };
        const title = String(source.title || source.name || fallback.title || "").trim();
        if (!title) return null;
        const id = String(source.id || source.key || fallback.id || pendingCategoryIdFromTitle(title)).trim();
        const color = isValidHexColor(source.color || fallback.color)
          ? String(source.color || fallback.color).toLowerCase()
          : criticalRoutePalette[Math.abs(id.length) % criticalRoutePalette.length];
        return {
          id,
          title,
          color,
          owner: String(source.owner || fallback.owner || "").trim(),
          responsibleLabel: String(source.responsibleLabel || fallback.responsibleLabel || "").trim(),
          startDate: taskDateInputValue(source.startDate || fallback.startDate || ""),
          dueDate: taskDateInputValue(source.dueDate || fallback.dueDate || ""),
          priority: String(source.priority || fallback.priority || "Media").trim() || "Media",
          createdAt: source.createdAt || fallback.createdAt || new Date().toISOString()
        };
      }

      function getStoredPendingCategories() {
        try {
          const parsed = JSON.parse(localStorage.getItem(PENDING_MANUAL_CATEGORIES_STORAGE_KEY) || "[]");
          return Array.isArray(parsed) ? parsed.map((category) => normalizePendingCategory(category)).filter(Boolean) : [];
        } catch {
          return [];
        }
      }

      function savePendingCategories() {
        try {
          localStorage.setItem(PENDING_MANUAL_CATEGORIES_STORAGE_KEY, JSON.stringify(manualPendingCategories));
        } catch {
          // Las categorias se mantienen en memoria aunque el navegador bloquee localStorage.
        }
      }

      function upsertPendingCategory(category) {
        const normalized = normalizePendingCategory(category);
        if (!normalized) return null;
        const currentIndex = manualPendingCategories.findIndex((item) => item.id === normalized.id);
        if (currentIndex >= 0) {
          manualPendingCategories[currentIndex] = {
            ...manualPendingCategories[currentIndex],
            ...normalized
          };
        } else {
          manualPendingCategories.unshift(normalized);
        }
        savePendingCategories();
        return normalized;
      }

      function pendingTaskCategory(task) {
        return normalizePendingCategory(task?.[TASK_CATEGORY_INDEX]);
      }

      function setPendingTaskCategory(task, category) {
        const normalized = normalizePendingCategory(category);
        if (!Array.isArray(task) || !normalized) return null;
        task[TASK_CATEGORY_INDEX] = normalized;
        return normalized;
      }

      function pendingCategoryById(id, groups = []) {
        const categoryId = String(id || "");
        const fromGroup = groups.find((group) => group.category?.id === categoryId)?.category;
        if (fromGroup) return fromGroup;
        return manualPendingCategories.find((category) => category.id === categoryId) || null;
      }

      function pendingCategoryMeta(category, groupTasks) {
        if (category?.responsibleLabel) return category.responsibleLabel;
        if (category?.owner) return `Responsables: ${category.owner}`;
        return defaultResponsibleSummaryForTasks(groupTasks);
      }

      function renamePendingCategory(categoryId, title) {
        const category = normalizePendingCategory(pendingCategoryById(categoryId), { id: categoryId });
        const nextCategory = normalizePendingCategory({ ...category, title });
        if (!nextCategory) return false;
        upsertPendingCategory(nextCategory);
        tasks.forEach((task) => {
          const taskCategory = pendingTaskCategory(task);
          if (taskCategory?.id === categoryId) task[TASK_CATEGORY_INDEX] = { ...taskCategory, title: nextCategory.title };
        });
        saveTaskState({ reason: "categoria-renombrada" });
        return true;
      }

      function updatePendingCategoryResponsible(categoryId, responsibleLabel) {
        const category = normalizePendingCategory(pendingCategoryById(categoryId), { id: categoryId });
        if (!category) return false;
        const nextCategory = upsertPendingCategory({
          ...category,
          responsibleLabel: String(responsibleLabel || "").trim()
        });
        if (!nextCategory) return false;
        tasks.forEach((task) => {
          const taskCategory = pendingTaskCategory(task);
          if (taskCategory?.id === categoryId) task[TASK_CATEGORY_INDEX] = { ...taskCategory, responsibleLabel: nextCategory.responsibleLabel };
        });
        saveTaskState({ reason: "responsable-categoria" });
        return true;
      }

      function clearFormFieldError(input) {
        if (!input) return;
        input.classList.remove("field-invalid");
        input.removeAttribute("aria-invalid");
        const errorId = input.getAttribute("aria-describedby");
        if (errorId) document.getElementById(errorId)?.remove();
        input.removeAttribute("aria-describedby");
      }

      function showFormFieldError(form, fieldName, message) {
        const input = form?.elements?.[fieldName];
        if (!input) return;
        clearFormFieldError(input);
        const error = document.createElement("small");
        const errorId = `form-error-${Date.now()}-${Math.random().toString(16).slice(2)}`;
        error.id = errorId;
        error.className = "form-field-error";
        error.textContent = message;
        error.setAttribute("role", "alert");
        input.classList.add("field-invalid");
        input.setAttribute("aria-invalid", "true");
        input.setAttribute("aria-describedby", errorId);
        (input.closest("label") || input.parentElement || form).appendChild(error);
        input.addEventListener("input", () => clearFormFieldError(input), { once: true });
        input.focus();
      }

      function addPendingCategory(form) {
        const formData = new FormData(form);
        const title = String(formData.get("title") || "").trim();
        const owner = String(formData.get("owner") || "").trim() || currentSuiteUserName();
        const startDate = String(formData.get("startDate") || "").trim() || localDayKey();
        const dueDate = String(formData.get("dueDate") || "").trim();
        const priority = String(formData.get("priority") || "Media").trim() || "Media";

        if (!title) {
          showFormFieldError(form, "title", "Escribe el nombre de la categoria.");
          return false;
        }

        const category = normalizePendingCategory({
          id: generatedTaskId("category"),
          title,
          owner,
          responsibleLabel: owner ? `Responsables: ${owner}` : "",
          startDate,
          dueDate,
          priority,
          color: criticalRoutePalette[manualPendingCategories.length % criticalRoutePalette.length],
          createdAt: new Date().toISOString()
        });
        upsertPendingCategory(category);
        return true;
      }

      function pendingManualCategoryGroups(visibleTasks) {
        const categoryMap = new Map();
        manualPendingCategories.forEach((category) => {
          const normalized = normalizePendingCategory(category);
          if (normalized) categoryMap.set(normalized.id, { category: normalized, tasks: [] });
        });
        visibleTasks.forEach((task) => {
          const category = pendingTaskCategory(task);
          if (!category) return;
          const current = categoryMap.get(category.id) || { category, tasks: [] };
          current.category = { ...current.category, ...category };
          current.tasks.push(task);
          categoryMap.set(category.id, current);
        });
        return [...categoryMap.values()]
          .filter((group) => group.tasks.length || manualPendingCategories.some((category) => category.id === group.category.id))
          .sort((left, right) => String(right.category.createdAt || "").localeCompare(String(left.category.createdAt || "")))
          .map((group) => ({
            category: group.category,
            headingKey: group.category.id,
            heading: group.category.title,
            metaKey: group.category.id,
            meta: pendingCategoryMeta(group.category, group.tasks),
            manualCategory: true,
            tasks: group.tasks
          }));
      }

      // Id para tareas internas antiguas guardadas sin id. Antes se inventaba uno al azar en cada
      // navegador, asi que la misma tarea llegaba con dos ids distintos y aparecia duplicada.
      function legacySubtaskId(title) {
        let hash = 2166136261;
        const text = normalizeText(title);
        for (let index = 0; index < text.length; index += 1) {
          hash ^= text.charCodeAt(index);
          hash = Math.imul(hash, 16777619);
        }
        return `subtask-legacy-${(hash >>> 0).toString(36)}`;
      }

      function normalizePendingSubtask(value, fallback = {}) {
        const source =
          value && typeof value === "object"
            ? value
            : {
                title: value
              };
        const title = String(source.title || source.name || fallback.title || "").trim();
        if (!title) return null;
        const startDate = taskDateInputValue(source.startDate ?? fallback.startDate ?? "");
        const endDate = taskDateInputValue(source.endDate ?? fallback.endDate ?? "");
        const rawOrder = source.order ?? fallback.order;
        // Number(null) es 0, asi que el hueco se descarta antes de convertir.
        const order = rawOrder === null || rawOrder === undefined || rawOrder === "" ? NaN : Number(rawOrder);
        return {
          id: String(source.id || fallback.id || legacySubtaskId(title)).trim(),
          title,
          owner: String(source.owner || fallback.owner || "").trim(),
          status: String(source.status || fallback.status || "Pendiente").trim() || "Pendiente",
          order: Number.isFinite(order) ? order : null,
          // Sin fecha real queda vacia: antes se ponia la hora actual y una tarea interna antigua pasaba
          // a ser "la editada mas recientemente", pisando cambios reales del otro usuario al fusionar.
          createdAt: source.createdAt || fallback.createdAt || "",
          completedAt: source.completedAt || fallback.completedAt || "",
          completedBy: source.completedBy || fallback.completedBy || "",
          updatedAt:
            source.updatedAt ||
            fallback.updatedAt ||
            source.completedAt ||
            fallback.completedAt ||
            source.createdAt ||
            fallback.createdAt ||
            "",
          startDate,
          endDate: endDate && startDate && endDate < startDate ? startDate : endDate
        };
      }

      function pendingSubtasks(task) {
        if (!Array.isArray(task)) return [];
        const source = Array.isArray(task[TASK_SUBTASKS_INDEX]) ? task[TASK_SUBTASKS_INDEX] : [];
        const normalized = source.map((subtask) => normalizePendingSubtask(subtask)).filter(Boolean);
        // Manda el orden manual; las tareas que nunca se movieron conservan su posicion.
        const ordered = normalized
          .map((subtask, index) => ({ subtask, index }))
          .sort((left, right) => {
            const leftOrder = Number.isFinite(left.subtask.order) ? left.subtask.order : left.index;
            const rightOrder = Number.isFinite(right.subtask.order) ? right.subtask.order : right.index;
            if (leftOrder !== rightOrder) return leftOrder - rightOrder;
            return left.index - right.index;
          })
          .map((entry) => entry.subtask);
        task[TASK_SUBTASKS_INDEX] = ordered;
        return ordered;
      }

      function findPendingTaskById(id) {
        const taskIndex = tasks.findIndex((task, index) => taskId(task, index) === id);
        return {
          task: taskIndex >= 0 ? tasks[taskIndex] : null,
          taskIndex
        };
      }

      function addPendingSubtask(taskIdValue, form) {
        const { task, taskIndex } = findPendingTaskById(taskIdValue);
        if (!task || taskIndex < 0) return false;
        const formData = new FormData(form);
        const title = String(formData.get("title") || "").trim();
        const owner = String(formData.get("owner") || "").trim() || task[1] || currentSuiteUserName();
        const startDate = taskDateInputValue(formData.get("startDate"));
        const endDate = taskDateInputValue(formData.get("endDate"));
        if (!title) {
          showFormFieldError(form, "title", "Escribe el nombre de la tarea interna.");
          return false;
        }
        const subtasks = pendingSubtasks(task);
        subtasks.push(
          normalizePendingSubtask({
            id: generatedTaskId("subtask"),
            updatedAt: new Date().toISOString(),
            order: subtasks.length,
            title,
            owner,
            status: "Pendiente",
            createdAt: new Date().toISOString(),
            startDate,
            endDate
          })
        );
        task[TASK_SUBTASKS_INDEX] = subtasks;
        saveTaskState({ reason: "subtarea-creada" });
        return true;
      }

      function togglePendingSubtask(taskIdValue, subtaskId) {
        const { task, taskIndex } = findPendingTaskById(taskIdValue);
        if (!task || taskIndex < 0) return false;
        if (!canCurrentUserControlTask(taskId(task, taskIndex))) return false;
        const subtasks = pendingSubtasks(task);
        const subtask = subtasks.find((item) => item.id === subtaskId);
        if (!subtask) return false;
        const completed = normalizeText(subtask.status) === "completado";
        subtask.status = completed ? "Pendiente" : "Completado";
        subtask.completedAt = completed ? "" : new Date().toISOString();
        subtask.completedBy = completed ? "" : currentSuiteUserName();
        subtask.updatedAt = nextSubtaskStamp(subtask);
        task[TASK_SUBTASKS_INDEX] = subtasks;
        saveTaskState({ reason: "subtarea-actualizada" });
        return true;
      }

      function updatePendingSubtaskOwner(taskIdValue, subtaskId, owner) {
        const nextOwner = String(owner || "").trim();
        if (!nextOwner) return false;
        const { task, taskIndex } = findPendingTaskById(taskIdValue);
        if (!task || taskIndex < 0) return false;
        if (!canCurrentUserControlTask(taskId(task, taskIndex))) return false;
        const subtasks = pendingSubtasks(task);
        const subtask = subtasks.find((item) => item.id === subtaskId);
        if (!subtask || subtask.owner === nextOwner) return false;
        subtask.owner = nextOwner;
        // La marca de edicion evita que el responsable viejo de la BBDD pise al nuevo.
        subtask.updatedAt = nextSubtaskStamp(subtask);
        task[TASK_SUBTASKS_INDEX] = subtasks;
        saveTaskState({ reason: "subtarea-responsable" });
        return true;
      }

      function renamePendingSubtask(taskIdValue, subtaskId, title) {
        const nextTitle = String(title || "").trim();
        if (!nextTitle) return false;
        const { task, taskIndex } = findPendingTaskById(taskIdValue);
        if (!task || taskIndex < 0) return false;
        if (!canCurrentUserControlTask(taskId(task, taskIndex))) return false;
        const subtasks = pendingSubtasks(task);
        const subtask = subtasks.find((item) => item.id === subtaskId);
        if (!subtask || subtask.title === nextTitle) return false;
        subtask.title = nextTitle;
        // La marca de edicion evita que el nombre viejo de la BBDD pise el nuevo.
        subtask.updatedAt = nextSubtaskStamp(subtask);
        task[TASK_SUBTASKS_INDEX] = subtasks;
        saveTaskState({ reason: "subtarea-renombrada" });
        return true;
      }

      function movePendingSubtask(taskIdValue, subtaskId, direction) {
        const { task, taskIndex } = findPendingTaskById(taskIdValue);
        if (!task || taskIndex < 0) return false;
        if (!canCurrentUserControlTask(taskId(task, taskIndex))) return false;
        const subtasks = pendingSubtasks(task);
        const currentIndex = subtasks.findIndex((item) => item.id === subtaskId);
        if (currentIndex < 0) return false;
        const targetIndex = direction === "up" ? currentIndex - 1 : currentIndex + 1;
        if (targetIndex < 0 || targetIndex >= subtasks.length) return false;
        const [moved] = subtasks.splice(currentIndex, 1);
        subtasks.splice(targetIndex, 0, moved);
        subtasks.forEach((subtask, index) => {
          if (subtask.order === index) return;
          subtask.order = index;
          // La marca de edicion evita que el orden viejo de la BBDD pise el nuevo.
          subtask.updatedAt = nextSubtaskStamp(subtask);
        });
        task[TASK_SUBTASKS_INDEX] = subtasks;
        saveTaskState({ reason: "subtarea-orden" });
        return true;
      }

      function updatePendingSubtaskDate(taskIdValue, subtaskId, field, value) {
        if (field !== "startDate" && field !== "endDate") return false;
        const { task, taskIndex } = findPendingTaskById(taskIdValue);
        if (!task || taskIndex < 0) return false;
        if (!canCurrentUserControlTask(taskId(task, taskIndex))) return false;
        const subtasks = pendingSubtasks(task);
        const subtask = subtasks.find((item) => item.id === subtaskId);
        if (!subtask) return false;
        const nextValue = taskDateInputValue(value);
        if (subtask[field] === nextValue) return false;
        subtask[field] = nextValue;
        if (subtask.startDate && subtask.endDate && subtask.endDate < subtask.startDate) {
          if (field === "startDate") subtask.endDate = subtask.startDate;
          else subtask.startDate = subtask.endDate;
        }
        subtask.updatedAt = nextSubtaskStamp(subtask);
        task[TASK_SUBTASKS_INDEX] = subtasks;
        saveTaskState({ reason: "subtarea-fechas" });
        return true;
      }

      function deletePendingSubtask(taskIdValue, subtaskId) {
        const { task, taskIndex } = findPendingTaskById(taskIdValue);
        if (!task || taskIndex < 0) return false;
        if (!canCurrentUserControlTask(taskId(task, taskIndex))) return false;
        if (!window.confirm("¿Borrar esta tarea interna?")) return false;
        const removed = pendingSubtasks(task).find((item) => item.id === subtaskId);
        taskTombstones()[String(subtaskId)] = {
          action: "subtarea-borrada",
          closedAt: Date.now(),
          closedBy: currentSuiteUserName(),
          title: removed?.title || ""
        };
        task[TASK_SUBTASKS_INDEX] = pendingSubtasks(task).filter((subtask) => subtask.id !== subtaskId);
        saveTimerState({ broadcast: false, shared: false, version: false });
        saveTaskState({ reason: "subtarea-borrada" });
        return true;
      }

      function isValidHexColor(value) {
        return /^#[0-9a-f]{6}$/i.test(String(value || ""));

      function criticalRouteColor(routeIndex) {
        const stored = state.criticalRouteColors?.[routeIndex];
        return criticalRoutePalette.includes(String(stored || "").toLowerCase())
          ? String(stored).toLowerCase()
          : defaultCriticalRouteColors[routeIndex % defaultCriticalRouteColors.length];
      }


      function defaultPendingTaskColor(task) {
        const seed = String(task?.[6] || task?.[0] || "pendiente");
        let hash = 0;
        for (let index = 0; index < seed.length; index += 1) hash = (hash * 31 + seed.charCodeAt(index)) >>> 0;
        return criticalRoutePalette[hash % criticalRoutePalette.length];
      }

      function pendingTaskColor(task, criticalRoute = null) {
        const stored = String(task?.[TASK_COLOR_INDEX] || "").toLowerCase();
        if (criticalRoutePalette.includes(stored)) return stored;

          )

      function setPendingTaskColor(taskIdValue, color) {
        const normalizedColor = String(color || "").toLowerCase();
        const taskIndex = tasks.findIndex((task, index) => taskId(task, index) === taskIdValue);
        if (taskIndex < 0 || !criticalRoutePalette.includes(normalizedColor)) return;

      const criticalRouteDefinitions = [
        {
          title: "Medicion -> Leads -> Contenido",

      function taskSortDateValue(task) {
        const value = task?.[5] || task?.[2] || taskCreatedAt(task) || "";
        const time = value ? new Date(value).getTime() : 0;
        return Number.isFinite(time) ? time : 0;
      }

      function addDaysToLocalDay(baseDate, offset) {
        const date = new Date(baseDate);
        date.setDate(date.getDate() + offset);
        return date.toISOString().slice(0, 10);
      }

      function routeTaskScore(task, route) {
        const title = normalizeText(task?.[0] || "");
        let score = 0;
        route.keywords.forEach((keyword, index) => {
          if (title.includes(normalizeText(keyword))) score += 100 - index;
        });
        if (normalizeText(task?.[4] || "") === "alta") score += 18;
        if (task?.[2] && new Date(task[2]) < new Date(localDayKey())) score += 25;
        return score;
      }

      function suggestedCriticalRoutes(visibleTasks) {
        const baseDate = new Date(localDayKey() + "T00:00:00");
        const usedTasks = new Set();
        return criticalRouteDefinitions
          .map((route, routeIndex) => {
            const routeKey = criticalRouteHeadingKey(routeIndex);
            // Los fijados a mano entran siempre en su grupo, sin pasar por el puntaje
            // ni por el tope de 4; los fijados a otro grupo no pueden caer aqui.
            const pinnedHere = visibleTasks
              .filter((task) => taskRoutePin(task) === routeKey)
              .map((task) => ({ task, score: routeTaskScore(task, route) }));
            pinnedHere.forEach((item) => usedTasks.add(item.task));
            const items = visibleTasks
              .map((task) => ({ task, score: routeTaskScore(task, route) }))
              .filter((item) => !taskRoutePin(item.task) && item.score > 0 && !usedTasks.has(item.task))
              .sort((left, right) => right.score - left.score || taskSortDateValue(left.task) - taskSortDateValue(right.task))
              .slice(0, 4)
              .concat(pinnedHere)
              .sort(
                (left, right) =>
                  compareTasksByManualOrder(left.task, right.task) ||
                  taskSortDateValue(left.task) - taskSortDateValue(right.task) ||
                  right.score - left.score
              )
              .map((item, index) => {
                usedTasks.add(item.task);
                return {
                  task: item.task,
                  start: addDaysToLocalDay(baseDate, index),
                  end: addDaysToLocalDay(baseDate, index + 1)
                };
              });
            return { ...route, items };
          })
          // Una ruta con un solo pendiente se descarta, salvo que alguien lo haya
          // movido ahi a mano: en ese caso el grupo debe seguir existiendo.
          .filter((route) => route.items.length >= 2 || route.items.some((item) => taskRoutePin(item.task)))
          .slice(0, 4);
      }

      function criticalTaskRouteMap(routes) {
        const map = new Map();
        routes.forEach((route, routeIndex) => {
          route.items.forEach((item, stepIndex) => {
            const index = tasks.indexOf(item.task);
            if (index < 0) return;
            const id = taskId(item.task, index);
            if (!map.has(id)) map.set(id, { routeIndex, stepIndex, route, item });
          });
        });
        return map;
      }

        return "Claude sugiere: Priorizar y clasificar pendientes sueltos";

      function daysBetweenIdeaNodes(startDay, endDay) {
        const startTime = new Date(`${startDay}T00:00:00`).getTime();
        const endTime = new Date(`${endDay}T00:00:00`).getTime();
        if (!Number.isFinite(startTime) || !Number.isFinite(endTime)) return 0;
        return Math.max(0, Math.round((endTime - startTime) / 86400000));
      }

      function ideaMapDaysLabel(days) {

      function ideaMapData(routes) {
        const nodes = [];
        const links = [];
        const seenNodes = new Set();

        routes.forEach((route, routeIndex) => {
          const routeColor = criticalRouteColor(routeIndex);
          const routeLabel = ideaMapRouteLabel(route, routeIndex);
          const routeNodes = route.items
            .map((item, stepIndex) => {
              const index = tasks.indexOf(item.task);
              if (index < 0) return null;
              const id = taskId(item.task, index);
              if (seenNodes.has(id)) return null;
              seenNodes.add(id);
              const startDate = ideaMapDayValue(item.task?.[5], item.start);
              const endDate = ideaMapDayValue(item.task?.[2], item.end);
              const priority = normalizeText(item.task?.[4] || "media");
              const isHighPriority = priority === "alta";
              const isOverdueNode = item.task?.[2] && new Date(`${taskDateInputValue(item.task[2])}T00:00:00`) < new Date(`${localDayKey()}T00:00:00`);
              const node = {
                id,
                title: item.task?.[0] || "Sin titulo",
                owner: item.task?.[1] || "Sin responsable",
                status: item.task?.[3] || "Pendiente",
                priority: item.task?.[4] || "Media",
                routeIndex,
                routeLabel,
                stepIndex,
                routeSize: route.items.length,
                color: routeColor,
                startDate,
                endDate,
                durationDays: Math.max(1, daysBetweenIdeaNodes(startDate, endDate)),
                radius: isHighPriority ? 31 : isOverdueNode ? 29 : 25
              };
              nodes.push(node);
              return node;
            })
            .filter(Boolean);

          routeNodes.forEach((node, index) => {
            const previous = routeNodes[index - 1];
            if (!previous) return;
            const days = daysBetweenIdeaNodes(previous.startDate, node.startDate);
            links.push({
              id: `${previous.id}-${node.id}-${routeIndex}`,
              source: previous.id,
              target: node.id,
              routeIndex,
              color: routeColor,
              days,
              label: ideaMapDaysLabel(days),
              routeLabel
            });
          });
        });

        return { nodes, links };
      }

      }

      function ideaMapInitialLayout(data, width, height) {
        const routeCount = Math.max(1, new Set(data.nodes.map((node) => node.routeIndex)).size);
        const maxStep = Math.max(1, ...data.nodes.map((node) => Math.max(1, node.routeSize - 1)));
        data.nodes.forEach((node) => {
          const xRatio = maxStep ? node.stepIndex / maxStep : 0.5;
          const yRatio = routeCount > 1 ? node.routeIndex / (routeCount - 1) : 0.5;
          const wave = Math.sin((node.stepIndex + 1) * 1.4 + node.routeIndex) * 34;
          node.x = 92 + xRatio * Math.max(120, width - 184);
          node.y = 86 + yRatio * Math.max(120, height - 172) + wave;
        });
      }

      function ideaMapPath(source, target) {
        const midX = (source.x + target.x) / 2;
        const bend = Math.max(-80, Math.min(80, (target.y - source.y) * 0.28));
        return `M${source.x},${source.y} C${midX},${source.y + bend} ${midX},${target.y - bend} ${target.x},${target.y}`;
      }

      function renderIdeaMapFallback(stage, data, width, height) {
        ideaMapInitialLayout(data, width, height);
        const nodesById = new Map(data.nodes.map((node) => [node.id, node]));
        const linksHtml = data.links
          .map((link) => {
            const source = nodesById.get(link.source);
            const target = nodesById.get(link.target);
            if (!source || !target) return "";
            const labelX = (source.x + target.x) / 2;
            const labelY = (source.y + target.y) / 2 - 10;
            return `<path class="idea-map-link" style="--route-color:${link.color}" d="${ideaMapPath(source, target)}"></path><text class="idea-map-link-label" x="${labelX}" y="${labelY}">${escapeHtml(link.label)}</text>`;
          })
          .join("");
        const nodesHtml = data.nodes
          .map(
            (node) => `<g class="idea-map-node" transform="translate(${node.x} ${node.y})" style="--route-color:${node.color}">
              <circle class="idea-map-node-halo" r="${node.radius + 13}"></circle>
              <circle class="idea-map-node-core" r="${node.radius}"></circle>
              <text class="idea-map-node-title" y="-3">${escapeHtml(ideaMapShortLabel(node.title, 24))}</text>
              <text class="idea-map-node-owner" y="14">${escapeHtml(ideaMapShortLabel(node.owner, 20))}</text>
              <title>${escapeHtml(`${node.title} | ${node.owner} | ${node.startDate} -> ${node.endDate}`)}</title>
            </g>`
          )
          .join("");
        stage.innerHTML = `<svg class="idea-map-svg" viewBox="0 0 ${width} ${height}" role="img" aria-label="Mapa de ideas">${linksHtml}${nodesHtml}</svg>`;
      }

      function renderIdeaMapWithD3(stage, data, width, height) {
        ideaMapInitialLayout(data, width, height);
        stage.innerHTML = `<svg class="idea-map-svg" viewBox="0 0 ${width} ${height}" role="img" aria-label="Mapa de ideas"></svg>`;
        const svg = window.d3.select(stage.querySelector("svg"));
        const linkLayer = svg.append("g").attr("class", "idea-map-links");
        const labelLayer = svg.append("g").attr("class", "idea-map-labels");
        const nodeLayer = svg.append("g").attr("class", "idea-map-nodes");
        const simulation = window.d3
          .forceSimulation(data.nodes)
          .force("link", window.d3.forceLink(data.links).id((node) => node.id).distance((link) => Math.min(280, 132 + link.days * 18)).strength(0.72))
          .force("charge", window.d3.forceManyBody().strength(-520))
          .force("center", window.d3.forceCenter(width / 2, height / 2))
          .force("collide", window.d3.forceCollide().radius((node) => node.radius + 52).iterations(2))
          .force("x", window.d3.forceX((node) => node.x).strength(0.055))
          .force("y", window.d3.forceY((node) => node.y).strength(0.075));

        const links = linkLayer
          .selectAll("path")
          .data(data.links)
          .join("path")
          .attr("class", "idea-map-link")
          .style("--route-color", (link) => link.color);

        const labels = labelLayer
          .selectAll("text")
          .data(data.links)
          .join("text")
          .attr("class", "idea-map-link-label")
          .text((link) => link.label);

        const drag = window.d3
          .drag()
          .on("start", (event, node) => {
            if (!event.active) simulation.alphaTarget(0.25).restart();
            node.fx = node.x;
            node.fy = node.y;
          })
          .on("drag", (event, node) => {
            node.fx = event.x;
            node.fy = event.y;
          })
          .on("end", (event, node) => {
            if (!event.active) simulation.alphaTarget(0);
            node.fx = null;
            node.fy = null;
          });

        const nodes = nodeLayer
          .selectAll("g")
          .data(data.nodes)
          .join("g")
          .attr("class", "idea-map-node")
          .style("--route-color", (node) => node.color)
          .call(drag);

        nodes.append("circle").attr("class", "idea-map-node-halo").attr("r", (node) => node.radius + 13);
        nodes.append("circle").attr("class", "idea-map-node-core").attr("r", (node) => node.radius);
        nodes.append("text").attr("class", "idea-map-node-title").attr("y", -3).text((node) => ideaMapShortLabel(node.title, 24));
        nodes.append("text").attr("class", "idea-map-node-owner").attr("y", 14).text((node) => ideaMapShortLabel(node.owner, 20));
        nodes.append("title").text((node) => `${node.title} | ${node.owner} | ${node.startDate} -> ${node.endDate}`);

        simulation.on("tick", () => {
          links.attr("d", (link) => ideaMapPath(link.source, link.target));
          labels.attr("x", (link) => (link.source.x + link.target.x) / 2).attr("y", (link) => (link.source.y + link.target.y) / 2 - 10);
          nodes.attr("transform", (node) => `translate(${node.x} ${node.y})`);
        });
      }

      function renderIdeaMap(routes) {
        const stage = document.querySelector("[data-idea-map-stage]");
        if (!stage) return;
        const data = ideaMapData(routes);
        if (data.nodes.length < 2 || !data.links.length) {
          stage.innerHTML = `<div class="idea-map-empty">Se necesitan al menos dos pendientes conectados por ruta critica para crear el mapa.</div>`;
          return;
        }
        const rect = stage.getBoundingClientRect();
        const width = Math.max(760, Math.round(rect.width || 980));
        const height = Math.max(520, Math.round(rect.height || 560));
        if (window.d3?.forceSimulation) {
          renderIdeaMapWithD3(stage, data, width, height);
        } else {
          renderIdeaMapFallback(stage, data, width, height);
        }
      }

      function addPendingTask(form, category = null) {
        const formData = new FormData(form);
        const title = String(formData.get("title") || "").trim();
        const owner = String(formData.get("owner") || "").trim() || currentSuiteUserName();
        const startDate = String(formData.get("startDate") || "").trim() || localDayKey();
        const dueDate = String(formData.get("dueDate") || "").trim();
        const priority = String(formData.get("priority") || "Media").trim() || "Media";

        if (!title) {
          showFormFieldError(form, "title", "Escribe el nombre del pendiente.");
          return false;
        }

        const id = "task-" + Date.now().toString(36) + "-" + Math.random().toString(16).slice(2, 8);
        const nextTask = [
          title,
          owner,
          dueDate,
          "Pendiente",
          priority,
          startDate,
          id,
          new Date().toISOString()
        ];
        nextTask[TASK_COLOR_INDEX] = defaultPendingTaskColor(nextTask);
        const normalizedCategory = normalizePendingCategory(category);
        if (normalizedCategory) {
          nextTask[TASK_CATEGORY_INDEX] = normalizedCategory;
          upsertPendingCategory(normalizedCategory);
        }
        tasks.unshift(nextTask);
        saveTaskState({ reason: "tarea-creada" });
        notifyTaskAssignment(nextTask, id, owner);
        return true;
      }

      const timelineCollapsedTaskIds = new Set();

      function timelineExpanded(parentTaskId) {
        return !timelineCollapsedTaskIds.has(String(parentTaskId || ""));
      }

      function setTimelineExpanded(parentTaskId, expanded) {
        const id = String(parentTaskId || "");
        if (!id) return;
        if (expanded) timelineCollapsedTaskIds.delete(id);
        else timelineCollapsedTaskIds.add(id);
      }

      function timelineMonthDays(monthId) {
        const match = String(monthId || "").match(/^(\d{4})-(\d{2})$/);
        if (!match) return 30;
        return new Date(Number(match[1]), Number(match[2]), 0).getDate();
      }

      function timelineDayKey(monthId, day) {
        return `${monthId}-${String(day).padStart(2, "0")}`;
      }

      function timelineWeekday(monthId, day) {
        const match = String(monthId || "").match(/^(\d{4})-(\d{2})$/);
        if (!match) return 0;
        return new Date(Number(match[1]), Number(match[2]) - 1, day).getDay();
      }

      // Recorta [startKey, endKey] a los dias del mes. Sin fecha fin deja la barra abierta.
      function timelineSpan(startKey, endKey, monthId, days) {
        const monthStart = timelineDayKey(monthId, 1);
        const monthEnd = timelineDayKey(monthId, days);
        const start = taskDateInputValue(startKey);
        const end = taskDateInputValue(endKey);
        if (!start && !end) return null;
        const effectiveStart = start || monthStart;
        const effectiveEnd = end || monthEnd;
        if (effectiveStart > monthEnd) return null;
        if (end && effectiveEnd < monthStart) return null;
        const clippedStart = effectiveStart < monthStart;
        const clippedEnd = !end || effectiveEnd > monthEnd;
        const startDay = clippedStart ? 1 : Number(effectiveStart.slice(8, 10));
        const endDay = clippedEnd ? days : Number(effectiveEnd.slice(8, 10));
        const safeStart = Math.min(Math.max(startDay || 1, 1), days);
        const safeEnd = Math.min(Math.max(endDay || safeStart, safeStart), days);
        return {
          start: safeStart,
          end: safeEnd,
          openStart: clippedStart,
          openEnd: clippedEnd,
          undated: false
        };
      }

      // Respaldo para tareas internas sin fechas: una marca repartida dentro del rango del padre.
      function timelineFallbackSpan(parentSpan, index, total) {
        if (!parentSpan) return null;
        const width = parentSpan.end - parentSpan.start + 1;
        const markWidth = Math.max(1, Math.min(2, width));
        const room = Math.max(0, width - markWidth);
        const slot = total > 1 ? Math.round((index * room) / (total - 1)) : Math.floor(room / 2);
        const start = Math.min(parentSpan.end, parentSpan.start + Math.max(0, slot));
        const end = Math.min(parentSpan.end, start + markWidth - 1);
        return { start, end, openStart: false, openEnd: false, undated: true };
      }

      function timelineBarStyle(span, extra = "") {
        return `grid-column:${span.start + 1} / ${span.end + 2};${extra}`;
      }

      function pendingTimelineHtml(visibleTasks, monthId, criticalTaskMap) {
        const days = timelineMonthDays(monthId);
        const monthLabel =
          financialMonthLabels.find((month) => month[0] === monthId)?.[2] || monthId;
        const todayKey = localDayKey();
        const todayDay = localMonthKey(todayKey) === monthId ? Number(todayKey.slice(8, 10)) : 0;

        const header = [];
        const columns = [];
        for (let day = 1; day <= days; day += 1) {
          const weekday = timelineWeekday(monthId, day);
          const isWeekend = weekday === 0 || weekday === 6;
          const isToday = day === todayDay;
          columns.push(
            `<span class="timeline-col ${isWeekend ? "is-weekend" : ""}" style="grid-column:${day + 1}" aria-hidden="true"></span>`
          );
          header.push(
            `<span class="timeline-day" style="grid-row:1;grid-column:${day + 1}"><b class="${isWeekend ? "is-weekend" : ""} ${isToday ? "is-today" : ""}">${day}</b></span>`
          );
        }

        const rows = [];
        let rowIndex = 1;
        let drawnTasks = 0;

        visibleTasks.forEach((task) => {
          const taskIndex = tasks.indexOf(task);
          const id = taskId(task, taskIndex);
          const span = timelineSpan(taskStartDay(task), task[2], monthId, days);
          if (!span) return;
          const subtasks = pendingSubtasks(task);
          const doneCount = subtasks.filter(
            (subtask) => normalizeText(subtask.status) === "completado"
          ).length;
          const color = pendingTaskColor(task, criticalTaskMap.get(id));
          const expanded = timelineExpanded(id);
          rowIndex += 1;
          drawnTasks += 1;

          const divider = drawnTasks > 1
            ? `<span class="timeline-divider" style="grid-row:${rowIndex};grid-column:1 / -1" aria-hidden="true"></span>`
            : "";

          rows.push(`
            ${divider}
            <div class="timeline-label is-parent" style="grid-row:${rowIndex};grid-column:1">
              ${
                subtasks.length
                  ? `<button class="timeline-toggle" type="button" data-timeline-toggle="${escapeHtml(id)}" aria-expanded="${expanded ? "true" : "false"}" aria-label="${expanded ? "Ocultar" : "Mostrar"} tareas internas">${expanded ? "&#9662;" : "&#9656;"}</button>`
                  : '<span class="timeline-toggle is-empty" aria-hidden="true"></span>'
              }
              <span class="timeline-label-body">
                <span class="timeline-label-title" title="${escapeHtml(task[0])}">${escapeHtml(task[0])}</span>
                <span class="timeline-label-owner">Resp. ${escapeHtml(task[1] || "Sin asignar")}</span>
              </span>
            </div>
            <div class="timeline-bar ${span.openEnd ? "is-open" : ""}" style="${timelineBarStyle(span, `grid-row:${rowIndex};--bar-color:${escapeHtml(color)}`)}" title="${escapeHtml(task[0])} · ${escapeHtml(task[1] || "Sin responsable")}">
              <span class="timeline-bar-title">${escapeHtml(task[0])}</span>
              ${subtasks.length ? `<span class="timeline-bar-badge">${doneCount}/${subtasks.length}</span>` : ""}
              ${span.openEnd ? '<span class="timeline-bar-more" title="Continua despues de este mes">&rsaquo;</span>' : ""}
            </div>
          `);

          if (!expanded) return;

          const undatedSubtasks = subtasks.filter(
            (subtask) => !subtask.startDate && !subtask.endDate
          );
          subtasks.forEach((subtask) => {
            const done = normalizeText(subtask.status) === "completado";
            const dated = Boolean(subtask.startDate || subtask.endDate);
            const subtaskSpan = dated
              ? timelineSpan(subtask.startDate, subtask.endDate, monthId, days)
              : timelineFallbackSpan(span, undatedSubtasks.indexOf(subtask), undatedSubtasks.length);
            if (!subtaskSpan) return;
            rowIndex += 1;
            const hint = subtaskSpan.undated ? " · Sin fecha propia" : "";
            rows.push(`
              <div class="timeline-label is-subtask" style="grid-row:${rowIndex};grid-column:1">
                <span class="timeline-label-title" title="${escapeHtml(subtask.title)}${hint}"><i aria-hidden="true">&#8627;</i>${escapeHtml(subtask.title)}</span>
              </div>
              <div class="timeline-subbar ${done ? "is-done" : "is-pending"} ${subtaskSpan.undated ? "is-undated" : ""} ${subtaskSpan.openEnd ? "is-open" : ""}" style="${timelineBarStyle(subtaskSpan, `grid-row:${rowIndex}`)}" title="${escapeHtml(subtask.title)}${hint}">
                ${subtaskSpan.openEnd ? '<span class="timeline-bar-more" title="Continua despues de este mes">&rsaquo;</span>' : ""}
              </div>
            `);
          });
        });

        const totalRows = rowIndex;
        const columnsHtml = columns
          .map((column) => column.replace('style="', `style="grid-row:2 / ${totalRows + 1};`))
          .join("");

        return `
          <div class="panel timeline-panel">
            <div class="timeline-head">
              <div>
                <strong>Mapa Visual &middot; Pendientes del mes</strong>
                <p class="small">Cada barra es un pendiente con sus tareas internas debajo. Usa el &#9656; para ocultarlas.</p>
              </div>
              <span class="month-chip">${escapeHtml(monthLabel)}</span>
            </div>
            ${
              rows.length
                ? `<div class="timeline-scroll">
                    <div class="timeline-grid" style="--timeline-days:${days}">
                      ${columnsHtml}
                      ${header.join("")}
                      ${rows.join("")}
                    </div>
                  </div>
                  <div class="timeline-legend">
                    <span><i class="dot is-bar"></i> Color del pendiente en el tablero</span>
                    <span><i class="dot is-done"></i> Tarea hecha</span>
                    <span><i class="dot is-pending"></i> Tarea pendiente</span>
                    <span>&rsaquo; = continua despues del mes</span>
                  </div>
                  <p class="small timeline-note">Las tareas internas sin fecha propia se reparten dentro del rango de su pendiente. Si les pones fecha de inicio y fin, se ubican exacto.</p>`
                : '<div class="empty">Sin pendientes con fechas en este mes.</div>'
            }
          </div>
        `;
      }

        return '"' + String(value ?? "").replace(/"/g, '""') + '"';

          task.completedBy || "Usuario local",
          task.action === "eliminada" ? "Borrado" : "Completado",
          formatTimer(task.totalSeconds || 0),
          task.startDate || "",
          task.dueDate || "",
          task.priority || ""
        ]);
        const csv = [headers, ...rows].map((row) => row.map(csvCell).join(";")).join("\r\n");
        const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "tareas-completadas-" + new Date().toISOString().slice(0, 10) + ".csv";
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
      }

      function tasksModule() {
        pruneActiveTimersByUser();
        syncLegacyActiveTimerFields();
        ensureTaskManualOrder();

        const statuses = ["Todos", "Pendiente", "En proceso", "Bloqueado"];
        const priorities = ["Todas", "Alta", "Media", "Baja"];
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const isOverdue = (task) => {
          if (!task[2]) return false;
          return task[3] !== "Completado" && new Date(task[2]) < today;
        };
        writePendingPresence(
          editingState.taskId
            ? {
                id: editingState.taskId,
                title: editingState.taskTitle,
                action: editingState.taskAction
              }
            : null
        );
        const collaboratorCards = pendingCollaboratorCards();
        const editorsByTask = pendingEditorsByTask();
        const owners = [
          ...new Set(
            [...suiteUsers]
              .sort((left, right) => (left.order || 99) - (right.order || 99) || (left.name || left.key).localeCompare(right.name || right.key, "es"))
              .map((user) => suitePendingOwnerName(user))
              .filter(Boolean)
          )
        ];
        if (state.taskOwner !== "Todos" && !owners.includes(state.taskOwner)) {
          state.taskOwner = "Todos";
        }
        const visible = tasks.filter((task) => {
          const statusMatch = state.taskStatus === "Todos" || task[3] === state.taskStatus;
          const priorityMatch = state.taskPriority === "Todas" || task[4] === state.taskPriority;
          const ownerMatch = state.taskOwner === "Todos" || task[1] === state.taskOwner;
          const monthMatch = taskMatchesMonth(task, state.taskMonth);
          return statusMatch && priorityMatch && ownerMatch && monthMatch;
        });
        const manualCategoryGroups = pendingManualCategoryGroups(visible);
        const categorizedTaskIds = new Set(
          manualCategoryGroups.flatMap((group) =>
            group.tasks.map((task) => {
              const index = tasks.indexOf(task);
              return taskId(task, index);
            })
          )
        );
        const routeVisible = visible.filter((task) => {
          const index = tasks.indexOf(task);
          return !categorizedTaskIds.has(taskId(task, index));
        });
        const criticalRoutes = suggestedCriticalRoutes(routeVisible);
        const criticalTaskMap = criticalTaskRouteMap(criticalRoutes);
        const routeGroupTasks = (routeIndex) => criticalRoutes[routeIndex]?.items.map((item) => item.task).filter(Boolean) || [];
        const routedTasks = new Set(criticalRoutes.flatMap((route) => route.items.map((item) => item.task)));
        const unassignedRouteTasks = routeVisible
          .filter((task) => !routedTasks.has(task))
          .sort((left, right) => compareTasksByManualOrder(left, right) || taskPriorityWeight(left) - taskPriorityWeight(right) || taskSortDateValue(left) - taskSortDateValue(right));
        const taskGroups = [
          ...manualCategoryGroups,

      let manychatClient = null;

      function ensureManychatClient() {
        if (manychatClient) return manychatClient;
        const config = window.LR_SUITE_SUPABASE || {};
        const supabaseUrl = config.url || "";
        const supabaseAnonKey = config.anonKey || config.anon_key || "";
        if (!window.supabase?.createClient || !supabaseUrl || !supabaseAnonKey) {
          return null;
        }
        manychatClient = ensureSharedPendingClient();
        return manychatClient;
      }

      function renderManychatStatus(content, message, detail = "") {
        content.innerHTML = `
          <section class="module">
            <div class="panel">
              <div class="panel-head">
                <strong>ManyChat Leads</strong>
                <p class="small">Leads recibidos desde el webhook de ManyChat y sincronizados con Supabase.</p>
              </div>

                <strong>${escapeHtml(message)}</strong>
                ${detail ? `<p class="small">${escapeHtml(detail)}</p>` : ""}
              </div>
            </div>
          </section>
        `;
      }

      function manychatFullName(lead) {
        return [lead.first_name, lead.last_name].filter(Boolean).join(" ").trim() || "Sin nombre";
      }

      function manychatEstadoBadge(estado) {
        const value = estado || "Nuevo";
        if (value === "Nuevo") return '<span class="badge sky">Nuevo</span>';
        return `<span class="badge">${escapeHtml(value)}</span>`;
      }

      async function manychatModule() {
        document.getElementById("app").querySelector(".content-body").innerHTML = "";
        const content = document.getElementById("app").querySelector(".content-body");
        renderManychatStatus(content, "Cargando Leads...");

        const supabase = ensureManychatClient();
        if (!supabase) {
          renderManychatStatus(
            content,
            "No se pudo conectar con Supabase.",
            "Revisa la configuración window.LR_SUITE_SUPABASE antes de abrir este módulo."
          );
          return;
        }

        const { data, error } = await supabase
          .from('mc_leads')
          .select('*')
          .order('created_at', { ascending: false });

        if (error) {
          renderManychatStatus(content, "No se pudieron cargar los leads.", error.message || "Error desconocido.");
          return;
        }

        const leads = Array.isArray(data) ? data : [];
        const rows = leads
          .map((lead) => {
            const dateStr = lead.created_at || "";
            const tagAds = lead.tag_ads || "";
            const estado = lead.estado || lead.status || "Nuevo";
            return `
              <tr>
                <td>${dateStr ? fmtDateTime(dateStr) : "Sin fecha"}</td>
                <td>${escapeHtml(manychatFullName(lead))}</td>
                <td>${escapeHtml(lead.phone || "Sin WhatsApp")}</td>
                <td>${escapeHtml(lead.email || "Sin email")}</td>
                <td>${tagAds ? `<span class="badge green">${escapeHtml(tagAds)}</span>` : '<span class="muted">Sin origen</span>'}</td>
                <td>${manychatEstadoBadge(estado)}</td>
              </tr>
            `;
          })
          .join("");

        content.innerHTML = `
          <section class="module">
            <div class="panel">
              <div class="panel-head">
                <strong>ManyChat Leads</strong>
                <p class="small">Leads recibidos desde ManyChat y guardados en la tabla mc_leads de Supabase.</p>
              </div>
              ${
                leads.length
                  ? `<div class="table-wrap">
                      <table>
                        <thead>
                          <tr>
                            <th>Fecha</th>
                            <th>Nombre Completo</th>
                            <th>WhatsApp</th>
                            <th>Email</th>
                            <th>Origen</th>
                            <th>Estado</th>
                          </tr>
                        </thead>
                        <tbody>${rows}</tbody>
                      </table>
                    </div>`
                  : `<div class="empty">No hay leads de ManyChat registrados todavía.</div>`
              }
            </div>
          </section>
        `;
      }

      function utmModule() {
        /* ── Constantes ── */
        const BLOCKS = [
          { id: "meta",   source: "meta",   defaultMedium: "paid_social", label: "Meta Ads"   },
          { id: "google", source: "google", defaultMedium: "cpc",         label: "Google Ads" },
          { id: "tiktok", source: "tiktok", defaultMedium: "paid_social", label: "TikTok Ads" }
        ];
        const MARCAS = [
          { value: "royal_baby", label: "Royal Baby" },
          { value: "marca_b",    label: "Marca B" },
          { value: "marca_c",    label: "Marca C" }
        ];

        /* ── Estado por bloque ── */
        const seqs = {};
        BLOCKS.forEach(b => { seqs[b.id] = { camp: 0, as: 0, ad: 0 }; });

        /* ── Utilidades ── */
        function sanitizeUtm(text) {
          const M = {á:"a",à:"a",ä:"a",â:"a",ã:"a",é:"e",è:"e",ë:"e",ê:"e",í:"i",ì:"i",ï:"i",î:"i",ó:"o",ò:"o",ö:"o",ô:"o",õ:"o",ú:"u",ù:"u",ü:"u",û:"u",ñ:"n",ç:"c"};
          return text.toLowerCase().split("").map(c => M[c] ?? c).join("").replace(/\s+/g,"_").replace(/[^a-z0-9_]/g,"").replace(/_+/g,"_").replace(/^_|_$/g,"");
        }
        function getVal(id) { return document.getElementById(id)?.value ?? ""; }
        function opts(items, p) {
          return `<option value="">${p}</option>` + items.map(i => `<option value="${escapeHtml(i.value)}">${escapeHtml(i.label)}</option>`).join("");
        }

              <button class="utm-delete-btn" data-action="delete-ad" data-ad="${adId}" data-as="${asId}" data-camp="${campId}" data-block="${blockId}" title="Eliminar anuncio">${icons.trash}</button>
            </div>`;
        }

        /* ── HTML: conjunto de anuncios (Nivel 2) ── */
        function adSetHtml(blockId, campId, asId) {
          const firstAdId = `ad${++seqs[blockId].ad}`;
          return `
            <div class="utm-adset-row" id="utm-${blockId}-${campId}-as-${asId}" data-as="${asId}" data-camp="${campId}" data-block="${blockId}">
              <div class="utm-adset-header">
                <span class="utm-adset-label">CONJUNTO</span>
                <input type="text" id="utm-${blockId}-${campId}-as-name-${asId}" placeholder="Nombre del Conjunto" />
                <button class="utm-delete-btn" data-action="delete-adset" data-as="${asId}" data-camp="${campId}" data-block="${blockId}" title="Eliminar conjunto">${icons.trash}</button>
              </div>
