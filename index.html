                <strong>${escapeHtml(message)}</strong>
                ${detail ? `<p class="small">${escapeHtml(detail)}</p>` : ""}
              </div>
            </div>
          </section>
        `;
      }

      function manychatFullName(lead) {
        return [lead.first_name, lead.last_name].filter(Boolean).join(" ").trim() || "Sin nombre";
      }

      function manychatEstadoBadge(estado) {
        const value = estado || "Nuevo";
        if (value === "Nuevo") return '<span class="badge sky">Nuevo</span>';
        return `<span class="badge">${escapeHtml(value)}</span>`;
      }

      async function manychatModule() {
        document.getElementById("app").querySelector(".content-body").innerHTML = "";
        const content = document.getElementById("app").querySelector(".content-body");
        renderManychatStatus(content, "Cargando Leads...");

        const supabase = ensureManychatClient();
        if (!supabase) {
          renderManychatStatus(
            content,
            "No se pudo conectar con Supabase.",
            "Revisa la configuración window.LR_SUITE_SUPABASE antes de abrir este módulo."
          );
          return;
        }

        const { data, error } = await supabase
          .from('mc_leads')
          .select('*')
          .order('created_at', { ascending: false });

        if (error) {
          renderManychatStatus(content, "No se pudieron cargar los leads.", error.message || "Error desconocido.");
          return;
        }

        const leads = Array.isArray(data) ? data : [];
        const rows = leads
          .map((lead) => {
            const dateStr = lead.created_at || "";
            const tagAds = lead.tag_ads || "";
            const estado = lead.estado || lead.status || "Nuevo";
            return `
              <tr>
                <td>${dateStr ? fmtDateTime(dateStr) : "Sin fecha"}</td>
                <td>${escapeHtml(manychatFullName(lead))}</td>
                <td>${escapeHtml(lead.phone || "Sin WhatsApp")}</td>
                <td>${escapeHtml(lead.email || "Sin email")}</td>
                <td>${tagAds ? `<span class="badge green">${escapeHtml(tagAds)}</span>` : '<span class="muted">Sin origen</span>'}</td>
                <td>${manychatEstadoBadge(estado)}</td>
              </tr>
            `;
          })
          .join("");

        content.innerHTML = `
          <section class="module">
            <div class="panel">
              <div class="panel-head">
                <strong>ManyChat Leads</strong>
                <p class="small">Leads recibidos desde ManyChat y guardados en la tabla mc_leads de Supabase.</p>
              </div>
              ${
                leads.length
                  ? `<div class="table-wrap">
                      <table>
                        <thead>
                          <tr>
                            <th>Fecha</th>
                            <th>Nombre Completo</th>
                            <th>WhatsApp</th>
                            <th>Email</th>
                            <th>Origen</th>
                            <th>Estado</th>
                          </tr>
                        </thead>
                        <tbody>${rows}</tbody>
                      </table>
                    </div>`
                  : `<div class="empty">No hay leads de ManyChat registrados todavía.</div>`
              }
            </div>
          </section>
        `;
      }
      // ── Fin ManyChat Module ──────────────────────────────────

      function utmModule() {
        /* ── Constantes ── */
        const BLOCKS = [
          { id: "meta",   source: "meta",   defaultMedium: "paid_social", label: "Meta Ads"   },
          { id: "google", source: "google", defaultMedium: "cpc",         label: "Google Ads" },
          { id: "tiktok", source: "tiktok", defaultMedium: "paid_social", label: "TikTok Ads" }
        ];
        const MARCAS = [
          { value: "royal_baby", label: "Royal Baby" },
          { value: "marca_b",    label: "Marca B" },
          { value: "marca_c",    label: "Marca C" }
        ];

        /* ── Estado por bloque ── */
        const seqs = {};
        BLOCKS.forEach(b => { seqs[b.id] = { camp: 0, as: 0, ad: 0 }; });

        /* ── Utilidades ── */
        function sanitizeUtm(text) {
          const M = {á:"a",à:"a",ä:"a",â:"a",ã:"a",é:"e",è:"e",ë:"e",ê:"e",í:"i",ì:"i",ï:"i",î:"i",ó:"o",ò:"o",ö:"o",ô:"o",õ:"o",ú:"u",ù:"u",ü:"u",û:"u",ñ:"n",ç:"c"};
          return text.toLowerCase().split("").map(c => M[c] ?? c).join("").replace(/\s+/g,"_").replace(/[^a-z0-9_]/g,"").replace(/_+/g,"_").replace(/^_|_$/g,"");
        }
        function getVal(id) { return document.getElementById(id)?.value ?? ""; }
        function opts(items, p) {
          return `<option value="">${p}</option>` + items.map(i => `<option value="${escapeHtml(i.value)}">${escapeHtml(i.label)}</option>`).join("");
        }

        /* ── HTML: fila de anuncio (Nivel 3) ── */
        function adRowHtml(blockId, campId, adId, asId) {
          return `
            <div class="utm-ad-row" id="utm-${blockId}-${campId}-ad-${adId}" data-ad="${adId}" data-as="${asId}" data-camp="${campId}" data-block="${blockId}">
              <span class="utm-ad-label">AD</span>
              <input type="text" class="utm-ad-name-input" id="utm-${blockId}-${campId}-ad-name-${adId}" placeholder="Nombre del Anuncio" />
              <input type="text" class="utm-url-output" id="utm-${blockId}-${campId}-ad-url-${adId}" readonly placeholder="Completa los campos de campaña…" />
              <button class="utm-copy-btn" data-action="copy-url" data-url-id="utm-${blockId}-${campId}-ad-url-${adId}">Copiar</button>
              <button class="utm-delete-btn" data-action="delete-ad" data-ad="${adId}" data-as="${asId}" data-camp="${campId}" data-block="${blockId}" title="Eliminar anuncio">${icons.trash}</button>
            </div>`;
        }

        /* ── HTML: conjunto de anuncios (Nivel 2) ── */
        function adSetHtml(blockId, campId, asId) {
          const firstAdId = `ad${++seqs[blockId].ad}`;
          return `
            <div class="utm-adset-row" id="utm-${blockId}-${campId}-as-${asId}" data-as="${asId}" data-camp="${campId}" data-block="${blockId}">
              <div class="utm-adset-header">
                <span class="utm-adset-label">CONJUNTO</span>
                <input type="text" id="utm-${blockId}-${campId}-as-name-${asId}" placeholder="Nombre del Conjunto" />
                <button class="utm-delete-btn" data-action="delete-adset" data-as="${asId}" data-camp="${campId}" data-block="${blockId}" title="Eliminar conjunto">${icons.trash}</button>
              </div>
              <div id="utm-${blockId}-${campId}-as-preview-${asId}" style="display:none;padding:3px 12px 7px">
                <span class="utm-preview" style="display:inline-flex">
                  <span class="utm-preview-label">utm_term:</span>
                  <span class="utm-preview-value" id="utm-${blockId}-${campId}-as-pv-${asId}"></span>
                </span>
              </div>
              <div id="utm-${blockId}-${campId}-ads-${asId}" class="utm-ads-container">
                ${adRowHtml(blockId, campId, firstAdId, asId)}
              </div>
              <button class="utm-add-ad-btn" data-action="add-ad" data-as="${asId}" data-camp="${campId}" data-block="${blockId}">+ Añadir Anuncio</button>
            </div>`;
        }

        /* ── HTML: contenedor de campaña (Nivel 1) ── */
        function campaignHtml(blockId, campId) {
          const firstAsId = `as${++seqs[blockId].as}`;
          return `
            <div class="utm-campaign-container" id="utm-${blockId}-${campId}" data-camp="${campId}" data-block="${blockId}" style="border-top:1px solid var(--line)">
              <div style="display:flex;align-items:center;padding:8px 18px;background:var(--surface-subtle);border-bottom:1px solid var(--line-soft)">
                <p style="margin:0;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--subtle)">Nivel 1 · Campaña</p>
                <button class="utm-delete-btn" data-action="delete-campaign" data-camp="${campId}" data-block="${blockId}" style="margin-left:auto" title="Eliminar campaña">${icons.trash}</button>
              </div>
              <div style="padding:14px 18px 16px;border-bottom:1px solid var(--line-soft)">
                <div class="utm-campaign-block">
                  <div class="form-field"><span>URL de Destino</span><input id="utm-${blockId}-${campId}-base-url" type="url" placeholder="https://…" /></div>
                  <div class="form-field"><span>Marca</span><select id="utm-${blockId}-${campId}-marca">${opts(MARCAS, "Seleccionar…")}</select></div>
                  <div class="form-field"><span>Nombre de la Campaña</span><input id="utm-${blockId}-${campId}-campaign-name" type="text" placeholder="ej. verano 2025" /></div>
                </div>
                <div id="utm-${blockId}-${campId}-preview" class="utm-preview" style="display:none;margin-top:10px">
                  <span class="utm-preview-label">utm_campaign:</span>
                  <span class="utm-preview-value" id="utm-${blockId}-${campId}-pv"></span>
                </div>
              </div>
              <div style="padding:14px 18px 18px">
                <p style="margin:0 0 12px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--subtle)">Niveles 2 y 3 · Conjuntos y Anuncios</p>
                <div id="utm-${blockId}-${campId}-tree" style="display:flex;flex-direction:column;gap:10px">
                  ${adSetHtml(blockId, campId, firstAsId)}
                </div>
                <button class="utm-add-adset-btn" style="margin-top:12px" data-action="add-adset" data-camp="${campId}" data-block="${blockId}">
                  ${icons.checks} Añadir Conjunto de Anuncios
                </button>
              </div>
            </div>`;
        }

        /* ── HTML: bloque de plataforma ── */
        function blockHtml(block) {
          const firstCampId = `camp${++seqs[block.id].camp}`;
          const pillStyle = `display:inline-flex;align-items:center;border:1px solid var(--green-line);border-radius:5px;background:var(--green-soft);overflow:hidden`;
          const lblStyle  = `padding:3px 6px 3px 9px;font-size:11px;font-weight:600;color:var(--green-700);font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;white-space:nowrap;line-height:1`;
          const inpStyle  = `border:none;border-left:1px solid var(--green-line);background:transparent;color:var(--green-700);padding:0 6px;font-size:11px;font-weight:600;height:26px;outline:none;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;min-width:0`;
          return `
            <div class="panel" id="utm-${block.id}-block" style="overflow:hidden;padding:0">
              <div style="display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line);background:var(--surface-subtle);flex-wrap:wrap">
                <strong style="font-size:13px;font-weight:700;color:var(--ink)">${block.label}</strong>
                <div style="${pillStyle}">
                  <span style="${lblStyle}">utm_source =</span>
                  <input id="utm-${block.id}-source" value="${block.source}" style="${inpStyle};width:80px" />
                </div>
                <div style="${pillStyle}">
                  <span style="${lblStyle}">utm_medium =</span>
                  <input id="utm-${block.id}-medium" value="${block.defaultMedium}" style="${inpStyle};width:100px" />
                </div>
                <div style="display:flex;gap:6px;margin-left:auto">
                  <button class="btn" style="font-size:11px;height:28px;padding:0 10px;display:inline-flex;align-items:center;gap:5px" data-action="export-csv" data-block="${block.id}">${icons.download} Exportar CSV</button>
                  <button class="btn" style="font-size:11px;height:28px;padding:0 10px" data-action="clear-block" data-block="${block.id}">Limpiar</button>
                </div>
              </div>
              <div id="utm-${block.id}-campaigns">
                ${campaignHtml(block.id, firstCampId)}
              </div>
              <div style="padding:10px 18px 14px;border-top:1px solid var(--line-soft)">
                <button class="utm-add-adset-btn" data-action="add-campaign" data-block="${block.id}">
                  ${icons.checks} Añadir Campaña
                </button>
              </div>
            </div>`;
        }

        /* ── Render ── */
        shell(`
          <section class="module">
            ${header("UTM Builder", "Genera URLs con parámetros UTM para Meta, Google y TikTok Ads. Los resultados aparecen inline en cada anuncio.", "Analítica Digital · GA4", icons.link, "<span></span>")}
            ${BLOCKS.map(b => blockHtml(b)).join("")}
          </section>
        `);

        /* ── Actualizar URLs (itera campañas del bloque) ── */
        function updateBlockUrls(blockId) {
          const source = getVal(`utm-${blockId}-source`) || BLOCKS.find(b => b.id === blockId).source;
          const medium = getVal(`utm-${blockId}-medium`) || BLOCKS.find(b => b.id === blockId).defaultMedium;
          document.getElementById(`utm-${blockId}-campaigns`)
            ?.querySelectorAll(".utm-campaign-container")
            .forEach(campEl => updateCampaignUrls(blockId, campEl.dataset.camp, source, medium));
        }

        function updateCampaignUrls(blockId, campId, source, medium) {
          const baseUrl  = getVal(`utm-${blockId}-${campId}-base-url`).trim();
          const marca    = getVal(`utm-${blockId}-${campId}-marca`);
          const cname    = sanitizeUtm(getVal(`utm-${blockId}-${campId}-campaign-name`));
          const campaign = (marca && cname) ? `${marca}_${cname}` : "";
          const sep      = baseUrl.includes("?") ? "&" : "?";
          const prevEl   = document.getElementById(`utm-${blockId}-${campId}-preview`);
          const pvVal    = document.getElementById(`utm-${blockId}-${campId}-pv`);
          if (prevEl && pvVal) {
            if (campaign) { prevEl.style.display = ""; pvVal.textContent = campaign; }
            else prevEl.style.display = "none";
          }
          const treeEl = document.getElementById(`utm-${blockId}-${campId}-tree`);
          if (!treeEl) return;
          treeEl.querySelectorAll(".utm-adset-row").forEach(asEl => {
            const asId    = asEl.dataset.as;
            const term    = sanitizeUtm(getVal(`utm-${blockId}-${campId}-as-name-${asId}`));
            const asPrev  = document.getElementById(`utm-${blockId}-${campId}-as-preview-${asId}`);
            const asPvVal = document.getElementById(`utm-${blockId}-${campId}-as-pv-${asId}`);
            if (asPrev && asPvVal) {
              if (term) { asPrev.style.display = ""; asPvVal.textContent = term; }
              else asPrev.style.display = "none";
            }
            asEl.querySelectorAll(".utm-ad-row").forEach(adEl => {
              const adId    = adEl.dataset.ad;
              const content = sanitizeUtm(getVal(`utm-${blockId}-${campId}-ad-name-${adId}`));
              const urlEl   = document.getElementById(`utm-${blockId}-${campId}-ad-url-${adId}`);
              if (!urlEl) return;
              if (!baseUrl || !campaign) { urlEl.value = ""; urlEl.title = ""; urlEl.classList.remove("has-url"); return; }
              const parts = [`utm_source=${source}`,`utm_medium=${medium}`,`utm_campaign=${campaign}`,...(term?[`utm_term=${term}`]:[]),...(content?[`utm_content=${content}`]:[])];
              const url = `${baseUrl}${sep}${parts.join("&")}`;
              urlEl.value = url; urlEl.title = url; urlEl.classList.add("has-url");
            });
          });
        }

        /* ── Exportar CSV de un bloque ── */
        function exportBlockCsv(blockId) {
          const source = getVal(`utm-${blockId}-source`) || BLOCKS.find(b => b.id === blockId).source;
          const medium = getVal(`utm-${blockId}-medium`) || BLOCKS.find(b => b.id === blockId).defaultMedium;
          const rows = [];
          document.getElementById(`utm-${blockId}-campaigns`)
            ?.querySelectorAll(".utm-campaign-container")
            .forEach(campEl => {
              const campId   = campEl.dataset.camp;
              const campaign = document.getElementById(`utm-${blockId}-${campId}-pv`)?.textContent || "";
              campEl.querySelectorAll(".utm-adset-row").forEach(asEl => {
                const asId = asEl.dataset.as;
                asEl.querySelectorAll(".utm-ad-row").forEach(adEl => {
                  const adId  = adEl.dataset.ad;
                  const urlEl = document.getElementById(`utm-${blockId}-${campId}-ad-url-${adId}`);
                  if (!urlEl?.value) return;
                  rows.push({source,medium,campaign,term:sanitizeUtm(getVal(`utm-${blockId}-${campId}-as-name-${asId}`)),content:sanitizeUtm(getVal(`utm-${blockId}-${campId}-ad-name-${adId}`)),url:urlEl.value});
                });
              });
            });
          if (!rows.length) return;
          const BOM="﻿",HEADERS=["#","utm_source","utm_medium","utm_campaign","utm_term","utm_content","URL"].join(",");
          const body=rows.map((r,i)=>[i+1,`"${r.source}"`,`"${r.medium}"`,`"${r.campaign}"`,`"${r.term}"`,`"${r.content}"`,`"${r.url}"`].join(",")).join("\n");
          const blob=new Blob([BOM+HEADERS+"\n"+body],{type:"text/csv;charset=utf-8;"});
          const url=URL.createObjectURL(blob);
          const a=Object.assign(document.createElement("a"),{href:url,download:`utm_${blockId}_${new Date().toISOString().slice(0,10)}.csv`});
          document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
        }

        /* ── Event listeners por bloque ── */
        BLOCKS.forEach(block => {
          const blockEl = document.getElementById(`utm-${block.id}-block`);
          if (!blockEl) return;
          blockEl.addEventListener("input",  () => updateBlockUrls(block.id));
          blockEl.addEventListener("change", () => updateBlockUrls(block.id));
          blockEl.addEventListener("click", e => {
            const btn = e.target.closest("[data-action]");
            if (!btn) return;
            const action  = btn.dataset.action;
            const blockId = btn.dataset.block || block.id;
            const campId  = btn.dataset.camp;
            const asId    = btn.dataset.as;
            const adId    = btn.dataset.ad;

            if (action === "add-campaign") {
              const campsEl = document.getElementById(`utm-${blockId}-campaigns`);
              if (!campsEl) return;
              const newCampId = `camp${++seqs[blockId].camp}`;
              const div = document.createElement("div");
              div.innerHTML = campaignHtml(blockId, newCampId);
              campsEl.appendChild(div.firstElementChild);
              document.getElementById(`utm-${blockId}-${newCampId}-base-url`)?.focus();
            }
            if (action === "delete-campaign" && campId) {
              const campsEl = document.getElementById(`utm-${blockId}-campaigns`);
              if (!campsEl || campsEl.querySelectorAll(".utm-campaign-container").length <= 1) return;
              document.getElementById(`utm-${blockId}-${campId}`)?.remove();
            }
            if (action === "add-adset" && campId) {
              const treeEl = document.getElementById(`utm-${blockId}-${campId}-tree`);
              if (!treeEl) return;
              const newAsId = `as${++seqs[blockId].as}`;
              const div = document.createElement("div");
              div.innerHTML = adSetHtml(blockId, campId, newAsId);
              treeEl.appendChild(div.firstElementChild);
              document.getElementById(`utm-${blockId}-${campId}-as-name-${newAsId}`)?.focus();
              updateBlockUrls(blockId);
            }
            if (action === "add-ad" && campId && asId) {
              const adsEl = document.getElementById(`utm-${blockId}-${campId}-ads-${asId}`);
              if (!adsEl) return;
              const newAdId = `ad${++seqs[blockId].ad}`;
              const div = document.createElement("div");
              div.innerHTML = adRowHtml(blockId, campId, newAdId, asId);
              adsEl.appendChild(div.firstElementChild);
              document.getElementById(`utm-${blockId}-${campId}-ad-name-${newAdId}`)?.focus();
              updateBlockUrls(blockId);
            }
            if (action === "delete-adset" && campId && asId) {
              const treeEl = document.getElementById(`utm-${blockId}-${campId}-tree`);
              if (!treeEl || treeEl.querySelectorAll(".utm-adset-row").length <= 1) return;
              document.getElementById(`utm-${blockId}-${campId}-as-${asId}`)?.remove();
            }
            if (action === "delete-ad" && campId && asId && adId) {
              const adsEl = document.getElementById(`utm-${blockId}-${campId}-ads-${asId}`);
              if (!adsEl || adsEl.querySelectorAll(".utm-ad-row").length <= 1) return;
              document.getElementById(`utm-${blockId}-${campId}-ad-${adId}`)?.remove();
            }
            if (action === "copy-url") {
              const urlEl = document.getElementById(btn.dataset.urlId);
              if (!urlEl?.value) return;
              navigator.clipboard.writeText(urlEl.value).catch(() => {});
              const orig = btn.textContent; btn.textContent = "✓";
              setTimeout(() => { btn.textContent = orig; }, 1500);
            }
            if (action === "export-csv") exportBlockCsv(blockId);
            if (action === "clear-block") {
              const b = BLOCKS.find(x => x.id === blockId);
              const srcEl = document.getElementById(`utm-${blockId}-source`);
              const medEl = document.getElementById(`utm-${blockId}-medium`);
              if (srcEl) srcEl.value = b.source;
              if (medEl) medEl.value = b.defaultMedium;
              seqs[blockId].camp = 0; seqs[blockId].as = 0; seqs[blockId].ad = 0;
              const campsEl = document.getElementById(`utm-${blockId}-campaigns`);
              if (!campsEl) return;
              campsEl.innerHTML = "";
              const newCampId = `camp${++seqs[blockId].camp}`;
              const div = document.createElement("div");
              div.innerHTML = campaignHtml(blockId, newCampId);
              campsEl.appendChild(div.firstElementChild);
            }
          });
        });
      }

      // ── Anuncios ─────────────────────────────────────────────
      // Los anuncios salen del export mensual de Meta Ads que vive en la carpeta "01 Meta Ads" de la
      // marca, ya sumados por anuncio, y cada uno trae su pieza de "06 Artes": un video, una imagen o un
      // carrusel. Una subcarpeta cuyo nombre termina en "(Carrusel)" es un anuncio carrusel y aqui se ve
      // lamina por lamina. Un anuncio sin pieza igual muestra sus numeros, con el hueco a la vista.
      // Las piezas se piden a Drive, no a Supabase: la miniatura al dibujar y el video solo al pulsarlo.
      const adsThumb = (id, ancho) => `https://drive.google.com/thumbnail?id=${encodeURIComponent(id)}&sz=w${ancho}`;
      const adsPlayer = (id) => `https://drive.google.com/file/d/${encodeURIComponent(id)}/preview`;

      let adsBrand = "";
      let adsMonth = "";
      let adsFilter = "todos";
      let adsSlide = {};
      let adsPlaying = {};

      // Los indices son los del mes que se esta viendo: al cambiar de marca o de mes dejan de valer.
      function adsResetViewState() {
        adsSlide = {};
        adsPlaying = {};
      }

      function adsBrandList() {
        return Array.isArray(adsPayload?.marcas) ? adsPayload.marcas : [];
      }

      function adsCurrentBrand() {
        const brands = adsBrandList();
        return brands.find((brand) => brand.marca === adsBrand) || brands[0] || null;
      }

      // Una hoja cuyo nombre no dice el mes llega sin `mes`: entonces manda su etiqueta.
      function adsMonthKey(month) {
        return String(month?.mes || month?.etiqueta || "");
      }

      function adsCurrentMonth() {
        const months = adsCurrentBrand()?.meses;
        if (!Array.isArray(months) || !months.length) return null;
        return months.find((month) => adsMonthKey(month) === adsMonth) || months[0];
      }

      function adsCreativeHtml(ad, index) {
        const creative = ad.creativo;
        if (!creative) {
          return `<div class="ad-creative empty">Sin pieza en Drive<br />con este nombre</div>`;
        }
        if (creative.tipo === "carrusel") {
          const slides = Array.isArray(creative.laminas) ? creative.laminas : [];
          if (!slides.length) return `<div class="ad-creative empty">El carrusel no tiene láminas</div>`;
          const position = ((adsSlide[index] || 0) % slides.length + slides.length) % slides.length;
          return `
            <div class="ad-creative">
              <img src="${escapeHtml(adsThumb(slides[position], 480))}" alt="Lámina ${position + 1} de ${slides.length}" loading="lazy" referrerpolicy="no-referrer" />
              <span class="ad-tag">Carrusel ${position + 1}/${slides.length}</span>
              ${slides.length > 1 ? `

      // Mapa de sincronización: por cada marca, la cadena que recorre un dato desde su carpeta de
      // Drive hasta el dashboard. El color sale de lo que ya está cargado, sin pedir nada más: el
      // link de la carpeta (clave "clientes-drive") y la última sincronización de anuncios (clave
      // "ads"). Verde es que esa parte está resuelta, rojo que hay algo que arreglar y gris que
      // todavía no existe, que no es lo mismo que estar roto.
      const CLIENTES_MAP_STALE_HOURS = 30;
      // Las tres vistas del módulo: «Conexiones» (las tarjetas de cada marca), «Automatización» (el
      // proceso por el que le llegan los datos) y «Alertas de Gasto» (presupuesto asignado vs. gastado).
      let clientesVista = "clientes";

      // sincronización; las demás, si su nombre sigue el estándar. Una carpeta fuera del estándar es
      // lo que hay que arreglar: la automatización busca las carpetas por su nombre.
      function clientesMapCarpetaNodo(carpeta, datos) {
        const nombre = String(carpeta?.nombre || "").trim();
        const url = carpeta?.id ? `https://drive.google.com/drive/folders/${carpeta.id}` : "";
        if (!carpeta?.estandar) {
          return { estado: "rojo", titulo: nombre, detalle: "Nombre fuera del estándar", url };
        }
        const { mes, anuncios, sinPieza } = datos;
        if (/^0[12] /.test(nombre) && mes) {
          return { estado: "verde", titulo: nombre, detalle: `${mes.etiqueta} · ${anuncios.length} anuncios`, url };
        }
        if (/^06 /.test(nombre) && mes) {
          return sinPieza
            ? { estado: "rojo", titulo: nombre, detalle: `${sinPieza} de ${anuncios.length} anuncios sin pieza`, url }
            : { estado: "verde", titulo: nombre, detalle: `Los ${anuncios.length} anuncios tienen pieza`, url };
        }
        return { estado: "verde", titulo: nombre, detalle: "Al estándar", url };
      }

      // La hoja nombra las carpetas con su camino ("02 Google Ads / Keywords"), así que la rama se
      // arma partiendo por "/": cada tramo cuelga del anterior. Un tramo intermedio sin fila propia
      // existe igual, como rama sin estado.
      function clientesArbol(carpetas, datos) {
        const raiz = [];
        const porCamino = new Map();
        (carpetas || []).forEach((carpeta) => {
          const tramos = String(carpeta?.nombre || "").split("/").map((tramo) => tramo.trim()).filter(Boolean);
          let hermanos = raiz;
          let camino = "";
          tramos.forEach((tramo, indice) => {
            camino = camino ? `${camino} / ${tramo}` : tramo;
            let nodo = porCamino.get(camino);
            if (!nodo) {
              nodo = { nombre: tramo, hijos: [] };
              porCamino.set(camino, nodo);
              hermanos.push(nodo);
            }
            if (indice === tramos.length - 1) {
              const vista = clientesMapCarpetaNodo(carpeta, datos);
              nodo.estado = vista.estado;
              nodo.detalle = vista.detalle;
              nodo.url = vista.url;
            }
            hermanos = nodo.hijos;
          });
        });
        return raiz;
      }

      function clientesArbolRojos(nodos) {
        return nodos.reduce(

          Array.isArray(clientesCarpetas?.errors) && clientesCarpetas.errors.length

          clientesCarpetasCargado && !clientesCarpetas
            ? `<div class="financial-notice">Falta instalar la lectura de carpetas: ejecuta <code>src/modules/clientes/BBDD/carpetas-clientes.sql</code> en Supabase y pulsa «Actualizar».</div>`

          if (Array.isArray(carpetas) && !carpetas.length) {

          }
          // El dashboard no es una carpeta, pero es donde termina la rama.
          arbol.push(
            !mes
              ? { nombre: "Dashboard", estado: "gris", hijos: [], detalle: "El módulo de Anuncios no muestra esta marca" }
              : vieja
                ? { nombre: "Dashboard", estado: "ambar", hijos: [], detalle: "La sincronización tiene más de un día" }
                : { nombre: "Dashboard", estado: "verde", hijos: [], detalle: `Anuncios · ${mes.etiqueta}` }
          );

          const drive = clientesDriveUrl(project);
          const rojos = clientesArbolRojos(arbol) + (drive ? 0 : 1);
          const search = normalizeText(
            projects.map((p) => [p.nombre, p.cliente, clientesClave(p), p.categoria, p.descripcion].join(" ")).join(" ")
          );

          return `
            <div class="clients-group" data-client-group>
              <div class="cbrand${archivada ? " archivada" : ""}" data-client-card data-archivada="${archivada ? "1" : "0"}" data-search="${escapeHtml(search)}" data-scope="${cliente === "Lima Retail" ? "interno" : "cliente"}">
                <div class="cbrand-head">
                  <span class="ctree-dot ${archivada ? "" : drive ? (rojos ? "rojo" : "verde") : "rojo"}"></span>
                  <p class="cbrand-name">${escapeHtml(cliente)}</p>
                  <span class="cbrand-state">${archivada ? "Archivada" : rojos ? `${rojos} por arreglar` : "Sin pendientes"}</span>
                  ${archivada
                    ? `<button class="cbrand-archive" type="button" data-client-restore="${escapeHtml(cliente)}" title="Vuelve a la lista de clientes">Restaurar</button>`
                    : `<button class="cbrand-archive" type="button" data-client-archive="${escapeHtml(cliente)}" title="Sale de la lista y queda guardada en «Archivadas»">Archivar</button>`}
                </div>
                ${projects
                  .map(
                    (item) => `
                      <div class="cbrand-project">
                        <span class="client-row-name" title="${escapeHtml(`${item.categoria} · ${item.descripcion}`)}">${escapeHtml(clientesShortName(item))}</span>
                        <div class="client-links">
                          ${clientesLinkHtml("Drive", clientesDriveUrl(item), "La carpeta de Drive se lee de Supabase; falta cargarla ahi")}
                          ${item.repo ? clientesLinkHtml("Repo", clientesRepoUrl(item.repo), "") : ""}
                          ${item.repo ? clientesLinkHtml("Pages", item.publicado ? clientesDashboardUrl(item.repo) : "", "Sin dashboard publicado en GitHub Pages") : ""}
                          ${clientesLinkHtml("En vivo", clientesEnVivoUrl(item), "El subdominio de la marca todavia no esta publicado")}
                        </div>
                      </div>
                    `
                  )
                  .join("")}
                ${clientesArbolHtml(arbol)}
              </div>
            </div>
          `;
        });

        return `
          ${avisos}
          <div class="panel">
            <div class="cmap-legend">
              <span class="automation-light verde">Resuelto</span>
              <span class="automation-light rojo">Hay que arreglarlo</span>
              <span class="automation-light ambar">Atrasado</span>
              <span class="automation-light">Todavía no existe</span>
              ${leido ? `<span>${leido}</span>` : ""}
              <button class="ads-filter" type="button" data-clientes-carpetas-sync ${clientesCarpetasSync ? "disabled" : ""}>${clientesCarpetasSync ? "Leyendo…" : "Actualizar"}</button>
            </div>
            <div class="cbrands">${bloques.join("")}</div>
            <p class="clients-empty" id="clientsEmpty" style="display:none">No hay proyectos que coincidan con la búsqueda.</p>
          </div>
        `;
      }
      // El trabajo interno se parte por categoria: un bloque largo no cabe en una columna y obligaria
      // a hacer scroll. Esta etiqueta es la que encabeza la tarjeta y con la que se archiva la marca.
      function clientesEtiqueta(project) {
        return project.cliente === "Lima Retail" ? `Lima Retail · ${project.categoria}` : project.cliente;
      }

      function clientesArchivada(project) {
        return clientesArchivadas.includes(clientesEtiqueta(project));
      }

      function clientesGroups() {
        const groups = new Map();
        clientesProyectos.forEach((project) => {
          const label = clientesEtiqueta(project);
          if (!groups.has(label)) groups.set(label, []);
          groups.get(label).push(project);
        });
        // Los clientes van primero y el trabajo interno cierra la lista.
        return [...groups.entries()].sort((left, right) => {
          const leftInterno = left[0].startsWith("Lima Retail");
          const rightInterno = right[0].startsWith("Lima Retail");
          if (leftInterno !== rightInterno) return leftInterno ? 1 : -1;
          return left[0].localeCompare(right[0]);
        });
      }

      function clientesShortName(project) {
        // El nombre del cliente ya encabeza el grupo, no hace falta repetirlo.
        const prefix = `${project.cliente} · `;
        return project.nombre.startsWith(prefix) ? project.nombre.slice(prefix.length) : project.nombre;
      }

      function clientesLinkHtml(label, url, faltante) {
        if (!url) {
          return `<span class="client-link off" title="${escapeHtml(faltante)}">${escapeHtml(label)}</span>`;
        }
        return `<a class="client-link" href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer" title="${escapeHtml(url)}">${escapeHtml(label)}</a>`;
      }

      function clientesModule() {
        const groups = clientesGroups();
        // Las marcas archivadas no cuentan como trabajo vivo: se resumen aparte.
        const activos = clientesProyectos.filter((project) => !clientesArchivada(project));
        const marcasArchivadas = groups.filter(([cliente]) => clientesArchivadas.includes(cliente)).length;
        const total = activos.length;
        const publicados = activos.filter((project) => project.publicado).length;
        const resumen = [
          `${publicados} dashboards activos`,
          total - publicados ? `${total - publicados} sin publicar` : "",
          marcasArchivadas ? `${marcasArchivadas} archivadas` : ""
        ]
          .filter(Boolean)
          .join(" · ");
        const hayInternos = activos.some((project) => project.cliente === "Lima Retail");

        shell(`
          <section class="module clients-module">
            <div class="panel clients-bar">
              <div class="clients-bar-head">
                <p class="clients-title">Clientes</p>
                <p class="clients-sub" id="clientsCount">${total} proyectos · ${resumen}</p>
              </div>
              ${clientesVista === "clientes"
                ? `
                  <input class="clients-search" id="clientsSearch" type="search" placeholder="Buscar cliente o repositorio" autocomplete="off" />
                  <button class="clients-filter active" type="button" data-client-filter="todos">Todos</button>
                  <button class="clients-filter" type="button" data-client-filter="cliente">Clientes</button>
                  ${hayInternos ? `<button class="clients-filter" type="button" data-client-filter="interno">Lima Retail</button>` : ""}
                  ${marcasArchivadas ? `<button class="clients-filter" type="button" data-client-filter="archivadas">Archivadas · ${marcasArchivadas}</button>` : ""}
                `
                : ""}
              <button class="clients-filter ${clientesVista === "clientes" ? "active" : ""}" type="button" data-client-view="clientes">Conexiones</button>
              <button class="clients-filter ${clientesVista === "automatizacion" ? "active" : ""}" type="button" data-client-view="automatizacion">Automatización</button>
              <button class="clients-filter ${clientesVista === "gasto" ? "active" : ""}" type="button" data-client-view="gasto">Alertas de Gasto</button>
              ${clientesVista === "automatizacion" ? automationToolbar() : ""}
              ${clientesVista === "gasto" ? gastoToolbar() : ""}
            </div>

            ${
              clientesVista === "automatizacion"
                ? automationSectionHtml()
                : clientesVista === "gasto"
                  ? gastoSectionHtml()
                  : clientesArbolPanelHtml(groups)
            }
          </section>
        `);

        document.querySelectorAll("[data-client-view]").forEach((button) => {
          button.addEventListener("click", () => {
            clientesVista = button.dataset.clientView;
            clientesModule();
          });
        });

        document.querySelectorAll("[data-clientes-carpetas-sync]").forEach((button) => {
          button.addEventListener("click", syncClientesCarpetas);
        });

        if (clientesVista === "automatizacion") {
          // Redibujar el proceso es volver a dibujar Clientes, que es quien lo contiene.
          wireAutomationModule(clientesModule);
          return;
        }
        if (clientesVista === "gasto") {
          wireGastoModule(clientesModule);
          return;
        }
        // El resto de la pantalla es la vista de tarjetas: en el mapa no hay nada que filtrar.
        if (clientesVista !== "clientes") return;

        let clientsScope = "todos";

        function applyClientsFilters() {
          const query = normalizeText(document.getElementById("clientsSearch")?.value || "");
          let visible = 0;

          document.querySelectorAll("[data-client-group]").forEach((group) => {
            let groupVisible = 0;
            group.querySelectorAll("[data-client-card]").forEach((card) => {
              // Una marca archivada solo sale en su propia pestaña, nunca mezclada con las demás.
              const archivada = card.dataset.archivada === "1";
              const matchesScope =
                clientsScope === "archivadas"
                  ? archivada
                  : !archivada && (clientsScope === "todos" || card.dataset.scope === clientsScope);
              const matchesQuery = !query || card.dataset.search.includes(query);
              const show = matchesScope && matchesQuery;
              card.style.display = show ? "" : "none";
              if (show) groupVisible += 1;
            });

            group.style.display = groupVisible ? "" : "none";
            const counter = group.querySelector("[data-client-group-count]");
            if (counter) counter.textContent = groupVisible;
            visible += groupVisible;
          });

          const count = document.getElementById("clientsCount");
          if (count) {
            const sinFiltrar = clientsScope === "todos" && !query;
            count.textContent = sinFiltrar
              ? `${total} proyectos · ${resumen}`
              : `${visible} ${visible === 1 ? "marca" : "marcas"} a la vista · ${resumen}`;
          }

          const empty = document.getElementById("clientsEmpty");
          if (empty) empty.style.display = visible ? "none" : "";
        }

        document.getElementById("clientsSearch")?.addEventListener("input", applyClientsFilters);

        document.querySelectorAll("[data-client-filter]").forEach((button) => {
          button.addEventListener("click", () => {
            clientsScope = button.dataset.clientFilter;
            document.querySelectorAll("[data-client-filter]").forEach((other) => {
              other.classList.toggle("active", other === button);
            });
            applyClientsFilters();
          });
        });

        document.querySelectorAll("[data-client-archive]").forEach((button) => {
          button.addEventListener("click", () => {
            const marca = button.dataset.clientArchive;
            if (
              !window.confirm(
                `¿Archivar ${marca}?\n\nSale de la lista de clientes y queda guardada en «Archivadas», con sus accesos y su rama de carpetas. Se puede restaurar cuando quieras.`
              )
            ) {
              return;
            }
            guardarClientesArchivadas([...clientesArchivadas, marca]);
          });
        });

        document.querySelectorAll("[data-client-restore]").forEach((button) => {
          button.addEventListener("click", () => {
            const marca = button.dataset.clientRestore;
            guardarClientesArchivadas(clientesArchivadas.filter((nombre) => nombre !== marca));
          });
        });

        // Al dibujar, las archivadas ya tienen que estar fuera de la lista.
        applyClientsFilters();
      }

      // ── Clientes · Alertas de Gasto ───────────────────────────────────────────
      // El presupuesto asignado a cada cuenta publicitaria frente a lo que ya gastó. La primera
      // plataforma es Google Ads: su «Informe de rendimiento» (administrador → Cuentas → Informe de
      // rendimiento → Descargar CSV) se sube a mano, porque la descarga automática de las plataformas
      // todavía no existe (ver la vista «Automatización»).
      // Todo vive en Supabase (lr_suite_private_data, clave "gasto-alertas"): este repositorio es
      // público y los nombres de las cuentas, sus ids y lo que gasta cada marca no pueden estar aquí.
      // Son unos pocos KB y se leen la primera vez que se abre la vista, no en cada sesión:
      //   { informes: { "2026-10": { plataforma, desde, hasta, subidoAt, subidoPor, cuentas: [...] } },
      //     cuentas:  { "<id de cliente>": { marca, presupuestos: { "2026-10": 1200 } } } }
      const GASTO_KEY = "gasto-alertas";
      // Un mes que proyecta hasta un 5 % por encima de lo asignado todavía cierra en lo asignado; por
      // debajo del 85 % el presupuesto se va a quedar sin usar, que también es algo que avisar.
      const GASTO_TOLERANCIA = 0.05;
      const GASTO_SUBUSO = 0.85;
      // El presupuesto diario cargado en Google es el techo real del gasto. Si por 30 días da menos del
      // 85 % de lo asignado, la cuenta no puede llegar ni queriendo; un techo holgado es normal, pero
      // más de vez y media lo asignado deja la puerta abierta a un mes que se dispara.
      const GASTO_DIARIO_PISO = 0.85;
      const GASTO_DIARIO_TECHO = 1.5;

      let gastoDatos = null;
      let gastoCargado = false;
      let gastoCargando = false;
      // Ya se pidió la lectura al menos una vez. Sin esto, una lectura que falla se volvería a pedir en
      // cada redibujado, porque el redibujado es lo que la dispara.
      let gastoIntentado = false;
      let gastoGuardando = false;
      let gastoError = "";
      let gastoMensaje = "";
      let gastoMesActivo = "";

      function gastoNormalizar(payload) {
        const fuente = payload && typeof payload === "object" ? payload : {};
        const informes = fuente.informes && typeof fuente.informes === "object" ? fuente.informes : {};
        const cuentas = fuente.cuentas && typeof fuente.cuentas === "object" ? fuente.cuentas : {};
        return { informes, cuentas };
      }

      async function loadGastoAlertas(force = false) {
        if (gastoCargando) return;
        if (gastoCargado && !force) return;
        const client = ensureSharedPendingClient();
        if (!client || !getSuiteAccessSession()) return;
        gastoIntentado = true;
        gastoCargando = true;
        try {
          const { data, error } = await client
            .from(PRIVATE_DATA_TABLE)
            .select("payload")
            .eq("key", GASTO_KEY)
            .maybeSingle();
          if (error) {
            console.warn("No se pudieron cargar las alertas de gasto:", error.message);
            gastoError = "No se pudieron leer los presupuestos desde Supabase. Recarga la página.";
          } else {
            gastoDatos = gastoNormalizar(data?.payload);
            gastoCargado = true;
            gastoError = "";
          }
        } finally {
          gastoCargando = false;
          rerenderGasto();
        }
      }

      // La lectura se pide al abrir la vista, igual que el Control de Automatización: quien no entra a
      // Alertas de Gasto no paga esa lectura.
      function ensureGastoCargado() {
        if (gastoCargado || gastoCargando || gastoIntentado) return;
        loadGastoAlertas();
      }

      function rerenderGasto() {
        if (hasSuiteAccess() && state.active === "clientes" && clientesVista === "gasto") clientesModule();
      }

      // El payload entero se guarda de una vez: son unos pocos KB y así el informe y los presupuestos
      // nunca quedan desparejos. Si Supabase no lo acepta, la pantalla vuelve a como estaba.
      async function guardarGasto(siguiente, mensaje = "") {
        const anterior = gastoDatos;
        gastoDatos = siguiente;
        gastoError = "";
        gastoMensaje = mensaje;
        gastoGuardando = true;
        rerenderGasto();

        const client = ensureSharedPendingClient();
        let fallo = "no hay sesión de Supabase";
        if (client && getSuiteAccessSession()) {
          const { error } = await client
            .from(PRIVATE_DATA_TABLE)
            .upsert({ key: GASTO_KEY, payload: siguiente, updated_at: new Date().toISOString() }, { onConflict: "key" });
          fallo = error ? error.message : "";
        }
        gastoGuardando = false;
        if (fallo) {
          console.warn("No se pudo guardar el gasto:", fallo);
          gastoDatos = anterior;
          gastoMensaje = "";
          gastoError = "No se pudo guardar el cambio en Supabase. Quedó como estaba.";
          rerenderGasto();
          return false;
        }
        rerenderGasto();
        return true;
      }

      // ── Reglas y Optimización ──────────────────────────────────────────────
      // Las reglas de cada marca viven en «08 Reglas y Optimización», dentro de su carpeta de
      // Drive, y un pg_cron las copia a Supabase cada día (src/modules/reglas/). Acá no hay ningún
      // umbral escrito: una marca sin reglas no tiene hito, y eso se dice en pantalla en lugar de
      // aplicarle una plantilla que nadie revisó.
      const REGLAS_KEY = "reglas-nexus";

      // Lo que este módulo sabe calcular para cada «Acción Automática» de la hoja. Alertas de Gasto
      // solo ve presupuesto y proyección: las acciones que miran creatividades o públicos se
      // anuncian igual, pero sus datos están en Anuncios, así que se dice dónde buscarlos.
      const REGLAS_ACCIONES = {
        alerta_pacing: { titulo: "Proyección frente a lo asignado" },
        escalar_presupuesto: { titulo: "Cuentas con margen para escalar" },
        pausar_fatigados: { titulo: "Frecuencia y fatiga creativa", modulo: "Anuncios" },
        alerta_overlap: { titulo: "Solapamiento de públicos", modulo: "Anuncios" },
        renovar_arte: { titulo: "Piezas que se desgastan", modulo: "Anuncios" },
        mover_inversion: { titulo: "Rendimiento por formato", modulo: "Anuncios" },
        escalar_ganador: { titulo: "Campañas con costo a la baja", modulo: "Anuncios" }
      };

      // Cada marca declara dos ciclos en el mismo libro, uno por plataforma: en Google se mueve
      // presupuesto diario y públicos, en Meta se mueve el arte y el formato. Una regla que llegue
      // sin «fuente» viene de un barrido anterior a la separación y es del ciclo de Google.
      const REGLAS_FUENTES = [
        { fuente: "google", etiqueta: "Google Ads" },
        { fuente: "meta", etiqueta: "Meta Ads" }
      ];
      const reglaFuente = (regla) => (regla?.fuente === "meta" ? "meta" : "google");

      let reglasDatos = null;
      let reglasCargado = false;
      let reglasCargando = false;
      let reglasIntentado = false;
      let reglasError = "";
      // El análisis que devolvió la IA, por marca. Vive lo que dure la sesión: es un texto de
      // trabajo, no un dato que haya que guardar ni que pagar dos veces de egress.
      const reglasAnalisis = new Map();
      let reglasAnalizando = "";
      let reglasMarcaElegida = "";

      async function loadReglas(force = false) {
        if (reglasCargando) return;
        if (reglasCargado && !force) return;
        const client = ensureSharedPendingClient();
        if (!client || !getSuiteAccessSession()) return;
        reglasIntentado = true;
        reglasCargando = true;
        try {
          const { data, error } = await client
            .from(PRIVATE_DATA_TABLE)
            .select("payload")
            .eq("key", REGLAS_KEY)
            .maybeSingle();
          if (error) {
            console.warn("No se pudieron cargar las reglas:", error.message);
            reglasError = "No se pudieron leer las reglas desde Supabase. Recarga la página.";
          } else {
            reglasDatos = data?.payload || null;
            reglasCargado = true;
            reglasError = "";
          }
        } finally {
          reglasCargando = false;
          rerenderGasto();
        }
      }

      // Se pide al abrir la vista, como los presupuestos: quien no entra a Alertas de Gasto no paga
      // esta lectura.
      function ensureReglasCargado() {
        if (reglasCargado || reglasCargando || reglasIntentado) return;
        loadReglas();
      }

      function reglasPorMarca() {
        const marcas = reglasDatos?.marcas;
        return marcas && typeof marcas === "object" ? marcas : {};
      }

      // El operador se compara tal como está escrito en la hoja. Una celda con «mayor que» en lugar
      // de «>» deja la regla sin aplicar, y eso es mejor que adivinar qué se quiso decir.
      function reglaCumple(regla, dia) {
        if (!regla || regla.metrica !== "dias_mes") return false;
        const valor = Number(regla.valor);
        if (!Number.isFinite(valor)) return false;
        switch (regla.operador) {
          case "<":
            return dia < valor;
          case "<=":
            return dia <= valor;
          case "==":
            return dia === valor;
          case ">=":
            return dia >= valor;
          case ">":
            return dia > valor;
          case "!=":
            return dia !== valor;
          default:
            return false;
        }
      }

      // Los hitos se evalúan en el orden de la hoja y gana el primero que cumple: con «<= 7»,
      // «<= 14», «<= 21» y «> 21», el día 10 cae en el segundo y solo en el segundo.
      // Se evalúa dentro de una sola fuente: los dos ciclos llegan en la misma lista y mezclarlos
      // dejaría que el hito de Meta gane el día de Google, o al revés.
      function reglaHitoDe(reglas, dia, fuente = "google") {
        return (
          (Array.isArray(reglas) ? reglas : []).find(
            (regla) => reglaFuente(regla) === fuente && reglaCumple(regla, dia)
          ) || null
        );
      }

      // El día con el que se evalúan las reglas. Un mes que ya cerró no tiene «hoy»: se lee con su
      // último día, que es el final del ciclo, y no con la fecha de quien está mirando.
      function reglasDiaDe(modelo) {
        const ahora = new Date();
        const mesActual = `${ahora.getFullYear()}-${String(ahora.getMonth() + 1).padStart(2, "0")}`;
        return modelo.mes === mesActual
          ? { dia: ahora.getDate(), enCurso: true }
          : { dia: modelo.totales.diasMes, enCurso: false };
      }

      // Qué hito corre en cada marca. Casi siempre es el mismo para todas, pero una marca puede
      // haber movido el corte de su semana, así que se agrupa por hito en lugar de suponer uno.
      function reglasHitosDe(dia) {
        const grupos = new Map();
        REGLAS_FUENTES.forEach(({ fuente, etiqueta }) => {
          Object.entries(reglasPorMarca()).forEach(([marca, datos]) => {
            const hito = reglaHitoDe(datos?.reglas, dia, fuente);
            if (!hito) return;
            const clave = `${fuente}/${hito.id}`;
            const actual = grupos.get(clave) || { hito, fuente, etiqueta, marcas: [] };
            actual.marcas.push(marca);
            grupos.set(clave, actual);
          });
        });
        // El ciclo de Google va primero porque es el que este módulo puede respaldar con cifras.
        return [...grupos.entries()]
          .sort((left, right) => left[0].localeCompare(right[0]))
          .map(([, grupo]) => grupo);
      }

      // Cuántas marcas tienen reglas de una fuente. Sirve para no decir «todas las marcas» en el
      // ciclo de Meta cuando la mitad todavía no pasó por crearReglas().
      function conteoMarcasDeFuente(fuente) {
        return Object.values(reglasPorMarca()).filter((datos) =>
          (Array.isArray(datos?.reglas) ? datos.reglas : []).some(
            (regla) => reglaFuente(regla) === fuente
          )
        ).length;
      }

      // Las cifras del módulo que respaldan la acción del hito. Las dos acciones que no salen de
      // aquí devuelven vacío: la tarjeta lo dice y manda al módulo que sí las tiene.
      function reglasEvidencia(modelo, grupo) {
        // Las cifras de este módulo son los presupuestos de Google Ads. El ciclo de Meta comparte
        // nombres de acción con el de Google («alerta_pacing»), así que sin este corte una tarjeta
        // de Meta mostraría el pacing de Google como si fuera suyo.
        if (grupo.fuente !== "google") return [];
        const dentro = (fila) => grupo.marcas.includes(fila.marca);
        if (grupo.hito.accion === "alerta_pacing") {
          return gastoAlertas(modelo)
            .filter((alerta) => dentro(alerta.fila))
            .map((alerta) => ({ fila: alerta.fila, texto: alerta.texto }));
        }
        if (grupo.hito.accion === "escalar_presupuesto") {
          // Escalar es para la cuenta que va a cerrar por debajo de lo asignado: ahí queda
          // presupuesto sin usar que todavía se puede mover.
          return modelo.filas
            .filter((fila) => dentro(fila) && fila.presupuesto && fila.proyeccion < fila.presupuesto)
            .sort(
              (left, right) =>
                right.presupuesto - right.proyeccion - (left.presupuesto - left.proyeccion)
            )
            .map((fila) => {
              const moneda = fila.cuenta.moneda || "PEN";
              return {
                fila,
                texto: `Proyecta ${gastoMonto(fila.proyeccion, moneda)} de ${gastoMonto(fila.presupuesto, moneda)}: quedan ${gastoMonto(fila.presupuesto - fila.proyeccion, moneda)} por invertir en lo que falta del mes.`
              };
            });
        }
        return [];
      }

      // Lo que viaja a la Edge Function: solo cifras de la marca que se analiza, sin nombres de
      // persona ni nada que no sirva para el análisis.
      function reglasNumeros(modelo, marca) {
        return {
          mes: modelo.mes,
          dias: modelo.totales.dias,
          diasMes: modelo.totales.diasMes,
          cuentas: modelo.filas
            .filter((fila) => fila.marca === marca)
            .map((fila) => ({
              cuenta: fila.cuenta.nombre,
              moneda: fila.cuenta.moneda || "PEN",
              presupuesto: Math.round(fila.presupuesto),
              gastado: Math.round(fila.cuenta.coste),
              ritmoDiario: Math.round(fila.ritmo),
              proyeccion: Math.round(fila.proyeccion),
              desvio: Math.round(fila.desvio),
              topeDiarioEnGoogle: Math.round(fila.cuenta.diario || 0),
              estado: fila.estado.texto
            }))
        };
      }

      // Marcas que se pueden analizar: tienen reglas con la IA activada y cuentas en el informe.
      // Sin cuentas no hay cifras que darle al modelo, y un análisis sin cifras no vale nada. Solo
      // el ciclo de Google: lo que se le manda al modelo son los presupuestos de Google Ads, y el
      // ciclo de Meta se analiza en el módulo de Anuncios, que es donde están sus cifras.
      function reglasMarcasAnalizables(modelo, grupos) {
        const conDatos = new Set(modelo.filas.map((fila) => fila.marca).filter(Boolean));
        return grupos
          .filter((grupo) => grupo.fuente === "google" && grupo.hito.ia)
          .flatMap((grupo) => grupo.marcas)
          .filter((marca) => conDatos.has(marca))
          .sort((left, right) => left.localeCompare(right));
      }

      async function reglasPedirAnalisis(modelo, marca) {
        const { dia } = reglasDiaDe(modelo);
        const hito = reglaHitoDe(reglasPorMarca()[marca]?.reglas, dia);
        if (!hito || !marca) return;
        reglasAnalizando = marca;
        reglasError = "";
        rerenderGasto();
        try {
          const client = ensureSharedPendingClient();
          if (!client) throw new Error("Sin conexión con Supabase.");
          const { data: sesion } = await client.auth.getSession();
          const token = sesion?.session?.access_token;
          if (!token) throw new Error("La sesión caducó: vuelve a iniciar sesión.");
          const config = sharedPendingConfig();
          const respuesta = await fetch(`${config.url}/functions/v1/reglas-analisis`, {
            method: "POST",
            headers: {
              "content-type": "application/json",
              authorization: `Bearer ${token}`,
              apikey: config.anonKey
            },
            body: JSON.stringify({ marca, hito, numeros: reglasNumeros(modelo, marca) })
          });
          const salida = await respuesta.json().catch(() => ({}));
          if (!respuesta.ok) throw new Error(salida?.error || `La función respondió ${respuesta.status}`);
          reglasAnalisis.set(marca, { texto: String(salida.texto || "").trim(), hito: hito.id });
        } catch (error) {
          reglasError = `No se pudo pedir el análisis: ${error.message}`;
        } finally {
          reglasAnalizando = "";
          rerenderGasto();
        }
      }

      // El botón «Actualizar reglas»: hace el barrido de las hojas en Supabase y vuelve a leer la
      // fila. Es la misma función que corre el pg_cron, con otro origen para que se distinga.
      async function reglasSincronizar() {
        const client = ensureSharedPendingClient();
        if (!client || !getSuiteAccessSession()) return;
        reglasCargando = true;
        reglasError = "";
        rerenderGasto();
        try {
          const { error } = await client.rpc("lr_suite_reglas_refresh", {
            p_trigger: "manual",
            p_requested_by: currentSuiteUserName()
          });
          if (error) throw new Error(error.message);
        } catch (error) {
          reglasError = `No se pudieron sincronizar las reglas: ${error.message}`;
        } finally {
          reglasCargando = false;
          reglasCargado = false;
          loadReglas(true);
        }
      }

      const gastoFormatos = new Map();

      // Cada cuenta tiene su moneda. Los montos del mes van sin céntimos, que a esa escala no dicen
      // nada; el ritmo diario y el presupuesto diario sí los necesitan.
      function gastoMonto(value, moneda = "PEN") {
        const monto = Number(value) || 0;
        const codigo = /^[A-Z]{3}$/.test(String(moneda)) ? String(moneda) : "PEN";
        const decimales = Math.abs(monto) < 100 ? 2 : 0;
        const clave = `${codigo}|${decimales}`;
        if (!gastoFormatos.has(clave)) {
          gastoFormatos.set(
            clave,
            new Intl.NumberFormat("es-PE", {
              style: "currency",
              currency: codigo,
              maximumFractionDigits: decimales,
              minimumFractionDigits: decimales
            })
          );
        }
        return gastoFormatos.get(clave).format(monto).replace(/\s/g, " ");
      }

      function gastoMesEtiqueta(mes) {
        const [anio, numero] = String(mes || "").split("-");
        const nombre = SHEET_MONTH_NAMES[Number(numero) - 1] || "";
        return nombre ? `${nombre[0].toUpperCase()}${nombre.slice(1)} ${anio}` : String(mes || "");
      }

      // Los números del informe vienen en formato español: "3.123,65" es 3123,65 y " --" es sin dato.
      function gastoNumero(value) {
        const texto = String(value ?? "").replace(/\s/g, "").replace("%", "");
        if (!texto || texto === "--") return 0;
        const limpio = texto.replace(/\./g, "").replace(",", ".").replace(/[^\d.-]/g, "");
        const numero = Number(limpio);
        return Number.isFinite(numero) ? numero : 0;
      }

      // "20 de octubre de 2026" o "2026-10-20" → "2026-10-20".
      function gastoFecha(texto) {
        const fuente = String(texto || "").trim();
        const iso = fuente.match(/(\d{4})-(\d{2})-(\d{2})/);
        if (iso) return `${iso[1]}-${iso[2]}-${iso[3]}`;
        const largo = normalizeText(fuente).match(/(\d{1,2}) de ([a-z]+) de (\d{4})/);
        if (!largo) return "";
        const mes = SHEET_MONTH_NAMES.indexOf(largo[2]);
        if (mes < 0) return "";
        return `${largo[3]}-${String(mes + 1).padStart(2, "0")}-${largo[1].padStart(2, "0")}`;
      }

      // La segunda línea del informe es su periodo: "1 de octubre de 2026 - 20 de octubre de 2026".
      function gastoPeriodo(linea) {
        const partes = String(linea || "").split(/\s[-–—]\s/);
        if (partes.length < 2) return null;
        const desde = gastoFecha(partes[0]);
        const hasta = gastoFecha(partes[1]);
        return desde && hasta && desde <= hasta ? { desde, hasta } : null;
      }

      function gastoParseInforme(texto) {
        const filas = parseSheetCsv(texto).filter((fila) => fila.some((celda) => String(celda).trim()));
        if (!filas.length) return { error: "El archivo está vacío." };
        const cabeceraIndex = filas.findIndex((fila) => fila.some((celda) => normalizeText(celda) === "nombre de cuenta"));
        if (cabeceraIndex < 0) {
          return { error: "No parece el Informe de rendimiento de Google Ads: no tiene la columna «Nombre de cuenta»." };
        }
        const periodo = filas
          .slice(0, cabeceraIndex)
          .map((fila) => gastoPeriodo(fila[0]))
          .find(Boolean);
        if (!periodo) {
          return {
            error:
              "El informe no trae el periodo: es la línea con las fechas que va arriba de la tabla. Descarga el CSV completo, sin quitarle las primeras filas."
          };
        }
        const cabecera = filas[cabeceraIndex].map(normalizeText);
        // «Código de moneda» sale dos veces en el informe (la de la cuenta y la convertida): la
        // primera es la de la cuenta, que es la que manda en su presupuesto.
        const columna = (nombre) => cabecera.indexOf(nombre);
        const iNombre = columna("nombre de cuenta");
        const iId = columna("id de cliente externo de la cuenta");
        const iEstado = columna("estado de la cuenta");
        const iMoneda = columna("codigo de moneda");
        const iCoste = columna("coste");
        const iConvertido = columna("coste (moneda convertida)");
        const iMonedaConvertida = columna("codigo de moneda convertida");
        const iDiario = columna("presupuesto diario total");
        const iImpresiones = columna("impr.");
        const iClics = columna("clics");
        const iConversiones = columna("conversiones");
        if (iCoste < 0) return { error: "El informe no trae la columna «Coste»." };

        const cuentas = filas
          .slice(cabeceraIndex + 1)
          .filter((fila) => {
            // Las filas de totales del informe no son cuentas: van sin nombre y empiezan con "Total:".
            const nombre = String(fila[iNombre] || "").trim();
            return nombre && !/^total/.test(normalizeText(fila[0] || ""));
          })
          .map((fila) => {
            const nombre = String(fila[iNombre]).trim();
            return {
              id: (iId >= 0 ? String(fila[iId] || "").trim() : "") || nombre,
              nombre,
              estado: iEstado >= 0 ? String(fila[iEstado] || "").trim() : "",
              moneda: (iMoneda >= 0 ? String(fila[iMoneda] || "").trim() : "").toUpperCase(),
              monedaConvertida: (iMonedaConvertida >= 0 ? String(fila[iMonedaConvertida] || "").trim() : "").toUpperCase(),
              coste: gastoNumero(fila[iCoste]),
              costeConvertido: iConvertido >= 0 ? gastoNumero(fila[iConvertido]) : 0,
              diario: iDiario >= 0 ? gastoNumero(fila[iDiario]) : 0,
              impresiones: iImpresiones >= 0 ? gastoNumero(fila[iImpresiones]) : 0,
              clics: iClics >= 0 ? gastoNumero(fila[iClics]) : 0,
              conversiones: iConversiones >= 0 ? gastoNumero(fila[iConversiones]) : 0
            };
          });
        if (!cuentas.length) return { error: "El informe no trae ninguna cuenta." };
        return { informe: { plataforma: "google", desde: periodo.desde, hasta: periodo.hasta, cuentas } };
      }

      // El mes del informe es el de su última fecha: con un informe a mitad de mes, lo que se compara
      // es el presupuesto de ese mes.
      function gastoMesDe(informe) {
        return String(informe?.hasta || "").slice(0, 7);
      }

      function gastoDiasDelMes(mes) {
        const [anio, numero] = String(mes || "").split("-").map(Number);
        if (!anio || !numero) return 30;
        return new Date(anio, numero, 0).getDate();
      }

      function gastoDiasCubiertos(informe) {
        const desde = new Date(`${informe.desde}T12:00:00`);
        const hasta = new Date(`${informe.hasta}T12:00:00`);
        const dias = Math.round((hasta - desde) / 86400000) + 1;
        return Number.isFinite(dias) && dias > 0 ? dias : 1;
      }

      // El informe trae el coste en la moneda de la cuenta y convertido a la del administrador: de esas
      // dos cifras sale el tipo de cambio, sin pedírselo a nadie. Una cuenta en otra moneda y sin gasto
      // no tiene tipo de cambio, así que no puede sumar al total.
      function gastoTipoCambio(cuenta) {
        if (!cuenta.monedaConvertida || cuenta.moneda === cuenta.monedaConvertida) return 1;
        return cuenta.coste && cuenta.costeConvertido ? cuenta.costeConvertido / cuenta.coste : 0;
      }

      function gastoMarcasDisponibles() {
        return [...new Set(clientesProyectos.map((project) => project.cliente))].sort((left, right) =>
          left.localeCompare(right)
        );
      }

      function gastoClave(texto) {
        return normalizeText(texto).replace(/[^a-z0-9]/g, "");
      }

      // El nombre de la cuenta en Google casi nunca es el de la marca ("IDG_AQUARIUSCONSULTING_PEN_
      // DIRECTA"), pero la contiene. Lo que se elija a mano manda sobre esta sugerencia.
      function gastoMarcaSugerida(nombre) {
        const clave = gastoClave(nombre);
        return gastoMarcasDisponibles().find((marca) => clave.includes(gastoClave(marca))) || "";
      }

      function gastoMarcaDe(cuenta) {
        const guardada = gastoDatos?.cuentas?.[cuenta.id];
        if (guardada && typeof guardada.marca === "string") return guardada.marca;
        return gastoMarcaSugerida(cuenta.nombre);
      }

      function gastoPresupuesto(cuenta, mes) {
        return Number(gastoDatos?.cuentas?.[cuenta.id]?.presupuestos?.[mes]) || 0;
      }

      // El semáforo, en un solo sitio: lo usan la fila de cada cuenta y el pacing por marca, y así
      // los umbrales no se escriben dos veces.
      function gastoEstadoDe(presupuesto, gastado, proyeccion) {
        if (!presupuesto) return { id: "sin-presupuesto", texto: "Sin presupuesto", tono: "" };
        if (gastado > presupuesto) return { id: "sobregirado", texto: "Sobregirado", tono: "rose" };
        if (!gastado) return { id: "sin-gasto", texto: "Sin gasto", tono: "amber" };
        if (proyeccion > presupuesto * (1 + GASTO_TOLERANCIA)) return { id: "se-pasa", texto: "Se pasará", tono: "rose" };
        if (proyeccion > presupuesto) return { id: "al-limite", texto: "Al límite", tono: "amber" };
        if (proyeccion < presupuesto * GASTO_SUBUSO) return { id: "corto", texto: "Quedará corto", tono: "amber" };
        return { id: "en-ritmo", texto: "En ritmo", tono: "green" };
      }

      // De peor a mejor, para que la marca que necesita una decisión hoy quede arriba.
      const GASTO_ORDEN_ESTADO = ["sobregirado", "se-pasa", "al-limite", "sin-gasto", "corto", "en-ritmo", "sin-presupuesto"];

      function gastoFila(cuenta, informe, mes) {
        const presupuesto = gastoPresupuesto(cuenta, mes);
        const diasMes = gastoDiasDelMes(mes);
        const dias = Math.min(diasMes, gastoDiasCubiertos(informe));
        const ritmo = cuenta.coste / dias;
        const proyeccion = ritmo * diasMes;
        const consumido = presupuesto ? cuenta.coste / presupuesto : 0;
        const desvio = presupuesto ? proyeccion - presupuesto : 0;
        // Lo que daría el presupuesto diario que está cargado en Google si corriera todo el mes.
        const diarioProyectado = cuenta.diario * diasMes;
        const estado = gastoEstadoDe(presupuesto, cuenta.coste, proyeccion);
        return {
          cuenta,
          marca: gastoMarcaDe(cuenta),
          presupuesto,
          dias,
          diasMes,
          avanceMes: Math.min(1, dias / diasMes),
          ritmo,
          proyeccion,
          consumido,
          desvio,
          diarioProyectado,
          cambio: gastoTipoCambio(cuenta),
          estado
        };
      }

      function gastoModelo() {
        const informes = gastoDatos?.informes || {};
        const meses = Object.keys(informes).sort().reverse();
        const mes = meses.includes(gastoMesActivo) ? gastoMesActivo : meses[0] || "";
        const informe = mes ? informes[mes] : null;
        if (!informe) return { meses, mes: "", informe: null, filas: [], totales: null };
        const filas = (informe.cuentas || [])
          .map((cuenta) => gastoFila(cuenta, informe, mes))
          .sort((left, right) => right.cuenta.coste - left.cuenta.coste);
        const moneda =
          filas.find((fila) => fila.cuenta.monedaConvertida)?.cuenta.monedaConvertida || filas[0]?.cuenta.moneda || "PEN";
        // Al total solo entran las cuentas con tipo de cambio: las demás se cuentan aparte y se dicen.
        const convertibles = filas.filter((fila) => fila.cambio);
        // El consumido y el desvío se miden solo sobre las cuentas que tienen presupuesto: con el
        // gasto de todas contra el presupuesto de unas pocas saldría un porcentaje que no dice nada.
        const asignadas = convertibles.filter((fila) => fila.presupuesto);
        const totales = {
          moneda,
          presupuesto: asignadas.reduce((suma, fila) => suma + fila.presupuesto * fila.cambio, 0),
          gastado: convertibles.reduce((suma, fila) => suma + fila.cuenta.coste * fila.cambio, 0),
          proyeccion: convertibles.reduce((suma, fila) => suma + fila.proyeccion * fila.cambio, 0),
          gastadoAsignado: asignadas.reduce((suma, fila) => suma + fila.cuenta.coste * fila.cambio, 0),
          proyeccionAsignada: asignadas.reduce((suma, fila) => suma + fila.proyeccion * fila.cambio, 0),
          conPresupuesto: asignadas.length,
          sinCambio: filas.length - convertibles.length,
          enAlerta: filas.filter((fila) => fila.estado.tono === "rose" || fila.estado.tono === "amber").length,
          dias: filas[0]?.dias || gastoDiasCubiertos(informe),
          diasMes: gastoDiasDelMes(mes)
        };
        return { meses, mes, informe, filas, totales };
      }

      // El pacing por marca: cómo va cada una contra lo suyo, que es como se contrata y como se
      // conversa con el cliente. El presupuesto de la marca es la suma del de sus cuentas, así que
      // sale de lo que ya se captura y no hay nada nuevo que escribir cada mes.
      //
      // Solo entran las cuentas con tipo de cambio, igual que en los totales: sumar soles con
      // dólares daría una cifra que no dice nada. Las que quedan fuera se cuentan y se dicen.
      function gastoPorMarca(modelo) {
        if (!modelo.totales) return [];
        const { dias, diasMes, moneda } = modelo.totales;
        const grupos = new Map();

        modelo.filas.forEach((fila) => {
          const marca = fila.marca || "Sin marca";
          const grupo = grupos.get(marca) || {
            marca,
            cuentas: 0,
            sinCambio: 0,
            conPresupuesto: 0,
            presupuesto: 0,
            gastado: 0,
            proyeccion: 0
          };
          grupo.cuentas += 1;
          if (!fila.cambio) {
            grupo.sinCambio += 1;
          } else {
            if (fila.presupuesto) grupo.conPresupuesto += 1;
            grupo.presupuesto += fila.presupuesto * fila.cambio;
            grupo.gastado += fila.cuenta.coste * fila.cambio;
            grupo.proyeccion += fila.proyeccion * fila.cambio;
          }
          grupos.set(marca, grupo);
        });

        return [...grupos.values()]
          .map((grupo) =>
            Object.assign(grupo, {
              moneda,
              ritmo: dias ? grupo.gastado / dias : 0,
              consumido: grupo.presupuesto ? grupo.gastado / grupo.presupuesto : 0,
              desvio: grupo.presupuesto ? grupo.proyeccion - grupo.presupuesto : 0,
              avanceMes: Math.min(1, dias / diasMes),
              // Lo que habría que gastar por día en lo que queda para cerrar justo en lo asignado.
              porDia:
                grupo.presupuesto && diasMes > dias
                  ? Math.max(0, grupo.presupuesto - grupo.gastado) / (diasMes - dias)
                  : 0,
              estado: gastoEstadoDe(grupo.presupuesto, grupo.gastado, grupo.proyeccion)
            })
          )
          .sort(
            (left, right) =>
              GASTO_ORDEN_ESTADO.indexOf(left.estado.id) - GASTO_ORDEN_ESTADO.indexOf(right.estado.id) ||
              right.gastado - left.gastado
          );
      }

      // Las alertas en palabras: lo que hay que hacer con esa cuenta, no solo su color.
      function gastoAlertas(modelo) {
        const alertas = [];
        modelo.filas.forEach((fila) => {
          const { cuenta, presupuesto, estado } = fila;
          const moneda = cuenta.moneda || "PEN";
          const avance = `${fila.dias} de ${fila.diasMes} días del mes`;
          if (estado.id === "sobregirado") {
            alertas.push({
              peso: 0,
              fila,
              texto: `Ya gastó ${gastoMonto(cuenta.coste, moneda)} de los ${gastoMonto(presupuesto, moneda)} asignados (${fmtMetricPercent(fila.consumido * 100)}) con ${avance}.`
            });
          } else if (estado.id === "se-pasa") {
            alertas.push({
              peso: 1,
              fila,
              texto: `Al ritmo de ${gastoMonto(fila.ritmo, moneda)} por día cerraría el mes en ${gastoMonto(fila.proyeccion, moneda)}: ${gastoMonto(fila.desvio, moneda)} por encima de lo asignado.`
            });
          } else if (estado.id === "al-limite") {
            alertas.push({
              peso: 2,
              fila,
              texto: `Va justo: proyecta ${gastoMonto(fila.proyeccion, moneda)} contra ${gastoMonto(presupuesto, moneda)} asignados, con ${avance}.`
            });
          } else if (estado.id === "sin-gasto") {
            alertas.push({
              peso: 2,
              fila,
              texto: `Tiene ${gastoMonto(presupuesto, moneda)} asignados y no gastó nada en ${avance}.`
            });
          } else if (estado.id === "corto") {
            alertas.push({
              peso: 3,
              fila,
              texto: `Proyecta ${gastoMonto(fila.proyeccion, moneda)} y quedarían ${gastoMonto(presupuesto - fila.proyeccion, moneda)} sin usar de los ${gastoMonto(presupuesto, moneda)} asignados.`
            });
          } else if (estado.id === "sin-presupuesto" && cuenta.coste) {
            alertas.push({
              peso: 4,
              fila,
              texto: `Gastó ${gastoMonto(cuenta.coste, moneda)} y todavía no tiene presupuesto asignado para ${gastoMesEtiqueta(modelo.mes)}.`
            });
          }
          // El presupuesto diario cargado en Google es el techo real del gasto: si no cuadra con lo
          // asignado, el mes no puede cerrar donde se quiere, por abajo o por arriba.
          if (presupuesto && cuenta.diario) {
            if (fila.diarioProyectado < presupuesto * GASTO_DIARIO_PISO) {
              alertas.push({
                peso: 5,
                fila,
                texto: `El presupuesto diario cargado en Google (${gastoMonto(cuenta.diario, moneda)}) da ${gastoMonto(fila.diarioProyectado, moneda)} en ${fila.diasMes} días: con ese techo la cuenta no llega a los ${gastoMonto(presupuesto, moneda)} asignados.`
              });
            } else if (fila.diarioProyectado > presupuesto * GASTO_DIARIO_TECHO) {
              alertas.push({
                peso: 6,
                fila,
                texto: `El presupuesto diario cargado en Google (${gastoMonto(cuenta.diario, moneda)}) permite gastar hasta ${gastoMonto(fila.diarioProyectado, moneda)} en el mes, muy por encima de los ${gastoMonto(presupuesto, moneda)} asignados.`
              });
            }
          } else if (presupuesto && !cuenta.diario) {
            alertas.push({
              peso: 6,
              fila,
              texto: `El informe no trae presupuesto diario para esta cuenta, así que no hay techo que comparar con los ${gastoMonto(presupuesto, moneda)} asignados.`
            });
          }
        });
        return alertas.sort((left, right) => left.peso - right.peso || right.fila.cuenta.coste - left.fila.cuenta.coste);
      }

      function gastoBadge(estado) {
        return `<span class="badge ${estado.tono}">${escapeHtml(estado.texto)}</span>`;
      }

      function gastoToolbar() {
        const modelo = gastoModelo();
        const informe = modelo.informe;
        const estado = gastoCargando
          ? "Leyendo los presupuestos…"
          : gastoGuardando
            ? "Guardando…"
            : gastoMensaje ||
              (informe
                ? `Informe del ${fmtDate(informe.desde)} al ${fmtDate(informe.hasta)}${informe.subidoAt ? ` · subido ${fmtDateTime(informe.subidoAt)}` : ""}`
