      // Ruedita del panel: los correos que reciben el resumen diario de pendientes (8:30 a. m.). La lista
      // vive en la tabla lr_suite_notificaciones de Supabase y el workflow resumen-pendientes la lee al
      // enviar (src/modules/lista-pendientes/BBDD/resumen-pendientes-correo.sql).
      const NOTIFICATIONS_TABLE = "lr_suite_notificaciones";
      const NOTIFICATIONS_ID = "resumen-pendientes";
      const NOTIFICATION_EMAIL_RE = /^[^\s@<>(),;:"]+@[^\s@<>(),;:"]+\.[a-z]{2,}$/i;

      function notificationRecipientsCopy(list) {
        return (Array.isArray(list) ? list : []).map((item) => ({
          nombre: String(item?.nombre || ""),
          email: String(item?.email || "")
        }));
      }

      async function openNotificationSettings() {
        state.notificationsConfig = true;
        state.notificationRecipients = { list: [], status: "loading" };
        updateSuiteNotificationsDom();
        const client = ensureSharedPendingClient();
        if (!client || !getSuiteAccessSession()) {
          state.notificationRecipients = { list: [], status: "error", message: "Inicia sesión en la Suite para ver los correos.", tone: "late" };
        } else {
          const { data, error } = await client
            .from(NOTIFICATIONS_TABLE)
            .select("destinatarios, actualizado_en, actualizado_por")
            .eq("id", NOTIFICATIONS_ID)
            .maybeSingle();
          state.notificationRecipients = error
            ? {
                list: [],
                status: "error",
                message: /schema cache|does not exist|PGRST205/i.test(error.message)
                  ? "Falta instalar la tabla de correos: ejecuta resumen-pendientes-correo.sql en Supabase."
                  : `No se pudo leer la lista de correos: ${error.message}`,
                tone: "late"
              }
            : {
                list: notificationRecipientsCopy(data?.destinatarios),
                status: "ready",
                updatedAt: data?.actualizado_en || "",
                updatedBy: data?.actualizado_por || ""
              };
        }
        if (state.notificationsOpen && state.notificationsConfig) updateSuiteNotificationsDom();
      }

      async function saveNotificationRecipients() {
        const settings = state.notificationRecipients;
        const seen = new Set();
        const list = settings.list
          .map((item) => ({ nombre: item.nombre.trim().slice(0, 60), email: item.email.trim().toLowerCase() }))
          .filter((item) => item.nombre || item.email)
          .filter((item) => !seen.has(item.email) && seen.add(item.email));
        const invalid = list.find((item) => !NOTIFICATION_EMAIL_RE.test(item.email));
        if (invalid) {
          Object.assign(settings, { message: `Revisa el correo «${invalid.email || "vacío"}».`, tone: "late" });
          updateSuiteNotificationsDom();
          return;
        }
        Object.assign(settings, { status: "saving", message: "" });
        updateSuiteNotificationsDom();
        const client = ensureSharedPendingClient();
        const now = new Date().toISOString();
        const author = currentSuiteUserName();
        const { error } = client && getSuiteAccessSession()
          ? await client
              .from(NOTIFICATIONS_TABLE)
              .upsert({ id: NOTIFICATIONS_ID, destinatarios: list, actualizado_en: now, actualizado_por: author })
          : { error: { message: "no hay sesión de Supabase" } };
        state.notificationRecipients = error
          ? { ...settings, status: "ready", message: `No se pudo guardar: ${error.message}`, tone: "late" }
          : {
              list: notificationRecipientsCopy(list),
              status: "ready",
              updatedAt: now,
              updatedBy: author,
              message: list.length
                ? "Guardado: el próximo resumen llega a estos correos."
                : "Guardado sin correos: el resumen no se enviará.",
              tone: list.length ? "ok" : "warn"
            };
        if (state.notificationsOpen && state.notificationsConfig) updateSuiteNotificationsDom();
      }

      function notificationSettingsHtml() {
        const settings = state.notificationRecipients || { list: [], status: "loading" };
        const editable = settings.status === "ready";
        const off = editable ? "" : "disabled";
        const rows = settings.list
          .map(
            (item, index) => `
              <div class="notif-recipient">
                <input type="text" value="${escapeHtml(item.nombre)}" placeholder="Nombre" maxlength="60" aria-label="Nombre" data-recipient="${index}" data-recipient-field="nombre" ${off}>
                <input type="email" value="${escapeHtml(item.email)}" placeholder="correo@empresa.com" aria-label="Correo" data-recipient="${index}" data-recipient-field="email" ${off}>
                <button class="notif-recipient-remove" type="button" title="Quitar este correo" aria-label="Quitar este correo" data-recipient-remove="${index}" ${off}>×</button>
              </div>
            `
          )
          .join("");
        const statusText =
          { loading: "Cargando la lista…", saving: "Guardando…" }[settings.status] || settings.message || "";
        const changed = settings.updatedAt
          ? ` Último cambio: ${new Date(settings.updatedAt).toLocaleString("es-PE", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })}${settings.updatedBy ? ` (${escapeHtml(settings.updatedBy)})` : ""}.`
          : "";
        return `
          <div class="notif-head">
            <div>
              <strong>Correos del resumen de pendientes</strong>
              <p>Llega todos los días a las 8:30 a. m. con los pendientes abiertos del equipo.</p>
            </div>
            <div class="notif-head-actions">
              <button class="notif-close" type="button" data-notifications-back>Volver</button>
            </div>
          </div>
          <div class="notif-recipients">
            ${rows || (editable ? '<div class="notif-empty">Sin correos: el resumen no se enviará.</div>' : "")}
            ${editable ? '<button class="notif-recipient-add" type="button" data-recipient-add>+ Agregar correo</button>' : ""}
          </div>
          <div class="notif-settings-foot">
            <span class="notif-settings-msg ${settings.status === "ready" || settings.status === "error" ? escapeHtml(settings.tone || "") : ""}">${escapeHtml(statusText)}</span>
            ${editable || settings.status === "saving" ? `<button class="notif-save" type="button" data-recipient-save ${off}>Guardar</button>` : ""}
          </div>
          <p class="notif-foot">Lo pueden cambiar las cuentas de la Suite.${changed}</p>
        `;
      }

      function suiteNotificationsHtml() {
        const scope = state.notificationsScope === "todos" ? "todos" : "mios";
        const items = pendingNotificationItems(scope);
        const summary = pendingNotificationSummary(items);
        const countTone = summary.late ? "late" : summary.warn ? "warn" : summary.total ? "" : "none";
        const headline = summary.total
          ? [
              `${summary.total} ${summary.total === 1 ? "pendiente abierto" : "pendientes abiertos"}`,
              summary.late ? `${summary.late} con ${NOTIF_LATE_DAYS} días o más` : "",
              summary.overdue ? `${summary.overdue} con fecha vencida` : ""
            ]
              .filter(Boolean)
              .join(" · ")
          : "Sin pendientes abiertos";
        return `
          <button
            class="notif-toggle ${state.notificationsOpen ? "open" : ""}"
            id="suiteNotificationsToggle"
            type="button"
            aria-expanded="${state.notificationsOpen ? "true" : "false"}"
            aria-controls="suiteNotificationsPanel"
            title="Notificaciones de pendientes"
          >
            ${icons.bell}
            <span class="notif-toggle-text">Notificaciones</span>
            <span class="notif-count ${countTone}">${summary.total}</span>
          </button>
          <div class="notif-panel" id="suiteNotificationsPanel" role="dialog" aria-label="Notificaciones de pendientes" ${state.notificationsOpen ? "" : "hidden"}>
            ${state.notificationsConfig ? notificationSettingsHtml() : `
            <div class="notif-head">
              <div>
                <strong>${scope === "todos" ? "Pendientes del equipo" : `Pendientes de ${escapeHtml(currentSuiteUserName())}`}</strong>
                <p>${escapeHtml(headline)}</p>
              </div>
              <div class="notif-head-actions">
                <button class="notif-settings" type="button" title="Correos del resumen diario" aria-label="Configurar los correos del resumen diario" data-notifications-settings>${icons.settings}</button>
                <button class="notif-close" type="button" data-close-notifications>Cerrar</button>
              </div>
            </div>
            <div class="notif-scope">
              <button class="${scope === "mios" ? "active" : ""}" type="button" data-notifications-scope="mios">Míos</button>
              <button class="${scope === "todos" ? "active" : ""}" type="button" data-notifications-scope="todos">Todos</button>
            </div>
            <div class="notif-list">
              ${items.length ? items.map(notificationItemHtml).join("") : '<div class="notif-empty">No hay pendientes abiertos para este filtro.</div>'}

            <p class="notif-foot">Los días se cuentan desde la fecha de inicio. Haz clic en un pendiente para abrirlo en el tablero.</p>`}

        `;

      function updateSuiteNotificationsDom() {
        const zone = document.getElementById("suiteNotifications");
        if (!zone) return false;
        zone.innerHTML = suiteNotificationsHtml();
        wireSuiteNotificationControls();
        return true;
      }

      function toggleSuiteNotifications(open) {
        state.notificationsOpen = typeof open === "boolean" ? open : !state.notificationsOpen;
        if (!state.notificationsOpen) state.notificationsConfig = false;
        updateSuiteNotificationsDom();
      }

      function focusPendingTask(id) {
        if (!id) return;
        window.requestAnimationFrame(() => {
          const selector = window.CSS?.escape ? `.task[data-task-id="${window.CSS.escape(id)}"]` : null;
          const card = selector
            ? document.querySelector(selector)
            : [...document.querySelectorAll(".task")].find((node) => node.dataset.taskId === id);
          if (!card) return;
          const reduceMotion = window.matchMedia?.("(prefers-reduced-motion: reduce)").matches;
          card.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "center" });
          card.classList.add("task-notif-focus");
          window.setTimeout(() => card.classList.remove("task-notif-focus"), 2600);
        });
      }

      function openPendingFromNotification(id) {
        state.notificationsOpen = false;
        const task = tasks.find((entry, index) => Array.isArray(entry) && taskId(entry, index) === id);
        if (!task || !currentSuiteUserCanAccessModule("tasks")) {
          updateSuiteNotificationsDom();
          return;
        }
        // El pendiente debe quedar visible: se abren los filtros y el mes que lo contiene.
        state.taskOwner = "Todos";
        state.taskStatus = "Todos";
        state.taskPriority = "Todas";
        if (!taskMatchesMonth(task, state.taskMonth)) {
          state.taskMonth = localMonthKey(taskStartDay(task)) || state.taskMonth;
        }
        if (state.active !== "tasks") {
          state.active = "tasks";
          saveActiveModule("tasks");
        }
        render();
        focusPendingTask(id);
      }

      function wireSuiteNotificationControls() {
        document.getElementById("suiteNotificationsToggle")?.addEventListener("click", (event) => {
          event.stopPropagation();
          toggleSuiteNotifications();
        });
        document.querySelectorAll("[data-close-notifications]").forEach((button) => {
          button.addEventListener("click", (event) => {
            event.stopPropagation();
            toggleSuiteNotifications(false);
          });
        });
        document.querySelectorAll("[data-notifications-scope]").forEach((button) => {
          button.addEventListener("click", (event) => {
            event.stopPropagation();
            state.notificationsScope = button.dataset.notificationsScope === "todos" ? "todos" : "mios";
            updateSuiteNotificationsDom();
          });
        });
        document.querySelectorAll("[data-notification-task]").forEach((button) => {
          button.addEventListener("click", (event) => {
            event.stopPropagation();
            openPendingFromNotification(button.dataset.notificationTask);
          });
        });
        // Los botones de la ruedita repintan el panel: no dejan subir el clic, que si no lo cerraría
        // (el botón ya no estaría dentro de la zona).
        const onClick = (selector, handler) =>
          document.querySelectorAll(selector).forEach((button) => {
            button.addEventListener("click", (event) => {
              event.stopPropagation();
              handler(button);
            });
          });
        onClick("[data-notifications-settings]", () => openNotificationSettings());
        onClick("[data-notifications-back]", () => {
          state.notificationsConfig = false;
          updateSuiteNotificationsDom();
        });
        onClick("[data-recipient-add]", () => {
          state.notificationRecipients.list.push({ nombre: "", email: "" });
          state.notificationRecipients.message = "";
          updateSuiteNotificationsDom();
          document.querySelector(`[data-recipient="${state.notificationRecipients.list.length - 1}"][data-recipient-field="nombre"]`)?.focus();
        });
        onClick("[data-recipient-remove]", (button) => {
          state.notificationRecipients.list.splice(Number(button.dataset.recipientRemove), 1);
          state.notificationRecipients.message = "";
          updateSuiteNotificationsDom();
        });
        onClick("[data-recipient-save]", () => saveNotificationRecipients());
        document.querySelectorAll("[data-recipient]").forEach((input) => {
          input.addEventListener("input", () => {
            const item = state.notificationRecipients?.list[Number(input.dataset.recipient)];
            if (item) item[input.dataset.recipientField] = input.value;
          });
        });
      }

      function wireSuiteNotifications() {
        wireSuiteNotificationControls();
        if (!suiteNotificationsOutsideReady) {
          suiteNotificationsOutsideReady = true;
          document.addEventListener("click", (event) => {
            if (!state.notificationsOpen) return;
            if (event.target instanceof Element && event.target.closest("#suiteNotifications")) return;
            toggleSuiteNotifications(false);
          });
          document.addEventListener("keydown", (event) => {
            if (event.key === "Escape" && state.notificationsOpen) toggleSuiteNotifications(false);
          });
        }
        // Apenas se abre la herramienta el panel se muestra solo una vez, si hay algo que avisar.
        if (!suiteNotificationsAutoOpened && pendingNotificationItems("mios").length) {
          suiteNotificationsAutoOpened = true;
          state.notificationsOpen = true;
          updateSuiteNotificationsDom();
        }
      }

      function updatePresenceCardsOnly() {
        const grid = document.querySelector(".presence-grid");
        if (!grid) return false;
        grid.innerHTML = pendingCollaboratorCards().map(presenceCardHtml).join("");
        return true;
      }

      function initTaskRealtimeSync() {
        if (taskSyncReady) return;
        taskSyncReady = true;

        if ("BroadcastChannel" in window) {
          taskSyncChannel = new BroadcastChannel(TASK_SYNC_CHANNEL);
          taskSyncChannel.addEventListener("message", (event) => {
            applyTaskSyncPayload(event.data);
          });
          presenceSyncChannel = new BroadcastChannel(PRESENCE_SYNC_CHANNEL);
          presenceSyncChannel.addEventListener("message", (event) => {
            applyPresenceSyncPayload(event.data);
          });
          assignmentSyncChannel = new BroadcastChannel(ASSIGNMENT_SYNC_CHANNEL);
          assignmentSyncChannel.addEventListener("message", (event) => {
            applyAssignmentNotificationPayload(event.data);
          });
        }

        window.addEventListener("storage", (event) => {
          if (event.key === TASK_SYNC_EVENT_KEY) {
            applyTaskSyncPayload(readStoredJson(TASK_SYNC_EVENT_KEY, null));
            return;
          }
          if ([TASKS_STORAGE_KEY, COMPLETED_STORAGE_KEY, TIMER_STORAGE_KEY].includes(event.key)) {
            refreshTaskStateFromStorage();
            return;
          }
          if (event.key === PRESENCE_SYNC_EVENT_KEY) {
            applyPresenceSyncPayload(readStoredJson(PRESENCE_SYNC_EVENT_KEY, null));
            return;
          }
          if (event.key === ASSIGNMENT_SYNC_EVENT_KEY) {
            applyAssignmentNotificationPayload(readStoredJson(ASSIGNMENT_SYNC_EVENT_KEY, null));
            return;
          }
          if (event.key === PRESENCE_STORAGE_KEY) {
            renderPresenceFromSync();
          }
        });
      }

      function migrateCompletedFromTasks() {
        const active = [];
        tasks.forEach((task, index) => {
          const id = taskId(task, index);
          if (task[3] === "Completado") {
            taskTombstones()[id] = {
              action: "completada",
              closedAt: Date.now(),
              closedBy: currentSuiteUserName(),
              title: task[0]
            };
            if (!completedTasks.some((completed) => completed.id === id)) {
              completedTasks.push({
                id,
                title: task[0],
                owner: task[1],
                createdAt: taskCreatedAt(task),
                startDate: task[5],
                dueDate: task[2],
                priority: task[4] || "Media",
                completedAt: new Date().toISOString(),
                completedBy: currentSuiteUserName(),
                action: "completada",
                totalSeconds: elapsedSecondsForTask(id)
              });
            }
          } else {
            active.push(task);
          }
        });
        tasks = active;
      }

      function loadTaskState() {
        const savedTasks = readStoredJson(TASKS_STORAGE_KEY, null);
        const savedCompleted = readStoredJson(COMPLETED_STORAGE_KEY, null);
        const savedTimer = readStoredJson(TIMER_STORAGE_KEY, null);
        pendingStateVersion =
          Number(readStoredJson(TASK_STATE_VERSION_STORAGE_KEY, 0) || 0) || 0;

        if (Array.isArray(savedTasks)) tasks = savedTasks;
        if (Array.isArray(savedCompleted)) completedTasks = savedCompleted;
        recoverLegacyCompletedTasks();
        if (savedTimer && typeof savedTimer === "object") {
          applyTaskTimerSnapshot(savedTimer);
        }

        if (migrateJorgeLuisPendingTasks()) {
          pendingStateVersion = Date.now();
        }
        ensureTaskIds();
        const normalizedStartDates = ensureTaskStartDates();
        if (normalizedStartDates) pendingStateVersion = Date.now();
        recoverLocalPendingBackups();
        migrateCompletedFromTasks();
        // Lo cargado de este navegador es el punto de partida: no cuenta como edicion nueva.
        rememberTaskFieldSignatures();
        initTaskRealtimeSync();
        initSharedPendingLive();
        initSharedPendingDb();
        saveTaskState({ broadcast: false, shared: false, version: normalizedStartDates, reason: "inicio" });
        saveTimerState({ broadcast: false, shared: false, version: false });
        if (hasActiveTaskTimers()) ensureTaskTimerInterval();
        writePendingPresence();
        window.setInterval(() => {
          writePendingPresence(
            editingState.taskId
              ? {
                  id: editingState.taskId,
                  title: editingState.taskTitle,
                  action: editingState.taskAction
                }
              : null
          );
        }, 10000);
        window.setInterval(renderPresenceFromSync, 5000);
        setupPendingConnectivityMonitor();
      }

      function elapsedSecondsForTask(id) {
        const saved = taskTimer.elapsedById[id] || 0;
        const entry = activeTimerEntry(id);
        if (entry?.startedAt) {
          return saved + Math.floor((Date.now() - entry.startedAt) / 1000);
        }
        return saved;
      }

      function timerSecondsForTask(id) {
        return elapsedSecondsForTask(id);
      }

      function formatTimer(seconds) {
        const normalized = Math.max(0, Math.floor(Number(seconds || 0)));
        const hrs = Math.floor(normalized / 3600);
        const mins = Math.floor((normalized % 3600) / 60);
        const secs = normalized % 60;
        return [hrs, mins, secs].map((value) => String(value).padStart(2, "0")).join(":");
      }

      function parseTimerDuration(value) {
        const parts = String(value || "").trim().split(":");
        if (!parts.length || parts.length > 3 || parts.some((part) => !/^\d+$/.test(part))) return null;
        const numbers = parts.map(Number);
        const seconds = numbers.pop() || 0;
        const minutes = numbers.pop() || 0;
        const hours = numbers.pop() || 0;
        if (minutes > 59 || seconds > 59) return null;
        return hours * 3600 + minutes * 60 + seconds;
      }

      function beginTaskTimerDurationEdit(element) {
        const id = element.dataset.timerValue;
        if (!id || activeTimerEntry(id) || isTaskLockedByOtherUser(id)) return;
        element.dataset.timerOriginal = formatTimer(timerSecondsForTask(id));
        element.dataset.timerEditing = "true";
        element.contentEditable = "true";
        element.textContent = element.dataset.timerOriginal;
        element.focus();
        selectEditableText(element);
      }

      function finishTaskTimerDurationEdit(element, cancel = false) {
        if (element.dataset.timerEditing !== "true") return;
        const id = element.dataset.timerValue;
        const original = element.dataset.timerOriginal || "00:00:00";
        const duration = cancel ? parseTimerDuration(original) : parseTimerDuration(element.textContent);
        if (duration === null) {
          window.alert("Ingresa la duración en formato HH:MM:SS.");
          element.focus();
          selectEditableText(element);
          return;
        }
        element.contentEditable = "false";
        delete element.dataset.timerEditing;
        delete element.dataset.timerOriginal;
        if (!cancel) {
          taskTimer.elapsedById[id] = duration;
          taskTimer.elapsedEditedAt = taskTimer.elapsedEditedAt || {};
          taskTimer.elapsedEditedAt[id] = Date.now();
          delete taskTimer.presetById[id];
          delete taskTimer.durationById[id];
          saveTimerState();
        }
        tasksModule();
      }

      function ensureTaskTimerInterval() {
        if (taskTimerInterval) return;
        taskTimerInterval = window.setInterval(() => {
          // Solo refresca la pantalla. Antes tambien enviaba el temporizador completo por Realtime cada
          // segundo, lo que sumaba trafico de salida en Supabase; iniciar y detener ya lo publican.
          updateTaskTimerDom();
        }, 1000);
      }

      function stopTaskTimerIntervalIfIdle() {
        if (hasActiveTaskTimers() || !taskTimerInterval) return;
        window.clearInterval(taskTimerInterval);
        taskTimerInterval = null;
      }

      function updateTaskTimerDom() {
        document.querySelectorAll("[data-timer-value]").forEach((element) => {
          const id = element.dataset.timerValue;
          if (element.dataset.timerEditing === "true") return;
          element.textContent = formatTimer(elapsedSecondsForTask(id));
        });
        document.querySelectorAll("[data-daily-minutes-user]").forEach((element) => {
          element.textContent = formatWorkedMinutes(dailyWorkedSecondsForUser(element.dataset.dailyMinutesUser));
        });
        document.querySelectorAll("[data-timer-toggle]").forEach((button) => {
          const id = button.dataset.timerToggle;
          const isActive = Boolean(activeTimerEntry(id));
          const isOwned = isActive && currentUserOwnsActiveTimer(id);
          button.textContent = isOwned ? "Pausar" : "Iniciar";
          button.classList.toggle("timer-active", isOwned);
        });
        document.querySelectorAll("[data-timer-box]").forEach((element) => {
          const id = element.dataset.timerBox;
          element.classList.toggle("active", Boolean(activeTimerEntry(id)));
        });
      }

      function finalizeTaskTimer(id, options = {}) {
        const entry = activeTimerEntry(id);
        if (!entry?.startedAt) return;
        if (!currentUserOwnsActiveTimer(id)) return;
        addTimerDailySeconds(id, entry);
        taskTimer.elapsedById[id] = elapsedSecondsForTask(id);
        const key = taskTimerKeyForId(id, entry);
        delete taskTimer.activeById[id];
        if (key) delete taskTimer.activeByKey[key];
        if (taskTimer.activeTaskId === id) {
          taskTimer.activeTaskId = null;
          taskTimer.activeUserKey = null;
          taskTimer.activeUserName = null;
          taskTimer.startedAt = null;
        }
        syncLegacyActiveTimerFields();
        if (options.persist !== false) {
          saveTimerState();
          publishSharedTimerState();
        }
        stopTaskTimerIntervalIfIdle();
      }

      function finalizeActiveTaskTimer() {
        const activeId = currentUserActiveTaskId() || taskTimer.activeTaskId;
        if (activeId) finalizeTaskTimer(activeId);
      }

      function forceUnlockTaskTimer(id) {
        const entry = activeTimerEntry(id);
        if (!entry?.startedAt) return;
        addTimerDailySeconds(id, entry);
        taskTimer.elapsedById[id] = elapsedSecondsForTask(id);
        const key = taskTimerKeyForId(id, entry);
        delete taskTimer.activeById[id];
        if (key) delete taskTimer.activeByKey[key];
        if (taskTimer.activeTaskId === id) {
          taskTimer.activeTaskId = null;
          taskTimer.activeUserKey = null;
          taskTimer.activeUserName = null;
          taskTimer.startedAt = null;
        }
        syncLegacyActiveTimerFields();
        saveTimerState();
        publishSharedTimerState();
        stopTaskTimerIntervalIfIdle();
      }

      function toggleTaskTimer(id) {
        const existingEntry = activeTimerEntry(id);
        if (existingEntry && !currentUserOwnsActiveTimer(id)) {
          window.alert(`${activeTimerWorkerName(id)} esta trabajando esta tarea. Espera a que finalice su timer.`);
          return;
        }
        if (existingEntry) {
          finalizeTaskTimer(id);
        } else {
          delete taskTimer.presetById[id];
          delete taskTimer.durationById[id];
          clearCurrentUserActiveTimers();
          syncLegacyActiveTimerFields();
          taskTimer.activeTaskId = id;
          taskTimer.activeUserKey = currentSuiteUserKey();
          taskTimer.activeUserName = currentSuiteUserName();
          taskTimer.startedAt = Date.now();
          const taskIndex = tasks.findIndex((task, index) => taskId(task, index) === id);
          taskTimer.activeById[id] = {
            taskCreatedAt: tasks[taskIndex] ? taskCreatedAt(tasks[taskIndex]) : "",
            taskOwner: tasks[taskIndex]?.[1] || "",
            taskTitle: tasks[taskIndex]?.[0] || "",
            userKey: taskTimer.activeUserKey,
            userName: taskTimer.activeUserName,
            startedAt: taskTimer.startedAt
          };
          const timerKey = taskTimerKeyForId(id, taskTimer.activeById[id]);
          if (timerKey) taskTimer.activeByKey[timerKey] = taskTimer.activeById[id];
          if (tasks[taskIndex]) tasks[taskIndex][3] = "En proceso";
          saveTaskState();
          saveTimerState();
          ensureTaskTimerInterval();
          publishSharedTimerState();
        }
        updateTaskTimerDom();
      }

      function selectEditableText(element) {
        const range = document.createRange();
        range.selectNodeContents(element);
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
      }

      function beginInlineTaskEdit(element) {
        const index = Number(element.dataset.index);
        const task = tasks[index];
        if (task && !canCurrentUserControlTask(taskId(task, index))) return;
        element.dataset.original = element.textContent.trim();
        element.dataset.cancelEdit = "false";
        element.contentEditable = "true";
        if (task) {
          setEditingPresence({
            id: taskId(task, index),
            title: task[0]
          });
        }
        element.focus();
        selectEditableText(element);
      }

      function openSubtaskOwnerSelect(element) {
        const parentTaskId = element.dataset.parentTaskId;
        const subtaskId = element.dataset.subtaskOwnerSelect;
        const { task, taskIndex } = findPendingTaskById(parentTaskId);
        if (!task || taskIndex < 0) return;
        if (!canCurrentUserControlTask(taskId(task, taskIndex))) return;
        const subtask = pendingSubtasks(task).find((item) => item.id === subtaskId);
        if (!subtask) return;

        const options = String(element.dataset.options || "")
          .split("|")
          .filter(Boolean)
          .map((option) => decodeURIComponent(option));
        // Un responsable que ya no esta en la lista sigue disponible para no perderlo.
        if (subtask.owner && !options.includes(subtask.owner)) options.unshift(subtask.owner);

        const select = document.createElement("select");
        select.className = "badge-select task-subtask-owner-select";
        options.forEach((option) => {
          const item = document.createElement("option");
          item.value = option;
          item.textContent = option;
          select.appendChild(item);
        });
        select.value = subtask.owner || options[0] || "";
        setEditingPresence({ id: taskId(task, taskIndex), title: task[0] });

        const closeWithoutChange = () => {
          setEditingPresence(null);
          tasksModule();
        };

        select.addEventListener("change", () => {
          updatePendingSubtaskOwner(parentTaskId, subtaskId, select.value);
          setEditingPresence(null);
          tasksModule();
        });
        select.addEventListener("blur", closeWithoutChange);
        select.addEventListener("keydown", (event) => {
          if (event.key === "Escape") {
            event.preventDefault();
            closeWithoutChange();
          }
          if (event.key === "Enter") {
            event.preventDefault();
            select.dispatchEvent(new Event("change"));
          }
        });

        element.replaceWith(select);
        select.focus();
      }

      function beginInlineSubtaskEdit(element) {
        const { task, taskIndex } = findPendingTaskById(element.dataset.parentTaskId);
        if (!task || taskIndex < 0) return;
        if (!canCurrentUserControlTask(taskId(task, taskIndex))) return;
        element.dataset.original = element.textContent.trim();
        element.dataset.cancelEdit = "false";
        element.contentEditable = "true";
        setEditingPresence({
          id: taskId(task, taskIndex),
          title: task[0]
        });
        element.focus();
        selectEditableText(element);
      }

      function finishInlineSubtaskEdit(element) {
        if (element.contentEditable !== "true") return;
        const canceled = element.dataset.cancelEdit === "true";
        const fallback = element.dataset.original || "";
        const nextValue = canceled ? fallback : element.textContent.trim();
        element.contentEditable = "false";
        delete element.dataset.original;
        delete element.dataset.cancelEdit;
        setEditingPresence(null);
        // Un titulo vacio no borra la tarea: el re-render devuelve el nombre anterior.
        renamePendingSubtask(element.dataset.parentTaskId, element.dataset.editableSubtask, nextValue);
        tasksModule();
      }

      function openTaskBadgeSelect(element) {
        const index = Number(element.dataset.index);
        const field = Number(element.dataset.field);
        const task = tasks[index];
        if (!task) return;
        if (!canCurrentUserControlTask(taskId(task, index))) return;

        const options = String(element.dataset.options || "")
          .split("|")
          .filter(Boolean)
          .map((option) => decodeURIComponent(option));
        const select = document.createElement("select");
        select.className = "badge-select";
        select.dataset.index = String(index);
        select.dataset.field = String(field);
        options.forEach((option) => {
          const item = document.createElement("option");
          item.value = option;
          item.textContent = option;
          select.appendChild(item);
        });
        select.value = task[field] || element.textContent.trim();
        setEditingPresence({ id: taskId(task, index), title: task[0] });

        const closeWithoutChange = () => {
          setEditingPresence(null);
          tasksModule();
        };

        select.addEventListener("change", () => {
          if (!tasks[index]) return;
          tasks[index][field] = select.value;
          setEditingPresence(null);
          saveTaskState();
          tasksModule();
        });
        select.addEventListener("blur", closeWithoutChange);
        select.addEventListener("keydown", (event) => {
          if (event.key === "Escape") {
            event.preventDefault();
            closeWithoutChange();
          }
          if (event.key === "Enter") {
            event.preventDefault();
            select.dispatchEvent(new Event("change"));
          }
        });

        element.replaceWith(select);
        select.focus();
      }

      // Opciones del responsable: los usuarios de la Suite. Un responsable que ya no esta en la lista se
      // conserva como primera opcion para no perderlo al guardar otro cambio.
      function taskOwnerOptionsHtml(currentOwner, owners) {
        const current = String(currentOwner || "").trim();
        const options = current && !owners.some((owner) => isSameSuitePerson(owner, current)) ? [current, ...owners] : owners;
        return options
          .map((owner) => `<option value="${escapeHtml(owner)}" ${isSameSuitePerson(owner, current) ? "selected" : ""}>${escapeHtml(owner)}</option>`)
          .join("");
      }

      function updatePendingTaskOwner(index, owner) {
        const task = tasks[index];
        if (!task || !owner || !canCurrentUserControlTask(taskId(task, index))) {
          tasksModule();
          return;
        }
        if (isSameSuitePerson(task[1], owner)) return;
        task[1] = owner;
        saveTaskState();
        notifyTaskAssignment(task, taskId(task, index), owner);
        tasksModule();
      }

      function finishInlineTaskEdit(element) {
        if (element.contentEditable !== "true") return;
        const index = Number(element.dataset.index);
        const field = Number(element.dataset.field);
        const task = tasks[index];
        if (task && !canCurrentUserControlTask(taskId(task, index))) {
          element.contentEditable = "false";
          setEditingPresence(null);
          tasksModule();
          return;
        }
        const fallback = element.dataset.original || "";
        const previousValue = tasks[index]?.[field] || "";
        const canceled = element.dataset.cancelEdit === "true";
        const nextValue =
          canceled ? fallback : element.textContent.trim();

        if (tasks[index] && nextValue) {
          tasks[index][field] = nextValue;
        }

        element.contentEditable = "false";
        delete element.dataset.original;
        delete element.dataset.cancelEdit;
        setEditingPresence(null);
        saveTaskState();
        if (
          tasks[index] &&
          field === 1 &&
          nextValue &&
          !canceled &&
          !isSameSuitePerson(previousValue, nextValue)
        ) {
          notifyTaskAssignment(tasks[index], taskId(tasks[index], index), nextValue);
        }
        tasksModule();
      }

      function beginRouteHeadingEdit(element) {
        element.dataset.original = element.textContent.trim();
        element.dataset.cancelEdit = "false";
        element.contentEditable = "true";
        element.focus();
        selectEditableText(element);
      }

      function finishRouteHeadingEdit(element) {
        if (element.contentEditable !== "true") return;
        const key = element.dataset.routeHeadingKey;
        const categoryId = element.dataset.pendingCategoryId;
        const fallback = element.dataset.original || "";
        const canceled = element.dataset.cancelEdit === "true";
        const nextValue = canceled ? fallback : element.textContent.trim();
        element.contentEditable = "false";
        delete element.dataset.original;
        delete element.dataset.cancelEdit;
        if (!canceled) {
          if (categoryId) renamePendingCategory(categoryId, nextValue);
          else setCriticalRouteHeading(key, nextValue);
        }
        tasksModule();
      }

      function beginRouteResponsibleEdit(element) {
        element.dataset.original = element.textContent.trim();
        element.dataset.cancelEdit = "false";
        element.contentEditable = "true";
        element.focus();
        selectEditableText(element);
      }

      function finishRouteResponsibleEdit(element) {
        if (element.contentEditable !== "true") return;
        const key = element.dataset.routeResponsibleKey;
        const categoryId = element.dataset.pendingCategoryId;
        const fallback = element.dataset.original || "";
        const canceled = element.dataset.cancelEdit === "true";
        const nextValue = canceled ? fallback : element.textContent.trim();
        element.contentEditable = "false";
        delete element.dataset.original;
        delete element.dataset.cancelEdit;
        if (!canceled) {
          if (categoryId) updatePendingCategoryResponsible(categoryId, nextValue);
          else setCriticalRouteResponsible(key, nextValue);
        }
        tasksModule();
      }

      const closingTaskIds = new Set();

      function moveTaskToCompleted(id, action = "completada") {
        if (!id || closingTaskIds.has(id)) return;
        const index = tasks.findIndex((task, taskIndex) => taskId(task, taskIndex) === id);
        if (index < 0) return;

        closingTaskIds.add(id);
        const task = tasks[index];
        try {
          const entry = activeTimerEntry(id);
          const workedByName = entry ? activeTimerWorkerName(id) : currentSuiteUserName();
          const workedByKey = suitePersonKey(entry?.userKey || entry?.userName || workedByName);
          const totalSeconds = elapsedSecondsForTask(id);
          const dailySecondsByUser = { ...(taskTimer.dailyById?.[id] || {}) };
          if (entry) finalizeTaskTimer(id, { persist: false });

          const completedRecord = {
            completedRecordId: generatedTaskId("completed"),
            id,
            title: task[0],
            owner: task[1],
            createdAt: taskCreatedAt(task),
            startDate: task[5],
            dueDate: task[2],
            priority: task[4] || "Media",
            completedAt: new Date().toISOString(),
            completedBy: currentSuiteUserName(),
            dailySecondsByUser,
            action,
            totalSeconds,
            workedByKey,
            workedByName
          };

          taskTombstones()[id] = {
            action,
            closedAt: Date.now(),
            closedBy: currentSuiteUserName(),
            title: task[0]
          };
          completedTasks = mergeCompletedTaskHistory(completedTasks, [completedRecord]);
          tasks.splice(index, 1);
          collapsedSubtaskIds.delete(String(id));
          if (editingState.taskId === id) setEditingPresence(null);
          delete taskTimer.elapsedById[id];
          delete taskTimer.elapsedEditedAt?.[id];
          delete taskTimer.durationById[id];
          delete taskTimer.presetById[id];
          delete taskTimer.dailyById?.[id];

          saveTimerState({ broadcast: false, shared: false, version: false });
          saveTaskState({ reason: action });
          tasksModule();

          void archiveCompletedTask(completedRecord)
            .then((archived) => {
              if (!archived) {
                console.warn(
                  "No se pudo guardar esta tarea en la BBDD historica; permanece cerrada en el estado compartido.",
                  sharedPendingError || "Acceso rechazado por Supabase."
                );
              }
            })
            .catch((error) => {
              console.warn("No se pudo archivar la tarea cerrada:", error);
            })
            .finally(() => {
              closingTaskIds.delete(id);
            });
        } catch (error) {
          closingTaskIds.delete(id);
          console.error("No se pudo cerrar la tarea:", error);
          window.alert("No se pudo cerrar la tarea. Recarga la pagina e intenta nuevamente.");
        }
      }

      function restoreCompletedTask(key) {
        const index = completedTasks.findIndex((task, taskIndex) => completedTaskKey(task, taskIndex) === key);
        if (index < 0) return;

        const task = completedTasks[index];
        const nextId = generatedTaskId();
        tasks.unshift([
          task.title,
          task.owner || currentSuiteUserName(),
          task.dueDate || "",
          "Pendiente",
          task.priority || "Media",
          task.startDate || "",
          nextId,
          task.createdAt || new Date().toISOString()
        ]);

        if (task.totalSeconds) {
          taskTimer.elapsedById[nextId] = task.totalSeconds;
        }
        if (task.dailySecondsByUser) {
          taskTimer.dailyById = taskTimer.dailyById && typeof taskTimer.dailyById === "object" ? taskTimer.dailyById : {};
          taskTimer.dailyById[nextId] = task.dailySecondsByUser;
        }
        completedTasks.splice(index, 1);
        saveTimerState({ broadcast: false, shared: false });
        saveTaskState();
        tasksModule();
      }

      function completeTask(id) {
        void moveTaskToCompleted(id, "completada");
      }

      function deleteTask(id) {
        if (!window.confirm("¿Mover este pendiente al historial como eliminado?")) return;
        void moveTaskToCompleted(id, "eliminada");
      }

      function handleTaskModuleClick(event) {
        const target = event.target;
        if (!(target instanceof Element)) return;

        const syncButton = target.closest("[data-force-pending-sync]");
        if (syncButton) {
          event.preventDefault();

          event.stopImmediatePropagation();
          forcePendingSync();
          return;
        }

        const unlockButton = target.closest("[data-force-unlock-task]");
        if (unlockButton) {
          event.preventDefault();
          event.stopPropagation();
          event.stopImmediatePropagation();
          const id = unlockButton.dataset.forceUnlockTask;
          const workerName = activeTimerWorkerName(id);
          if (
            window.confirm(
              `Â¿Destrabar esta tarea? Se pausarÃ¡ el timer de ${workerName} y su tiempo quedarÃ¡ guardado.`
            )
          ) {

        }

        const timerButton = target.closest("[data-timer-toggle]");
        if (timerButton) {

        const subtaskMoveButton = target.closest("[data-subtask-move]");
        if (subtaskMoveButton) {

            movePendingSubtask(
              subtaskMoveButton.dataset.parentTaskId,
              subtaskMoveButton.dataset.subtaskMove,
              subtaskMoveButton.dataset.subtaskMoveDirection
            )
          ) {
            tasksModule();
          }

        }

        const subtaskDatesButton = target.closest("[data-subtask-dates-toggle]");
        if (subtaskDatesButton) {
          event.preventDefault();
          event.stopPropagation();
          event.stopImmediatePropagation();
          const parentTaskId = subtaskDatesButton.dataset.parentTaskId;
          const subtaskId = subtaskDatesButton.dataset.subtaskDatesToggle;
          const expanded = !subtaskDatesExpanded(parentTaskId, subtaskId);
          setSubtaskDatesExpanded(parentTaskId, subtaskId, expanded);
          // Se abre en el sitio, sin redibujar el tablero, para no perder el foco.
          const wrapper = subtaskDatesButton.closest(".task-subtask-dates");
          wrapper?.classList.toggle("open", expanded);
          subtaskDatesButton.setAttribute("aria-expanded", expanded ? "true" : "false");
          if (expanded) wrapper?.querySelector("input")?.focus();

        }

        const subtaskToggleButton = target.closest("[data-subtask-toggle]");
        if (subtaskToggleButton) {
          event.preventDefault();
          event.stopPropagation();
          event.stopImmediatePropagation();
          if (togglePendingSubtask(subtaskToggleButton.dataset.parentTaskId, subtaskToggleButton.dataset.subtaskToggle)) {
            tasksModule();
          }
          return;
        }

        const subtaskDeleteButton = target.closest("[data-subtask-delete]");
        if (subtaskDeleteButton) {
          event.preventDefault();
          event.stopPropagation();
          event.stopImmediatePropagation();
          if (deletePendingSubtask(subtaskDeleteButton.dataset.parentTaskId, subtaskDeleteButton.dataset.subtaskDelete)) {
            tasksModule();
          }
          return;
        }

        const completeButton = target.closest(".complete[data-task-id]");
        if (completeButton) {
          event.preventDefault();
          event.stopPropagation();
          event.stopImmediatePropagation();
          completeTask(completeButton.dataset.taskId);
          return;
        }

        const deleteButton = target.closest("[data-delete-task]");
        if (deleteButton) {
          event.preventDefault();
          event.stopPropagation();
          event.stopImmediatePropagation();
          deleteTask(deleteButton.dataset.deleteTask);
        }
      }

      function taskDropDirection(target, event) {
        const rect = target.getBoundingClientRect();
        return event.clientY > rect.top + rect.height / 2 ? "after" : "before";
      }

      function clearTaskDropGuides() {
        document.querySelectorAll(".task.drop-before, .task.drop-after").forEach((element) => {
          element.classList.remove("drop-before", "drop-after");
        });
      }

      function clearTaskDropTargets() {
        document.querySelectorAll(".task.dragging").forEach((element) => {
          element.classList.remove("dragging");
        });
        clearTaskDropGuides();
      }

      // Al ordenar a mano, el resto del tablero se queda donde el usuario lo esta
      // viendo. Sin esto, sacar un pendiente de una ruta podia dejarla con uno solo,
      // disolverla y arrastrar a su compañero a otro grupo.
      function pinVisibleTasksToTheirGroups() {
        document.querySelectorAll("[data-task-draggable]").forEach((row) => {
          const groupKey = row.closest(".task-owner-group")?.dataset.groupKey || "";
          if (!groupKey) return;
          const index = tasks.findIndex((task, taskIndex) => taskId(task, taskIndex) === row.dataset.taskId);
          if (index < 0) return;
          const task = tasks[index];
          if (task[TASK_CATEGORY_INDEX] || taskRoutePin(task)) return;
          task[TASK_ROUTE_PIN_INDEX] = groupKey;
        });
      }

      function reorderTaskByDrop(sourceId, targetId, direction = "before") {
        if (!sourceId || !targetId || sourceId === targetId) {
          clearTaskDropTargets();
          draggedTaskId = null;
          return;
        }

        pinVisibleTasksToTheirGroups();

        // El grupo del destino se lee del DOM antes de mover, porque el re-render
        // posterior reconstruye las filas.
        const targetGroupKey =
          document
            .querySelector(`[data-task-draggable][data-task-id="${CSS.escape(targetId)}"]`)
            ?.closest(".task-owner-group")?.dataset.groupKey || "";

        const previousOrder = tasks.map((task, index) => taskId(task, index)).join("|");
        const sourceIndex = tasks.findIndex((task, index) => taskId(task, index) === sourceId);
        if (sourceIndex < 0) {
          clearTaskDropTargets();
          draggedTaskId = null;
          return;
        }

        const [movedTask] = tasks.splice(sourceIndex, 1);
        const targetIndex = tasks.findIndex((task, index) => taskId(task, index) === targetId);
        if (targetIndex < 0) {
          tasks.splice(sourceIndex, 0, movedTask);
          clearTaskDropTargets();
          draggedTaskId = null;
          return;
        }

        const previousGroupPin = taskRoutePin(movedTask);
        const previousCategory = movedTask[TASK_CATEGORY_INDEX];
        adoptGroupFromNeighbour(movedTask, tasks[targetIndex], targetGroupKey);
        tasks.splice(direction === "after" ? targetIndex + 1 : targetIndex, 0, movedTask);
        tasks.forEach((task, index) => {
          if (Array.isArray(task)) task[TASK_MANUAL_ORDER_INDEX] = index;
        });
        draggedTaskId = null;
        const nextOrder = tasks.map((task, index) => taskId(task, index)).join("|");
        const groupChanged =
          taskRoutePin(movedTask) !== previousGroupPin || movedTask[TASK_CATEGORY_INDEX] !== previousCategory;
        if (nextOrder === previousOrder && !groupChanged) {
          clearTaskDropTargets();
          return;
        }
        saveTaskState({ reason: "orden-manual" });
        tasksModule();
      }

      function moveTaskWithArrow(button) {
        const taskIdToMove = button.dataset.taskMove;
        const direction = button.dataset.taskMoveDirection;
        if (!taskIdToMove || !canCurrentUserControlTask(taskIdToMove)) return;
        const item = button.closest("[data-task-draggable]");
        if (!item) return;
        // Se recorre el tablero entero, no solo el grupo: al pasar el borde el
        // pendiente se cambia de grupo en vez de quedarse atascado.
        const board = item.closest(".tasks") || document;
        const visibleItems = Array.from(board.querySelectorAll("[data-task-draggable]"));
        const currentIndex = visibleItems.findIndex((candidate) => candidate.dataset.taskId === taskIdToMove);
        if (currentIndex < 0) return;
        const target = direction === "up" ? visibleItems[currentIndex - 1] : visibleItems[currentIndex + 1];
        if (!target?.dataset.taskId) return;
        reorderTaskByDrop(taskIdToMove, target.dataset.taskId, direction === "up" ? "before" : "after");
      }

      function ensureTaskManualOrder() {
        let changed = false;
        tasks.forEach((task, index) => {
          if (!Array.isArray(task)) return;
          if (!hasManualOrder(task)) {
            task[TASK_MANUAL_ORDER_INDEX] = index;
            changed = true;
          }
        });
        return changed;
      }

      // Un hueco del arreglo vuelve como null al pasar por JSON, y Number(null) es 0:
      // sin este filtro esas tareas quedaban todas con orden 0, empatadas, y el tablero
      // caia de vuelta al orden por fecha y prioridad.
      function hasManualOrder(task) {
        const raw = task?.[TASK_MANUAL_ORDER_INDEX];
        if (raw === null || raw === undefined || raw === "") return false;
        return Number.isFinite(Number(raw));
      }

      function taskManualOrder(task) {
        return hasManualOrder(task) ? Number(task[TASK_MANUAL_ORDER_INDEX]) : Number.MAX_SAFE_INTEGER;
      }

      function taskRoutePin(task) {
        const pin = task?.[TASK_ROUTE_PIN_INDEX];
        return typeof pin === "string" && pin ? pin : "";
      }

      // Al mover un pendiente junto a otro, adopta el grupo del vecino: si el vecino
      // esta en una categoria manual entra en esa categoria, y si esta en una ruta
      // sugerida queda fijado a esa ruta.
      function adoptGroupFromNeighbour(task, neighbourTask, neighbourGroupKey) {
        if (!Array.isArray(task) || !Array.isArray(neighbourTask)) return;
        const neighbourCategory = neighbourTask[TASK_CATEGORY_INDEX];
        if (neighbourCategory) {
          task[TASK_CATEGORY_INDEX] = neighbourCategory;
          task[TASK_ROUTE_PIN_INDEX] = "";
          return;
        }
        task[TASK_CATEGORY_INDEX] = "";
        task[TASK_ROUTE_PIN_INDEX] = neighbourGroupKey || "";
      }

      function compareTasksByManualOrder(left, right) {
        return taskManualOrder(left) - taskManualOrder(right);
      }

      function beginTaskPointerDrag(handle, startEvent) {
        if (startEvent.button !== undefined && startEvent.button !== 0) return;
        const sourceItem = handle.closest("[data-task-draggable]");
        if (!sourceItem) return;
        if (!canCurrentUserControlTask(sourceItem.dataset.taskId)) return;

        const sourceId = handle.dataset.taskDragHandle || sourceItem.dataset.taskId;
        const sourceIndex = tasks.findIndex((task, index) => taskId(task, index) === sourceId);
        if (sourceIndex < 0) return;

        const startPoint = { x: startEvent.clientX, y: startEvent.clientY };
        const dragState = {
          active: false,
          lastTarget: null,
          lastDirection: "before",
          pointerId: startEvent.pointerId,
          sourceId,
          sourceItem
        };

        const cleanup = () => {
          try {
            if (dragState.pointerId !== undefined && handle.hasPointerCapture?.(dragState.pointerId)) {
              handle.releasePointerCapture(dragState.pointerId);
            }
          } catch {
            // El navegador puede cancelar la captura si cambia la ventana activa.
          }
          document.removeEventListener("pointermove", move);
          document.removeEventListener("pointerup", stop);
          document.removeEventListener("pointercancel", cancel);
          setEditingPresence(null);
          draggedTaskId = null;
          clearTaskDropTargets();
        };

        const activate = () => {
          if (dragState.active) return;
          dragState.active = true;
          draggedTaskId = sourceId;
          sourceItem.classList.add("dragging");
          setEditingPresence({
            action: "Moviendo",
            id: sourceId,
            title: tasks[sourceIndex][0]
          });
        };

        const targetFromPoint = (event) => {
          const target = document.elementFromPoint(event.clientX, event.clientY)?.closest("[data-task-draggable]");
          if (!target || target.dataset.taskId === sourceId) return null;
          return target;
        };

        const updateGuide = (event) => {
          const target = targetFromPoint(event);
          clearTaskDropGuides();
          dragState.lastTarget = target;
          if (!target) return;
          dragState.lastDirection = taskDropDirection(target, event);
          target.classList.toggle("drop-before", dragState.lastDirection === "before");
          target.classList.toggle("drop-after", dragState.lastDirection === "after");
        };

        const move = (event) => {
          if (event.pointerId !== dragState.pointerId) return;
          const distance = Math.hypot(event.clientX - startPoint.x, event.clientY - startPoint.y);
          if (!dragState.active && distance < 6) return;
          event.preventDefault();
          activate();
          updateGuide(event);
        };

        const stop = (event) => {
          if (event.pointerId !== dragState.pointerId) return;
          event.preventDefault();
          if (!dragState.active) {
            cleanup();
            return;
          }
          updateGuide(event);
          const target = dragState.lastTarget;
          const direction = dragState.lastDirection;
          cleanup();
          if (target?.dataset.taskId && target.dataset.taskId !== sourceId) {
            reorderTaskByDrop(sourceId, target.dataset.taskId, direction);
          }
        };

        const cancel = (event) => {
          if (event.pointerId !== dragState.pointerId) return;
          cleanup();
        };

        startEvent.preventDefault();
        handle.setPointerCapture?.(startEvent.pointerId);
        document.addEventListener("pointermove", move, { passive: false });
        document.addEventListener("pointerup", stop, { passive: false });
        document.addEventListener("pointercancel", cancel);
      }

      const CRITICAL_ROUTE_COLORS_STORAGE_KEY = "lr-suite-critical-route-colors-v1";
      const CRITICAL_ROUTE_HEADINGS_STORAGE_KEY = "lr-suite-critical-route-headings-v1";
      const CRITICAL_ROUTE_RESPONSIBLES_STORAGE_KEY = "lr-suite-critical-route-responsibles-v1";
      const PENDING_MANUAL_CATEGORIES_STORAGE_KEY = "lr-suite-pending-manual-categories-v1";
      const TASK_CATEGORY_INDEX = 8;
      const TASK_SUBTASKS_INDEX = 9;
      const TASK_COLOR_INDEX = 10;
      const TASK_MANUAL_ORDER_INDEX = 11;
      // Grupo al que el usuario movio el pendiente a mano. Manda sobre la ruta que
      // sugeriria el algoritmo, para que las flechas puedan cruzar de grupo.
      const TASK_ROUTE_PIN_INDEX = 12;
      // Marca de la ultima edicion del pendiente (numero, ver nextTaskStamp). La fusion con la BBDD
      // elige campo por pendiente segun esta marca, no segun la version global del tablero.
      const TASK_UPDATED_AT_INDEX = 13;
      const criticalRoutePalette = ["#2563eb", "#0f766e", "#7c3aed", "#ea580c", "#db2777", "#ca8a04", "#0891b2", "#475569", "#16a34a", "#dc2626"];
      const defaultCriticalRouteColors = criticalRoutePalette.slice(0, 4);
      let criticalRouteHeadingOverrides = getStoredCriticalRouteHeadings();
      let criticalRouteResponsibleOverrides = getStoredCriticalRouteResponsibles();
      let manualPendingCategories = getStoredPendingCategories();

      function pendingCategoryIdFromTitle(title) {
        const slug = normalizeText(title)
          .replace(/[^a-z0-9]+/g, "-")
          .replace(/^-+|-+$/g, "")
          .slice(0, 60);
        return `category-${slug || Date.now().toString(36)}`;
      }

      function normalizePendingCategory(value, fallback = {}) {
        const source =
          value && typeof value === "object"
            ? value
            : {
                title: value
              };
        const title = String(source.title || source.name || fallback.title || "").trim();
        if (!title) return null;
        const id = String(source.id || source.key || fallback.id || pendingCategoryIdFromTitle(title)).trim();
        const color = isValidHexColor(source.color || fallback.color)
          ? String(source.color || fallback.color).toLowerCase()
          : criticalRoutePalette[Math.abs(id.length) % criticalRoutePalette.length];
        return {
          id,
          title,
          color,
          owner: String(source.owner || fallback.owner || "").trim(),
          responsibleLabel: String(source.responsibleLabel || fallback.responsibleLabel || "").trim(),
          startDate: taskDateInputValue(source.startDate || fallback.startDate || ""),
          dueDate: taskDateInputValue(source.dueDate || fallback.dueDate || ""),
          priority: String(source.priority || fallback.priority || "Media").trim() || "Media",
          createdAt: source.createdAt || fallback.createdAt || new Date().toISOString()
        };
      }

      function getStoredPendingCategories() {
        try {
          const parsed = JSON.parse(localStorage.getItem(PENDING_MANUAL_CATEGORIES_STORAGE_KEY) || "[]");
          return Array.isArray(parsed) ? parsed.map((category) => normalizePendingCategory(category)).filter(Boolean) : [];
        } catch {
          return [];
        }
      }

      function savePendingCategories() {
        try {
          localStorage.setItem(PENDING_MANUAL_CATEGORIES_STORAGE_KEY, JSON.stringify(manualPendingCategories));
        } catch {
          // Las categorias se mantienen en memoria aunque el navegador bloquee localStorage.
        }
      }

      function upsertPendingCategory(category) {
        const normalized = normalizePendingCategory(category);
        if (!normalized) return null;
        const currentIndex = manualPendingCategories.findIndex((item) => item.id === normalized.id);
        if (currentIndex >= 0) {
          manualPendingCategories[currentIndex] = {
            ...manualPendingCategories[currentIndex],
            ...normalized
          };
        } else {
          manualPendingCategories.unshift(normalized);

        savePendingCategories();
        return normalized;

      // Id para tareas internas antiguas guardadas sin id. Antes se inventaba uno al azar en cada
      // navegador, asi que la misma tarea llegaba con dos ids distintos y aparecia duplicada.
      function legacySubtaskId(title) {
        let hash = 2166136261;
        const text = normalizeText(title);
        for (let index = 0; index < text.length; index += 1) {
          hash ^= text.charCodeAt(index);
          hash = Math.imul(hash, 16777619);
        }
        return `subtask-legacy-${(hash >>> 0).toString(36)}`;
      }

      function normalizePendingSubtask(value, fallback = {}) {
        const source =
          value && typeof value === "object"
            ? value
            : {
                title: value
              };
        const title = String(source.title || source.name || fallback.title || "").trim();
        if (!title) return null;
        const startDate = taskDateInputValue(source.startDate ?? fallback.startDate ?? "");
        const endDate = taskDateInputValue(source.endDate ?? fallback.endDate ?? "");
        const rawOrder = source.order ?? fallback.order;
        // Number(null) es 0, asi que el hueco se descarta antes de convertir.
        const order = rawOrder === null || rawOrder === undefined || rawOrder === "" ? NaN : Number(rawOrder);
        return {
          id: String(source.id || fallback.id || legacySubtaskId(title)).trim(),
          title,
          owner: String(source.owner || fallback.owner || "").trim(),
          status: String(source.status || fallback.status || "Pendiente").trim() || "Pendiente",
          order: Number.isFinite(order) ? order : null,
          // Sin fecha real queda vacia: antes se ponia la hora actual y una tarea interna antigua pasaba
          // a ser "la editada mas recientemente", pisando cambios reales del otro usuario al fusionar.
          createdAt: source.createdAt || fallback.createdAt || "",
          completedAt: source.completedAt || fallback.completedAt || "",
          completedBy: source.completedBy || fallback.completedBy || "",
          updatedAt:
            source.updatedAt ||
            fallback.updatedAt ||
            source.completedAt ||
            fallback.completedAt ||
            source.createdAt ||
            fallback.createdAt ||
            "",
          startDate,
          endDate: endDate && startDate && endDate < startDate ? startDate : endDate
        };
      }

      function pendingSubtasks(task) {
        if (!Array.isArray(task)) return [];
        const source = Array.isArray(task[TASK_SUBTASKS_INDEX]) ? task[TASK_SUBTASKS_INDEX] : [];
        const normalized = source.map((subtask) => normalizePendingSubtask(subtask)).filter(Boolean);
        // Manda el orden manual; las tareas que nunca se movieron conservan su posicion.
        const ordered = normalized
          .map((subtask, index) => ({ subtask, index }))
          .sort((left, right) => {
            const leftOrder = Number.isFinite(left.subtask.order) ? left.subtask.order : left.index;
            const rightOrder = Number.isFinite(right.subtask.order) ? right.subtask.order : right.index;
            if (leftOrder !== rightOrder) return leftOrder - rightOrder;
            return left.index - right.index;
          })
          .map((entry) => entry.subtask);
        task[TASK_SUBTASKS_INDEX] = ordered;
        return ordered;
      }

      function movePendingSubtask(taskIdValue, subtaskId, direction) {
        const { task, taskIndex } = findPendingTaskById(taskIdValue);
        if (!task || taskIndex < 0) return false;
        if (!canCurrentUserControlTask(taskId(task, taskIndex))) return false;
        const subtasks = pendingSubtasks(task);
        const currentIndex = subtasks.findIndex((item) => item.id === subtaskId);
        if (currentIndex < 0) return false;
        const targetIndex = direction === "up" ? currentIndex - 1 : currentIndex + 1;
        if (targetIndex < 0 || targetIndex >= subtasks.length) return false;
        const [moved] = subtasks.splice(currentIndex, 1);
        subtasks.splice(targetIndex, 0, moved);
        subtasks.forEach((subtask, index) => {
          if (subtask.order === index) return;
          subtask.order = index;
          // La marca de edicion evita que el orden viejo de la BBDD pise el nuevo.
          subtask.updatedAt = nextSubtaskStamp(subtask);
        });
        task[TASK_SUBTASKS_INDEX] = subtasks;
        saveTaskState({ reason: "subtarea-orden" });
        return true;
      }

      function updatePendingSubtaskDate(taskIdValue, subtaskId, field, value) {
        if (field !== "startDate" && field !== "endDate") return false;
        const { task, taskIndex } = findPendingTaskById(taskIdValue);
        if (!task || taskIndex < 0) return false;
        if (!canCurrentUserControlTask(taskId(task, taskIndex))) return false;
        const subtasks = pendingSubtasks(task);
        const subtask = subtasks.find((item) => item.id === subtaskId);
        if (!subtask) return false;
        const nextValue = taskDateInputValue(value);
        if (subtask[field] === nextValue) return false;
        subtask[field] = nextValue;
        if (subtask.startDate && subtask.endDate && subtask.endDate < subtask.startDate) {
          if (field === "startDate") subtask.endDate = subtask.startDate;
          else subtask.startDate = subtask.endDate;
        }
        subtask.updatedAt = nextSubtaskStamp(subtask);
        task[TASK_SUBTASKS_INDEX] = subtasks;
        saveTaskState({ reason: "subtarea-fechas" });
        return true;
      }

        return true;
      }

        const title = normalizeText(task?.[0] || "");

        route.keywords.forEach((keyword, index) => {
          if (title.includes(normalizeText(keyword))) score += 100 - index;
        });

      function suggestedCriticalRoutes(visibleTasks) {
        const usedTasks = new Set();
        return criticalRouteDefinitions
          .map((route, routeIndex) => {
            const routeKey = criticalRouteHeadingKey(routeIndex);
            // Los fijados a mano entran siempre en su grupo, sin pasar por el puntaje
            // ni por el tope de 4; los fijados a otro grupo no pueden caer aqui.
            const pinnedHere = visibleTasks
              .filter((task) => taskRoutePin(task) === routeKey)
              .map((task) => ({ task, score: routeTaskScore(task, route) }));
            pinnedHere.forEach((item) => usedTasks.add(item.task));
            const items = visibleTasks
              .map((task) => ({ task, score: routeTaskScore(task, route) }))
              .filter((item) => !taskRoutePin(item.task) && item.score > 0 && !usedTasks.has(item.task))
              .sort((left, right) => right.score - left.score || taskSortDateValue(left.task) - taskSortDateValue(right.task))
              .slice(0, 4)
              .concat(pinnedHere)
              .sort(
                (left, right) =>
                  compareTasksByManualOrder(left.task, right.task) ||
                  taskSortDateValue(left.task) - taskSortDateValue(right.task) ||
                  right.score - left.score
              )
              .map((item) => {
                usedTasks.add(item.task);
                return { task: item.task };
              });
            return { ...route, items };
          })
          // Una ruta con un solo pendiente se descarta, salvo que alguien lo haya
          // movido ahi a mano: en ese caso el grupo debe seguir existiendo.
          .filter((route) => route.items.length >= 2 || route.items.some((item) => taskRoutePin(item.task)))
          .slice(0, 4);
      }

        const id = "task-" + Date.now().toString(36) + "-" + Math.random().toString(16).slice(2, 8);
        const nextTask = [
          title,
          owner,
          dueDate,
          "Pendiente",
          priority,
          startDate,
          id,
          new Date().toISOString()
        ];
        nextTask[TASK_COLOR_INDEX] = defaultPendingTaskColor(nextTask);
        const normalizedCategory = normalizePendingCategory(category);
        if (normalizedCategory) {
          nextTask[TASK_CATEGORY_INDEX] = normalizedCategory;
          upsertPendingCategory(normalizedCategory);
        }
        tasks.unshift(nextTask);
        saveTaskState({ reason: "tarea-creada" });
        notifyTaskAssignment(nextTask, id, owner);
        return true;
      }

        return !collapsedSubtaskIds.has(String(parentTaskId || ""));

        const id = String(parentTaskId || "");

        return `${String(parentTaskId || "")}::${String(subtaskId || "")}`;

        return openSubtaskDateIds.has(subtaskDatesKey(parentTaskId, subtaskId));

      function downloadCompletedTasksTable() {
        if (!completedTasks.length) {
          window.alert("Aún no hay tareas completadas para descargar.");
          return;
        }

        const headers = [
          "Pendiente",
          "Responsable",
          "Fecha de creación",
          "Fecha de finalización",
          "Usuario",
          "Acción",
          "Tiempo dedicado",
          "Fecha de inicio",
          "Fecha fin",
          "Prioridad"
        ];
        const rows = completedTasks.map((task) => [
          task.title,
          task.owner || "Sin asignar",
          task.createdAt ? fmtDateTime(task.createdAt) : "Sin fecha",
          task.completedAt ? fmtDateTime(task.completedAt) : "Sin fecha",
          task.completedBy || "Usuario local",
          task.action === "eliminada" ? "Borrado" : "Completado",
          formatTimer(task.totalSeconds || 0),
          task.startDate || "",
          task.dueDate || "",
          task.priority || ""
        ]);
        const csv = [headers, ...rows].map((row) => row.map(csvCell).join(";")).join("\r\n");
        const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "tareas-completadas-" + new Date().toISOString().slice(0, 10) + ".csv";
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
      }

      // ── ManyChat Leads Module ────────────────────────────────
      let manychatClient = null;

      function ensureManychatClient() {
        if (manychatClient) return manychatClient;
        const config = window.LR_SUITE_SUPABASE || {};
        const supabaseUrl = config.url || "";
        const supabaseAnonKey = config.anonKey || config.anon_key || "";
        if (!window.supabase?.createClient || !supabaseUrl || !supabaseAnonKey) {
          return null;
        }
        manychatClient = ensureSharedPendingClient();
        return manychatClient;
      }

      function renderManychatStatus(content, message, detail = "") {
        content.innerHTML = `
          <section class="module">
            <div class="panel">
              <div class="panel-head">
                <strong>ManyChat Leads</strong>
                <p class="small">Leads recibidos desde el webhook de ManyChat y sincronizados con Supabase.</p>
              </div>
