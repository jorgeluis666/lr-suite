        return `
          <div class="gasto-toolbar">
            ${
              modelo.meses.length > 1
                ? `<label class="small">Mes
                    <select data-gasto-mes aria-label="Mes del informe">${modelo.meses
                      .map(
                        (mes) =>
                          `<option value="${mes}" ${mes === modelo.mes ? "selected" : ""}>${escapeHtml(gastoMesEtiqueta(mes))}</option>`
                      )
                      .join("")}</select>
                  </label>`
                : ""
            }
            <input class="gasto-file" id="gastoInformeInput" type="file" accept=".csv,.tsv,.txt" />
            <button class="btn primary" type="button" data-gasto-subir>${icons.upload} Subir informe</button>
            <p class="small gasto-toolbar-status" role="status" aria-live="polite">${escapeHtml(estado)}</p>
          </div>
        `;
      }

      function gastoSectionHtml() {
        ensureGastoCargado();
        const modelo = gastoModelo();
        return `
          <div class="gasto-module">
            ${gastoError ? `<div class="financial-notice error" role="alert">${escapeHtml(gastoError)}</div>` : ""}
            ${
              modelo.informe
                ? `${gastoMetricasHtml(modelo)}${gastoMarcasHtml(modelo)}${gastoHitoHtml(modelo)}${gastoTablaHtml(modelo)}${gastoAlertasHtml(modelo)}`
                : gastoVacioHtml()
            }
          </div>
        `;
      }

      function gastoVacioHtml() {
        if (gastoCargando || (!gastoCargado && !gastoError)) {
          return `<div class="panel"><div class="empty">Leyendo los presupuestos…</div></div>`;
        }
        // La lectura falló: el aviso de arriba ya lo dice y el instructivo no ayudaría.
        if (!gastoCargado) return "";
        return `
          <div class="panel">
            <div class="gasto-ayuda">
              <span class="gasto-ayuda-titulo">Todavía no hay informe de Google Ads</span>
              Las alertas comparan el presupuesto que le asignas a cada cuenta con lo que ya gastó. El gasto sale del
              «Informe de rendimiento» del administrador de Google Ads:
              <ol>
                <li>En Google Ads, entra a la cuenta de administrador y abre <strong>Cuentas → Informe de rendimiento</strong>.</li>
                <li>Elige el periodo (el mes en curso) y descarga el informe en <strong>CSV</strong>.</li>
                <li>Súbelo acá con «Subir informe». Los presupuestos se escriben una vez por mes y quedan guardados.</li>
              </ol>
            </div>
          </div>
        `;
      }

      // ── La tarjeta del hito ────────────────────────────────────────────────
      function gastoHitoHtml(modelo) {
        ensureReglasCargado();
        if (reglasCargando || (!reglasCargado && !reglasError)) {
          return `<div class="panel"><div class="empty">Leyendo las reglas…</div></div>`;
        }
        const { dia, enCurso } = reglasDiaDe(modelo);
        const grupos = reglasHitosDe(dia);
        if (!grupos.length) return gastoHitoVacioHtml();

        const conReglas = Object.keys(reglasPorMarca()).length;
        const analizables = reglasMarcasAnalizables(modelo, grupos);
        return `
          <div class="panel">
            <div class="toolbar">
              <div>
                <strong>El hito que toca</strong>
                <p class="small">${
                  enCurso
                    ? `Día ${dia} de ${modelo.totales.diasMes} del mes`
                    : `${escapeHtml(gastoMesEtiqueta(modelo.mes))} ya cerró: se lee con su último día`
                } · ${conReglas} ${conReglas === 1 ? "marca" : "marcas"} con reglas · ${
                  conteoMarcasDeFuente("meta")
                } con el ciclo de Meta${
                  reglasDatos?.lastSync ? ` · sincronizadas ${fmtDateTime(reglasDatos.lastSync)}` : ""
                }</p>
              </div>
              <button class="btn" type="button" data-reglas-actualizar>${icons.refresh} Actualizar reglas</button>
            </div>
            ${grupos.map((grupo) => gastoHitoGrupoHtml(modelo, grupo)).join("")}
            ${analizables.length ? gastoHitoAnalisisHtml(analizables) : ""}
          </div>
        `;
      }

      function gastoHitoGrupoHtml(modelo, grupo) {
        const { hito, marcas, etiqueta } = grupo;
        const accion = REGLAS_ACCIONES[hito.accion];
        const evidencia = reglasEvidencia(modelo, grupo);
        const todas = marcas.length === conteoMarcasDeFuente(grupo.fuente);
        // El ciclo de Meta no tiene ninguna cifra en este módulo, ni siquiera en los hitos cuya
        // acción se llama igual que una de Google: todo lo suyo se mira en Anuncios.
        const modulo = accion?.modulo || (grupo.fuente === "meta" ? "Anuncios" : "");
        return `
          <div class="hito">
            <div class="hito-cabecera">
              <span class="badge">${escapeHtml(etiqueta)}</span>
              <span class="hito-nombre">${escapeHtml(hito.hito || hito.id)}</span>
              <span class="badge">${escapeHtml(hito.accion || "sin acción")}</span>
              <span class="small">${todas ? "todas las marcas" : escapeHtml(marcas.join(", "))}</span>
            </div>
            ${hito.instruccion ? `<p class="hito-instruccion">${escapeHtml(hito.instruccion)}</p>` : ""}
            ${
              modulo
                ? `<p class="small">Lo que pide esta acción —${escapeHtml((accion?.titulo || hito.accion || "").toLowerCase())}— no sale de los presupuestos: está en el módulo de ${escapeHtml(modulo)}. Acá quedan las cifras de gasto para el análisis.</p>`
                : ""
            }
            ${
              evidencia.length
                ? `<div class="hito-evidencia">
                    <span class="hito-titulo-evidencia">${escapeHtml(accion?.titulo || "Cifras del mes")}</span>
                    ${evidencia
                      .map(
                        (item) => `
                          <div class="gasto-alerta">
                            ${gastoBadge(item.fila.estado)}
                            <span class="gasto-alerta-cuenta">${escapeHtml(item.fila.marca || item.fila.cuenta.nombre)}</span>
                            <p class="gasto-alerta-texto">${escapeHtml(item.texto)}</p>
                          </div>
                        `
                      )
                      .join("")}
                  </div>`
                : modulo
                  ? ""
                  : `<p class="small">${escapeHtml(
                      hito.accion === "escalar_presupuesto"
                        ? "Ninguna de estas marcas va a cerrar el mes por debajo de lo asignado: no hay presupuesto suelto que escalar."
                        : "Sin cifras que mostrar para esta acción con el informe de este mes."
                    )}</p>`
            }
          </div>
        `;
      }

      function conteoMarcasConReglas() {
        return Object.keys(reglasPorMarca()).length;
      }

      function gastoHitoAnalisisHtml(marcas) {
        const elegida = marcas.includes(reglasMarcaElegida) ? reglasMarcaElegida : marcas[0];
        const guardado = reglasAnalisis.get(elegida);
        return `
          <div class="hito hito-analisis">
            <div class="hito-analisis-barra">
              <span class="hito-titulo-evidencia">Análisis del hito</span>
              <select data-reglas-marca aria-label="Marca a analizar">
                ${marcas
                  .map(
                    (marca) =>
                      `<option value="${escapeHtml(marca)}" ${marca === elegida ? "selected" : ""}>${escapeHtml(marca)}</option>`
                  )
                  .join("")}
              </select>
              <button class="btn primary" type="button" data-reglas-analizar ${reglasAnalizando ? "disabled" : ""}>
                ${reglasAnalizando === elegida ? "Pensando…" : guardado ? "Pedir de nuevo" : "Pedir el análisis"}
              </button>
            </div>
            ${
              guardado?.texto
                ? `<p class="hito-analisis-texto">${escapeHtml(guardado.texto)}</p>`
                : `<p class="small">La instrucción estratégica de ${escapeHtml(elegida)} y las cifras de sus cuentas se le pasan a Claude, que responde con el análisis de este hito. Nada se guarda: queda mientras dure la sesión.</p>`
            }
          </div>
        `;
      }

      // Sin reglas sincronizadas no se inventa un hito: se dice qué falta para tenerlas.
      function gastoHitoVacioHtml() {
        const avisos = Array.isArray(reglasDatos?.errors) ? reglasDatos.errors : [];
        const hayMarcas = conteoMarcasConReglas() > 0;
        return `
          <div class="panel">
            <div class="gasto-ayuda">
              <span class="gasto-ayuda-titulo">
                ${hayMarcas ? "Ninguna regla aplica a este día del mes" : "Todavía no hay reglas sincronizadas"}
              </span>
              ${
                hayMarcas
                  ? `Las ${conteoMarcasConReglas()} marcas con reglas no tienen ningún hito cuyo corte incluya el día
                     que se está mirando. Revisa la columna «Valor» de sus hojas: con «&lt;= 7», «&lt;= 14», «&lt;= 21»
                     y «&gt; 21» todos los días del mes quedan cubiertos.`
                  : `Las proyecciones de este módulo siguen el Ciclo Mensual de Análisis y Optimización: cuatro hitos,
                     uno por semana y por plataforma, declarados en una hoja por marca —una pestaña para Google Ads
                     y otra para Meta Ads— en lugar de escritos en el código.
                     <ol>
                       <li>Ejecuta <strong>crearReglas()</strong> del Apps Script de
                           <code>src/modules/reglas/apps-script/</code>: crea «08 Reglas y Optimización» con la hoja
                           «Reglas_Nexus_&lt;Marca&gt;» en el Drive de cada marca.</li>
                       <li>Corre <code>src/modules/reglas/BBDD/reglas-nexus.sql</code> en Supabase y guarda el ID del
                           maestro con <strong>lr_suite_reglas_set_maestro()</strong>.</li>
                       <li>Vuelve acá y pulsa «Actualizar reglas».</li>
                     </ol>`
              }
              ${
                avisos.length
                  ? `<p class="small">Lo que avisó la última sincronización:</p>
                     <ol>${avisos.map((aviso) => `<li>${escapeHtml(String(aviso))}</li>`).join("")}</ol>`
                  : ""
              }
            </div>
          </div>
        `;
      }

      function gastoMetricasHtml(modelo) {
        const total = modelo.totales;
        const consumido = total.presupuesto ? total.gastadoAsignado / total.presupuesto : 0;
        const desvio = total.proyeccionAsignada - total.presupuesto;
        const cuentas = modelo.filas.length;
        // Mientras falten presupuestos, el consumido y el desvío dicen sobre cuántas cuentas se miden.
        const parcial = total.conPresupuesto < cuentas ? ` en ${total.conPresupuesto} de ${cuentas} cuentas` : "";
        return `
          <div class="metrics gasto-metrics">
            ${metric(
              "Presupuesto asignado",
              total.presupuesto ? gastoMonto(total.presupuesto, total.moneda) : "—",
              `${total.conPresupuesto} de ${cuentas} cuentas con presupuesto`
            )}
            ${metric("Gastado", gastoMonto(total.gastado, total.moneda), `${total.dias} de ${total.diasMes} días del mes`)}
            ${metric(
              "Consumido",
              total.presupuesto ? fmtMetricPercent(consumido * 100) : "—",
              total.presupuesto
                ? `El mes va al ${fmtMetricPercent((total.dias / total.diasMes) * 100)}${parcial}`
                : "Falta asignar presupuestos"
            )}
            ${metric(
              "Proyección del mes",
              gastoMonto(total.proyeccion, total.moneda),
              total.presupuesto
                ? `${desvio >= 0 ? "+" : "−"}${gastoMonto(Math.abs(desvio), total.moneda)} frente a lo asignado${parcial}`
                : "Sin presupuesto con el que comparar"
            )}
            ${metric(
              "Cuentas en alerta",
              fmtNumber(total.enAlerta),
              !total.conPresupuesto
                ? "Falta asignar presupuestos"
                : total.enAlerta
                  ? `De ${cuentas} cuentas del informe`
                  : "Ninguna se sale del presupuesto"
            )}
          </div>
        `;
      }

      // Pacing por marca: la lectura con la que se conversa con el cliente. La tabla de cuentas que

                    <th class="right">Proyección</th>

              barra azul va por detrás, la marca gasta más lento de lo que le toca.
            </p>
          </div>
        `;

      function gastoTablaHtml(modelo) {

                    <th>Estado</th>

                  <div class="gasto-bar-fill ${tono}" style="width:${ancho}%"></div>

                <strong>Qué revisar</strong>

      function gastoGuardarPresupuesto(id, valor) {
        const modelo = gastoModelo();
        if (!modelo.mes || !id) return;
        const numero = Number(String(valor).replace(",", "."));
        const monto = Number.isFinite(numero) && numero > 0 ? Math.round(numero * 100) / 100 : 0;
        const base = gastoNormalizar(gastoDatos);
        const cuenta = base.cuentas[id] || {};
        const presupuestos = { ...(cuenta.presupuestos || {}) };
        if (monto) presupuestos[modelo.mes] = monto;
        else delete presupuestos[modelo.mes];
        guardarGasto(
          { ...base, cuentas: { ...base.cuentas, [id]: { ...cuenta, presupuestos } } },
          monto ? "Presupuesto guardado." : "Presupuesto borrado."
        );
      }

      function gastoGuardarMarca(id, valor) {
        if (!id) return;
        const base = gastoNormalizar(gastoDatos);
        const cuenta = base.cuentas[id] || {};
        guardarGasto(
          { ...base, cuentas: { ...base.cuentas, [id]: { ...cuenta, marca: String(valor || "") } } },
          "Marca guardada."
        );
      }

      function gastoSubirInforme(file) {
        const reader = new FileReader();
        reader.onload = () => {
          const { informe, error } = gastoParseInforme(String(reader.result || ""));
          if (error) {
            window.alert(error);
            return;
          }
          const mes = gastoMesDe(informe);
          if (!mes) {
            window.alert("No se pudo leer a qué mes corresponde el informe.");
            return;
          }
          const base = gastoNormalizar(gastoDatos);
          const aviso = [
            `${informe.cuentas.length} cuentas · del ${fmtDate(informe.desde)} al ${fmtDate(informe.hasta)}.`,
            informe.desde.slice(0, 7) !== mes
              ? `El informe abarca más de un mes: se compara contra el presupuesto de ${gastoMesEtiqueta(mes)}.`
              : "",
            base.informes[mes]
              ? `Reemplaza el informe de ${gastoMesEtiqueta(mes)} que ya estaba cargado.`
              : `Queda como el informe de ${gastoMesEtiqueta(mes)}.`,
            "Los presupuestos asignados no se tocan.",
            "",
            "¿Continuar?"
          ]
            .filter(Boolean)
            .join("\n");
          if (!window.confirm(aviso)) return;
          gastoMesActivo = mes;
          guardarGasto(
            {
              ...base,
              informes: {
                ...base.informes,
                [mes]: { ...informe, subidoAt: new Date().toISOString(), subidoPor: currentSuiteUserName() }
              }
            },
            `Informe de ${gastoMesEtiqueta(mes)} cargado.`
          );
        };
        reader.readAsText(file, "utf-8");
      }

      // `redraw` es cómo se vuelve a dibujar la pantalla que contiene las alertas.
      function wireGastoModule(redraw) {
        document.querySelector("[data-gasto-subir]")?.addEventListener("click", () => {
          document.getElementById("gastoInformeInput")?.click();

        document.querySelector("[data-gasto-mes]")?.addEventListener("change", (event) => {

      // salud -> [texto, clase del badge, gravedad]
      const AUTOMATION_HEALTH = {
        error: ["Error", "rose", 6],
        rojo: ["Atrasado", "rose", 5],
        ambar: ["Atención", "amber", 4],
        "sin-datos": ["Sin datos", "", 3],

        pausado: ["Pausado", "", 0],

      };
      // estado de una corrida -> [texto, clase del badge]
      const AUTOMATION_RUN_STATUS = {
        ok: ["OK", "automation-ok"],
        avisos: ["OK con avisos", "amber"],
        error: ["Error", "rose"],
        vencida: ["No se ejecutó", "rose"],
        en_curso: ["En curso", "sky"],

      };
      const AUTOMATION_CADENCE = { diaria: "diaria", semanal: "semanal", mensual: "mensual" };
      const AUTOMATION_FINANCIAL_TABS = { ventas: "Ventas", inversion: "Inversion", resultados: "Venta vs Resultados" };
      const AUTOMATION_DISCOVERY = { "drive-api": "Drive API", embeddedfolderview: "vista pública de la carpeta", manifest: "último listado guardado" };
      const automationLimaDateTime = new Intl.DateTimeFormat("es-PE", {
        timeZone: "America/Lima",
        day: "2-digit",
        month: "short",
        hour: "2-digit",
        minute: "2-digit"
      });
      const automationLimaTime = new Intl.DateTimeFormat("es-PE", {
        timeZone: "America/Lima",
        hour: "2-digit",
        minute: "2-digit"
      });
      const automationLoad = { started: false, loading: false, checkedAt: 0, error: "", missing: false, outdated: false };
      const automationRerun = { busy: {}, message: "", messageAt: 0, error: "" };
      let automationStatus = null; // respuesta de lr_suite_automation_status
      let automationStatusAt = 0; // Date.now() al recibirla: con esto avanza el reloj de Supabase
      let automationPollTimer = 0;
      let automationPollStartedAt = 0;
      let automationSelected = "";
      let automationPrefs = readAutomationPrefs();

      function readAutomationPrefs() {
        const defaults = { threshold: 48, runs: "all" };
        try {
          const saved = JSON.parse(localStorage.getItem(AUTOMATION_PREFS_KEY) || "{}");
          return {
            threshold: AUTOMATION_THRESHOLDS.includes(Number(saved.threshold)) ? Number(saved.threshold) : defaults.threshold,
            runs: saved.runs === "errors" ? "errors" : defaults.runs
          };
        } catch {
          return defaults;
        }
      }

      function saveAutomationPrefs() {
        try {
          localStorage.setItem(AUTOMATION_PREFS_KEY, JSON.stringify(automationPrefs));
        } catch {
          // Las preferencias siguen activas durante la sesión aunque el navegador no las guarde.
        }
      }

      function resetAutomationState() {
        window.clearTimeout(automationPollTimer);
        automationPollTimer = 0;
        automationPollStartedAt = 0;
        automationStatus = null;
        automationStatusAt = 0;
        automationSelected = "";
        Object.assign(automationLoad, { started: false, checkedAt: 0, error: "", missing: false, outdated: false });
        Object.assign(automationRerun, { busy: {}, message: "", messageAt: 0, error: "" });
      }

      // Reloj de Supabase: la hora que devolvió el RPC más lo transcurrido desde entonces. Sin RPC, el del equipo.
      function automationNow() {
        const serverNow = Date.parse(automationStatus?.serverNow || "");
        return Number.isFinite(serverNow) ? serverNow + (Date.now() - automationStatusAt) : Date.now();
      }

      function automationTime(value) {
        const time = typeof value === "number" ? value : Date.parse(value || "");
        return Number.isFinite(time) && time > 0 ? time : null;
      }

      function automationHoursSince(time) {
        return time ? Math.max(0, (automationNow() - time) / 3600000) : null;
      }

      function automationDateText(time) {
        return time ? automationLimaDateTime.format(new Date(time)) : "—";
      }

      function automationClockText(time) {
        return time ? automationLimaTime.format(new Date(time)) : "";
      }

      function automationAgeText(hours) {
        if (hours === null || hours === undefined || !Number.isFinite(hours)) return "";
        if (hours < 1) return `hace ${Math.max(1, Math.round(hours * 60))} min`;
        const total = Math.round(hours);
        if (total < 48) return `hace ${total} h`;
        const days = Math.floor(total / 24);
        return total % 24 ? `hace ${days} d ${total % 24} h` : `hace ${days} d`;
      }

      function automationDurationText(ms) {
        if (ms === null || ms === undefined || !Number.isFinite(ms) || ms < 0) return "—";
        const seconds = Math.round(ms / 1000);
        return seconds < 60 ? `${seconds} s` : `${Math.floor(seconds / 60)} min ${seconds % 60} s`;
      }

      function automationWho(value) {
        if (!value) return "";
        return suiteUserForEmail(value)?.name || value;
      }

      function automationTriggerText(trigger, requestedBy) {
        if (trigger === "manual") return requestedBy ? `manual · ${automationWho(requestedBy)}` : "manual";
        if (trigger === "instalacion") return "primera carga";
        if (trigger === "automatica") return "automática";
        return trigger || "";
      }

      // Verde hasta la mitad del umbral, ámbar hasta el umbral y rojo después. Lo semanal suma 7 días y lo
      // mensual 31.
      function automationFreshness(ageHours, cadence, threshold) {
        if (ageHours === null || ageHours === undefined || !Number.isFinite(ageHours)) return "sin-datos";
        const base = cadence === "semanal" ? 168 : cadence === "mensual" ? 744 : 0;
        if (ageHours <= base + threshold / 2) return "verde";
        if (ageHours <= base + threshold) return "ambar";
        return "rojo";
      }

      function automationIsMissingRpc(error) {
        return String(error?.code || "") === "PGRST202" || /could not find the function/i.test(String(error?.message || ""));
      }

      function automationStatusError(error) {
        if (automationIsMissingRpc(error)) {
          return "Falta instalar el control en Supabase: ejecuta src/modules/control-automatizacion/BBDD/control-automatizacion.sql en el SQL Editor. Mientras tanto el proceso se muestra sin su estado real.";
        }
        if (String(error?.code || "") === "42501") return "Tu usuario no tiene permiso para ver el estado de la automatización.";
        return `No se pudo leer el estado desde Supabase: ${error?.message || "error desconocido"}`;
      }

      async function loadAutomationStatus() {
        const client = ensureSharedPendingClient();
        if (!client || !getSuiteAccessSession()) {
          automationLoad.error = "Inicia sesión para ver el estado de la automatización.";
          return;
        }
        try {
          const { data, error } = await client.rpc("lr_suite_automation_status", { p_history: AUTOMATION_HISTORY });
          if (!getSuiteAccessSession()) return; // la sesión se cerró mientras tanto
          if (error) {
            automationLoad.missing = automationIsMissingRpc(error);
            automationLoad.outdated = false;
            automationLoad.error = automationStatusError(error);
            return;
          }
          automationLoad.missing = false;
          if (data && Array.isArray(data.components)) {
            automationStatus = data;
            automationStatusAt = Date.now();
            automationLoad.outdated = false;
            automationLoad.error = "";
          } else {
            // La versión 1 del SQL devuelve "jobs" en lugar de "components".
            automationStatus = null;
            automationLoad.outdated = Boolean(data && Array.isArray(data.jobs));
            automationLoad.error = automationLoad.outdated
              ? "El SQL instalado en Supabase es la versión anterior: vuelve a ejecutar src/modules/control-automatizacion/BBDD/control-automatizacion.sql para ver el estado real del proceso."
              : "Supabase devolvió un estado vacío.";
          }
        } catch (error) {
          automationLoad.error = automationStatusError(error);
        } finally {
          automationLoad.checkedAt = Date.now();
        }
      }

      // Se relee como máximo cada 2 minutos, salvo que se pulse «Actualizar».
      async function ensureAutomationLoaded(force = false) {
        if (automationLoad.loading) return;
        if (automationLoad.started && !force && Date.now() - automationLoad.checkedAt < AUTOMATION_STATUS_TTL_MS) return;
        automationLoad.started = true;
        automationLoad.loading = true;
        try {
          await loadAutomationStatus();
        } finally {
          automationLoad.loading = false;
          rerenderAutomation();
          scheduleAutomationPoll();
        }
      }

      // La lectura del estado es asíncrona: cuando llega, se redibuja solo si el proceso está a la
      // vista, que ahora es la vista «Proceso» del módulo de Clientes.
      function rerenderAutomation() {
        if (hasSuiteAccess() && state.active === "clientes" && clientesVista === "automatizacion") clientesModule();
      }

      function automationQueuedRunIds() {
        return (automationStatus?.components || []).flatMap((component) =>
          (component.runs || []).filter((run) => run.status === "en_cola" && !run.overdue).map((run) => run.id)
        );
      }

      // Mientras haya una re-ejecución en cola se relee el estado cada 15 s (~6 KB por lectura).
      function scheduleAutomationPoll() {
        window.clearTimeout(automationPollTimer);
        automationPollTimer = 0;
        const queued = automationQueuedRunIds();
        if (!queued.length || !getSuiteAccessSession()) {
          automationPollStartedAt = 0;
          return;
        }
        if (!automationPollStartedAt) automationPollStartedAt = Date.now();
        if (Date.now() - automationPollStartedAt > AUTOMATION_POLL_LIMIT_MS) return;
        automationPollTimer = window.setTimeout(async () => {
          automationPollTimer = 0;
          await loadAutomationStatus();
          announceFinishedReruns(queued);
          rerenderAutomation();
          scheduleAutomationPoll();
        }, AUTOMATION_POLL_MS);
      }

      // Avisa cuando termina una re-ejecución que estaba en cola. Si fue Pérdidas y Ganancias, relee su fila
      // para que ese módulo muestre los datos nuevos.
      function announceFinishedReruns(previouslyQueued) {
        (automationStatus?.components || []).forEach((component) => {
          (component.runs || []).forEach((run) => {
            if (!previouslyQueued.includes(run.id) || run.status === "en_cola") return;
            if (run.status === "ok") {
              automationRerun.message = `${component.name}: terminó bien (${automationClockText(automationTime(run.finishedAt))}).`;
              automationRerun.error = "";
              if (component.id === "financial") loadPrivateFinancial();
            } else {
              automationRerun.message = "";
              automationRerun.error = `${component.name}: la ejecución falló. ${run.error || ""}`.trim();
            }
            automationRerun.messageAt = Date.now();
          });
        });
      }

      function automationRerunError(error) {
        if (automationIsMissingRpc(error)) return "Falta instalar el control en Supabase (control-automatizacion.sql).";
        if (String(error?.code || "") === "42501") return "Tu usuario no tiene permiso para ejecutar sincronizaciones.";
        return `No se pudo poner en cola: ${error?.message || "error desconocido"}`;
      }

      async function rerunAutomation(componentId) {
        const component = automationStatus?.components?.find((item) => item.id === componentId && item.canRun);
        if (!component || automationRerun.busy[component.id]) return;
        const client = ensureSharedPendingClient();
        if (!client || !getSuiteAccessSession()) {
          automationRerun.error = "Inicia sesión para ejecutar.";
          rerenderAutomation();
          return;
        }
        automationRerun.busy[component.id] = true;
        automationRerun.error = "";
        rerenderAutomation();
        try {
          const { data, error } = await client.rpc("run_lr_suite_automation", { p_job: component.id });
          if (error) throw error;
          // La corrida en cola entra al estado sin esperar otra lectura.
          if (data?.id) component.runs = [data, ...(component.runs || []).filter((run) => run.id !== data.id)];
          const startsAt = automationClockText(automationTime(data?.scheduledFor));
          automationRerun.message = `${component.name}: en cola${startsAt ? ` (empieza a las ${startsAt})` : ""}. Esta pantalla se actualiza sola.`;
          automationRerun.messageAt = Date.now();
        } catch (error) {
          automationRerun.error = automationRerunError(error);
        } finally {
          delete automationRerun.busy[component.id];
        }
        rerenderAutomation();
        scheduleAutomationPoll();
      }

      function automationCronRun(run, cronJob) {
        const status = run.status === "succeeded" ? "ok" : run.status === "failed" ? "error" : "en_curso";
        return {
          id: "",
          cronJob,
          origin: "automatica",
          who: "",
          status,
          startedAt: automationTime(run.startedAt),
          finishedAt: automationTime(run.finishedAt),
          durationMs: Number.isFinite(run.durationMs) ? run.durationMs : null,
          message: status === "error" ? String(run.message || "").replace(/^ERROR:\s*/i, "") : "",
          detail: null
        };
      }

      function automationLoggedRun(run) {
        const scheduledFor = automationTime(run.scheduledFor);
        const detail = run.detail && typeof run.detail === "object" ? run.detail : null;
        const warnings = Array.isArray(detail?.errors) ? detail.errors : [];
        let status = run.status;
        if (status === "en_cola") {
          status = run.overdue ? "vencida" : scheduledFor && automationNow() >= scheduledFor ? "en_curso" : "en_cola";
        } else if (status === "ok" && warnings.length) {
          status = "avisos";
        }
        const loaded = Array.isArray(detail?.files)
          ? `${fmtNumber(Number(detail.total) || 0)} archivos leídos`
          : detail?.rows
            ? `${fmtNumber(Number(detail.total) || 0)} filas cargadas`
            : "";
        const message =
          status === "error"
            ? run.error || ""
            : status === "vencida"
              ? "pg_cron no la ejecutó. Revisa los jobs «lr-suite-automation-run-…» en Supabase."
              : status === "en_cola"
                ? `Empieza a las ${automationClockText(scheduledFor)}`
                : status === "en_curso"
                  ? "Ejecutándose…"
                  : status === "avisos"
                    ? warnings.slice(0, 2).join(" · ")
                    : loaded;
        return {
          id: run.id,
          cronJob: "",
          origin: run.trigger === "manual" ? "manual" : "automatica",
          who: run.requestedBy || "",
          status,
          startedAt: automationTime(run.startedAt) || scheduledFor || automationTime(run.requestedAt),
          finishedAt: automationTime(run.finishedAt),
          durationMs: Number.isFinite(run.durationMs) ? run.durationMs : null,
          message,
          detail
        };
      }

      function automationComponents() {
        return Array.isArray(automationStatus?.components)
          ? automationStatus.components
          : AUTOMATION_DEFAULT_COMPONENTS.map((component) => ({ ...component, fallback: true }));
      }

      function automationView(component) {
        const cron = component.cronJob ? automationStatus?.cron?.[component.cronJob] || null : null;
        const runs = [
          ...(Array.isArray(cron?.runs) ? cron.runs : []).map((run) => automationCronRun(run, component.cronJob)),
          ...(Array.isArray(component.runs) ? component.runs : []).map(automationLoggedRun)
        ].sort((left, right) => (right.startedAt || 0) - (left.startedAt || 0));
        const data = component.data && typeof component.data === "object" ? component.data : null;
        const files = Array.isArray(data?.files) ? data.files : [];
        const dataWarnings = [
          ...(Array.isArray(data?.errors) ? data.errors : []),
          ...files
            .filter((file) => file.status && file.status !== "ok")
            .map((file) => `${file.name}: ${file.status === "anterior" ? "no se pudo leer, se conserva la copia anterior" : "no se pudo leer"}`)
        ];
        const warnings = [];
        if (component.status === "activo" && component.cronJob && automationStatus) {
          if (cron?.error) warnings.push(`No se pudo leer pg_cron: ${cron.error}`);
          else if (!cron || cron.missing) warnings.push(`No existe el job «${component.cronJob}» en pg_cron: no se ejecuta solo.`);
          else if (cron.active === false) warnings.push(`El job «${component.cronJob}» está desactivado en pg_cron.`);
        }
        const lastRun = runs[0] || null;
        let lastStatus = lastRun ? lastRun.status : "";
        if (lastStatus === "ok" && dataWarnings.length) lastStatus = "avisos";
        const lastOk = runs.find((run) => run.status === "ok" || run.status === "avisos") || null;
        const ageHours = Number.isFinite(component.ageHours)
          ? component.ageHours + (Date.now() - automationStatusAt) / 3600000
          : lastOk
            ? automationHoursSince(lastOk.finishedAt || lastOk.startedAt)
            : null;
        let health;
        if (component.status === "pendiente") health = "pendiente";
        else if (component.status === "pausado") health = "pausado";
        else if (component.fallback) health = automationLoad.loading || !automationLoad.started ? "cargando" : "sin-datos";
        else if (warnings.length || lastStatus === "error" || lastStatus === "vencida") health = "error";
        else {
          health = automationFreshness(ageHours, component.cadence, automationPrefs.threshold);
          if (health === "verde" && dataWarnings.length) health = "ambar";
        }
        return { ...component, cron, runs, lastRun, lastStatus, lastOk, data, dataWarnings, warnings, ageHours, health };
      }

      function automationHealthText(view) {
        const [label] = AUTOMATION_HEALTH[view.health] || AUTOMATION_HEALTH["sin-datos"];
        if (view.health === "pendiente" || view.health === "pausado" || view.health === "cargando") return label;
        if (view.fallback) return automationLoad.missing || automationLoad.outdated ? "Falta instalar el SQL" : label;
        if (view.health === "error") {
          if (view.warnings.length) return "Error · revisar pg_cron";
          return view.lastStatus === "vencida" ? "Error · no se ejecutó" : "Error · falló la última corrida";
        }
        const age = automationAgeText(view.ageHours);
        return age ? `${label} · ${age}` : label;
      }

      // La pieza más grave manda; si todas están pendientes (o pausadas), la etapa también.
      function automationStageHealth(views) {
        const measured = views.filter((view) => view.health !== "pendiente" && view.health !== "pausado");
        if (!measured.length) return views.some((view) => view.health === "pausado") ? "pausado" : "pendiente";
        return measured.reduce(
          (worst, view) => (AUTOMATION_HEALTH[view.health][2] > AUTOMATION_HEALTH[worst][2] ? view.health : worst),
          measured[0].health
        );
      }

      function automationStageText(views) {
        const health = automationStageHealth(views);
        const pending = views.filter((view) => view.health === "pendiente").length;
        const [label] = AUTOMATION_HEALTH[health];
        return health !== "pendiente" && pending ? `${label} · ${pending} ${pending === 1 ? "pendiente" : "pendientes"}` : label;
      }

      function automationDefaultSelection(views) {
        const active = views.filter((view) => view.health !== "pendiente" && view.health !== "pausado");
        const worst = [...active].sort((left, right) => AUTOMATION_HEALTH[right.health][2] - AUTOMATION_HEALTH[left.health][2])[0];
        if (worst && AUTOMATION_HEALTH[worst.health][2] >= AUTOMATION_HEALTH.ambar[2]) return worst.id;
        return views.find((view) => view.stage === "carga" && view.health !== "pendiente")?.id || views[0]?.id || "";
      }

      function automationToolbar() {
        const busy = automationLoad.loading;
        const checkedAt = automationTime(automationStatus?.serverNow) || automationLoad.checkedAt;
        const text = busy
          ? "Revisando el proceso…"
          : automationRerun.message && Date.now() - automationRerun.messageAt < AUTOMATION_MESSAGE_MS
            ? automationRerun.message
            : checkedAt
              ? `Revisado a las ${automationClockText(checkedAt)} · hora de Lima`
              : "";
        const threshold = String(automationPrefs.threshold);
        return `
          <div class="automation-toolbar">
            <button class="btn primary" type="button" data-automation-refresh ${busy ? "disabled" : ""}>
              <span class="financial-sync-icon ${busy ? "spinning" : ""}">${icons.refresh}</span>
              ${busy ? "Actualizando…" : "Actualizar"}
            </button>
            <label class="small automation-threshold">Umbral de frescura
              <select data-automation-pref="threshold" aria-label="Umbral de frescura">${AUTOMATION_THRESHOLDS.map(
                (hours) =>
                  `<option value="${hours}" ${String(hours) === threshold ? "selected" : ""}>${hours === 168 ? "7 días" : `${hours} h`}${hours === 48 ? " (predeterminado)" : ""}</option>`
              ).join("")}</select>
            </label>
            <p class="small automation-toolbar-status" role="status" aria-live="polite">${escapeHtml(text)}</p>
          </div>
        `;
      }

      function automationNotices(views) {
        const notices = [];
        if (automationRerun.error) {
          notices.push(`<div class="financial-notice error" role="alert">${escapeHtml(automationRerun.error)}</div>`);
        }
        if (automationLoad.error) {
          const soft = automationLoad.missing || automationLoad.outdated;
          notices.push(`<div class="financial-notice ${soft ? "" : "error"}">${escapeHtml(automationLoad.error)}</div>`);
        }
        // Un job de pg_cron que usan varias piezas da un solo aviso, con las piezas afectadas.
        const warnings = new Map();
        views.forEach((view) => {
          view.warnings.forEach((warning) => warnings.set(warning, [...(warnings.get(warning) || []), view.name]));
        });
        warnings.forEach((names, warning) => {
          notices.push(`<div class="financial-notice error">${escapeHtml(`${warning} Afecta a: ${names.join(", ")}.`)}</div>`);
        });
        return notices.join("");
      }

      // Corridas sin repetir: un job de pg_cron que usan varias piezas cuenta una vez (con el nombre de su carga).
      function automationExecutions(views) {
        const order = { carga: 0, descarga: 1, drive: 2, modulo: 3, asistente: 4 };
        const seen = new Set();
        const items = [];
        [...views]
          .sort((left, right) => (order[left.stage] ?? 9) - (order[right.stage] ?? 9))
          .forEach((view) => {
            view.runs.forEach((run) => {
              const key = run.cronJob ? `cron|${run.cronJob}|${run.startedAt}` : `run|${run.id}`;
              if (seen.has(key)) return;
              seen.add(key);
              items.push({ view, run });
            });
          });
        return items.sort((left, right) => (right.run.startedAt || 0) - (left.run.startedAt || 0));
      }

      function automationMetrics(views) {
        const loading = !automationStatus && (automationLoad.loading || !automationLoad.started);
        const stages = AUTOMATION_STAGES.map((stage) => ({
          stage,
          health: automationStageHealth(views.filter((view) => view.stage === stage.id))
        }));
        const upToDate = stages.filter((item) => item.health === "verde").length;
        const problems = stages.filter((item) => ["error", "rojo", "ambar"].includes(item.health)).map((item) => item.stage.title);
        const pendingStages = stages.filter((item) => item.health === "pendiente").map((item) => item.stage.title);
        const active = views.filter((view) => view.status === "activo").length;
        const pending = views.filter((view) => view.status === "pendiente").length;
        const weekAgo = automationNow() - 7 * 86400000;
        const errors = automationExecutions(views).filter(
          ({ run }) => (run.status === "error" || run.status === "vencida") && (run.startedAt || 0) >= weekAgo
        );
        const modules = views.filter((view) => view.stage === "modulo" && view.status === "activo" && view.ageHours !== null);
        const oldest = [...modules].sort((left, right) => right.ageHours - left.ageHours)[0];
        const ready = Boolean(automationStatus);
        return `
          <div class="metrics">
            ${metric(
              "Etapas al día",
              loading ? "…" : ready ? `${upToDate} de ${stages.length}` : "—",
              escapeHtml(
                problems.length
                  ? `Con problemas: ${problems.join(", ")}`
                  : pendingStages.length
                    ? `Pendiente: ${pendingStages.join(", ")}`
                    : ready
                      ? "Todo el proceso funciona"
                      : "Sin estado real todavía"
              )
            )}
            ${metric("Piezas activas", `${active} de ${views.length}`, escapeHtml(`${pending} ${pending === 1 ? "pendiente" : "pendientes"} de implementar`))}
            ${metric(
              "Errores en 7 días",
              loading ? "…" : ready ? fmtNumber(errors.length) : "—",
              escapeHtml(errors.length ? `Último: ${errors[0].view.name}, ${automationDateText(errors[0].run.startedAt)}` : ready ? "Ninguna corrida falló" : "Sin estado real todavía")
            )}
            ${metric(
              "Dato más antiguo del dashboard",
              loading ? "…" : oldest ? automationAgeText(oldest.ageHours) : "—",
              escapeHtml(modules.length ? modules.map((view) => `${view.name} ${automationAgeText(view.ageHours)}`).join(" · ") : "Sin módulos con datos todavía")
            )}
          </div>
        `;
      }

      function automationNodeHtml(view, selectedId, label = view.name, sub = view.brand || "", text = automationHealthText(view)) {
        const selected = view.id === selectedId;
        return `
          <button class="automation-node ${selected ? "selected" : ""} ${view.health === "pendiente" ? "pending" : ""}" type="button" data-automation-select="${escapeHtml(view.id)}" aria-pressed="${selected ? "true" : "false"}">
            <span class="automation-node-name">${escapeHtml(label)}</span>
            ${sub ? `<span class="automation-sub">${escapeHtml(sub)}</span>` : ""}
            <span class="automation-light ${view.health}">${escapeHtml(text)}</span>
          </button>
        `;
      }

      // Sin número de paso (el asistente, que va aparte) no lleva la bolita ni se anuncia como un paso.
      function automationStageHtml(step, title, desc, health, statusText, body) {
        return `
          <section class="automation-stage" aria-label="${escapeHtml(step ? `Paso ${step}: ${title}` : title)}">
            <div class="automation-stage-head">
              ${step ? `<span class="automation-step">${step}</span>` : ""}
              <div>
                <strong>${escapeHtml(title)}</strong>
                <span class="automation-sub">${escapeHtml(desc)}</span>
              </div>
            </div>
            <span class="automation-light ${health}">${escapeHtml(statusText)}</span>
            <div class="automation-nodes">${body}</div>
          </section>
        `;
      }

      // El proceso del gráfico: fuentes → descarga automática → carpetas de Drive → carga (automática y botón
      // manual) → dashboard.
      function automationFlow(views, selectedId) {
        const arrow = '<span class="automation-arrow" aria-hidden="true"></span>';
        const sources = AUTOMATION_SOURCES.map((source) => {
          const downloads = views.filter((view) => view.stage === "descarga" && view.source === source.id);
          const health = automationStageHealth(downloads);
          const target = downloads[0] || { id: "", health };
          const text = health === "pendiente" ? "Sin descarga automática" : automationHealthText({ ...target, health });
          return { source, view: { ...target, health }, text };
        });
        const sourcesHealth = automationStageHealth(sources.map((item) => item.view));
        const sourceNodes = sources.map((item) => automationNodeHtml(item.view, selectedId, item.source.label, "", item.text)).join("");
        const stageHtml = (stage) => {
          const stageViews = views.filter((view) => view.stage === stage.id);
          let body = stageViews.map((view) => automationNodeHtml(view, selectedId)).join("");
          if (!stageViews.length) body = '<p class="small muted">Sin piezas registradas.</p>';
          if (stage.id === "carga") body += automationManualBox(views);
          return automationStageHtml(stage.step, stage.title, stage.desc, automationStageHealth(stageViews), automationStageText(stageViews), body);
        };
        const stagesHtml = AUTOMATION_STAGES.filter((stage) => !stage.aparte).map(stageHtml);
        const asideHtml = AUTOMATION_STAGES.filter((stage) => stage.aparte).map(stageHtml).join("");
        return `
          <div class="panel">
            <div class="panel-head automation-panel-head">
              <strong>Proceso de automatización</strong>
              <p class="small">Cómo llegan los datos de las plataformas al dashboard, para todas las marcas. Elige una pieza para ver su detalle.</p>
            </div>
            <div class="automation-flow">
              ${automationStageHtml(
                1,
                "Fuentes",
                "Plataformas de anuncios.",
                sourcesHealth,
                sourcesHealth === "pendiente" ? "Sin conexión automática" : AUTOMATION_HEALTH[sourcesHealth][0],
                sourceNodes
              )}
              ${stagesHtml.map((html) => `${arrow}${html}`).join("")}
            </div>
            ${asideHtml ? `<div class="automation-flow aparte">${asideHtml}</div>` : ""}
          </div>
        `;
      }

      function automationManualBox(views) {
        const runnable = views.filter((view) => view.canRun);
        const last = automationManualLoads(views)[0];
        return `
          <div class="automation-manual-box">
            <strong>Botón de carga manual</strong>
            <span class="automation-sub">${escapeHtml(
              runnable.length
                ? `«Ejecutar ahora» en ${runnable.length} ${runnable.length === 1 ? "carga" : "cargas"}`
                : automationStatus
                  ? "Ninguna carga lo tiene todavía"
                  : "Disponible al instalar el SQL"
            )}</span>
            <span class="automation-sub">${escapeHtml(
              last ? `Última: ${automationDateText(last.run.startedAt)}${last.run.who ? ` · ${automationWho(last.run.who)}` : ""}` : "Sin cargas manuales registradas"
            )}</span>
            <button class="automation-link" type="button" data-automation-scroll="automation-manual">Ver cargas manuales</button>
          </div>
        `;
      }

      function automationOriginText(run) {
        if (!run) return "";
        if (run.origin === "manual") return run.who ? `Manual · ${automationWho(run.who)}` : "Manual";
        return "Automática";
      }

      function automationRunWhen(run) {
        return run.status === "en_cola" ? `Programada ${automationClockText(run.startedAt)}` : automationDateText(run.startedAt);
      }

      function automationRunBadge(run) {
        const [label, tone] = AUTOMATION_RUN_STATUS[run.status] || ["—", ""];
        return `<span class="badge ${tone}">${escapeHtml(label)}</span>`;
      }

      function automationRunsTable(view) {
        if (!view.runs.length) {
          return `<p class="small muted">${view.fallback ? "Se verán al instalar el SQL." : "Todavía no hay corridas registradas."}</p>`;
        }
        const body = view.runs
          .slice(0, AUTOMATION_HISTORY)
          .map(
            (run) => `
              <tr>
                <td>${escapeHtml(automationRunWhen(run))}</td>
                <td>${escapeHtml(automationOriginText(run))}</td>
                <td>${automationRunBadge(run)}</td>
                <td class="right">${escapeHtml(automationDurationText(run.durationMs))}</td>
                <td class="automation-message">${escapeHtml(run.message || "—")}</td>
              </tr>
            `
          )
          .join("");
        return `
          <div class="automation-runs-wrap">
            <table class="automation-runs">
              <thead>
                <tr><th>Inicio (Lima)</th><th>Origen</th><th>Estado</th><th class="right">Duración</th><th>Detalle</th></tr>
              </thead>
              <tbody>${body}</tbody>
            </table>
          </div>
        `;
      }

      // Lista de HTML ya escapado.
      function automationFacts(view) {
        const items = [];
        if (view.brand) items.push(escapeHtml(`Marca: ${view.brand}`));
        const source = AUTOMATION_SOURCES.find((item) => item.id === view.source);
        if (source) items.push(escapeHtml(`Fuente: ${source.label}`));
        items.push(escapeHtml(`Frecuencia esperada: ${AUTOMATION_CADENCE[view.cadence] || view.cadence || "diaria"}`));
        if (view.cronJob) {
          items.push(
            escapeHtml(
              view.cron?.schedule
                ? `pg_cron «${view.cronJob}»: ${view.cron.schedule} (hora UTC)${view.cron.active === false ? " · desactivado" : ""}`
                : `pg_cron «${view.cronJob}»`
            )
          );
        }
        const data = view.data;
        const dataAt = automationTime(data?.at);
        if (dataAt) {
          const origin = automationTriggerText(data.trigger, data.requestedBy);
          items.push(escapeHtml(`Último dato: ${automationDateText(dataAt)} (${automationAgeText(view.ageHours)})${origin ? ` · ${origin}` : ""}`));
        } else if (view.lastOk) {
          items.push(escapeHtml(`Última corrida correcta: ${automationDateText(view.lastOk.finishedAt || view.lastOk.startedAt)}`));
        } else if (!view.fallback) {
          items.push(escapeHtml("Todavía no hay datos guardados."));
        }
        const rows = Object.entries(data?.rows || {});
        if (rows.length) items.push(escapeHtml(`Filas con datos: ${rows.map(([key, count]) => `${AUTOMATION_FINANCIAL_TABS[key] || key} ${fmtNumber(count)}`).join(" · ")}`));
        const files = Array.isArray(data?.files) ? data.files : [];
        if (files.length) {
          const ok = files.filter((file) => file.status === "ok").length;
          items.push(escapeHtml(`Archivos en la carpeta: ${files.length}${ok === files.length ? ", todos leídos bien" : ` (${ok} leídos bien)`}`));
        }
        const lastChange = automationTime(data?.lastChange);
        if (lastChange && view.data?.at !== data.lastChange) items.push(escapeHtml(`Último cambio en los archivos: ${automationDateText(lastChange)}`));
        if (AUTOMATION_DISCOVERY[data?.discovery]) items.push(escapeHtml(`Listado de la carpeta: ${AUTOMATION_DISCOVERY[data.discovery]}`));
        return items;
      }

      function automationErrorList(view) {
        const errors = view.runs
          .filter((run) => run.status === "error" || run.status === "vencida")
          .slice(0, 5)
          .map((run) => `${automationDateText(run.startedAt)} · ${automationOriginText(run)}: ${run.message || "sin detalle"}`);
        const items = [...view.warnings, ...view.dataWarnings.map((warning) => `Última corrida: ${warning}`), ...errors];
        if (!items.length) {
          const count = Math.min(view.runs.length, AUTOMATION_HISTORY);
          return `<p class="small muted">${count ? `Sin errores en las últimas ${count} corridas.` : "Sin corridas registradas todavía."}</p>`;
        }
        return `<ul class="automation-list">${items.map((text) => `<li>${escapeHtml(text)}</li>`).join("")}</ul>`;
      }

      function automationDetailPanel(view) {
        if (!view) return "";
        const stage = AUTOMATION_STAGES.find((item) => item.id === view.stage);
        const [label, tone] = AUTOMATION_HEALTH[view.health] || AUTOMATION_HEALTH["sin-datos"];
        const busy = Boolean(automationRerun.busy[view.id]);
        const queued = view.runs.some((run) => run.origin === "manual" && (run.status === "en_cola" || run.status === "en_curso"));
        const runButton = view.canRun
          ? `<button class="btn" type="button" data-automation-rerun="${escapeHtml(view.id)}" ${busy || queued ? "disabled" : ""} title="La corrida empieza en el minuto siguiente.">${icons.refresh} ${busy ? "Enviando…" : queued ? "En cola…" : "Ejecutar ahora"}</button>`
          : "";
        const pending = view.status === "pendiente";
        return `
          <div class="panel" id="automation-detail">
            <div class="automation-detail-head">
              <div>
                <span class="automation-sub">${escapeHtml(stage ? (stage.step ? `Paso ${stage.step} · ${stage.title}` : stage.title) : "")}</span>
                <strong>${escapeHtml(view.name)}</strong>
                ${view.description ? `<p class="small">${escapeHtml(view.description)}</p>` : ""}
                ${
                  pending
                    ? '<p class="small">Todavía no existe. Cuando se implemente para cualquier marca, se registra en Supabase y su estado aparece aquí solo.</p>'
                    : ""
                }
              </div>
              <div class="automation-actions"><span class="badge ${tone}">${escapeHtml(label)}</span>${runButton}</div>
            </div>
            ${
              pending
                ? ""
                : `<div class="automation-detail">
                    <div>
                      <p class="automation-detail-title">Últimas corridas</p>
                      ${automationRunsTable(view)}
                    </div>
                    <div>
                      <p class="automation-detail-title">Ficha</p>
                      <ul class="automation-list">${automationFacts(view)
                        .map((item) => `<li>${item}</li>`)
                        .join("")}</ul>
                      <p class="automation-detail-title">Errores recientes</p>
                      ${automationErrorList(view)}
                    </div>
                  </div>`
            }
          </div>
        `;
      }

      function automationExecutionsPanel(views) {
        const all = automationExecutions(views);
        const onlyErrors = automationPrefs.runs === "errors";
        const items = (onlyErrors ? all.filter(({ run }) => run.status === "error" || run.status === "vencida") : all).slice(0, 20);
        const stageTitle = (view) => AUTOMATION_STAGES.find((stage) => stage.id === view.stage)?.title || "";
        const body = items
          .map(
            ({ view, run }) => `
              <tr>
                <td>${escapeHtml(automationRunWhen(run))}</td>
                <td><strong>${escapeHtml(view.name)}</strong><span class="automation-sub">${escapeHtml(stageTitle(view))}</span></td>
                <td>${escapeHtml(automationOriginText(run))}</td>
                <td>${automationRunBadge(run)}</td>
                <td class="right">${escapeHtml(automationDurationText(run.durationMs))}</td>
                <td class="automation-message">${escapeHtml(run.message || "—")}</td>
              </tr>
            `
          )
          .join("");
        return `
          <div class="panel">
            <div class="panel-head automation-panel-head automation-panel-head-row">
              <div>
                <strong>Ejecuciones</strong>
                <p class="small">Todas las corridas del proceso, automáticas y manuales, de la más reciente a la más antigua.</p>
              </div>
              <label class="small automation-threshold">Mostrar
                <select data-automation-pref="runs" aria-label="Ejecuciones a mostrar">
                  <option value="all" ${onlyErrors ? "" : "selected"}>Todas</option>
                  <option value="errors" ${onlyErrors ? "selected" : ""}>Solo errores</option>
                </select>
              </label>
            </div>
            ${
              body
                ? `<div class="table-wrap">
                    <table class="automation-table">
                      <thead>
                        <tr><th>Inicio (Lima)</th><th>Pieza</th><th>Origen</th><th>Estado</th><th class="right">Duración</th><th>Detalle</th></tr>
                      </thead>
                      <tbody>${body}</tbody>
                    </table>
                  </div>`
                : `<p class="empty">${
                    automationStatus ? (onlyErrors ? "Sin errores en las corridas recientes." : "Todavía no hay corridas registradas.") : "Se verán al instalar el SQL."
                  }</p>`
            }
          </div>
        `;
      }

      // Corridas pedidas a mano. Las cargas también se piden con el botón «Actualizar» de su propio módulo:
      // esa corrida no pasa por la cola, pero su fila guarda quién la pidió.
      function automationManualLoads(views) {
        const items = [];
        const seen = new Set();
        views.forEach((view) => {
          view.runs
            .filter((run) => run.origin === "manual" && run.id)
            .forEach((run) => {
              if (seen.has(run.id)) return;
              seen.add(run.id);
              items.push({ view, run });
            });
          if (view.stage !== "carga") return;
          const at = automationTime(view.data?.at);
          const logged = view.runs.some((run) => run.origin === "manual" && at && Math.abs((run.finishedAt || run.startedAt || 0) - at) < 3 * 60000);
          if (view.data?.trigger === "manual" && at && !logged) {
            items.push({
              view,
              run: { id: "", origin: "manual", who: view.data.requestedBy || "", status: "ok", startedAt: at, message: "Botón «Actualizar» del módulo", detail: null }
            });
          }
        });
        return items.sort((left, right) => (right.run.startedAt || 0) - (left.run.startedAt || 0)).slice(0, 15);
      }

      function automationLoadedText(view, run) {
        if (run.status !== "ok" && run.status !== "avisos") return run.message || "—";
        const detail = run.detail || {};
        const rows = detail.rows || (!run.id ? view.data?.rows : null);
        if (rows && typeof rows === "object") {
          const tabs = Object.keys(rows).map((key) => AUTOMATION_FINANCIAL_TABS[key] || key);
          const total = Number.isFinite(Number(detail.total)) && detail.rows ? ` (${fmtNumber(Number(detail.total))} filas)` : "";
          return `Pestañas: ${tabs.join(", ")}${total}${run.message && !run.id ? ` · ${run.message}` : ""}`;
        }
        const names = (Array.isArray(detail.files) ? detail.files : []).map((file) => file.name).filter(Boolean);
        if (names.length) return `${names.length} archivos: ${names.slice(0, 2).join(", ")}${names.length > 2 ? ` y ${names.length - 2} más` : ""}`;
        return run.message || "—";
      }

      function automationManualPanel(views) {
        const body = automationManualLoads(views)
          .map(
            ({ view, run }) => `
              <tr>
                <td>${escapeHtml(automationRunWhen(run))}</td>
                <td><strong>${escapeHtml(view.name)}</strong>${view.brand ? `<span class="automation-sub">${escapeHtml(view.brand)}</span>` : ""}</td>
                <td>${escapeHtml(automationWho(run.who) || "—")}</td>
                <td>${automationRunBadge(run)}</td>
                <td class="automation-message">${escapeHtml(automationLoadedText(view, run))}</td>
              </tr>
            `
          )
          .join("");
        return `
          <div class="panel" id="automation-manual">
            <div class="panel-head automation-panel-head">
              <strong>Cargas manuales</strong>
              <p class="small">Corridas pedidas a mano («Ejecutar ahora» o el botón «Actualizar» de cada módulo): quién, cuándo y qué se cargó. Las automáticas no aparecen aquí.</p>
            </div>
            ${
              body
                ? `<div class="table-wrap">
                    <table class="automation-table">
                      <thead>
                        <tr><th>Fecha (Lima)</th><th>Carga</th><th>Quién</th><th>Resultado</th><th>Qué se cargó</th></tr>
                      </thead>
                      <tbody>${body}</tbody>
                    </table>
                  </div>`
                : `<p class="empty">${automationStatus ? "Sin cargas manuales en el historial reciente." : "Se verán al instalar el SQL."}</p>`
            }
          </div>
        `;
      }

      function automationFootnote() {
        return `
          <div class="panel automation-notes">
            <strong>Cómo se lee</strong>
            <ul>
              <li>Cada pieza del proceso está registrada en Supabase. <strong>Activa</strong>: funciona y se mide. <strong>Pendiente</strong>: todavía no existe; cuando se implemente, para cualquier marca, aparece aquí sola.</li>
              <li>Estado de una pieza activa: <strong>Error</strong> si su última corrida falló o su job de pg_cron no está programado; si no, la antigüedad de su último dato: verde hasta la mitad del umbral, ámbar hasta el umbral y rojo después (lo semanal suma 7 días y lo mensual 31). La etapa toma el estado de su pieza más grave.</li>
              <li>Las antigüedades se miden con el reloj de Supabase y las fechas están en hora de Lima, así no dependen del reloj del equipo.</li>
              <li><strong>Ejecutar ahora</strong> (botón de carga manual): la corrida entra en cola, pg_cron la empieza en el minuto siguiente y esta pantalla se actualiza sola.</li>
            </ul>
          </div>
        `;
      }

      // El proceso de automatización ya no es un módulo aparte: vive dentro de Clientes, que es
      // donde se mira cómo le llegan los datos a cada marca. Esto devuelve el cuerpo sin cabecera
      // propia, porque la pone la barra de Clientes.
      function automationSectionHtml() {
        ensureAutomationLoaded();
        const views = automationComponents().map(automationView);
        if (!views.some((view) => view.id === automationSelected)) automationSelected = automationDefaultSelection(views);
        const selected = views.find((view) => view.id === automationSelected) || null;
        return `
          <div class="automation-module">
            ${automationNotices(views)}
            ${automationMetrics(views)}
            ${automationFlow(views, automationSelected)}
            ${automationDetailPanel(selected)}
            ${automationExecutionsPanel(views)}
            ${automationManualPanel(views)}
            ${automationFootnote()}
          </div>
        `;
      }

      // `redraw` es cómo se vuelve a dibujar la pantalla que contiene el proceso.
      function wireAutomationModule(redraw) {
        document.querySelector("[data-automation-refresh]")?.addEventListener("click", () => {
          automationRerun.error = "";
          ensureAutomationLoaded(true);
          redraw();
        });
        document.querySelectorAll("[data-automation-pref]").forEach((select) => {
          select.addEventListener("change", () => {
            const key = select.dataset.automationPref;
            automationPrefs[key] = key === "threshold" ? Number(select.value) : select.value;
            saveAutomationPrefs();
            redraw();
          });
        });
        document.querySelectorAll("[data-automation-select]").forEach((button) => {
          button.addEventListener("click", () => {
            if (!button.dataset.automationSelect) return;
            automationSelected = button.dataset.automationSelect;
            redraw();
            const reduceMotion = window.matchMedia?.("(prefers-reduced-motion: reduce)").matches;
            document.getElementById("automation-detail")?.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "nearest" });
          });
        });
        document.querySelectorAll("[data-automation-rerun]").forEach((button) => {
          button.addEventListener("click", () => rerunAutomation(button.dataset.automationRerun));
        });
        document.querySelectorAll("[data-automation-scroll]").forEach((button) => {
          button.addEventListener("click", () => {
            const reduceMotion = window.matchMedia?.("(prefers-reduced-motion: reduce)").matches;
            document.getElementById(button.dataset.automationScroll)?.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "start" });
          });
        });
      }

      // ── Agenda con asistente de WhatsApp ────────────────────────────────────
      // Los datos viven en Supabase (src/modules/agenda/BBDD/agenda.sql). Lo que necesita hablar
      // con Meta o con Google Calendar pasa por la Edge Function "agenda-panel": el navegador no
      // guarda ningún token de WhatsApp ni de Google, y el repositorio es público.
      // El panel asume que quien lo usa está en hora de Lima, igual que la agenda.
      const AGENDA_VISTAS = [
        ["agenda", "Agenda"],
        ["chats", "Conversaciones"],
        ["conocimiento", "Conocimiento"],
        ["estandares", "Estándares"],
        ["reglas", "Reglas"],
        ["revisiones", "Revisiones"]
      ];
      const AGENDA_TIPOS_CONOCIMIENTO = [
        ["servicio", "Servicio"],
        ["precio", "Precio"],
        ["caso", "Caso"],
        ["objecion", "Objeción"],
        ["diagnostico", "Pregunta de diagnóstico"],
        ["faq", "Pregunta frecuente"],
        ["regla", "Regla"]
      ];
      const AGENDA_DIAS_SEMANA = [
        ["1", "Lunes"], ["2", "Martes"], ["3", "Miércoles"], ["4", "Jueves"],
        ["5", "Viernes"], ["6", "Sábado"], ["7", "Domingo"]
      ];

      let agendaVista = "agenda";
      let agendaResumen = null;
      let agendaCargado = false;
      let agendaCargando = false;
      let agendaError = "";
      let agendaAviso = "";
      let agendaRango = 7;
      let agendaChatActivo = "";
      let agendaChat = null;
      let agendaConocimiento = null;
      let agendaEstandares = null;
      let agendaConfig = null;
      let agendaRevisiones = null;
      let agendaPrueba = null;
      let agendaOcupado = "";
      let agendaNuevaCita = false;
      let agendaMoviendo = "";

      function agendaZona() {
        return agendaResumen?.zona_horaria || agendaConfig?.zona_horaria || "America/Lima";
      }

      function agendaHora(iso) {
        return new Intl.DateTimeFormat("es-PE", {
          hour: "2-digit",
          minute: "2-digit",
          timeZone: agendaZona()
        }).format(new Date(iso));
      }

      function agendaDiaLargo(iso) {
        return new Intl.DateTimeFormat("es-PE", {
          weekday: "long",
          day: "2-digit",
          month: "long",
          timeZone: agendaZona()
        }).format(new Date(iso));
      }

      function agendaClaveDia(iso) {
        return new Intl.DateTimeFormat("en-CA", { timeZone: agendaZona(), dateStyle: "short" })
          .format(new Date(iso));
      }

      function agendaDesdeAhora(iso) {
        if (!iso) return "sin registro";
        const minutos = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
        if (minutos < 1) return "ahora mismo";
        if (minutos < 60) return `hace ${minutos} min`;
        const horas = Math.round(minutos / 60);
        if (horas < 24) return `hace ${horas} h`;
        return `hace ${Math.round(horas / 24)} d`;
      }

      // Las fechas de los formularios se escriben en hora local del navegador (Lima).
      function agendaLocalInput(iso) {
        const fecha = new Date(iso);
        const desfase = fecha.getTimezoneOffset() * 60000;
        return new Date(fecha.getTime() - desfase).toISOString().slice(0, 16);
      }

      function agendaRerender() {
        if (hasSuiteAccess() && state.active === "agenda") agendaModule();
      }

      async function agendaLlamar(accion, cuerpo = {}) {
        const client = ensureSharedPendingClient();
        if (!client) throw new Error("Sin conexión con Supabase.");
        const { data: sesion } = await client.auth.getSession();
        const token = sesion?.session?.access_token;
        if (!token) throw new Error("La sesión caducó: vuelve a iniciar sesión.");
        const config = sharedPendingConfig();
        const respuesta = await fetch(`${config.url}/functions/v1/agenda-panel`, {
          method: "POST",
          headers: {
            "content-type": "application/json",
            authorization: `Bearer ${token}`,
            apikey: config.anonKey
          },
          body: JSON.stringify({ accion, ...cuerpo })
        });
        const salida = await respuesta.json().catch(() => ({}));
        if (!respuesta.ok) throw new Error(salida?.error || `La función respondió ${respuesta.status}`);
        return salida;
      }

      async function agendaConCliente(trabajo, etiqueta) {
        const client = ensureSharedPendingClient();
        if (!client || !getSuiteAccessSession()) {
          agendaError = "Inicia sesión para ver la agenda.";
          return null;
        }
        try {
          const salida = await trabajo(client);
          agendaError = "";
          return salida;
        } catch (error) {
          agendaError = `${etiqueta}: ${error?.message || error}`;
          return null;
        }
      }

      async function cargarAgendaResumen() {
        agendaCargando = true;
        const datos = await agendaConCliente(async (client) => {
          const { data, error } = await client.rpc("lr_suite_agenda_resumen", {
            p_desde: null,
            p_dias: agendaRango,
            p_chats: 40
          });
          if (error) throw error;
          return data;
        }, "No se pudo leer la agenda");
        agendaCargando = false;
        agendaCargado = true;
        if (datos) agendaResumen = datos;
        agendaRerender();
      }

      async function cargarAgendaChat(waId) {
        agendaChatActivo = waId;
        agendaChat = null;
        agendaRerender();
        const datos = await agendaConCliente(async (client) => {
          const { data, error } = await client.rpc("lr_suite_agenda_chat", {
            p_wa_id: waId,
            p_limite: 60
          });
          if (error) throw error;
          return data;
        }, "No se pudo abrir la conversación");
        if (datos) agendaChat = datos;
        agendaRerender();
      }

      async function cargarAgendaConocimiento() {
        const datos = await agendaConCliente(async (client) => {
          const { data, error } = await client
            .from("lr_suite_agenda_conocimiento")
            .select("id, tipo, titulo, contenido, orden, activo")
            .order("tipo", { ascending: true })
            .order("orden", { ascending: true });
          if (error) throw error;
          return data || [];
        }, "No se pudo leer el conocimiento");
        agendaConocimiento = datos || [];
        agendaRerender();
      }

      async function cargarAgendaEstandares() {
        const datos = await agendaConCliente(async (client) => {
          const { data, error } = await client
            .from("lr_suite_agenda_estandares")
            .select("*")
            .eq("app_id", "lr-suite-agenda")
            .maybeSingle();
          if (error) throw error;
          return data || {};
        }, "No se pudieron leer los estándares");
        agendaEstandares = datos || {};
        agendaRerender();
      }

      async function cargarAgendaConfig() {
        const datos = await agendaConCliente(async (client) => {
          const { data, error } = await client
            .from("lr_suite_agenda_config")
            .select("*")
            .eq("app_id", "lr-suite-agenda")
            .maybeSingle();
          if (error) throw error;
          return data || {};
        }, "No se pudo leer la configuración");
        agendaConfig = datos || {};
        agendaRerender();
      }

      async function cargarAgendaRevisiones() {
        const datos = await agendaConCliente(async (client) => {
          const { data, error } = await client
            .from("lr_suite_agenda_revisiones")
            .select("id, wa_id, borrador, enviado, veredicto, observaciones, intentos, creado_at")
            .order("creado_at", { ascending: false })
            .limit(40);
          if (error) throw error;
          return data || [];
        }, "No se pudieron leer las revisiones");
        agendaRevisiones = datos || [];
        agendaRerender();
      }

      function agendaLineas(valor) {
        return String(valor || "")
          .split("\n")
          .map((linea) => linea.trim())
          .filter(Boolean);
      }

      function agendaTexto(lista) {
        return (Array.isArray(lista) ? lista : []).join("\n");
      }

      // Horario: "09:00-13:00, 15:00-18:00" por día. Lo que no cuadre se descarta al guardar y la
      // RPC de huecos también lo ignora, así que un día mal escrito no ofrece horas raras.
      function agendaHorarioTexto(bloques) {
        return (Array.isArray(bloques) ? bloques : [])
          .map((bloque) => `${bloque?.[0] || ""}-${bloque?.[1] || ""}`)
          .filter((texto) => texto.length > 1)
          .join(", ");
      }

      function agendaHorarioParse(texto) {
        return String(texto || "")
          .split(",")
          .map((parte) => parte.trim())
          .filter(Boolean)
          .map((parte) => parte.split("-").map((hora) => hora.trim()))
          .filter(([abre, cierra]) => /^\d{1,2}:\d{2}$/.test(abre || "") && /^\d{1,2}:\d{2}$/.test(cierra || ""))
          .map(([abre, cierra]) => [abre, cierra]);
      }

      // Tipos de reunión, una por línea: id | nombre | minutos | modalidad | descripción
      function agendaTiposTexto(tipos) {
        return (Array.isArray(tipos) ? tipos : [])
          .map((tipo) => [tipo.id, tipo.nombre, tipo.duracion_min, tipo.modalidad || "", tipo.descripcion || ""].join(" | "))
          .join("\n");
      }

      function agendaTiposParse(texto) {
        return agendaLineas(texto)
          .map((linea) => linea.split("|").map((parte) => parte.trim()))
          .filter((partes) => partes[0] && partes[1])
          .map((partes) => ({
            id: partes[0],
            nombre: partes[1],
            duracion_min: Number(partes[2]) || 30,
            modalidad: partes[3] || "",
            descripcion: partes[4] || ""
          }));
      }

      function agendaBadgeEstado(estado) {

          confirmada: ["green", "Confirmada"],
          atendida: ["sky", "Atendida"],
          cancelada: ["rose", "Cancelada"],
          no_asistio: ["amber", "No asistió"]
        };
        const [color, texto] = mapa[estado] || ["", estado];
        return `<span class="badge ${color}">${escapeHtml(texto)}</span>`;
      }

      function agendaBadgeVeredicto(veredicto) {
        const mapa = {
          aprobado: ["green", "Aprobada"],
          corregido: ["amber", "Corregida"],
          frenado: ["rose", "Frenada"]
        };

              <span class="badge ${errores ? "rose" : "green"}">${errores} ${errores === 1 ? "error" : "errores"} en 7 días</span>

      function agendaVistaAgendaHtml() {
        const citas = [...(agendaResumen?.citas || [])].sort((a, b) => a.inicio.localeCompare(b.inicio));
        const porDia = new Map();
        citas.forEach((cita) => {
          const clave = agendaClaveDia(cita.inicio);
          porDia.set(clave, [...(porDia.get(clave) || []), cita]);
        });

        return `
          ${agendaEstadoHtml()}
          ${agendaMetricasHtml()}
          <div class="panel">
            <div class="panel-head" style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
              <strong>Citas</strong>
              <span style="display:flex;gap:8px;flex-wrap:wrap">
                ${[["1", "Hoy"], ["7", "7 días"], ["30", "30 días"]]
                  .map(([dias, etiqueta]) => `<button class="clients-filter ${String(agendaRango) === dias ? "active" : ""}" type="button" data-agenda-accion="rango" data-valor="${dias}">${etiqueta}</button>`)
                  .join("")}
                <button class="btn" type="button" data-agenda-accion="nueva-cita">${agendaNuevaCita ? "Cerrar" : "Nueva cita"}</button>
              </span>
            </div>
            ${agendaNuevaCita ? agendaFormularioCitaHtml() : ""}
