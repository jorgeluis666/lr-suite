        overflow-y: auto;
      }

      .notif-item {
        display: grid;
        width: 100%;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 10px;
        align-items: center;
        border: 1px solid var(--line-soft);
        border-radius: 10px;
        background: #ffffff;
        padding: 9px 10px;
        text-align: left;
      }

      .notif-item:hover {
        border-color: var(--green-line);
        background: var(--green-soft);
      }

      .notif-item strong {
        display: block;
        overflow: hidden;
        color: var(--ink);
        font-size: 13px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .notif-meta {
        display: block;
        margin: 3px 0 0;
        overflow: hidden;
        color: var(--subtle);
        font-size: 12px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .notif-days {
        display: grid;
        min-width: 56px;
        justify-items: center;
        border-radius: 8px;
        background: var(--surface-subtle);
        padding: 4px 8px;
        color: var(--muted);
      }

      .notif-days strong {
        color: inherit;
        font-size: 15px;
        line-height: 1.1;
      }

      .notif-days span {
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .notif-item.warn .notif-days {
        background: var(--green-soft);
        color: var(--green-700);
      }

      .notif-item.late .notif-days {
        background: var(--green);
        color: #ffffff;
      }

      .notif-item.late .notif-days strong {
        color: #ffffff;
      }

      .notif-empty {
        border: 1px dashed var(--line);
        border-radius: 10px;
        padding: 16px;
        color: var(--subtle);
        font-size: 12px;
        text-align: center;
      }

      .notif-foot {
        margin: 0;
        color: var(--subtle);
        font-size: 11px;
      }
      /* Ruedita del panel: correos del resumen diario de pendientes */
      .notif-head-actions {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .notif-settings {
        display: inline-grid;
        width: 30px;
        height: 27px;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #ffffff;
        padding: 0;
        color: var(--subtle);
      }
      .notif-settings .svg-icon {
        width: 15px;
        height: 15px;
      }
      .notif-settings:hover {
        border-color: var(--green-line);
        background: var(--green-soft);
        color: var(--green-700);
      }
      .notif-recipients {
        display: grid;
        max-height: 330px;
        gap: 8px;
        overflow-y: auto;
      }
      .notif-recipient {
        display: grid;
        grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr) 32px;
        gap: 6px;
        align-items: center;
      }
      .notif-recipient input {
        width: 100%;
        min-width: 0;
        height: 32px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #ffffff;
        padding: 0 10px;
        color: var(--ink);
        font: inherit;
        font-size: 12px;
      }
      .notif-recipient input:focus {
        border-color: #93c5fd;
        outline: none;
        box-shadow: 0 0 0 3px rgba(147, 197, 253, 0.28);
      }
      .notif-recipient-remove {
        height: 32px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #ffffff;
        color: var(--subtle);
        font-size: 17px;
        line-height: 1;
      }
      .notif-recipient-remove:hover:not(:disabled) {
        border-color: #fecdd3;
        background: var(--rose-soft);
        color: var(--rose);
      }
      .notif-recipient-add {
        justify-self: start;
        border: 1px dashed var(--green-line);
        border-radius: 8px;
        background: #ffffff;
        padding: 6px 12px;
        color: var(--green-700);
        font-size: 12px;
        font-weight: 600;
      }
      .notif-recipient-add:hover {
        background: var(--green-soft);
      }
      .notif-settings-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      .notif-settings-msg {
        color: var(--subtle);
        font-size: 12px;
        line-height: 1.4;
      }
      .notif-settings-msg.ok {
        color: #047857;
      }
      .notif-settings-msg.warn {
        color: var(--amber);
      }
      .notif-settings-msg.late {
        color: var(--rose);
      }
      .notif-save {
        flex-shrink: 0;
        border: 1px solid var(--green);
        border-radius: 9px;
        background: var(--green);
        padding: 7px 16px;
        color: #ffffff;
        font-size: 12px;
        font-weight: 600;
      }
      .notif-save:hover:not(:disabled) {
        background: var(--green-700);
      }
      .notif-save:disabled {
        opacity: 0.6;
      }

      .task.task-notif-focus {
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.35);
        transition: box-shadow 0.25s ease;
      }

      @media (max-width: 720px) {
        .notif-toggle-text {
          display: none;
        }
      }

      /* Portada de acceso: mismo formato que la pantalla de acceso de los dashboards de clientes
         (panel blanco a la izquierda, foto a la derecha), con el azul de LR Suite. */
      .suite-gate {
        display: flex;
        min-height: 100vh;
        background: var(--ink);
        color: var(--ink);
      }

      .suite-gate-panel {
        display: flex;
        flex-shrink: 0;
        align-items: center;
        justify-content: center;
        width: 400px;
        max-width: 100%;
        padding: 48px 44px;
        overflow-y: auto;
        background: var(--white);
      }

      .suite-gate-inner {
        width: 100%;
        max-width: 312px;
      }

      .suite-gate-logo {
        display: block;
        width: 44px;
        height: 44px;
        margin-bottom: 20px;
        border-radius: 10px;
      }

      .suite-gate-brand {
        margin: 0 0 16px;
        color: var(--green);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .suite-gate-title {
        margin: 0 0 28px;
        color: var(--ink);
        font-size: 38px;
        font-weight: 700;
        line-height: 1.1;
        letter-spacing: -0.02em;
      }

      .suite-gate-divider {
        width: 40px;
        height: 3px;
        margin-bottom: 36px;
        border-radius: 2px;
        background: var(--green);
      }

      .suite-gate-form {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      /* Cuadros celestes con borde azul al enfocar: el estándar de todas las pantallas de acceso. */
      .suite-gate-form input {
        width: 100%;
        padding: 12px 16px;
        border: 1.5px solid var(--line);
        border-radius: 8px;
        outline: none;
        background: #e8f0fe;
        color: var(--ink);
        font-size: 14px;
        transition: border-color 0.15s;
      }

      .suite-gate-form input::placeholder {
        color: var(--subtle);
      }

      .suite-gate-form input:focus {
        border-color: var(--green);
      }

      .suite-gate-form button {
        width: 100%;
        padding: 12px;
        border: 0;
        border-radius: 8px;
        background: var(--green);
        color: var(--white);
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.02em;
        transition: background 0.15s;
      }

      .suite-gate-form button:hover {
        background: var(--green-700);
      }

      .suite-gate-form button:disabled {
        opacity: 0.6;
        cursor: wait;
      }

      .suite-gate-error {
        min-height: 18px;
        margin: 12px 0 0;
        color: #dc2626;
        font-size: 12px;
      }

      .suite-gate-text {
        margin: 0;
        color: var(--subtle);
        font-size: 14px;
        line-height: 1.5;
      }

      .suite-gate-text strong {
        color: var(--ink);
      }

      /* El degradado es la capa de respaldo si la foto falta o todavía no carga. */
      .suite-gate-bg {
        flex: 1;
        min-width: 0;
        background-color: var(--ink);
        background-image: linear-gradient(140deg, var(--green) 0%, var(--green-700) 38%, var(--ink) 100%);
        background-position: center;
        background-size: cover;
        filter: grayscale(20%);
      }

      @media (max-width: 768px) {
        .suite-gate-panel {
          width: 100%;
          padding: 32px 24px;
        }

        .suite-gate-inner {
          max-width: 360px;
        }

        .suite-gate-title {
          margin-bottom: 22px;
          font-size: 30px;
        }

        .suite-gate-divider {
          margin-bottom: 26px;
        }

        .suite-gate-bg {
          display: none;
        }
      }

      @media (max-height: 520px) {
        .suite-gate-panel {
          align-items: flex-start;
          padding: 24px;
        }

        .suite-gate-title {
          margin-bottom: 18px;
          font-size: 26px;
        }

        .suite-gate-divider {
          margin-bottom: 20px;
        }
      }

      .user-form {
        display: grid;
        gap: 12px;
      }

      .user-form {
        grid-template-columns: repeat(3, minmax(0, 1fr)) auto;
        align-items: end;
        margin-bottom: 16px;
      }

      .auth-input {
        display: grid;
        gap: 6px;
        color: var(--subtle);
        font-size: 13px;
      }

      .auth-input input {
        width: 100%;
        height: 42px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--white);
        color: var(--ink);
        font: inherit;
        font-weight: 500;
        outline: 0;
        padding: 0 12px;
      }

      .auth-input input:focus {
        border-color: var(--green);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
      }

      .auth-message {
        margin: 0;
        border: 1px solid var(--green-line);
        border-radius: 8px;
        background: var(--green-soft);
        color: var(--green-700);
        padding: 10px 12px;
        font-size: 13px;
      }

      .auth-message.error {
        border-color: #fecdd3;
        background: var(--rose-soft);
        color: #be123c;
      }

      .user-list {
        display: grid;
        gap: 8px;
      }

      .user-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 10px;
        align-items: center;
        border: 1px solid var(--line-soft);
        border-radius: 8px;
        background: #f8fafc;
        padding: 10px 12px;
      }

      .user-row strong {
        display: block;
        font-size: 14px;
        font-weight: 600;
      }

      .user-key {
        color: var(--subtle);
        font-size: 12px;
      }

      .access-users {
        display: grid;
        gap: 12px;
        padding: 18px;
      }

      .access-card {
        display: grid;
        gap: 12px;
        border: 1px solid var(--line-soft);
        border-radius: 8px;
        background: #f8fafc;
        padding: 14px;
      }

      .access-card-head {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: flex-start;
      }

      .access-card-actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 8px;
        align-items: center;
      }

      .access-card-head strong {
        display: block;
        font-size: 15px;
        font-weight: 600;
      }

      .access-form-grid {
        display: grid;
        grid-template-columns: minmax(220px, 1fr) minmax(170px, 0.7fr) minmax(170px, 0.7fr) auto auto;
        gap: 10px;
        align-items: end;
      }

      .module-access-details {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
      }

      .module-access-details summary {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-height: 42px;
        cursor: pointer;
        list-style: none;
        padding: 8px 12px;
        color: var(--ink);
        font-size: 13px;
        font-weight: 600;
      }

      .module-access-details summary::-webkit-details-marker {
        display: none;
      }

      .module-access-summary {
        color: var(--subtle);
        font-size: 12px;
        font-weight: 500;
      }

      .module-access-list {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        border-top: 1px solid var(--line-soft);
        padding: 12px;
      }

      .module-access-option {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 36px;
        border: 1px solid var(--line-soft);
        border-radius: 7px;
        background: var(--soft);
        color: var(--muted);
        padding: 8px 10px;
        font-size: 12px;
        font-weight: 500;
      }

      .module-access-option input {
        width: 14px;
        height: 14px;
        accent-color: var(--green);
      }

      .auth-input input[readonly] {
        background: var(--surface-subtle);
        color: var(--muted);
      }

      /* ── Agenda con asistente de WhatsApp ── */
      .agenda-input,
      .agenda-area,
      .agenda-select {
        width: 100%;
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        color: var(--ink);
        font: inherit;
        padding: 9px 11px;
      }

      .agenda-area {
        min-height: 86px;
        line-height: 1.5;
        resize: vertical;
      }

      .agenda-input:focus,
      .agenda-area:focus,
      .agenda-select:focus {
        outline: 0;
        border-color: var(--green-line);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
      }

      .agenda-form {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 12px;
        padding: 16px 18px;
      }

      .agenda-field {
        display: grid;
        gap: 6px;
        min-width: 0;
      }

      .agenda-field > span {
        color: var(--subtle);
        font-size: 12px;
        font-weight: 500;
        text-transform: uppercase;
      }

      .agenda-field.ancho {
        grid-column: 1 / -1;
      }

      .agenda-acciones {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        padding: 0 18px 16px;
      }

      .agenda-estado {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        padding: 14px 18px;
      }

      .agenda-dia {
        background: #f8fafc;
        border-bottom: 1px solid var(--line-soft);
        padding: 11px 18px;
        font-size: 13px;
        font-weight: 600;
      }

      .agenda-cita {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
        border-bottom: 1px solid var(--line-soft);
        padding: 14px 18px;
      }

      .agenda-cita-hora {
        min-width: 92px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }

      .agenda-cita-quien {
        flex: 1;
        min-width: 180px;
        display: grid;
        gap: 3px;
      }

      .agenda-chats {
        display: grid;
        grid-template-columns: minmax(220px, 300px) minmax(0, 1fr);
      }

      .agenda-chat-lista {
        border-right: 1px solid var(--line);
        max-height: 560px;
        overflow-y: auto;
      }

      .agenda-chat-item {
        display: grid;
        gap: 4px;
        width: 100%;
        border: 0;
        border-bottom: 1px solid var(--line-soft);
        background: #fff;
        padding: 12px 14px;
        font: inherit;
        text-align: left;
      }

      .agenda-chat-item.active {
        background: var(--green-soft);
      }

      .agenda-chat-panel {
        min-width: 0;
      }

      .agenda-mensajes {
        display: grid;
        gap: 10px;
        max-height: 420px;
        overflow-y: auto;
        padding: 16px 18px;
      }

      .agenda-msg {
        max-width: 78%;
        border-radius: 10px;
        padding: 9px 12px;
        font-size: 14px;
        line-height: 1.5;
        white-space: pre-wrap;
      }

      .agenda-msg.cliente {
        justify-self: start;
        background: #f1f5f9;
      }

      .agenda-msg.asistente {
        justify-self: end;
        background: var(--green-soft);
      }

      .agenda-msg.equipo {
        justify-self: end;
        border: 1px solid var(--green-line);
        background: #fff;
      }

      .agenda-msg-quien {
        display: block;
        margin-bottom: 3px;
        color: var(--subtle);
        font-size: 11px;
      }

      .agenda-obs {
        margin: 6px 0 0;
        padding-left: 18px;
        color: var(--subtle);
        font-size: 12px;
      }

      @media (max-width: 900px) {
        .agenda-chats {
          grid-template-columns: minmax(0, 1fr);
        }

        .agenda-chat-lista {
          border-right: 0;
          border-bottom: 1px solid var(--line);
          max-height: 260px;
        }
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        height: 40px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        color: var(--ink);
        font-weight: 500;
        padding: 0 14px;
      }

      .btn:hover {
        border-color: var(--green-line);
        background: var(--green-soft);
        color: var(--green-700);
      }

      .btn.primary {
        border-color: var(--green);
        background: var(--green);
        color: #fff;
      }

      .btn.primary:hover {
        border-color: var(--green-700);
        background: var(--green-700);
        color: #fff;
      }

      .btn.icon-action {
        width: 40px;
        padding: 0;
      }

      .btn.timer-active {
        border-color: #fecdd3;
        background: #fff;
        color: #be123c;
      }

      .btn:disabled {
        cursor: default;
        border-color: var(--green-line);
        background: var(--green-soft);
        color: var(--green-700);
      }

      .empty {
        padding: 46px 18px;
        color: var(--muted);
        text-align: center;
      }

      .svg-icon {
        width: 18px;
        height: 18px;
        stroke: currentColor;
        stroke-width: 1.8;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      @media (max-width: 1380px) {
        .content {
          padding: 24px;
        }

        .task-overview {
          grid-template-columns: 1fr;
        }

        .task-form {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .category-task-form,
        .category-create-panel .task-form {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .task-subtask-form,
        .task-subtask-item {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }

      }

      @media (max-width: 1040px) {
        .content {
          padding: 24px;
        }

        .metrics {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .task-form {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .category-task-form,
        .category-create-panel .task-form {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .task-subtask-form,
        .task-subtask-item {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .task-overview {
          grid-template-columns: 1fr;
        }

        .split {
          grid-template-columns: 1fr;
        }

        .compare-card,
        .toolbar,
        .header-card,
        .month-track-head {
          grid-template-columns: 1fr;
          flex-direction: column;
          align-items: stretch;
        }

        .compare-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .month-tabs {
          grid-template-columns: repeat(6, minmax(0, 1fr));
        }
      }

      @media (max-width: 760px) {
        /* Con el panel abierto como cajon, el boton queda visible a su derecha para poder cerrarlo. */
        .app:not(.sidebar-collapsed) .sidebar-toggle {
          position: fixed;
          top: 14px;
          left: calc(min(84vw, 288px) + 10px);
          z-index: 60;
        }

        .sidebar {
          position: fixed;
          inset: 0 auto 0 0;
          width: min(288px, 84vw);
          border-right: 1px solid var(--line);
          border-bottom: 0;
          transform: translateX(0);
        }

        .app.sidebar-collapsed .sidebar {
          transform: translateX(-100%) !important;
        }

        .content {
          margin-left: 0;
          padding: 18px;
        }
        .metrics {
          grid-template-columns: 1fr;
        }

        .task-form {
          grid-template-columns: 1fr;
        }

        .category-task-form,
        .category-create-panel .task-form {
          grid-template-columns: 1fr;
        }

        .task-subtasks {
          flex-basis: 100%;
          margin-left: 0;
        }

        .task-subtask-form,
        .task-subtask-item {
          grid-template-columns: 1fr;
        }

        .task-overview .metrics {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .task-actions {
          justify-content: flex-start;
        }

        .completed-head {
          align-items: stretch;
          flex-direction: column;
        }

        .history-actions {
          justify-content: flex-start;
        }

        .completed-task {
          grid-template-columns: 1fr;
          gap: 6px;
        }

        .month-tabs {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .user-form,
        .access-form-grid {
          grid-template-columns: 1fr;
        }
      }

      /* ── UTM Builder v3 ── */
      .utm-platform-badge {
        display: inline-flex;
        align-items: center;
        padding: 3px 9px;
        border-radius: 5px;
        background: var(--green-soft);
        color: var(--green-700);
        border: 1px solid var(--green-line);
        font-size: 11px;
        font-weight: 600;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }

      .utm-campaign-block {
        display: grid;
        grid-template-columns: 2fr 1fr 2fr;
        gap: 12px;
      }

      .utm-preview {
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px dashed var(--line-soft);
        border-radius: 6px;
        background: var(--surface-subtle);
        padding: 7px 12px;
      }

      .utm-preview-label {
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: .08em;
        color: #64748b;
        white-space: nowrap;
      }

      .utm-preview-value {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 11px;
        color: var(--green-700);
        word-break: break-all;
      }

      .utm-adset-row {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface-subtle);
        overflow: hidden;
      }

      .utm-adset-header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
      }

      .utm-adset-label {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: .08em;
        color: var(--green);
        white-space: nowrap;
        min-width: 70px;
      }

      .utm-adset-header input {
        flex: 1;
        min-width: 0;
        height: 32px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--white);
        color: var(--ink);
        outline: 0;
        padding: 0 10px;
        font-size: 12px;
        font-weight: 500;
        font-family: inherit;
      }

      .utm-adset-header input:focus {
        border-color: var(--green);
        box-shadow: 0 0 0 2px rgba(37, 99, 235, .1);
      }

      .utm-ads-container {
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 6px 12px 8px 36px;
        border-top: 1px solid var(--line-soft);
      }

      .utm-ad-row {
        display: flex;
        align-items: center;
        gap: 6px;
        background: var(--white);
        border: 1px solid var(--line-soft);
        border-radius: 6px;
        padding: 5px 8px;
      }

      .utm-ad-label {
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: .06em;
        color: var(--subtle);
        white-space: nowrap;
        min-width: 24px;
      }

      .utm-ad-name-input {
        width: 180px;
        flex-shrink: 0;
        height: 26px;
        border: 1px solid var(--line-soft);
        border-radius: 5px;
        background: var(--soft);
        color: var(--ink);
        outline: 0;
        padding: 0 8px;
        font-size: 12px;
        font-family: inherit;
      }

      .utm-ad-name-input:focus {
        border-color: var(--green);
        background: var(--white);
      }

      .utm-url-output {
        flex: 1;
        min-width: 0;
        height: 26px;
        border: 1px solid var(--line-soft);
        border-radius: 5px;
        background: var(--soft);
        color: var(--subtle);
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 10px;
        padding: 0 8px;
        outline: 0;
        cursor: default;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        transition: border-color .18s, background .18s, color .18s;
      }

      .utm-url-output.has-url {
        border-color: var(--green-line);
        background: var(--green-soft);
        color: var(--green-700);
      }

      .utm-copy-btn {
        display: inline-flex;
        align-items: center;
        height: 26px;
        padding: 0 8px;
        font-size: 10px;
        font-weight: 500;
        white-space: nowrap;
        flex-shrink: 0;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: var(--white);
        color: var(--ink);
        cursor: pointer;
        font-family: inherit;
        transition: background .18s, border-color .18s, color .18s;
      }

      .utm-copy-btn:hover {
        background: var(--green-soft);
        border-color: var(--green-line);
        color: var(--green-700);
      }

      .utm-delete-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 26px;
        height: 26px;
        padding: 0;
        border: none;
        background: transparent;
        color: #cbd5e1;
        border-radius: 5px;
        cursor: pointer;
        flex-shrink: 0;
        transition: color .18s, background .18s;
      }

      .utm-delete-btn:hover {
        background: #fff1f2;
        color: #be123c;
      }

      .utm-add-ad-btn {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        margin: 4px 12px 8px 36px;
        padding: 4px 10px;
        font-size: 11px;
        font-weight: 500;
        color: var(--subtle);
        border: 1px dashed var(--line);
        border-radius: 5px;
        background: transparent;
        cursor: pointer;
        font-family: inherit;
        transition: color .18s, border-color .18s, background .18s;
      }

      .utm-add-ad-btn:hover {
        color: var(--green-700);
        border-color: var(--green-line);
        background: var(--green-soft);
      }

      .utm-add-adset-btn {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 9px 14px;
        font-size: 13px;
        font-weight: 500;
        color: var(--ink);
        border: 1px dashed var(--line);
        border-radius: 7px;
        background: var(--white);
        cursor: pointer;
        font-family: inherit;
        transition: color .18s, border-color .18s, background .18s;
      }

      .utm-add-adset-btn:hover {
        color: var(--green-700);
        border-color: var(--green-line);
        background: var(--green-soft);
      }

      /* ── Prospección en LinkedIn ── */
      .prospect-input,
      .prospect-area,
      .prospect-select {
        width: 100%;
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--white);
        color: var(--ink);
        font: inherit;
        padding: 9px 11px;
      }

      .prospect-area {
        min-height: 86px;
        line-height: 1.5;
        resize: vertical;
      }

      .prospect-input:focus,
      .prospect-area:focus,
      .prospect-select:focus {
        outline: 0;
        border-color: var(--green-line);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
      }

      .prospect-form {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
        gap: 12px;
        padding: 16px 18px;
        border-bottom: 1px solid var(--line-soft);
      }

      .prospect-field {
        display: grid;
        gap: 6px;
        min-width: 0;
      }

      .prospect-field > span {
        color: var(--subtle);
        font-size: 12px;
        font-weight: 500;
        text-transform: uppercase;
      }

      .prospect-field.ancho {
        grid-column: 1 / -1;
      }

      .prospect-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        grid-column: 1 / -1;
      }

      /* En la tabla el select no puede encogerse hasta esconder el estado. */
      .prospect-estado-select {
        min-width: 158px;
      }

      .prospect-hito {
        white-space: nowrap;
      }

      .prospect-aviso {
        padding: 14px 18px;
        color: var(--green-700);
        font-size: 13px;
        font-weight: 500;
      }

      /* El embudo va en una sola franja para no robarle la pantalla a la tabla. */
      .prospect-funnel {
        display: flex;
        padding: 12px 18px;
      }

      .prospect-funnel-step {
        flex: 1 1 0;
        min-width: 0;
        display: flex;
        align-items: baseline;
        gap: 8px;
        padding: 4px 16px;
        border-left: 1px solid var(--line);
        white-space: nowrap;
      }

      .prospect-funnel-step:first-child {
        padding-left: 0;
        border-left: 0;
      }

      .prospect-funnel-value {
        color: var(--ink);
        font-size: 20px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }

      .prospect-funnel-label {
        color: var(--subtle);
        font-size: 12px;
      }

      /* El porcentaje solo aparece cuando la pantalla da para los cinco pasos. */
      .prospect-funnel-share {
        display: none;
        margin-left: auto;
        color: var(--subtle);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }

      @media (min-width: 1180px) {
        .prospect-funnel-share {
          display: inline;
        }
      }

      .prospect-person {
        display: grid;
        gap: 2px;
      }

      .prospect-person strong {
        font-weight: 600;
      }

      .prospect-links {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .prospect-link {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 4px 9px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--white);
        color: var(--muted);
        font-size: 12px;
        text-decoration: none;
        white-space: nowrap;
      }

      .prospect-link:hover {
        color: var(--green-700);
        border-color: var(--green-line);
        background: var(--green-soft);
      }

      .prospect-note {
        display: block;
        width: 100%;
        min-width: 180px;
        border: 1px solid transparent;
        border-radius: 7px;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 13px;
        padding: 6px 8px;
        resize: vertical;
      }

      .prospect-note:hover {
        border-color: var(--line);
      }

      .prospect-note:focus {
        outline: 0;
        background: var(--white);
        border-color: var(--green-line);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
      }

      .prospect-row-actions {
        display: flex;
        gap: 6px;
        justify-content: flex-end;
      }

      .prospect-icon-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 30px;
        height: 30px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--white);
        color: var(--subtle);
        cursor: pointer;
      }

      .prospect-icon-btn:hover {
        color: var(--green-700);
        border-color: var(--green-line);
        background: var(--green-soft);
      }

      .prospect-icon-btn.danger:hover {
        color: var(--rose);
        border-color: var(--rose);
        background: var(--rose-soft);
      }

      /* ── Clientes ── */
      .clients-module {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .clients-bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        padding: 12px 16px;
      }

      .clients-bar-head {
        margin-right: auto;
      }

      .clients-title {
        margin: 0;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }

      .clients-sub {
        margin: 2px 0 0;
        color: var(--subtle);
        font-size: 12px;
      }

      .clients-search {
        width: 230px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 7px 10px;
        font: inherit;
        font-size: 13px;
        color: var(--ink);
        outline: none;
      }

      .clients-search:focus {
        border-color: var(--green);
        box-shadow: 0 0 0 3px var(--green-soft);
      }

      .clients-filter {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--white);
        padding: 7px 12px;
        font: inherit;
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
        cursor: pointer;
      }

      .clients-filter.active {
        background: var(--ink);
        border-color: var(--ink);
        color: var(--white);
      }

      .clients-board {
        columns: 270px;
        column-gap: 14px;
        padding: 14px 16px;
      }

      @media (max-width: 1279px) {
        .clients-board {
          columns: 215px;
        }
      }

      .clients-group {
        break-inside: avoid;
        margin: 0 0 12px;
      }

      .clients-group-title {
        display: flex;
        align-items: baseline;
        gap: 6px;
        margin: 0 0 5px;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
      }

      .clients-group-count {
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0;
        text-transform: none;
        color: var(--subtle);
      }

      .client-row {
        display: flex;
        flex-direction: column;
        gap: 5px;
        border: 1px solid var(--line-soft);
        border-radius: 6px;
        background: var(--white);
        padding: 7px 8px;
        margin-bottom: 5px;
      }

      .client-row-head {
        display: flex;
        align-items: center;
        gap: 7px;
      }

      .client-links {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }

      .client-link {
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 2px 7px;
        font-size: 10px;
        font-weight: 700;
        color: var(--muted);
        text-decoration: none;
      }

      .client-link:hover {
        border-color: var(--green-line);
        background: var(--green-soft);
        color: var(--green-700);
      }

      /* ── Clientes · accesos y rama de carpetas ──────────────── */
      .cmap-legend {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 14px;
        padding: 12px 16px 0;
        font-size: 11px;
        color: var(--subtle);
      }

      .cbrands {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
        gap: 12px;
        padding: 14px 16px;
        align-items: start;
      }

      .cbrand {
        border: 1px solid var(--line-soft);
        border-radius: 8px;
        background: var(--white);
        padding: 10px 12px 12px;
      }

      .cbrand-head {
        display: flex;
        align-items: baseline;
        gap: 8px;
      }

      .cbrand-name {
        margin: 0;
        font-size: 13px;
        font-weight: 700;
      }

      .cbrand-state {
        margin-left: auto;
        font-size: 10px;
        font-weight: 600;
        color: var(--subtle);
      }

      /* Archivar está siempre a la vista, pero en gris: no compite con los accesos de la marca. */
      .cbrand-archive {
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--white);
        padding: 2px 8px;
        font: inherit;
        font-size: 10px;
        font-weight: 700;
        color: var(--subtle);
        cursor: pointer;
      }

      .cbrand-archive:hover {
        border-color: var(--green-line);
        background: var(--green-soft);
        color: var(--green-700);
      }

      .cbrand.archivada {
        border-style: dashed;
        background: var(--soft);
      }

      .cbrand.archivada .cbrand-name,
      .cbrand.archivada .ctree-name {
        color: var(--muted);
      }

      .cbrand-project {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        margin-top: 7px;
      }

      .cbrand-project .client-row-name {
        font-size: 11px;
        color: var(--muted);
      }

      /* La rama: cada nivel se dibuja con una línea que baja desde su padre. */
      .ctree {
        margin: 9px 0 0;
        padding: 0;
        list-style: none;
      }

      .ctree .ctree {
        margin: 0;
        padding-left: 13px;
        border-left: 1px solid var(--line);
        margin-left: 4px;
      }

      .ctree li {
        display: grid;
        grid-template-columns: 10px minmax(0, auto) minmax(0, 1fr);
        align-items: baseline;
        gap: 2px 7px;
        padding: 3px 0;
      }

      .ctree li > .ctree {
        grid-column: 2 / -1;
      }

      .ctree-dot {
        width: 9px;
        height: 9px;
        border-radius: 999px;
        background: #cbd5e1;
        transform: translateY(-1px);
      }

      .ctree-dot.verde {
        background: #16a34a;
      }

      .ctree-dot.ambar {
        background: var(--amber);
      }

      .ctree-dot.rojo {
        background: var(--rose);
      }

      .ctree-name {
        font-size: 11px;
        font-weight: 600;
        color: var(--ink);
        text-decoration: none;
      }

      a.ctree-name:hover {
        color: var(--green-700);
        text-decoration: underline;
      }

      .ctree-detail {
        font-size: 10px;
        color: var(--subtle);
        line-height: 1.35;
      }

      /* ── Clientes · Alertas de Gasto ──────────────────────── */
      .gasto-module {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .gasto-toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
      }

      .gasto-file {
        display: none;
      }

      .gasto-toolbar .btn {
        height: 32px;
        padding: 0 10px;
        font-size: 13px;
      }

      .gasto-toolbar select {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--white);
        padding: 5px 7px;
        font: inherit;
        font-size: 12px;
        color: var(--ink);
      }

      .gasto-toolbar-status {
        max-width: 320px;
      }

      .gasto-metrics {
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 12px;
      }

      .gasto-metrics .metric-card {
        min-height: 96px;
        padding: 13px 14px;
        border-radius: 12px;
      }

      @media (max-width: 1279px) {
        .gasto-metrics {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      .gasto-cell-consumo {
        display: flex;
        flex-direction: column;
        gap: 5px;
        min-width: 108px;
      }

      /* La barra es el presupuesto del mes; la marca gris es por dónde va el mes. Si el relleno pasa
         la marca, la cuenta gasta más rápido que el calendario. */
      .gasto-bar {
        position: relative;
        height: 6px;
        border-radius: 999px;
        background: #eef2f7;
        overflow: hidden;
      }

      .gasto-bar-fill {
        height: 100%;
        border-radius: 999px;
        background: var(--green);
      }

      .gasto-bar-fill.ambar {
        background: var(--amber);
      }

      .gasto-bar-fill.rojo {
        background: var(--rose);
      }

      .gasto-bar-mark {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 2px;
        background: #94a3b8;
      }

      .gasto-presupuesto-input {
        width: 94px;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 5px 7px;
        font: inherit;
        font-size: 12px;
        text-align: right;
        color: var(--ink);
        outline: none;
      }

      .gasto-presupuesto-input:focus {
        border-color: var(--green);
        box-shadow: 0 0 0 3px var(--green-soft);
      }

      .gasto-marca-select {
        margin-top: 4px;
        max-width: 190px;
        border: 1px solid var(--line-soft);
        border-radius: 6px;
        background: var(--white);
        padding: 2px 4px;
        font: inherit;
        font-size: 11px;
        color: var(--muted);
      }

      .gasto-desvio.alto {
        color: var(--rose);
      }

      .gasto-alertas {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 14px 16px;
      }

      .gasto-alerta {
        display: flex;
        flex-wrap: wrap;

      function parseSheetCsv(text) {
        const rows = [];
        let row = [];
        let cell = "";
        let quoted = false;
        const source = String(text || "").replace(/^﻿/, "");
        for (let index = 0; index < source.length; index += 1) {
          const char = source[index];
          if (quoted) {
            if (char === '"' && source[index + 1] === '"') {
              cell += '"';
              index += 1;
            } else if (char === '"') {
              quoted = false;
            } else {
              cell += char;
            }
          } else if (char === '"') {
            quoted = true;
          } else if (char === ",") {
            row.push(cell.trim());
            cell = "";
          } else if (char === "\n" || char === "\r") {
            if (char === "\r" && source[index + 1] === "\n") index += 1;
            row.push(cell.trim());
            rows.push(row);
            row = [];
            cell = "";
          } else {
            cell += char;
          }
        }
        if (cell || row.length) {
          row.push(cell.trim());
          rows.push(row);
        }
        return rows;

      // "S/ 5,600.00", "1,557.87", "23.5%" o "2.21x" -> número; vacío -> null.
      function sheetNumber(value) {
        const cleaned = String(value ?? "").replace(/S\/\.?/gi, "").replace(/[^0-9.-]/g, "");
        if (!/\d/.test(cleaned)) return null;
        const parsed = Number(cleaned);
        return Number.isFinite(parsed) ? parsed : null;
      }

      // "19/01/2026" -> "2026-01-19"
      function sheetDate(value) {
        const match = String(value || "").match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
        return match ? `${match[3]}-${match[2].padStart(2, "0")}-${match[1].padStart(2, "0")}` : "";
      }

      // "Septiembre" (o "Setiembre") -> 9; texto que no es un mes -> 0.
      function sheetMonthNumber(value) {
        const name = normalizeText(value).trim().replace(/^setiembre$/, "septiembre");
        return SHEET_MONTH_NAMES.indexOf(name) + 1;
      }

      // Las pestañas tienen títulos y notas encima de la tabla: se ubica la fila de encabezados por su
      // primera celda y las columnas se leen por nombre, para tolerar columnas nuevas o reordenadas.
      function sheetTable(rows, firstHeader) {
        const headerIndex = rows.findIndex((row) => normalizeText(row[0]).trim() === normalizeText(firstHeader));
        if (headerIndex < 0) return { rows: [], value: () => "" };
        const headers = rows[headerIndex].map((cell) => normalizeText(cell).trim());
        return {
          rows: rows.slice(headerIndex + 1),
          value: (row, name) => {
            const index = headers.findIndex((header) => header.startsWith(normalizeText(name)));
            return index >= 0 ? row[index] || "" : "";
          }
        };
      }

      // adsMonths: meses del modelo de palabras clave (informes de Google Ads de la carpeta de Drive).
      function buildFinancialModel(payload, adsMonths = []) {
        const tabs = payload?.tabs || {};
        const ventasRows = parseSheetCsv(tabs.ventas);
        const inversionRows = parseSheetCsv(tabs.inversion);
        const resultadosRows = parseSheetCsv(tabs.resultados);
        const monthId = (year, monthNumber) => `${year}-${String(monthNumber).padStart(2, "0")}`;

        const ventas = sheetTable(ventasRows, "Fecha");
        const allSales = ventas.rows
          .map((row) => {
            const base = sheetNumber(ventas.value(row, "Monto base"));
            const units = sheetNumber(ventas.value(row, "Meses")) ?? 1;
            return {
              date: sheetDate(ventas.value(row, "Fecha")),
              monthName: ventas.value(row, "Mes"),
              client: ventas.value(row, "Cliente"),
              service: ventas.value(row, "Servicio") || "Servicio sin nombre",
              base: base || 0,
              units,
              billed: sheetNumber(ventas.value(row, "Facturacion")) ?? (base === null ? null : base * units),
              status: ventas.value(row, "Estado")
            };
          })
          .filter((sale) => sale.billed !== null && !/anulad|cancelad|perdid|devuel/.test(normalizeText(sale.status)));

        const titleYear = String(resultadosRows[0]?.[0] || ventasRows[0]?.[0] || "").match(/\b(20\d{2})\b/);
        const year =
          Number(titleYear?.[1]) ||
          Number(allSales.find((sale) => sale.date)?.date.slice(0, 4)) ||
          new Date().getFullYear();
        allSales.forEach((sale) => {
          const monthNumber = sale.date ? Number(sale.date.slice(5, 7)) : sheetMonthNumber(sale.monthName);
          sale.monthId = monthNumber ? monthId(sale.date ? sale.date.slice(0, 4) : year, monthNumber) : "";
        });
        // Nuevo cliente: la primera venta de cada cliente en toda la pestaña Ventas. Una venta sin nombre
        // de cliente cuenta como un cliente distinto, porque la hoja no permite saber si ya compró antes.
        const seenClients = new Set();
        [...allSales]
          .sort((a, b) => (a.date || a.monthId).localeCompare(b.date || b.monthId))
          .forEach((sale, index) => {
            const key = sale.client ? normalizeText(sale.client).trim() : `sin-nombre-${index}`;
            sale.isNewClient = !seenClients.has(key);
            seenClients.add(key);
          });
        const sales = allSales
          .filter((sale) => sale.monthId.startsWith(`${year}-`))
          .sort((a, b) => (a.date || a.monthId).localeCompare(b.date || b.monthId));

        // Venta vs Resultados: cotizaciones y monto cotizado por mes (la pestaña Cotizaciones no se
        // descarga porque tiene teléfonos) e inversión mensual, si algún día se completa esa columna.
        const resultados = sheetTable(resultadosRows, "Mes");
        const monthRows = new Map();
        for (const row of resultados.rows) {
          if (normalizeText(row[0]).trim() === "total") break;
          const monthNumber = sheetMonthNumber(row[0]);
          if (!monthNumber) continue;
          monthRows.set(monthId(year, monthNumber), {
            quotes: sheetNumber(resultados.value(row, "Cotizaciones")),
            quoted: sheetNumber(resultados.value(row, "Monto cotizado")),
            investment: sheetNumber(resultados.value(row, "Inversion")),
            notes: resultados.value(row, "Observaciones")
          });
        }

        const inversion = sheetTable(inversionRows, "Plataforma");
        const platforms = inversion.rows
          .map((row) => ({
            name: row[0],
            period: inversion.value(row, "Periodo"),
            currency: inversion.value(row, "Moneda"),
            origin: sheetNumber(inversion.value(row, "Inversion origen")),
            rate: inversion.value(row, "TC"),
            amount: sheetNumber(inversion.value(row, "Inversion en PEN")),
            resultLabel: inversion.value(row, "Resultado principal"),
            results: sheetNumber(inversion.value(row, "Resultados")),
            monthly: null
          }))
          .filter((platform) => platform.name && platform.amount !== null);

        // Google Ads mes a mes: fila "Total: Cuenta" de cada informe de Drive, en la moneda de la cuenta y
        // convertida con el TC de la fila Google Ads de esta pestaña. Meta Ads no tiene informe mensual:
        // queda con el total consolidado de la hoja.
        const google = platforms.find((platform) => /google/.test(normalizeText(platform.name)));
        if (google) {
          const sheetRate = sheetNumber(google.rate);
          google.monthly = new Map();
          adsMonths
            .filter((month) => month.id.startsWith(`${year}-`) && month.account)
            .forEach((month) => {
              const rate = month.currency === "PEN" ? 1 : month.currency === google.currency ? sheetRate : null;
              google.monthly.set(month.id, {
                currency: month.currency,
                origin: month.account.cost,
                rate,
                amount: rate === null ? null : month.account.cost * rate
              });
            });
          if (!google.monthly.size) google.monthly = null;
        }

        // Notas que la hoja deja junto a las tablas ("Nota", "Nota de inversión", "Nota ROAS mensual").
        const notes = [];
        [...inversionRows, ...resultadosRows].forEach((row) => {
          row.forEach((cell, index) => {
            if (/^nota\b/.test(normalizeText(cell).trim()) && row[index + 1]) {
              notes.push({ label: cell, text: row[index + 1] });
            }
          });
        });

        const ids = [
          ...new Set([...monthRows.keys(), ...sales.map((sale) => sale.monthId), ...(google?.monthly?.keys() || [])])
        ].sort();
        const months = ids.map((id) => {
          const sheetRow = monthRows.get(id) || {};
          const monthNumber = Number(id.slice(5, 7));
          const name = SHEET_MONTH_NAMES[monthNumber - 1];
          return {
            id,
            short: SHEET_MONTH_SHORT[monthNumber - 1],
            label: `${name.charAt(0).toUpperCase()}${name.slice(1)} ${year}`,
            sales: sales.filter((sale) => sale.monthId === id),
            quotes: sheetRow.quotes ?? null,
            quoted: sheetRow.quoted ?? null,
            investment: sheetRow.investment ?? null,
            notes: sheetRow.notes || ""
          };
        });

        return {
          year,
          months,
          platforms,
          notes,
          syncedAt: payload?.syncedAt || "",
          trigger: payload?.trigger || "",
          requestedBy: payload?.requestedBy || ""
        };
      }

      function financialModel() {
        if (!financialPayload) return null;
        if (financialModelCache?.payload !== financialPayload || financialModelCache.ads !== keywordsModel) {
          financialModelCache = {
            payload: financialPayload,
            ads: keywordsModel,
            model: buildFinancialModel(financialPayload, keywordsModel?.months || [])
          };
        }
        return financialModelCache.model;
      }

      function groupSalesByService(sales) {
        const groups = new Map();
        sales.forEach((sale) => {
          const key = normalizeText(sale.service).trim();
          const group = groups.get(key) || { key, service: sale.service, amount: 0, clients: [] };
          group.amount += sale.billed;
          if (sale.client && !group.clients.includes(sale.client)) group.clients.push(sale.client);
          groups.set(key, group);
        });
        return [...groups.values()].sort((a, b) => b.amount - a.amount);
      }

      // periodId: "ytd" (acumulado del año) o "AAAA-MM".
      function financialPeriod(model, periodId) {
        const isTotal = periodId === "ytd";
        const months = isTotal ? model.months : model.months.filter((month) => month.id === periodId);
        if (!isTotal && !months.length) return null;
        const sales = months.flatMap((month) => month.sales);
        const billed = sales.reduce((sum, sale) => sum + sale.billed, 0);
        const quoteMonths = months.filter((month) => month.quotes !== null);
        const quotes = quoteMonths.length ? quoteMonths.reduce((sum, month) => sum + month.quotes, 0) : null;
        const quoted = months.some((month) => month.quoted !== null)
          ? months.reduce((sum, month) => sum + (month.quoted || 0), 0)
          : null;

        // Inversión por plataforma. Con detalle mensual (Google Ads, informes de Drive) se suman los meses
        // del periodo. Sin él (Meta Ads) solo existe el total consolidado de la pestaña Inversion: entra
        // al Acumulado y no se reparte entre meses para no inventarlo, así que en un mes queda pendiente.
        const decimals = (value) => value.toLocaleString("es-PE", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        const investmentLines = [];
        const investmentMissing = [];
        model.platforms.forEach((platform) => {
          const key = normalizeText(platform.name);
          if (platform.monthly) {
            const covered = months.filter((month) => platform.monthly.has(month.id));
            const entries = covered.map((month) => platform.monthly.get(month.id));
            if (!entries.length) {
              investmentMissing.push({ key, label: platform.name, detail: "Sin informe del mes en Drive" });
              return;
            }
            if (entries.some((entry) => entry.amount === null)) {
              investmentMissing.push({ key, label: platform.name, detail: `Falta el TC ${entries[0].currency}/PEN en la pestaña Inversion` });
              return;
            }
            const [first] = entries;
            const origin = entries.reduce((sum, entry) => sum + entry.origin, 0);
            const conversion =
              first.currency !== "PEN" && entries.every((entry) => entry.currency === first.currency && entry.rate === first.rate)
                ? `${first.currency} ${decimals(origin)} × TC ${decimals(first.rate)}`
                : "";
            const source = isTotal
              ? `${covered.length} ${covered.length === 1 ? "informe" : "informes"} de Drive (${covered[0].short} – ${covered[covered.length - 1].short})`
              : "Informe de Drive";
            investmentLines.push({
              key,
              label: platform.name,
              detail: [conversion, source].filter(Boolean).join(" · "),
              amount: entries.reduce((sum, entry) => sum + entry.amount, 0)
            });
          } else if (isTotal) {
            investmentLines.push({
              key,
              label: platform.name,
              detail: [
                platform.currency && platform.currency !== "PEN" && platform.origin !== null
                  ? `${platform.currency} ${decimals(platform.origin)} × TC ${platform.rate || "?"}`
                  : "",
                platform.results !== null ? `${fmtNumber(platform.results)} ${platform.resultLabel || "resultados"}` : "",
                platform.period
              ].filter(Boolean).join(" · "),
              amount: platform.amount
            });
          } else {
            investmentMissing.push({ key, label: platform.name, detail: "Sin informe mensual: la hoja solo trae el total del año" });
          }
        });
        let investment = investmentLines.length ? investmentLines.reduce((sum, line) => sum + line.amount, 0) : null;
        // Sin datos de ninguna plataforma: la columna "Inversión (S/)" de Venta vs Resultados, si la hoja la llena.
        if (investment === null && months.length && months.every((month) => month.investment !== null)) {
          investment = months.reduce((sum, month) => sum + month.investment, 0);
          investmentLines.push({ key: "mes", label: "Inversión publicitaria", detail: "Venta vs Resultados", amount: investment });
          investmentMissing.length = 0;
        }
        const result = investment === null ? null : billed - investment;
        const first = model.months[0];
        const last = model.months[model.months.length - 1];

        return {
          id: periodId,
          isTotal,
          label: isTotal ? `Acumulado ${model.year}` : months[0].label,
          range: isTotal ? (first ? `${first.short} – ${last.short} ${model.year}` : String(model.year)) : months[0].label,
          sales,
          billed,
          salesCount: sales.length,
          quotes,
          quoted,
          closeRate: quotes ? sales.length / quotes : null,
          investment,
          investmentLines,
          // Plataformas sin dato en el periodo: la inversión, el resultado y el ROAS quedan sin ellas.
          investmentMissing,
          result,
          margin: result !== null && billed ? result / billed : null,
          roas: investment ? billed / investment : null,
          ticket: sales.length ? billed / sales.length : null,
          newClients: sales.filter((sale) => sale.isNewClient),
          incomeGroups: groupSalesByService(sales),
          notes: isTotal
            ? model.notes.map((note) => `${note.label}: ${note.text}`)
            : months.map((month) => month.notes).filter(Boolean)
        };
      }

      // Las cotizaciones (clientes, contactos, telefonos y montos) ya no viven en este archivo, que es
      // publico: se cargan de Supabase (lr_suite_private_data, clave "quotes") despues del login.

        };

        localStorage.setItem(QUOTE_INVESTMENT_STORAGE_KEY, JSON.stringify(quoteInvestments));

      function variation(current, previous) {
        return previous ? ((current - previous) / Math.abs(previous)) * 100 : 0;
      }

      function trend(value, inverse = false) {
        const positive = value >= 0;
        const favorable = inverse ? !positive : positive;
        const symbol = positive ? "↗" : "↘";
        return `<span class="trend ${favorable ? "" : "bad"}">${symbol} ${Math.abs(value).toFixed(1)}%</span>`;
      }

      function metric(label, value, detail, trendValue, inverse = false) {
        return `
          <article class="metric-card">
            <div class="metric-head">
              <p class="metric-label">${label}</p>
              ${typeof trendValue === "number" ? trend(trendValue, inverse) : ""}
            </div>
            <p class="metric-value">${value}</p>
            <p class="metric-detail">${detail}</p>
          </article>
        `;
      }

          Crece: "green",
          "En caída": "rose",
          Estable: "sky",
          Procesando: "sky",
          Cargado: "green",
          Aviso: "amber",
          Error: "rose",
          Enviada: "sky",
          "En proceso": "sky",
          "En negociación": "amber",
          Media: "amber",
          Perdida: "rose",
          Bloqueado: "rose",
          Alta: "rose",
          Baja: "green",

        const requester = model?.requestedBy ? suiteUserForEmail(model.requestedBy)?.name || model.requestedBy : "";
        const origin = !model
          ? ""
          : model.trigger === "manual"
            ? `Actualización manual${requester ? ` · ${requester}` : ""}`
            : model.trigger === "instalacion"
              ? "Primera carga"
              : "Actualización automática";
        const monthlyAds = model?.platforms.find((platform) => platform.monthly)?.monthly;
        const adsSource = monthlyAds
          ? `Google Ads por mes: ${monthlyAds.size} ${monthlyAds.size === 1 ? "informe" : "informes"} de Drive`
          : keywordsLoad.loading || keywordsLoad.syncing
            ? "Google Ads por mes: cargando informes de Drive…"
            : "";
        return `
          <div class="financial-sync">
            <div class="financial-sync-info">
              <p class="small">Google Sheets · diario a las 6:00 a. m.</p>
              <strong>${validSync ? `Actualizado ${escapeHtml(fmtDateTime(syncedAt))}` : "Sin sincronizar"}</strong>
              ${origin ? `<p class="small">${escapeHtml(origin)}</p>` : ""}
              ${adsSource ? `<p class="small">${escapeHtml(adsSource)}</p>` : ""}

        const notices = [];

        const syncedAt = model?.syncedAt ? new Date(model.syncedAt).getTime() : 0;

          notices.push(
            `<div class="financial-notice">La última actualización tiene más de un día. Pulsa «Actualizar» o revisa el cron <code>lr-suite-financial-daily</code> en Supabase.</div>`

          notices.push(`<div class="financial-notice">Inversión mensual de Google Ads: ${escapeHtml(keywordsLoad.error)}</div>`);
