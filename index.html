<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LR Suite</title>
    <!-- Sello de version: permite saber que build esta sirviendo el navegador.
         Comprobar con  window.LR_SUITE_BUILD  en la consola. -->
    <meta name="lr-suite-build" content="2026-10-04-palabras-clave" />
    <script>
      window.LR_SUITE_BUILD = "2026-10-04-palabras-clave";
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.3/dist/umd/supabase.js" integrity="sha384-wUhGjm8yom7j8IkWM5ZzIdOO/62dez3WNulthrcTYBqGaTi9lWhKKCnVtcxT2CEI" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
    <script src="./lr-suite-config.js"></script>
    <!-- Lector de informes de palabras clave: el mismo archivo que usa el script de Node. -->
    <script src="./src/modules/analisis-palabras-clave/keyword-report.js?v=2026-10-04"></script>
    <style>
      :root {
        --ink: #0f172a;
        --muted: #475569;
        --subtle: #64748b;
        --soft: #f8fafc;
        --surface-subtle: #f1f5f9;
        --line: #dce3ef;
        --line-soft: #e2e8f0;
        --green: #2563eb;
        --green-700: #1d4ed8;
        --green-soft: #eff6ff;
        --green-line: #bfdbfe;
        --sky: #0ea5e9;
        --sky-soft: #f0f9ff;
        --amber: #d97706;
        --amber-soft: #fffbeb;
        --rose: #e11d48;
        --rose-soft: #fff1f2;
        --white: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      html {
        background: var(--soft);
      }

      body {
        width: 100%;
        max-width: 100%;
        margin: 0;
        overflow-x: hidden;
        background: var(--soft);
        color: var(--ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      button,
      input,
      select {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      .app {
        min-height: 100vh;
      }

      .sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        z-index: 20;
        width: 288px;
        border-right: 1px solid var(--line);
        background: var(--white);
        padding: 24px 22px 20px;
        display: flex;
        flex-direction: column;
        gap: 24px;
        overflow-y: auto;
        transition:
          width 0.2s ease,
          padding 0.2s ease,
          transform 0.2s ease,
          box-shadow 0.2s ease;
      }

      /* Sidebar minimizable */
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        max-width: 1480px;
        margin: 0 auto 16px;
      }

      .topbar-left {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }

      .topbar-title {
        overflow: hidden;
        color: var(--ink);
        font-size: 15px;
        font-weight: 600;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .sidebar-toggle {
        display: grid;
        flex: 0 0 auto;
        width: 36px;
        height: 36px;
        padding: 0;
        place-items: center;
        border: 1px solid #dbe5f2;
        border-radius: 9px;
        background: #ffffff;
        color: #52647d;
        transition:
          background 0.15s ease,
          border-color 0.15s ease,
          color 0.15s ease;
      }

      .sidebar-toggle:hover {
        border-color: #bfdbfe;
        background: #f8fbff;
        color: var(--green);
      }

      .sidebar-toggle:focus-visible {
        outline: none;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.25);
      }

      .sidebar-toggle-arrow {
        transform-box: fill-box;
        transform-origin: center;
        transition: transform 0.2s ease;
      }

      .app.sidebar-collapsed .sidebar-toggle-arrow {
        transform: scaleX(-1);
      }

      @media (min-width: 901px) {
        .app.sidebar-collapsed .sidebar {
          width: 88px;
          padding: 24px 12px 20px;
        }

        .app.sidebar-collapsed .content {
          margin-left: 88px;
        }

        .app.sidebar-collapsed .brand {
          justify-content: center;
        }

        .app.sidebar-collapsed .brand-text,
        .app.sidebar-collapsed .sidebar-heading,
        .app.sidebar-collapsed .nav-text,
        .app.sidebar-collapsed .chevron,
        .app.sidebar-collapsed .active-box {
          display: none;
        }

        .app.sidebar-collapsed .nav-button {
          min-height: 56px;
          grid-template-columns: 40px;
          justify-content: center;
          padding: 7px;
        }
      }

      @media (max-width: 900px) {
        .app.sidebar-collapsed .sidebar {
          transform: translateX(-100%);
          box-shadow: none;
        }

        .app.sidebar-collapsed .content {
          margin-left: 0;
        }
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        text-decoration: none;
        color: inherit;
      }

      .logo {
        display: grid;
        width: 44px;
        height: 44px;
        place-items: center;
        border-radius: 8px;
        background: #172033;
        color: #fff;
        font-size: 14px;
        font-weight: 700;
      }

      .brand-title {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
      }

      .small {
        margin: 0;
        color: var(--subtle);
        font-size: 12px;
        line-height: 1.5;
      }

      .eyebrow {
        margin: 0 0 4px;
        color: var(--subtle);
        font-size: 13px;
        font-weight: 500;
      }

      .panel-title {
        margin: 0;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 0;
      }

      .nav {
        display: grid;
        gap: 9px;
      }

      .nav-button {
        width: 100%;
        min-height: 66px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--white);
        color: var(--ink);
        display: grid;
        grid-template-columns: 40px minmax(0, 1fr) 14px;
        gap: 12px;
        align-items: center;
        padding: 10px;
        text-align: left;
        transition:
          background 0.18s ease,
          border-color 0.18s ease,
          box-shadow 0.18s ease;
      }

      .nav-button:hover,
      .nav-button.active {
        border-color: var(--green-line);
        background: var(--green-soft);
        box-shadow: 0 6px 16px rgba(16, 185, 129, 0.08);
      }

      .nav-icon {
        display: grid;
        width: 40px;
        height: 40px;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--soft);
        color: var(--subtle);
      }

      .nav-button.active .nav-icon {
        border-color: var(--green-line);
        background: #fff;
        color: var(--green);
      }

      .nav-name,
      .nav-desc {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .nav-name {
        color: var(--ink);
        font-size: 14px;
        font-weight: 500;
      }

      .nav-button.active .nav-name {
        color: var(--green-700);
      }

      .nav-desc {
        margin-top: 4px;
        color: var(--subtle);
        font-size: 12px;
      }

      .chevron {
        color: #94a3b8;
        font-size: 22px;
        line-height: 1;
      }

      .active-box {
        margin-top: auto;
        border: 1px solid var(--green-line);
        border-radius: 8px;
        background: var(--green-soft);
        padding: 14px;
      }

      .active-box .label {
        margin: 0 0 8px;
        color: var(--green-700);
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
      }

      .active-box strong {
        display: block;
        margin-bottom: 5px;
        font-size: 14px;
        font-weight: 600;
      }

      .content {
        margin-left: 288px;
        min-height: 100vh;
        padding: 32px 56px;
        transition: margin-left 0.2s ease;
      }

      .module {
        width: 100%;
        min-width: 0;
        max-width: 1480px;
        margin: 0 auto;
        display: grid;
        gap: 22px;
      }

      .task-module {
        width: 100%;
        min-width: 0;
        gap: 8px;
      }

      .task-module .header-card {
        gap: 12px;
        padding: 14px 16px;
      }

      .task-module .tag {
        gap: 5px;
        padding: 3px 8px;
        font-size: 11px;
      }

      .task-module h1 {
        margin-top: 7px;
        font-size: 24px;
      }

      .task-module .lead {
        margin-top: 5px;
        font-size: 12px;
        line-height: 1.35;
      }

      .task-module .header-card > .control {
        min-width: 190px;
        padding: 7px 9px;
        font-size: 12px;
      }

      .task-module .task-overview {
        grid-template-columns: minmax(260px, 0.75fr) minmax(520px, 1.8fr);
        gap: 6px;
      }

      .task-module .presence-grid,
      .task-module .task-overview .metrics {
        gap: 6px;
      }

      .task-module .presence-card {
        padding: 6px 8px;
      }

      .task-module .presence-title {
        gap: 6px;
        font-size: 11px;
      }

      .task-module .presence-detail,
      .task-module .presence-worked {
        font-size: 9px;
      }

      .task-module .task-overview .metric-card {
        gap: 1px 6px;
        padding: 6px 8px;
      }

      .task-module .task-overview .metric-label {
        font-size: 9px;
      }

      .task-module .task-overview .metric-value {
        font-size: 17px;
      }

      .task-module .task-overview .metric-detail {
        font-size: 8px;
      }

      .task-module .live-activity {
        padding: 6px 10px;
        font-size: 11px;
      }

      .task-module .pending-sync-bar {
        gap: 8px;
        margin-top: 0;
        padding: 6px 8px;
        border-radius: 8px;
      }

      .task-module .pending-sync-label,
      .task-module .pending-sync-message {
        font-size: 10px;
      }

      .task-module .task-create-panel {
        padding: 7px 9px;
      }

      .task-module .task-form {
        gap: 6px;
      }

      .task-module .form-field input,
      .task-module .form-field select,
      .task-module .task-form > .btn {
        height: 30px;
        font-size: 11px;
      }

      .task-module .toolbar {
        gap: 10px;
        padding: 10px 12px;
      }

      .task-module .filters {
        gap: 6px;
      }

      .task-module .toolbar .control {
        min-width: 155px;
        gap: 7px;
        padding: 7px 9px;
        font-size: 12px;
      }

      .task-module .toolbar .btn,
      .task-module .pending-sync-bar .btn {
        height: 32px;
        padding: 0 10px;
        font-size: 12px;
      }

      .task-module .task-owner-heading,
      .task-module .category-task-form {
        display: none;
      }

      .task-module .task-owner-group + .task-owner-group {
        border-top: 1px solid var(--line-soft);
      }

      .task-module .task-subtasks {
        margin: -2px 0 4px 44px;
        border-color: #e2e8f0;
        background: #fff;
      }

      .task-module .task-subtasks > summary {
        min-height: 26px;
        padding: 4px 8px;
        font-size: 10px;
      }

      .task-module .task-subtask-body {
        gap: 6px;
        padding: 6px 8px 8px;
      }
      @media (max-width: 1380px) {
        .task-module .task-overview {
          grid-template-columns: 1fr;
        }
      }

      .header-card,
      .compare-card,
      .month-track,
      .metric-card,
      .panel {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--white);
        box-shadow: 0 18px 60px rgba(15, 23, 42, 0.04);
      }

      .header-card {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 18px;
        padding: 22px 20px;
      }

      .tag {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        width: max-content;
        border: 1px solid var(--green-line);
        border-radius: 7px;
        background: var(--green-soft);
        color: var(--green-700);
        padding: 5px 10px;
        font-size: 12px;
        font-weight: 500;
      }

      h1 {
        margin: 12px 0 0;
        color: var(--ink);
        font-size: 30px;
        line-height: 1.1;
        letter-spacing: 0;
        font-weight: 600;
      }

      .lead {
        max-width: 900px;
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.5;
      }

      .control {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        min-width: 240px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--white);
        padding: 11px 12px;
        color: var(--subtle);
      }

      .control input,
      .control select {
        width: 100%;
        border: 0;
        background: transparent;
        color: var(--ink);
        font-weight: 500;
        outline: 0;
      }

      .month-period strong {
        display: block;
        color: var(--ink);
        font-size: 14px;
        font-weight: 600;
        white-space: nowrap;
      }

      .compare-card {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 16px;
        padding: 16px 18px;
      }

      .compare-left {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .compare-icon {
        display: grid;
        width: 42px;
        height: 42px;
        place-items: center;
        border-radius: 8px;
        background: var(--amber-soft);
        color: var(--amber);
      }

      .compare-title {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
      }

      .compare-grid {
        display: grid;
        grid-template-columns: repeat(4, max-content);
        gap: 26px;
        color: var(--subtle);
        font-size: 12px;
      }

      .compare-grid strong {
        display: block;
        margin-top: 3px;
        color: var(--ink);
        font-size: 13px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }

      .compare-grid .up {
        color: var(--green);
      }

      .compare-grid .negative {
        color: var(--rose);
      }

      .month-track {
        display: grid;
        gap: 14px;
        padding: 16px 18px;
      }

      .month-track-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
      }

      .month-track-head strong {
        display: block;
        font-size: 14px;
        font-weight: 600;
      }

      .month-chip {
        display: inline-flex;
        align-items: center;
        width: max-content;
        border: 1px solid var(--green-line);
        border-radius: 999px;
        background: var(--green-soft);
        color: var(--green-700);
        padding: 5px 10px;
        font-size: 12px;
        font-weight: 600;
      }

      .month-tabs {
        display: grid;
        grid-template-columns: repeat(12, minmax(0, 1fr));
        gap: 9px;
      }

      .month-tab {
        min-height: 48px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--white);
        color: var(--ink);
        font-size: 13px;
        font-weight: 600;
        transition:
          background 0.18s ease,
          border-color 0.18s ease,
          color 0.18s ease;
      }

      .month-tab:hover:not(:disabled),
      .month-tab.active {
        border-color: var(--green-line);
        background: var(--green-soft);
        color: var(--green-700);
      }

      .month-tab:disabled {
        cursor: not-allowed;
        color: #94a3b8;
        background: #f8fafc;
      }

      .metrics {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 16px;
      }

      .metric-card {
        min-height: 126px;
        padding: 18px;
        position: relative;
      }

      .metric-head {
        display: flex;
        align-items: start;
        justify-content: space-between;
        gap: 12px;
      }

      .metric-label {
        margin: 0;
        color: var(--subtle);
        font-size: 13px;
        font-weight: 500;
        text-transform: uppercase;
      }

      .trend {
        display: inline-flex;
        align-items: center;
        border-radius: 6px;
        background: var(--green-soft);
        color: var(--green);
        padding: 4px 8px;
        font-size: 12px;
        font-weight: 500;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }

      .trend.bad {
        background: var(--rose-soft);
        color: var(--rose);
      }

      .metric-value {
        margin: 22px 0 0;
        color: var(--ink);
        font-size: 24px;
        font-weight: 600;
        letter-spacing: 0;
        font-variant-numeric: tabular-nums;
      }

      .metric-detail {
        margin: 9px 0 0;
        color: var(--subtle);
        font-size: 12px;
      }

      .split {
        display: grid;
        grid-template-columns: minmax(0, 1.15fr) minmax(420px, 0.85fr);
        gap: 22px;
        align-items: start;
      }

      .panel-head {
        border-bottom: 1px solid var(--line);
        padding: 17px 18px;
      }

      .panel-head strong {
        display: block;
        font-size: 14px;
        font-weight: 600;
      }

      .table-wrap {
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }

      th,
      td {
        border-bottom: 1px solid var(--line-soft);
        padding: 13px 18px;
        vertical-align: middle;
      }

      th {
        background: #f8fafc;
        color: var(--subtle);
        font-size: 12px;
        font-weight: 500;
        text-align: left;
        text-transform: uppercase;
      }

      .right {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }

      .muted {
        color: var(--subtle);
      }

      .section-row td {
        background: #fff;
        color: var(--ink);
        font-weight: 600;
      }

      .section-row .negative {
        color: var(--rose);
      }

      .final-row td {
        background: #172033;
        color: #fff;
        font-weight: 600;
      }

      .chart-panel {
        padding: 18px;
      }

      .chart-head {
        display: flex;
        justify-content: space-between;
        gap: 14px;
        margin-bottom: 12px;
      }

      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        color: var(--subtle);
        font-size: 12px;
      }

      .dot {
        display: inline-block;
        width: 10px;
        height: 10px;
        margin-right: 6px;
        border-radius: 3px;
        vertical-align: -1px;
      }

      /* ── Pérdidas y Ganancias (Google Sheets) ── */
      .financial-sync {
        display: flex;
        align-items: center;
        gap: 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--white);
        padding: 11px 12px;
      }

      .financial-sync-info strong {
        display: block;
        color: var(--ink);
        font-size: 14px;
        font-weight: 600;
        white-space: nowrap;
      }

      .financial-sync .btn {
        flex: none;
      }

      .financial-sync-icon {
        display: inline-flex;
      }

      .financial-sync-icon.spinning {
        animation: financial-spin 0.9s linear infinite;
      }

      @keyframes financial-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .financial-sync-icon.spinning {
          animation: none;
        }
      }

      .financial-notice {
        border: 1px solid #fde68a;
        border-radius: 8px;
        background: var(--amber-soft);
        color: #92400e;
        padding: 12px 16px;
        font-size: 13px;
        line-height: 1.5;
      }

      .financial-notice.error {
        border-color: #fecdd3;
        background: var(--rose-soft);
        color: #9f1239;
      }

      .financial-empty {
        padding: 28px 22px;
        color: var(--muted);
        font-size: 14px;
      }

      .financial-empty p {
        margin: 0;
      }

      .financial-line-detail {
        display: block;
        margin-top: 3px;
        color: #94a3b8;
        font-size: 12px;
      }

      .financial-notes {
        display: grid;
        gap: 6px;
        border-top: 1px solid var(--line);
        padding: 14px 18px;
      }

      .final-row td.muted {
        color: #cbd5e1;
      }

      .financial-platforms {
        display: grid;
        gap: 6px;
        margin-top: 12px;
        border-top: 1px solid var(--line-soft);
        padding-top: 10px;
      }

      .financial-platform {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        color: var(--subtle);
        font-size: 13px;
      }

      .financial-platform strong {
        color: var(--ink);
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }

      .financial-statement .right {
        white-space: nowrap;
      }

      /* Las tablas ya se desplazan dentro de .table-wrap: sin esto, su ancho fija el minimo del grid y
         en un telefono la pagina entera se ensancha. */
      .financial-module > *,
      .financial-module .split > * {
        min-width: 0;
      }

      .month-tabs.financial-month-tabs {
        grid-template-columns: repeat(13, minmax(0, 1fr));
      }

      @media (max-width: 1040px) {
        .month-tabs.financial-month-tabs {
          grid-template-columns: repeat(7, minmax(0, 1fr));
        }

        text-anchor: middle;

      .idea-map-node {

      }

      .idea-map-node:active {

      }

      .idea-map-node-halo {
        fill: var(--route-color);
        opacity: 0.13;
      }

      .idea-map-node-core {
        fill: #fff;
        stroke: var(--route-color);
        stroke-width: 5;
        filter: drop-shadow(0 9px 16px rgba(15, 23, 42, 0.16));

      .idea-map-node-title {
        fill: #0f172a;
        font-size: 11px;
        font-weight: 900;
        text-anchor: middle;
        pointer-events: none;
      }

      .idea-map-node-owner {
        fill: #475569;
        font-size: 10px;
        font-weight: 800;
        text-anchor: middle;
        pointer-events: none;
      }

      .idea-map-loading,
      .idea-map-empty {
        display: grid;
        min-height: 260px;
        place-items: center;
        color: var(--muted);
        font-weight: 800;
        text-align: center;
      }

      @media (max-width: 760px) {
        .idea-map-stage {
          height: 620px;
          min-height: 620px;
        }

        .idea-map-legend {
          justify-content: flex-start;
        }

      .task.critical-route-task {
        background: linear-gradient(90deg, rgba(37, 99, 235, 0.07), rgba(248, 250, 252, 0));
        box-shadow: inset 3px 0 0 var(--critical-route-color, var(--green));
      }


      .critical-step-badge {
        display: inline-grid;
        width: 14px;
        height: 14px;
        min-width: 16px;
        border: 2px solid rgba(255, 255, 255, 0.95);
        border-radius: 999px;
        background: var(--critical-route-color, var(--green));
        box-shadow: 0 0 0 1px color-mix(in srgb, var(--critical-route-color, var(--green)) 35%, white);
        cursor: pointer;
        padding: 0;
      }

      .critical-step-badge:hover,
      .critical-step-badge:focus-visible {
        box-shadow: 0 0 0 2px var(--ink);
        outline: 0;
      }

      .critical-route-picker {
        position: fixed;
        z-index: 9999;
        display: none;
        grid-template-columns: repeat(5, 14px);
        gap: 4px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: #fff;
        padding: 6px;
        box-shadow: 0 12px 26px rgba(15, 23, 42, 0.16);
      }

      .critical-route-picker.open {
        display: grid;
      }

      .critical-route-picker .critical-route-swatch {
        width: 14px;
        height: 14px;
      }

      .critical-route-schedule {
        display: inline-flex;
        flex: 0 0 190px;
        justify-content: center;
        align-items: center;
        gap: 6px;
        margin-left: auto;
        border: 1px solid color-mix(in srgb, var(--critical-route-color, var(--green)) 22%, white);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.82);
        color: var(--critical-route-color, var(--green));
        padding: 4px 9px;
        font-size: 10px;
        font-weight: 800;
        line-height: 1;
        white-space: nowrap;
      }

      .critical-route-schedule span {
        color: var(--muted);
        font-weight: 700;
      }

      .critical-route-arrows,
      .critical-route-arrow,
      .critical-route-arrow-marker {
        display: none;
      }

      .task-owner-group {
        display: block;
      }

      .task-owner-heading {
        display: flex;
        flex-wrap: wrap;
        margin: 0;
        border-bottom: 1px solid var(--line-soft);
        background: #f8fafc;
        padding: 12px 18px;
        color: #000;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        gap: 8px;
        align-items: center;
      }

      .task-owner-heading .route-heading-meta {
        color: #000;
        font-size: inherit;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .task-owner-heading::before {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: var(--category-color, var(--blue));
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--category-color, var(--blue)) 16%, transparent);
        content: "";
        flex: 0 0 auto;
      }

      .route-heading-title,
      .route-heading-meta {
        max-width: 100%;
        min-width: 160px;
        line-height: 1.2;
        text-transform: uppercase;
      }

      .category-task-form {
        display: grid;
        grid-template-columns:
          minmax(240px, 2fr)
          minmax(130px, 0.8fr)
          minmax(136px, 0.8fr)
          minmax(136px, 0.8fr)
          minmax(100px, 0.6fr)
          auto;
        gap: 7px;
        align-items: end;
        border-bottom: 1px solid var(--line-soft);
        background: #fff;
        padding: 10px 18px;
      }

      .category-task-form .form-field span {
        font-size: 9px;
      }

      .category-task-form .form-field input,
      .category-task-form .form-field select,
      .category-task-form > .btn {
        height: 30px;
        font-size: 11px;
      }

      .form-field-error {
        display: block;
        margin-top: 5px;
        color: #b91c1c;
        font-size: 12px;
        font-weight: 700;
      }

      .field-invalid {
        border-color: #dc2626 !important;
        box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12) !important;
      }

      .category-create-panel .task-form {
        grid-template-columns:
          minmax(260px, 2fr)
          minmax(150px, 1fr)
          minmax(160px, 0.9fr)
          minmax(160px, 0.9fr)
          minmax(110px, 0.7fr)
          auto;
      }

      .task {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        gap: 8px;
        border-bottom: 1px solid var(--line-soft);
        background: #f8fafc;
        padding: 0 18px 8px;
        min-height: 50px;
        position: relative;
        transition:
          background 0.18s ease,
          opacity 0.18s ease,
          box-shadow 0.18s ease;
      }

      .task.locked-by-other {
        overflow: hidden;
      }

      .task.locked-by-other > :not(.task-lock-overlay) {
        pointer-events: none;
      }

      .task.locked-by-other .task-subtasks,
      .task.locked-by-other .task-subtasks > summary,
      .task.locked-by-other .task-subtask-form,
      .task.locked-by-other .task-subtask-form input,
      .task.locked-by-other .task-subtask-form select,
      .task.locked-by-other .task-subtask-form .btn {
        pointer-events: auto;
      }

      .task.locked-by-other .task-subtasks {
        position: relative;
        z-index: 8;
        opacity: 1;
      }

      .task.locked-by-other .task-main,
      .task.locked-by-other .task-actions,
      .task.locked-by-other .timer-box,
      .task.locked-by-other .btn {
        pointer-events: auto;
      }

      .task.locked-by-other .task-order-controls,
      .task.locked-by-other .task-main,
      .task.locked-by-other .task-actions {
        opacity: 0.62;
      }

      .task.locked-by-other .task-actions {
        opacity: 1;
      }

      .task-lock-overlay {
        position: absolute;
        inset: 0;
        z-index: 5;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto auto;
        gap: 10px;
        align-items: center;
        border: 1px solid rgba(100, 116, 139, 0.24);
        background: linear-gradient(90deg, rgba(241, 245, 249, 0.28), rgba(241, 245, 249, 0.72));
        padding: 14px 18px;
        backdrop-filter: blur(1px);
        pointer-events: none;
      }

      .task-lock-message {
        justify-self: end;
        width: min(320px, 28vw);
        min-width: 220px;
        border: 1px solid rgba(148, 163, 184, 0.3);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.82);
        padding: 8px 10px;
        box-shadow: 0 6px 16px rgba(15, 23, 42, 0.08);
        pointer-events: auto;
      }

      .task-lock-title {
        color: var(--ink);
        font-size: 13px;
        font-weight: 800;
      }

      .task-lock-detail {
        margin-top: 2px;
        color: var(--muted);
        font-size: 11px;
      }

      .task-lock-timer {
        display: inline-grid;
        grid-template-columns: auto auto;
        align-items: stretch;
        overflow: hidden;
        border: 1px solid var(--rose);
        border-radius: 8px;
        background: #fff;
        pointer-events: auto;
      }

      .task-lock-timer strong {
        display: grid;
        min-width: 86px;
        place-items: center;
        background: var(--rose);
        color: #fff;
        font-variant-numeric: tabular-nums;
        padding: 10px 14px;
      }

      .task-lock-timer span {
        display: grid;
        min-width: 130px;
        place-items: center;
        color: #be123c;
        font-size: 13px;
        font-weight: 800;
        padding: 10px 14px;
      }

      .task.dragging {
        opacity: 0.5;
        background: var(--surface-subtle);
      }

      .task.remote-editing {
        background: #f8fbff;
        box-shadow: inset 3px 0 0 var(--green);
      }

      .task.drop-before,
      .task.drop-after {
        box-shadow: inset 0 0 0 2px var(--green-line);
        background: var(--green-soft);
      }

      .task.drop-before::before,
      .task.drop-after::after {
        content: "";
        position: absolute;
        left: 18px;
        right: 18px;
        height: 3px;
        border-radius: 999px;
        background: var(--green);
      }

      .task.drop-before::before {
        top: 0;
      }

      .task.drop-after::after {
        bottom: 0;
      }

      .task-order-controls {
        display: inline-grid;
        grid-template-columns: 24px 28px;
        grid-template-rows: repeat(2, 22px);
        column-gap: 4px;
        row-gap: 0;
        flex: 0 0 56px;
        width: 56px;
        margin-top: 3px;
        justify-items: center;
        align-items: center;
        position: relative;
        z-index: 10;
        pointer-events: auto;
      }

      .task-order-controls .critical-step-badge {
        grid-row: 1 / span 2;
        grid-column: 1;
        width: 20px;
        height: 20px;
        min-width: 20px;
        touch-action: none;
        user-select: none;
      }

      .task-order-button {
        display: grid;
        grid-column: 2;
        width: 28px;
        height: 22px;
        place-items: center;
        border: 0;
        border-radius: 4px;
        background: transparent;
        color: #94a3b8;
        line-height: 1;
        padding: 0;
        position: relative;
        z-index: 11;
        pointer-events: auto;
        touch-action: manipulation;
      }

      .task-order-button::before {
        content: "";
        width: 7px;
        height: 7px;
        border-top: 2px solid currentColor;
        border-left: 2px solid currentColor;
        transform: rotate(45deg);
      }

      .task-order-button[data-task-move-direction="down"]::before {
        transform: rotate(225deg);
      }

      .task-order-button:hover,
      .task-order-button:focus-visible {
        background: rgba(15, 118, 110, 0.08);
        color: var(--green);
        outline: 0;
      }

      .task-order-button:disabled {
        cursor: not-allowed;
        opacity: 0.25;
      }

      .task h2 {
        flex: 0 0 100%;
        width: 100%;
        max-width: 100%;
        min-width: 0;
        white-space: normal;
        overflow-wrap: anywhere;
        margin: 0;
        padding: 6px 0 4px;
        color: #000;
        font-size: 13px;
        font-weight: 600;
        line-height: 1.3;
        text-transform: uppercase;
        overflow: visible;
        text-overflow: clip;
      }

      .task.timer-owned {
        background: linear-gradient(90deg, rgba(225, 29, 72, 0.05), rgba(255, 255, 255, 0));
        box-shadow: inset 3px 0 0 var(--rose);
      }

      .task.timer-owned h2 {
        color: #000;
      }

      .task-meta-top {
        display: flex;
        min-width: 0;
        flex-wrap: wrap;
        gap: 4px;
        align-items: center;
        flex-shrink: 0;
        font-size: 11px;
      }

      .task-meta-top .badge {
        padding: 3px 7px;
        font-size: 11px;
      }

      .task-owner-name::before {
        content: "Resp. ";
        color: var(--subtle);
        font-weight: 700;
      }

      .task-live-slot:empty {
        display: none;
      }

      .task-live-edit {
        display: inline-flex;
        width: max-content;
        max-width: 100%;
        align-items: center;
        border: 1px solid var(--green-line);
        border-radius: 999px;
        background: var(--green-soft);
        color: var(--green-700);
        padding: 4px 8px;
        font-size: 11px;
        font-weight: 700;
        line-height: 1.2;
      }

      .task-main {
        display: flex;
        width: 100%;
        max-width: 100%;
        flex-wrap: wrap;
        align-items: center;
        flex: 1;
        min-height: 50px;
        min-width: 0;
        gap: 8px;
        overflow: visible;
        position: relative;
        z-index: 2;
      }

      .task-subtasks {
        flex: 1 0 calc(100% - 56px);
        min-width: 0;
        margin: -4px 0 0 56px;
        border: 1px solid #dbe7fb;
        border-radius: 8px;
        background: rgba(248, 250, 252, 0.82);
        overflow: hidden;
      }

      .task-subtasks > summary {
        display: flex;
        min-height: 30px;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        cursor: pointer;
        list-style: none;
        padding: 6px 10px;
        color: var(--subtle);
        font-size: 11px;
        font-weight: 800;
        text-transform: uppercase;
      }

      .task-subtasks > summary::-webkit-details-marker {
        display: none;
      }

      .task-subtasks > summary::after {
        content: "+";
        display: grid;
        width: 20px;
        height: 20px;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #fff;
        color: var(--green);
        font-size: 14px;
        line-height: 1;
      }

      .task-subtasks[open] > summary::after {
        content: "-";
      }

      .task-subtask-body {
        display: grid;
        gap: 8px;
        border-top: 1px solid var(--line-soft);
        padding: 8px 10px 10px;
      }

      .task-subtask-form {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }

      .task-subtask-form input[name="title"] {
        flex: 1 1 170px;
        min-width: 0;
      }

      .task-subtask-form select {
        flex: 0 1 140px;
        min-width: 0;
      }

      .task-subtask-form .btn {
        flex: 0 0 auto;
        margin-left: auto;
      }

      .task-subtask-date {
        display: inline-flex;
        flex: 0 0 auto;
        align-items: center;
        gap: 4px;
        padding: 0;
        color: var(--subtle);
        font-size: 10px;
        font-weight: 800;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .task-subtask-date.is-empty {
        color: #94a3b8;
      }

      .task-subtask-date input {
        height: 26px;
        min-width: 116px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
        color: var(--ink);
        padding: 0 5px;
        font-size: 11px;
        font-weight: 600;
        text-transform: none;
        outline: 0;
      }

      .task-subtask-date input:focus {
        border-color: var(--green);
      }

      .task-subtask-form input,
      .task-subtask-form select {
        height: 30px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: #fff;
        color: var(--ink);
        padding: 0 9px;
        font-size: 11px;
        font-weight: 600;
        outline: 0;
      }

      .task-subtask-form .btn {
        height: 30px;
        padding: 0 10px;
        font-size: 11px;
      }

      .task-subtask-form .task-subtask-date input {
        height: 30px;
        min-width: 116px;
        padding: 0 6px;
      }

      .task-subtask-list {
        display: grid;
        gap: 5px;
      }

      .task-subtask-item {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        border: 1px solid var(--line-soft);
        border-radius: 7px;
        background: #fff;
        padding: 5px 6px;
      }

      .task-subtask-item .task-subtask-check {
        flex: 0 0 auto;
      }

      .task-subtask-order {
        display: grid;
        flex: 0 0 auto;
        gap: 1px;
      }

      .task-subtask-order-button {
        display: grid;
        width: 20px;
        height: 13px;
        place-items: center;
        border: 0;
        border-radius: 3px;
        background: transparent;
        color: #94a3b8;
        line-height: 1;
        padding: 0;
        touch-action: manipulation;
      }

      .task-subtask-order-button::before {
        content: "";
        width: 6px;
        height: 6px;
        border-top: 2px solid currentColor;
        border-left: 2px solid currentColor;
        transform: rotate(45deg);
      }

      .task-subtask-order-button[data-subtask-move-direction="down"]::before {
        transform: rotate(225deg);
      }

      .task-subtask-order-button:hover,
      .task-subtask-order-button:focus-visible {
        background: rgba(15, 118, 110, 0.08);
        color: var(--green);
        outline: 0;
      }

      .task-subtask-order-button:disabled {
        cursor: not-allowed;
        opacity: 0.25;
      }

      .task-subtask-item .task-subtask-delete,
      .task-subtask-item .task-subtask-done {
        height: 24px;
        flex: 0 0 auto;
        margin-left: auto;
        padding: 0 8px;
        font-size: 10px;
      }

      .task-subtask-item.done {
        background: #f0fdf4;
        color: #166534;
      }

      .task-subtask-check {
        display: grid;
        width: 22px;
        height: 22px;
        place-items: center;
        border: 1px solid #bfdbfe;
        border-radius: 999px;
        background: #eff6ff;
        color: var(--green);
        font-size: 12px;
        font-weight: 900;
      }

      .task-subtask-item.done .task-subtask-check {
        border-color: #86efac;
        background: #22c55e;
        color: #fff;
      }

      .task-subtask-title {
        flex: 1 1 150px;
        min-width: 0;
        color: #000;
        font-size: 12px;
        font-weight: 700;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .task-subtask-item.done .task-subtask-title {
        text-decoration: line-through;
      }

      .task-subtask-title[data-editable-subtask] {
        border: 1px dashed transparent;
        border-radius: 6px;
        margin: -1px -3px;
        padding: 1px 3px;
        cursor: text;
        transition:
          background 0.18s ease,
          border-color 0.18s ease;
      }

      .task-subtask-title[data-editable-subtask]:hover {
        border-color: var(--green-line);
        background: var(--surface-subtle);
      }

      .task-subtask-item .task-subtask-title[contenteditable="true"] {
        overflow: visible;
        white-space: normal;
        text-overflow: clip;
        text-decoration: none;
        border-color: transparent;
        background: #fff;
        box-shadow: 0 0 0 2px var(--green-line);
        outline: 0;
      }

      .task-subtask-owner {
        flex: 0 1 110px;
        min-width: 0;
        color: var(--subtle);
        font-size: 11px;
        font-weight: 700;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .task-subtask-owner[data-subtask-owner-select] {
        border: 1px dashed transparent;
        border-radius: 6px;
        margin: -1px -3px;
        padding: 1px 3px;
        cursor: pointer;
        transition:
          background 0.18s ease,
          border-color 0.18s ease;
      }

      .task-subtask-owner[data-subtask-owner-select]:hover,
      .task-subtask-owner[data-subtask-owner-select]:focus-visible {
        border-color: var(--green-line);
        background: var(--surface-subtle);
        outline: 0;
      }

      .task-subtask-owner-select {
        flex: 0 1 120px;
        height: 22px;
        min-width: 0;
        padding: 0 4px;
        font-size: 11px;
      }

      .task-subtask-delete,
      .task-subtask-done {
        height: 24px;
        padding: 0 8px;
        font-size: 10px;
      }

      .task-subtask-list .task-subtask-done {
        border-color: #86efac;
        background: #dcfce7;
        color: #166534;
        font-weight: 800;
      }

      .task-subtask-list .task-subtask-done:hover {
        background: #bbf7d0;
      }

      .task-subtask-empty {
        color: var(--muted);
        font-size: 11px;
      }

      /* Mapa Visual: linea de tiempo mensual de pendientes y tareas internas */
      .timeline-panel {
        display: grid;
        gap: 14px;
        padding: 18px;
      }

      .timeline-head {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: flex-start;
        justify-content: space-between;
      }

      .timeline-head strong {
        color: var(--ink);
        font-size: 19px;
      }

      .timeline-head .small {
        margin: 4px 0 0;
      }

      .timeline-legend {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 16px;
        align-items: center;
        color: var(--muted);
        font-size: 11px;
        font-weight: 600;
      }

      .timeline-legend span {
        display: inline-flex;
        gap: 6px;
        align-items: center;
      }

      .timeline-legend .dot {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 3px;
      }

      .timeline-legend .dot.is-bar {
        background: linear-gradient(135deg, #16a34a 0 50%, #2563eb 50% 100%);
      }

      .timeline-legend .dot.is-done {
        background: #16a34a;
      }

      .timeline-legend .dot.is-pending {
        background: #cbd5e1;
      }

      .timeline-note {
        margin: 0;
      }

      .timeline-scroll {
        overflow-x: auto;
      }

      .timeline-grid {
        display: grid;
        grid-template-columns: 250px repeat(var(--timeline-days), minmax(28px, 1fr));
        min-width: 100%;
        align-items: center;
        row-gap: 6px;
        padding-bottom: 6px;
      }

      .timeline-col {
        border-left: 1px solid #eef2f7;
        pointer-events: none;
      }

      .timeline-col.is-weekend {
        background: #f8fafc;
      }

      .timeline-divider {
        align-self: start;
        height: 1px;
        margin-top: -3px;
        background: var(--line-soft);
        pointer-events: none;
      }

      .timeline-day {
        display: grid;
        justify-items: center;
        padding-bottom: 8px;
      }

      .timeline-day b {
        display: grid;
        min-width: 22px;
        height: 22px;
        place-items: center;
        border-radius: 7px;
        padding: 0 4px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }

      .timeline-day b.is-weekend {
        background: #eef2f7;
        color: #94a3b8;
      }

      .timeline-day b.is-today {
        background: var(--green);
        color: #fff;
      }

      .timeline-label {
        position: sticky;
        left: 0;
        z-index: 2;
        display: flex;
        min-width: 0;
        gap: 6px;
        align-items: flex-start;
        background: var(--white);
        padding: 2px 14px 2px 2px;
      }

      .timeline-label.is-parent {
        padding-top: 4px;
      }

      .timeline-label-body {
        display: grid;
        min-width: 0;
        gap: 1px;
      }

      .timeline-label-title {
        min-width: 0;
        color: var(--ink);
        font-size: 13px;
        font-weight: 700;
        line-height: 1.25;
      }

      .timeline-label-owner {
        color: var(--subtle);
        font-size: 11px;
        font-weight: 600;
      }

      .timeline-label.is-subtask {
        align-items: center;
        padding-left: 34px;
      }

      .timeline-label.is-subtask .timeline-label-title {
        display: flex;
        gap: 5px;
        align-items: center;
        color: var(--muted);
        font-size: 12px;
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .timeline-label.is-subtask i {
        flex: 0 0 auto;
        color: #94a3b8;
        font-style: normal;
      }

      .timeline-toggle {
        display: grid;
        width: 16px;
        height: 18px;
        flex: 0 0 auto;
        place-items: center;
        border: 0;
        background: none;
        color: var(--ink);
        font-size: 12px;
        line-height: 1;
        cursor: pointer;
      }

      .timeline-toggle.is-empty {
        cursor: default;
      }

      .timeline-bar {
        display: flex;
        min-width: 0;
        height: 26px;
        gap: 8px;
        align-items: center;
        border-radius: 8px;
        background: var(--bar-color, #2563eb);
        padding: 0 10px;
        color: #fff;
        overflow: hidden;
      }

      .timeline-bar-title {
        min-width: 0;
        font-size: 12px;
        font-weight: 700;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .timeline-bar-badge {
        flex: 0 0 auto;
        margin-left: auto;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.26);
        padding: 1px 8px;
        font-size: 11px;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
      }

      .timeline-bar-more {
        flex: 0 0 auto;
        margin-left: auto;
        font-size: 15px;
        font-weight: 900;
        line-height: 1;
      }

      .timeline-bar-badge + .timeline-bar-more {
        margin-left: 0;
      }

      .timeline-subbar {
        display: flex;
        height: 12px;
        align-items: center;
        justify-content: flex-end;
        border-radius: 999px;
        padding: 0 4px;
        color: #64748b;
      }

      .timeline-subbar.is-done {
        background: #16a34a;
        color: #fff;
      }

      .timeline-subbar.is-pending {
        background: #cbd5e1;
      }

      .timeline-subbar.is-undated {
        opacity: 0.75;
      }

      .timeline-subbar .timeline-bar-more {
        font-size: 11px;
      }

      @media (max-width: 860px) {
        .timeline-grid {
          grid-template-columns: 170px repeat(var(--timeline-days), minmax(24px, 1fr));
        }

        .timeline-legend {
          gap: 6px 10px;
          font-size: 10px;
        }
      }

      .task-bottom-row {
        display: flex;
        width: 100%;
        gap: 4px;
        align-items: center;
        justify-content: space-between;
      }

      .task-dates {
        display: flex;
        min-width: 0;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }

      .task-age {
        display: inline-flex;
        flex: 0 0 auto;
        align-items: center;
        gap: 4px;
        color: var(--subtle);
        font-size: 11px;
        white-space: nowrap;
      }

      .task-age strong {
        display: inline-grid;
        min-width: 32px;
        height: 26px;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
        color: var(--ink);
        font-size: 11px;
        font-weight: 800;
      }

      .task-age.overdue {
        padding: 2px 6px;
        border: 1px solid var(--rose);
        border-radius: 8px;
        background: var(--rose);
        color: #fff;
        font-weight: 800;
      }

      .task-age.overdue strong {
        border-color: rgba(255, 255, 255, 0.35);
        background: rgba(255, 255, 255, 0.14);
        color: #fff;
      }

      .task-meta .badge {
        padding: 4px 7px;
        font-size: 11px;
      }

      .task-meta > .muted {
        font-size: 12px;
      }

      .editable-field {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        border-radius: 6px;
        border: 1px dashed transparent;
        margin: -2px;
        padding: 2px;
        cursor: text;
        transition:
          background 0.18s ease,
          border-color 0.18s ease,
          box-shadow 0.18s ease;
      }

      .editable-field:hover {
        border-color: var(--green-line);
        background: var(--surface-subtle);
      }

      .editable-field::after {
        content: "";
        width: 7px;
        height: 2px;
        flex: 0 0 7px;
        border-radius: 999px;
        background: currentColor;
        color: var(--green);
        opacity: 0.42;
        transform: rotate(45deg);
      }

      .editable-field[contenteditable="true"] {
        background: #fff;
        box-shadow: 0 0 0 2px var(--green-line);
        outline: 0;
      }

      .editable-field[contenteditable="true"]::after {
        content: "";
      }

      .task-date {
        display: inline-flex;
        position: relative;
        flex: 0 0 auto;
        align-items: center;
        gap: 4px;
        color: var(--subtle);
        font-size: 11px;
      }

      .date-field {
        width: 104px;
        height: 26px;
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
        color: var(--ink);
        padding: 0 5px;
        font-size: 11px;
        font-weight: 500;
      }

      .task-actions {
        flex: 0 0 auto;
      }

      /* Anula el padding de la regla genérica .empty (estado vacío de paneles),
         que colisiona con la clase "empty" de las fechas sin valor e inflaba la
         fila, dejando los botones del timer debajo de la fila siguiente. */
      .task-date.empty {
        padding: 0;
      }

      .task-date.empty .date-field {
        color: transparent;
      }

      .task-date.empty::after {
        content: "Sin fecha";
        position: absolute;
        right: 28px;
        left: 42px;
        color: var(--subtle);
        line-height: 30px;
        text-align: center;
        white-space: nowrap;
        pointer-events: none;
      }

      .date-field:focus {
        border-color: var(--green-line);
        outline: 0;
      }

      .task-create-panel {
        padding: 10px 12px;
      }

      .task-form {
        display: grid;
        grid-template-columns:
          minmax(260px, 2fr)
          minmax(150px, 1fr)
          minmax(160px, 0.9fr)
          minmax(160px, 0.9fr)
          minmax(110px, 0.7fr)
          auto;
        gap: 8px;
        align-items: end;
      }

      .task-title-field {
        min-width: 0;
      }

      .form-field {
        display: grid;
        min-width: 0;
        gap: 3px;
        color: var(--subtle);
        font-size: 10px;
        font-weight: 500;
      }

      .form-field span {
        color: var(--subtle);
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
      }

      .form-field input,
      .form-field select {
        width: 100%;
        min-width: 0;
        height: 34px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--white);
        color: var(--ink);
        outline: 0;
        padding: 0 10px;
        font-size: 12px;
        font-weight: 500;
      }

      .task-form > .btn {
        height: 34px;
        padding: 0 14px;
        font-size: 12px;
      }

      .form-field input:focus,
      .form-field select:focus {
        border-color: var(--green);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
      }

      .task-actions {
        display: flex;
        max-width: 100%;
        flex-wrap: wrap;
        flex: 0 0 auto;
        justify-content: flex-end;
        gap: 6px;
        align-items: center;
        min-width: 0;
        position: relative;
        z-index: 3;
      }

      .task-actions > .btn {
        height: 26px;
        border-radius: 6px;
        padding: 0 8px;
        font-size: 11px;
      }

      .timer-box {
        display: inline-grid;
        grid-template-columns: minmax(64px, auto) auto;
        align-items: stretch;
        height: 26px;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
      }

      .timer-box .btn {
        height: 100%;
        border: 0;
        border-left: 1px solid var(--line);
        border-radius: 0;
        padding: 0 8px;
        font-size: 11px;
      }

      .timer-box.active {
        border-color: var(--rose);
      }

      .timer-box.active .timer-value {
        border-color: var(--rose);
        background: var(--rose);
        color: #fff;
      }

      .timer-box.active .btn {
        border-left-color: #fecdd3;
        color: #be123c;
      }

      .timer-value {
        display: grid;
        min-width: 68px;
        place-items: center;
        border-right: 1px solid var(--line);
        color: var(--ink);
        font-size: 11px;
        font-variant-numeric: tabular-nums;
        font-weight: 700;
        padding: 0 8px;
      }

      .timer-value[data-timer-value] {
        cursor: text;
        user-select: none;
      }

      .timer-value[data-timer-editing="true"] {
        min-width: 82px;
        background: #eff6ff;
        box-shadow: inset 0 0 0 2px var(--green);
        outline: 0;
        user-select: text;
      }

      .completed-list {
        display: grid;
      }

      .completed-task {
        display: grid;
        grid-template-columns: minmax(0, 1fr) repeat(4, max-content);
        gap: 14px;
        align-items: center;
        border-bottom: 1px solid var(--line-soft);
        padding: 12px 18px;
      }

      .completed-task:last-child {
        border-bottom: 0;
      }

      .completed-task strong {
        display: block;
        font-size: 14px;
        font-weight: 600;
      }

      .completed-meta {
        color: var(--subtle);
        font-size: 12px;
        white-space: nowrap;
      }

      .completed-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
      }

      .completed-head > div {
        min-width: 0;
      }

      .completed-head .btn {
        flex: 0 0 auto;
        white-space: nowrap;
      }

      .history-actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 10px;
      }

      .history-tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .history-tabs .btn,
      .history-actions > .btn {
        height: 28px;
        padding: 0 10px;
        font-size: 11px;
        border-radius: 6px;
        font-weight: 500;
        letter-spacing: 0.01em;
      }

      .history-tab.active {
        border-color: var(--green);
        background: var(--green-soft);
        color: var(--green-700);
      }

      .presence-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .presence-card {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        padding: 9px 11px;
      }

      .presence-card.online {
        border-color: #bbf7d0;
        background: #f0fdf4;
      }

      .presence-title {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--ink);
        font-size: 12px;
        font-weight: 600;
      }

      .presence-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #cbd5e1;
      }

      .presence-card.online .presence-dot {
        background: #22c55e;
      }

      .presence-detail {
        margin: 2px 0 0;
        color: var(--subtle);
        font-size: 10px;
        line-height: 1.25;
      }

      .presence-worked {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 4px;
        margin-top: 4px;
        color: var(--ink);
        font-size: 11px;
        font-weight: 700;
      }

      .presence-worked span {
        color: var(--subtle);
        font-size: 9px;
        font-weight: 600;
        text-transform: uppercase;
      }

      .task-overview {
        display: grid;
        grid-template-columns: minmax(340px, 0.9fr) minmax(560px, 1.6fr);
        gap: 10px;
        align-items: stretch;
      }

      .task-footer-status {
        display: grid;
        gap: 10px;
      }
      .task-overview .metrics {
        gap: 8px;
      }

      .task-overview .metric-card {
        display: grid;
        min-height: 0;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 2px 8px;
        align-content: center;
        padding: 9px 11px;
      }

      .task-overview .metric-head {
        min-width: 0;
      }

      .task-overview .metric-label {
        overflow: hidden;
        font-size: 10px;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      .task-overview .metric-value {
        grid-column: 2;
        grid-row: 1 / span 2;
        align-self: center;
        margin: 0;
        font-size: 20px;
      }

      .task-overview .metric-detail {
        overflow: hidden;
        margin: 0;
        font-size: 9px;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      .pending-sync-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-top: 10px;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fff;
      }

      .pending-sync-detail {
        display: flex;
        min-width: 0;
        flex-direction: column;
        gap: 2px;
      }

      .pending-sync-label {
        display: inline-flex;
        width: fit-content;
        align-items: center;
        gap: 6px;
        border-radius: 999px;
        padding: 3px 8px;
        background: #f8fafc;
        color: var(--subtle);
        font-size: 11px;
        font-weight: 700;
      }

      .pending-sync-label::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #94a3b8;
      }

      .pending-sync-label.ok {
        background: #f0fdf4;
        color: #15803d;
      }

      .pending-sync-label.ok::before {
        background: #22c55e;
      }

      .pending-sync-label.busy {
        background: #eff6ff;
        color: #1d4ed8;
      }

      .pending-sync-label.busy::before {
        background: #3b82f6;
      }

      .pending-sync-label.warn {
        background: #fff7ed;
        color: #c2410c;
      }

      .pending-sync-label.warn::before {
        background: #f97316;
      }

      .pending-sync-label.danger {
        background: var(--rose-soft);
        color: var(--rose);
      }

      .pending-sync-label.danger::before {
        background: var(--rose);
      }

      .pending-sync-message {
        overflow: hidden;
        margin: 0;
        color: var(--subtle);
        font-size: 11px;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      .pending-sync-top-message {
        margin: 0 14px 8px;
        white-space: normal;
        color: #b45309;
        font-size: 12px;
      }

      .live-activity {
        border: 1px solid var(--green-line);
        border-radius: 8px;
        background: var(--green-soft);
        color: var(--green-700);
        padding: 10px 14px;
        font-size: 13px;
        font-weight: 700;
      }

      .live-activity[hidden] {
        display: none;
      }

      .assignment-notices {
        display: grid;
        gap: 8px;
      }

      .assignment-notices[hidden] {
        display: none;
      }

      .assignment-notice {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 12px;
        align-items: center;
        border: 1px solid var(--green-line);
        border-radius: 8px;
        background: #fff;
        box-shadow: 0 10px 32px rgba(37, 99, 235, 0.08);
        padding: 10px 12px;
      }

      .assignment-notice strong {
        display: block;
        color: var(--ink);
        font-size: 13px;
        font-weight: 700;
      }

      .assignment-notice p {
        margin: 3px 0 0;
        color: var(--subtle);
        font-size: 12px;
      }

      .auth-layout {
        display: grid;
        grid-template-columns: minmax(0, 0.95fr) minmax(0, 1.05fr);
        gap: 18px;
        align-items: start;
      }

      .auth-layout.single {
        grid-template-columns: minmax(0, 640px);
      }

      .suite-lock {
        min-height: 100vh;
        display: grid;
        align-items: center;
        padding: 36px;
      }

      .suite-lock-inner {
        width: min(100%, 1080px);
        margin: 0 auto;
        display: grid;
        gap: 22px;
      }

      .suite-lock-brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .auth-panel {
        padding: 18px;
      }

      .auth-head {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        margin-bottom: 16px;
      }

      .auth-head strong {
        display: block;
        font-size: 15px;
        font-weight: 600;
      }

      .auth-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        flex: 0 0 auto;
        border: 1px solid var(--green-line);
        border-radius: 8px;
        background: var(--green-soft);
        color: var(--green-700);
      }

      .auth-form,
      .user-form {
        display: grid;
        gap: 12px;
      }

      .user-form {
        grid-template-columns: repeat(3, minmax(0, 1fr)) auto;
        align-items: end;
        margin-bottom: 16px;
      }

      .auth-input {
        display: grid;
        gap: 6px;
        color: var(--subtle);
        font-size: 13px;
      }

      .auth-input input {
        width: 100%;
        height: 42px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--white);
        color: var(--ink);
        font: inherit;
        font-weight: 500;
        outline: 0;
        padding: 0 12px;
      }

      .auth-input input:focus {
        border-color: var(--green);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
      }

      .auth-message {
        margin: 0;
        border: 1px solid var(--green-line);
        border-radius: 8px;
        background: var(--green-soft);
        color: var(--green-700);
        padding: 10px 12px;
        font-size: 13px;
      }

      .auth-message.error {
        border-color: #fecdd3;
        background: var(--rose-soft);
        color: #be123c;
      }

      .user-list {
        display: grid;
        gap: 8px;
      }

      .user-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 10px;
        align-items: center;
        border: 1px solid var(--line-soft);
        border-radius: 8px;
        background: #f8fafc;
        padding: 10px 12px;
      }

      .user-row strong {
        display: block;
        font-size: 14px;
        font-weight: 600;
      }

      .user-key {
        color: var(--subtle);
        font-size: 12px;
      }

      .access-users {
        display: grid;
        gap: 12px;
        padding: 18px;
      }

      .access-card {
        display: grid;
        gap: 12px;
        border: 1px solid var(--line-soft);
        border-radius: 8px;
        background: #f8fafc;
        padding: 14px;
      }

      .access-card-head {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: flex-start;
      }

      .access-card-actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 8px;
        align-items: center;
      }

      .access-card-head strong {
        display: block;
        font-size: 15px;
        font-weight: 600;
      }

      .access-form-grid {
        display: grid;
        grid-template-columns: minmax(220px, 1fr) minmax(170px, 0.7fr) minmax(170px, 0.7fr) auto auto;
        gap: 10px;
        align-items: end;
      }

      .module-access-details {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
      }

      .module-access-details summary {
        display: flex;
        align-items: center;

      // Pérdidas y Ganancias: los datos vienen de la hoja de Google "Perdidas y ganancias - Lima Retail"

      // después del login, igual que las cotizaciones. El CSV de cada pestaña se interpreta en el navegador.
      const FINANCIAL_STALE_HOURS = 30;
      const SHEET_MONTH_NAMES = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
      const SHEET_MONTH_SHORT = ["Ene", "Feb", "Mar", "Abr", "May", "Jun", "Jul", "Ago", "Sep", "Oct", "Nov", "Dic"];
      let financialPayload = null;

      function parseSheetCsv(text) {
        const rows = [];
        let row = [];
        let cell = "";
        let quoted = false;
        const source = String(text || "").replace(/^﻿/, "");
        for (let index = 0; index < source.length; index += 1) {
          const char = source[index];
          if (quoted) {
            if (char === '"' && source[index + 1] === '"') {
              cell += '"';
              index += 1;
            } else if (char === '"') {
              quoted = false;
            } else {
              cell += char;
            }
          } else if (char === '"') {
            quoted = true;
          } else if (char === ",") {
            row.push(cell.trim());
            cell = "";
          } else if (char === "\n" || char === "\r") {
            if (char === "\r" && source[index + 1] === "\n") index += 1;
            row.push(cell.trim());
            rows.push(row);
            row = [];
            cell = "";
          } else {
            cell += char;
          }
        }
        if (cell || row.length) {
          row.push(cell.trim());
          rows.push(row);
        }
        return rows;
      }

      // "S/ 5,600.00", "1,557.87", "23.5%" o "2.21x" -> número; vacío -> null.
      function sheetNumber(value) {
        const cleaned = String(value ?? "").replace(/S\/\.?/gi, "").replace(/[^0-9.-]/g, "");
        if (!/\d/.test(cleaned)) return null;
        const parsed = Number(cleaned);
        return Number.isFinite(parsed) ? parsed : null;
      }

      // "19/01/2026" -> "2026-01-19"
      function sheetDate(value) {
        const match = String(value || "").match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
        return match ? `${match[3]}-${match[2].padStart(2, "0")}-${match[1].padStart(2, "0")}` : "";
      }

      // "Septiembre" (o "Setiembre") -> 9; texto que no es un mes -> 0.
      function sheetMonthNumber(value) {
        const name = normalizeText(value).trim().replace(/^setiembre$/, "septiembre");
        return SHEET_MONTH_NAMES.indexOf(name) + 1;
      }

      // Las pestañas tienen títulos y notas encima de la tabla: se ubica la fila de encabezados por su
      // primera celda y las columnas se leen por nombre, para tolerar columnas nuevas o reordenadas.
      function sheetTable(rows, firstHeader) {
        const headerIndex = rows.findIndex((row) => normalizeText(row[0]).trim() === normalizeText(firstHeader));
        if (headerIndex < 0) return { rows: [], value: () => "" };
        const headers = rows[headerIndex].map((cell) => normalizeText(cell).trim());
        return {
          rows: rows.slice(headerIndex + 1),
          value: (row, name) => {
            const index = headers.findIndex((header) => header.startsWith(normalizeText(name)));
            return index >= 0 ? row[index] || "" : "";
          }
        };
      }

      function buildFinancialModel(payload) {
        const tabs = payload?.tabs || {};
        const ventasRows = parseSheetCsv(tabs.ventas);
        const inversionRows = parseSheetCsv(tabs.inversion);
        const resultadosRows = parseSheetCsv(tabs.resultados);
        const monthId = (year, monthNumber) => `${year}-${String(monthNumber).padStart(2, "0")}`;

        const ventas = sheetTable(ventasRows, "Fecha");
        const allSales = ventas.rows
          .map((row) => {
            const base = sheetNumber(ventas.value(row, "Monto base"));
            const units = sheetNumber(ventas.value(row, "Meses")) ?? 1;
            return {
              date: sheetDate(ventas.value(row, "Fecha")),
              monthName: ventas.value(row, "Mes"),
              client: ventas.value(row, "Cliente"),
              service: ventas.value(row, "Servicio") || "Servicio sin nombre",
              base: base || 0,
              units,
              billed: sheetNumber(ventas.value(row, "Facturacion")) ?? (base === null ? null : base * units),
              status: ventas.value(row, "Estado")
            };
          })
          .filter((sale) => sale.billed !== null && !/anulad|cancelad|perdid|devuel/.test(normalizeText(sale.status)));

        const titleYear = String(resultadosRows[0]?.[0] || ventasRows[0]?.[0] || "").match(/\b(20\d{2})\b/);
        const year =
          Number(titleYear?.[1]) ||
          Number(allSales.find((sale) => sale.date)?.date.slice(0, 4)) ||
          new Date().getFullYear();
        allSales.forEach((sale) => {
          const monthNumber = sale.date ? Number(sale.date.slice(5, 7)) : sheetMonthNumber(sale.monthName);
          sale.monthId = monthNumber ? monthId(sale.date ? sale.date.slice(0, 4) : year, monthNumber) : "";
        });
        // Nuevo cliente: la primera venta de cada cliente en toda la pestaña Ventas. Una venta sin nombre
        // de cliente cuenta como un cliente distinto, porque la hoja no permite saber si ya compró antes.
        const seenClients = new Set();
        [...allSales]
          .sort((a, b) => (a.date || a.monthId).localeCompare(b.date || b.monthId))
          .forEach((sale, index) => {
            const key = sale.client ? normalizeText(sale.client).trim() : `sin-nombre-${index}`;
            sale.isNewClient = !seenClients.has(key);
            seenClients.add(key);
          });
        const sales = allSales
          .filter((sale) => sale.monthId.startsWith(`${year}-`))
          .sort((a, b) => (a.date || a.monthId).localeCompare(b.date || b.monthId));

        // Venta vs Resultados: cotizaciones y monto cotizado por mes (la pestaña Cotizaciones no se
        // descarga porque tiene teléfonos) e inversión mensual, si algún día se completa esa columna.
        const resultados = sheetTable(resultadosRows, "Mes");
        const monthRows = new Map();
        for (const row of resultados.rows) {
          if (normalizeText(row[0]).trim() === "total") break;
          const monthNumber = sheetMonthNumber(row[0]);
          if (!monthNumber) continue;
          monthRows.set(monthId(year, monthNumber), {
            quotes: sheetNumber(resultados.value(row, "Cotizaciones")),
            quoted: sheetNumber(resultados.value(row, "Monto cotizado")),
            investment: sheetNumber(resultados.value(row, "Inversion")),
            notes: resultados.value(row, "Observaciones")
          });
        }

        const inversion = sheetTable(inversionRows, "Plataforma");
        const platforms = inversion.rows
          .map((row) => ({
            name: row[0],
            period: inversion.value(row, "Periodo"),
            currency: inversion.value(row, "Moneda"),
            origin: sheetNumber(inversion.value(row, "Inversion origen")),
            rate: inversion.value(row, "TC"),
            amount: sheetNumber(inversion.value(row, "Inversion en PEN")),
            resultLabel: inversion.value(row, "Resultado principal"),
            results: sheetNumber(inversion.value(row, "Resultados"))
          }))
          .filter((platform) => platform.name && platform.amount !== null);

        // Notas que la hoja deja junto a las tablas ("Nota", "Nota de inversión", "Nota ROAS mensual").
        const notes = [];
        [...inversionRows, ...resultadosRows].forEach((row) => {
          row.forEach((cell, index) => {
            if (/^nota\b/.test(normalizeText(cell).trim()) && row[index + 1]) {
              notes.push({ label: cell, text: row[index + 1] });
            }
          });
        });

        const ids = [...new Set([...monthRows.keys(), ...sales.map((sale) => sale.monthId)])].sort();
        const months = ids.map((id) => {
          const sheetRow = monthRows.get(id) || {};
          const monthNumber = Number(id.slice(5, 7));
          const name = SHEET_MONTH_NAMES[monthNumber - 1];
          return {
            id,
            short: SHEET_MONTH_SHORT[monthNumber - 1],
            label: `${name.charAt(0).toUpperCase()}${name.slice(1)} ${year}`,
            sales: sales.filter((sale) => sale.monthId === id),
            quotes: sheetRow.quotes ?? null,
            quoted: sheetRow.quoted ?? null,
            investment: sheetRow.investment ?? null,
            notes: sheetRow.notes || ""
          };
        });

        return {
          year,
          months,
          platforms,
          notes,
          syncedAt: payload?.syncedAt || "",
          trigger: payload?.trigger || "",
          requestedBy: payload?.requestedBy || ""
        };
      }

      function financialModel() {
        if (!financialPayload) return null;
        if (financialModelCache?.payload !== financialPayload) {
          financialModelCache = { payload: financialPayload, model: buildFinancialModel(financialPayload) };
        }
        return financialModelCache.model;
      }

      function groupSalesByService(sales) {
        const groups = new Map();
        sales.forEach((sale) => {
          const key = normalizeText(sale.service).trim();
          const group = groups.get(key) || { key, service: sale.service, amount: 0, clients: [] };
          group.amount += sale.billed;
          if (sale.client && !group.clients.includes(sale.client)) group.clients.push(sale.client);
          groups.set(key, group);
        });
        return [...groups.values()].sort((a, b) => b.amount - a.amount);
      }

      // periodId: "ytd" (acumulado del año) o "AAAA-MM".
      function financialPeriod(model, periodId) {
        const isTotal = periodId === "ytd";
        const months = isTotal ? model.months : model.months.filter((month) => month.id === periodId);
        if (!isTotal && !months.length) return null;
        const sales = months.flatMap((month) => month.sales);
        const billed = sales.reduce((sum, sale) => sum + sale.billed, 0);
        const quoteMonths = months.filter((month) => month.quotes !== null);
        const quotes = quoteMonths.length ? quoteMonths.reduce((sum, month) => sum + month.quotes, 0) : null;
        const quoted = months.some((month) => month.quoted !== null)
          ? months.reduce((sum, month) => sum + (month.quoted || 0), 0)
          : null;

        // La hoja trae la inversión consolidada por plataforma (pestaña Inversion). Por mes solo existe si
        // se llena la columna "Inversión (S/)" de Venta vs Resultados; no se reparte para no inventarla.
        let investment = null;
        let investmentLines = [];
        if (isTotal && model.platforms.length) {
          investment = model.platforms.reduce((sum, platform) => sum + platform.amount, 0);
          investmentLines = model.platforms.map((platform) => ({
            key: normalizeText(platform.name),
            label: platform.name,
            detail: [
              platform.currency && platform.currency !== "PEN" && platform.origin !== null
                ? `${platform.currency} ${platform.origin.toLocaleString("es-PE", { minimumFractionDigits: 2, maximumFractionDigits: 2 })} × TC ${platform.rate || "?"}`
                : "",
              platform.results !== null ? `${fmtNumber(platform.results)} ${platform.resultLabel || "resultados"}` : "",
              platform.period
            ].filter(Boolean).join(" · "),
            amount: platform.amount
          }));
        } else if (months.length && months.every((month) => month.investment !== null)) {
          investment = months.reduce((sum, month) => sum + month.investment, 0);
          investmentLines = [{ key: "mes", label: "Inversión publicitaria", detail: "Venta vs Resultados", amount: investment }];
        }
        const result = investment === null ? null : billed - investment;
        const first = model.months[0];
        const last = model.months[model.months.length - 1];

        return {
          id: periodId,
          isTotal,
          label: isTotal ? `Acumulado ${model.year}` : months[0].label,
          range: isTotal ? (first ? `${first.short} – ${last.short} ${model.year}` : String(model.year)) : months[0].label,
          sales,
          billed,
          salesCount: sales.length,
          quotes,

          closeRate: quotes ? sales.length / quotes : null,
          investment,
          investmentLines,
